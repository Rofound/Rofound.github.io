<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Base64 Query</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f4f6f8;
      color: #17202a;
    }
    input,
    textarea,
    button {
      padding: 12px;
      border: 1px solid #ccd4dc;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      width: 70%;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 110px;
      font-family: monospace;
    }
    button {
      background: #1769d2;
      color: #fff;
      cursor: pointer;
    }
    .panel {
      background: #fff;
      padding: 16px;
      border-radius: 8px;
      margin: 18px 0;
    }
    .result {
      background: #fff;
      border: 1px solid #dce2e7;
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }
    code {
      display: block;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 6px 0 14px;
    }
    .copy {
      background: #e9f2ff;
      color: #1459a6;
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .row button {
      white-space: nowrap;
    }
    [hidden] {
      display: none !important;
    }
    .panel-head {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .toggle {
      background: #eef2f6;
      color: #1769d2;
      border: 1px solid #ccd4dc;
      font-size: 14px;
      padding: 8px 12px;
      white-space: nowrap;
    }
    .editor {
      margin-top: 12px;
    }
  </style>
  <h1>Base64 Data Query</h1>
  <section class="panel">
    <div class="panel-head">
      <label for="data"><b>Data (one a,b pair per line)</b></label>
      <button id="toggle" class="toggle" type="button" aria-expanded="false" aria-controls="editor">
        Edit data
      </button>
    </div>
    <div id="editor" class="editor" hidden>
      <textarea id="data"></textarea>
      <button id="update" type="button">Update data</button>
      <span id="notice"></span>
    </div>
  </section>
  <form id="f">
    <input id="q" placeholder="str" />
    <button>Search</button>
  </form>
  <p id="s"></p>
  <div id="r"></div>
  <script>
    const initial = `Hello World,hello\n你好!,world`;
    let dataText = localStorage.getItem("base64-data") || initial;
    let rows = parse(dataText);
    data.value = dataText;

    function parse(text) {
      return text
        .split(/\r?\n/)
        .map((x) => x.trim())
        .filter(Boolean)
        .flatMap((x) => {
          let i = x.indexOf(",");
          return i < 0
            ? []
            : [{ a: enc(x.slice(0, i).trim()), b: enc(x.slice(i + 1).trim()) }];
        });
    }

    function enc(x) {
      return btoa(unescape(encodeURIComponent(x)));
    }

    const dec = (x) => {
      try {
        return decodeURIComponent(escape(atob(x)));
      } catch {
        return "[invalid Base64 UTF-8]";
      }
    };

    toggle.onclick = () => {
      const open = editor.hidden;
      editor.hidden = !open;
      toggle.textContent = open ? "Hide data" : "Edit data";
      toggle.setAttribute("aria-expanded", String(open));
      if (open) data.focus();
    };

    update.onclick = () => {
      dataText = data.value;
      rows = parse(dataText);
      localStorage.setItem("base64-data", dataText);
      notice.textContent = ` Updated ${rows.length} rows`;
      setTimeout(() => (notice.textContent = ""), 1800);
    };

    f.onsubmit = (e) => {
      e.preventDefault();
      let v = q.value.trim();
      if (!v) {
        s.textContent = "Enter a string";
        r.innerHTML = "";
        return;
      }
      let m = rows.filter((x) => x.b === enc(v));
      s.textContent = `Found ${m.length}`;
      r.innerHTML = m.length
        ? m
            .map(
              (x) => `<article class="result"><small>a (raw)</small><code>${x.a}</code><small>a (decoded)</small><code>${dec(x.a)}</code><button class="copy" data-v="${encodeURIComponent(dec(x.a))}">Copy decoded</button></article>`
            )
            .join("")
        : "<p>No matches</p>";
      r.querySelectorAll(".copy").forEach(
        (b) =>
          (b.onclick = async () => {
            await navigator.clipboard.writeText(decodeURIComponent(b.dataset.v));
            b.textContent = "Copied";
          })
      );
    };
  </script>
</html>
