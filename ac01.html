function sessionSummary(){const s=state.session;if(!s)return;const done=Object.keys(s.answers).length,correct=Object.values(s.answers).filter(a=>a.correct).length;showModal(`<h2>${done===s.ids.length?'本轮练习已完成':'本轮学习小结'}</h2><p>${esc(s.title)}</p><div class="result-stats"><span><b>${done}/${s.ids.length}</b>已提交</span><span><b>${percent(correct,done)}%</b>正确率</span><span><b>${done-correct}</b>错题</span></div><p style="margin-top:22px">已提交的记录、错题、收藏与笔记均已保留。</p><div class="actions"><button class="btn" data-action="close-modal">继续查看</button>${done-correct?'<button class="btn" data-action="retry-session">重练本轮错题</button>':''}<button class="btn primary" data-action="finish-session">${done===s.ids.length?'结束本轮':'结束并保留记录'}</button></div>`)}
function examSetup(){return head('A REHEARSAL FOR THE REAL THING','把练习，变成临场发挥。','交卷后统一评分，按竞赛技术文件设置题量与分值。')+`<section class="exam-banner"><div><span class="pill">公开题库模拟卷</span><h2 style="margin-top:12px">一次完整的赛前演练</h2><p>单选 70 题 × 1 分，多选 10 题 × 2 分，判断 20 题 × 0.5 分。每份试卷随机抽取，同卷内不重复。</p><div class="exam-numbers"><div><strong>100</strong><span>题目总数</span></div><div><strong>90</strong><span>考试分钟</span></div><div><strong>100</strong><span>试卷满分</span></div></div><button class="btn" data-action="start-standard">生成标准模拟卷 →</button></div><div class="hero-art" aria-hidden="true">${icon('exam')}</div></section><div class="rule-note">正式竞赛试题由 70% 公开题库题与 30% 现场命题组成。本站仅有公开题库，不能覆盖现场新题。考试计时持续进行，刷新或关闭页面不暂停；到时自动交卷。</div><section class="panel"><div class="panel-head"><h2>自定义随机试卷</h2><span class="small muted">短练习，也有考试感</span></div><div class="form-grid"><label class="field">单选题（0–300）<input id="exam-single" type="number" min="0" max="300" step="1" value="20"></label><label class="field">多选题（0–70）<input id="exam-multi" type="number" min="0" max="70" step="1" value="5"></label><label class="field">判断题（0–130）<input id="exam-judge" type="number" min="0" max="130" step="1" value="10"></label><label class="field">时长 / 分钟（1–300）<input id="exam-minutes" type="number" min="1" max="300" step="1" value="30"></label></div><div class="form-footer"><span class="small muted">每题分值与标准卷相同，总分按题量计算。</span><button class="btn primary" data-action="start-custom-exam">生成自定义试卷</button></div></section><section class="panel section-gap"><div class="panel-head"><h2>考试记录</h2><span class="small muted">保留最近 30 次</span></div>${state.history.length?state.history.map(h=>{const v=examScore(h);return `<div class="history-item"><div>${esc(h.title)}<p>${dateTime(h.finishedAt)} · ${h.ids.length} 题${h.auto?' · 到时交卷':''}</p></div><div><b>${v.score}<span class="small muted"> / ${v.max}</span></b><button class="btn small-btn" data-action="exam-result" data-id="${esc(h.id)}">复盘</button></div></div>`}).join(''):'<p class="muted small">还没有考试记录。完成第一份模拟卷，看看自己的准备程度。</p>'}</section>`}
function startExam(config,title){
 if(state.exam){navTo('exam');return}
 const {single,multi,judge,minutes}=config;
 if(![single,multi,judge,minutes].every(Number.isInteger)||single<0||single>300||multi<0||multi>70||judge<0||judge>130||single+multi+judge===0||minutes<1||minutes>300){toast('请输入有效的整数题量，至少选择 1 题，时长为 1–300 分钟。');return}
 const ids=Object.entries({single,multi,judge}).flatMap(([t,n])=>shuffle(QS.filter(q=>q.type===t)).slice(0,n).map(q=>q.id));
 confirmModal('准备好开始考试了吗？',`${ids.length} 题，${minutes} 分钟，满分 ${single+multi*2+judge*.5} 分。开始后持续计时，提交前不显示答案。`,'开始计时',()=>{const now=Date.now();state.exam={id:'exam-'+now,title,ids,index:0,answers:{},flags:{},startedAt:now,duration:minutes*60000,deadline:now+minutes*60000};reviewExamId=null;persist();navTo('exam')});
}
function examView(){const e=state.exam,q=BY_ID.get(e.ids[e.index]),choice=e.answers[q.id]||[],done=e.ids.filter(id=>e.answers[id]?.length).length;return head('FOCUS MODE',esc(e.title),'',`<div class="actions"><span id="exam-timer" class="timer compact-timer" aria-label="考试剩余时间"></span><button class="btn primary small-btn" data-action="submit-exam">交卷</button></div>`)+`<div class="session-top"><span>第 <strong>${e.index+1}</strong> / ${e.ids.length} 题 <span class="muted">· ${POINTS[q.type]} 分 · 已答 ${done}</span></span><div class="actions"><button class="btn text" data-action="flag">${e.flags[q.id]?'⚑ 已标记':'⚐ 标记'}</button><button class="btn small-btn palette-trigger" data-action="open-palette">答题卡</button></div></div><div class="question-layout"><section class="panel question-card">${questionHTML(q,choice,false,{exam:true})}<div class="q-nav"><button class="btn" data-action="prev" ${e.index===0?'disabled':''}>← 上一题</button><button class="btn primary" data-action="next">${e.index===e.ids.length-1?'检查并交卷':'下一题 →'}</button></div></section><aside class="q-side"><section class="panel"><div class="panel-head"><h2>答题卡</h2><span class="small muted">${done}/${e.ids.length}</span></div><p class="small muted">未答 ${e.ids.length-done} · 标记 ${Object.keys(e.flags).length}</p><button class="btn small-btn full-width" data-action="first-unanswered">定位未答题</button>${palette(e,true)}<div class="palette-legend"><span><i></i>已作答</span><span><i class="mark"></i>已标记</span></div></section></aside></div>`}
function requestSubmit(){const e=state.exam;if(!e)return;if(Date.now()>=e.deadline){finishExam(true);return}const remaining=e.ids.filter(id=>!e.answers[id]?.length).length,flags=Object.keys(e.flags).length;confirmModal('确认交卷？',`${remaining?`还有 ${remaining} 道题未作答，未答题记 0 分。`:'全部题目均已作答。'}${flags?`有 ${flags} 道题被标记为待检查。`:''}交卷后将生成成绩与错题复盘。`,'确认交卷',()=>finishExam(false))}
function finishExam(auto){const e=state.exam;if(!e)return;auto=auto||Date.now()>=e.deadline;const end=auto?e.deadline:Date.now();e.finishedAt=end;e.auto=auto;e.ids.forEach(id=>registerAnswer(id,e.answers[id]||[],end));state.history.unshift(e);state.history=state.history.slice(0,30);state.exam=null;reviewExamId=e.id;persist();$('#modal').close();navTo('exam');if(auto)toast('考试时间已到，试卷已自动提交。')}
function updateTimer(){if(!state.exam)return;const remaining=state.exam.deadline-Date.now();if(remaining<=0){finishExam(true);return}const el=$('#exam-timer');if(el){const seconds=Math.ceil(remaining/1000);el.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;el.classList.toggle('urgent',remaining<=300000)}}
function examScore(h){let score=0,max=0,correct=0,unanswered=0;const types={};for(const id of h.ids){const q=BY_ID.get(id),choice=h.answers[id]||[],ok=same(choice,q.answer),points=POINTS[q.type];score+=ok?points:0;max+=points;correct+=Number(ok);unanswered+=Number(!choice.length);types[q.type]??={total:0,correct:0,score:0,max:0};types[q.type].total++;types[q.type].correct+=Number(ok);types[q.type].score+=ok?points:0;types[q.type].max+=points}return{score,max,correct,unanswered,types}}
function resultsView(id){const h=state.history.find(e=>e.id===id);if(!h){reviewExamId=null;return examSetup()}const v=examScore(h);return head('REFLECT, THEN IMPROVE','这一场，你收获了什么？',`${esc(h.title)} · ${dateTime(h.finishedAt)}`,`<button class="btn small-btn" data-action="exam-home">返回考试</button>`)+`<section class="results-hero"><span class="eyebrow">本次成绩</span><div class="score-big">${v.score}<small> / ${v.max}</small></div><div class="result-stats"><span><b>${v.correct}</b>答对题数</span><span><b>${h.ids.length-v.correct}</b>错题 / 未答</span><span><b>${Math.min(h.duration/60000,Math.max(0,(h.finishedAt-h.startedAt)/60000)).toFixed(1)}</b>用时 / 分钟</span></div></section><section class="panel"><h2>按题型查漏补缺</h2><table class="result-table"><thead><tr><th>题型</th><th>正确 / 题量</th><th>正确率</th><th>得分</th></tr></thead><tbody>${Object.entries(v.types).map(([t,r])=>`<tr><td>${TYPES[t]}</td><td>${r.correct} / ${r.total}</td><td>${percent(r.correct,r.total)}%</td><td>${r.score} / ${r.max}</td></tr>`).join('')}</tbody></table><div class="form-footer"><span class="small muted">未答 ${v.unanswered} 题；错题与未答题已收录到错题集。</span><div class="actions"><button class="btn" data-action="review-all-exam" data-id="${esc(h.id)}">逐题复盘</button>${h.ids.length-v.correct?`<button class="btn primary" data-action="retry-exam" data-id="${esc(h.id)}">重练本卷错题</button>`:''}</div></div></section><section class="panel section-gap"><div class="panel-head"><h2>需要关注的题目</h2><span class="small muted">点击查看答案与笔记</span></div>${h.ids.filter(id=>!same(h.answers[id]||[],BY_ID.get(id).answer)).slice(0,20).map(id=>{const q=BY_ID.get(id);return `<div class="list-item"><div><div class="list-meta"><span class="badge">${TYPES[q.type]} #${q.number}</span><span>${esc(q.topic)}</span></div><h3>${esc(q.text)}</h3><span class="list-sub">你的答案：${(h.answers[id]||[]).join('、')||'未作答'} · 题库答案：${q.answer.join('、')}</span></div><button class="btn small-btn" data-action="review-one-exam" data-id="${id}" data-exam="${esc(h.id)}">查看</button></div>`}).join('')||'<p class="muted">全部答对！可以隔一段时间再来复习，巩固记忆。</p>'}${h.ids.length-v.correct>20?'<p class="small muted">此处展示前 20 题。“逐题复盘”可查看全部题目。</p>':''}</section>`}
function openExamReview(examId,index=0){const h=state.history.find(e=>e.id===examId);if(!h)return;const q=BY_ID.get(h.ids[index]);showModal(`<div class="panel-head"><h2>试卷复盘 ${index+1} / ${h.ids.length}</h2><button class="btn small-btn" data-action="close-modal">关闭</button></div>${questionHTML(q,h.answers[q.id]||[],true,{exam:true,result:true})}<div class="q-nav"><button class="btn" data-action="review-nav" data-exam="${esc(h.id)}" data-index="${index-1}" ${index===0?'disabled':''}>上一题</button><button class="btn primary" data-action="review-nav" data-exam="${esc(h.id)}" data-index="${index+1}" ${index===h.ids.length-1?'disabled':''}>下一题</button></div>`);$('#modal').classList.add('review-dialog');$('#modal').scrollTop=0}
function filteredQuestions(){return scopeQuestions(route==='wrong'?'wrong':route==='favorite'?'favorite':'all').filter(q=>{const r=record(q.id),search=filter.text.trim().toLowerCase();return(!filter.type||q.type===filter.type)&&(!filter.topic||q.topic===filter.topic)&&(!search||(`${q.text} ${q.options.map(o=>o.text).join(' ')} ${TYPES[q.type]} ${q.number} ${r.note} ${q.explanation?.analysis||''} ${q.explanation?.tip||''}`).toLowerCase().includes(search))&&(!filter.status||(filter.status==='unseen'?!r.answered:filter.status==='mastered'?r.streak>=2:filter.status==='wrong'?r.wrong:!!r.answered))}).sort((a,b)=>route==='wrong'?record(b.id).errors-record(a.id).errors||record(b.id).lastAt-record(a.id).lastAt:0)}
function listView(){const meta=route==='wrong'?['TURN ERRORS INTO PROGRESS','错过的题，值得再看一遍。','自动收录错题和考试未答题。连续答对 2 次移出待巩固，保留历史错误次数。']:route==='favorite'?['KEEP WHAT MATTERS','把值得回看的，留在这里。','收藏难点、易混点，建立自己的重点题库。']:['EXPLORE THE QUESTION BANK','每一道题，都能找到。','搜索题目、解析或笔记；知识点为关键词辅助归类。'];return head(...meta,`<button class="btn primary small-btn" data-action="practice-filtered">练习当前筛选</button>`)+`<section class="panel"><div class="filter-bar"><input class="search" id="search" type="search" value="${esc(filter.text)}" placeholder="搜索题目、解析、笔记…" aria-label="搜索题目"><select class="filter" id="filter-type" aria-label="筛选题型"><option value="">全部题型</option>${typeOptions(filter.type)}</select><select class="filter" id="filter-topic" aria-label="筛选知识点"><option value="">全部知识点</option>${topicOptions(filter.topic)}</select><select class="filter" id="filter-status" aria-label="筛选学习状态"><option value="">全部状态</option>${[['unseen','未做'],['done','已做'],['mastered','已熟练'],['wrong','待巩固']].map(([v,t])=>`<option value="${v}" ${filter.status===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="list-results">${listResults()}</div></section>`}
function listResults(){const qs=filteredQuestions(),pages=Math.max(1,Math.ceil(qs.length/listPageSize));filter.page=Math.min(filter.page,pages);const slice=qs.slice((filter.page-1)*listPageSize,filter.page*listPageSize);return `<div class="list-results-head"><span class="small muted">共 ${qs.length} 题${route==='wrong'?' · 按错误次数排序':''}</span><label class="page-size">每页 <select id="list-page-size" aria-label="每页题目数">${[5,10,20].map(n=>`<option value="${n}" ${listPageSize===n?'selected':''}>${n} 题</option>`).join('')}</select></label></div>`+(slice.length?slice.map(q=>{const r=record(q.id);return `<div class="list-item"><div><div class="list-meta"><span class="badge">${TYPES[q.type]} #${q.number}</span><span>${esc(q.topic)}</span>${r.wrong?'<span class="badge red">待巩固</span>':r.streak>=2?'<span class="badge green">已熟练</span>':r.answered?'<span class="badge">已做</span>':'<span class="badge">未做</span>'}${r.favorite?'<span aria-label="已收藏">★</span>':''}</div><h3>${esc(q.text)}</h3><div class="list-sub">${r.attempts?`实际作答 ${r.answered} 次 · 错误/未答 ${r.errors} 次 · 连续答对 ${r.streak} 次`:'尚未练习'}${r.note?' · 有笔记':''}${route==='wrong'?` · 最近作答：${r.lastAnswer.join('、')||'未作答'}`:''}</div></div><button class="btn small-btn" data-action="practice-one" data-id="${q.id}">练习</button></div>`}).join(''):empty(route==='wrong'&&!filter.text&&!filter.type&&!filter.topic&&!filter.status?'还没有待巩固错题':'没有找到符合条件的题目','试试调整筛选条件，或从完整题库开始。'))+`<div class="pagination"><span>第 ${filter.page} / ${pages} 页 · 每页 ${listPageSize} 题</span><div class="actions"><button class="btn small-btn" data-action="list-prev" ${filter.page===1?'disabled':''}>上一页</button><button class="btn small-btn" data-action="list-next" ${filter.page===pages?'disabled':''}>下一页</button></div></div>`}
function guideView(){return head('MAKE LEARNING STICK','一点方法，让每次练习更有效。','离线使用，自主学习，所有数据留在当前浏览器。')+`<div class="two-col"><section class="panel guide-text"><h2>推荐的刷题路径</h2><ol><li><strong>第一轮全刷：</strong>从全部 500 题开始，先选答案再提交。覆盖率统计“实际选择并提交过的不同题目”，跳过和考试未答不计入。</li><li><strong>第二轮纠错：</strong>用错题集和智能巩固，优先处理反复出错的题。把原因写进笔记，比只记答案更有效。</li><li><strong>第三轮模拟：</strong>在 90 分钟内完成标准卷，复盘错题与未答题，查看各题型正确率。</li><li><strong>间隔复习：</strong>答对后在 1、3、7、14、30 天后回看；答错立即进入待巩固。复习间隔按连续答对次数延长。</li></ol><h3>“已熟练”如何计算？</h3><p>连续正确作答至少 2 次记为已熟练，再次答错则回到待巩固。该指标仅反映本地练习表现。错题被移出待巩固后，历史错误次数仍保留。</p><h3>适合手机和电脑的答题布局</h3><p>电脑端题目与解析并排，底部操作固定可见。手机端提交后自动切到“答案解析”，可切回“查看题目”对照；答题卡通过按钮打开，减少长页面滚动。</p><h3>键盘也可以刷题</h3><p>按 A–E 选择对应选项；Enter 提交 / 下一题；← → 切换题目。输入笔记、打开对话框或操作表单时不会触发这些快捷键。</p><h3>智能巩固的选择顺序</h3><p>待巩固错题 → 到期复习题 → 未熟练的已做题 → 未做题 → 其他题。每轮 20 题且不重复，错误次数多的题优先。</p></section><section class="panel guide-text"><h2>题库与竞赛规则</h2><p>题库来源：<strong>南山区竞赛题目最终版.xlsx</strong>。包含单选 300 题、多选 70 题、判断 130 题，题干、选项和答案来自原表。保留各题型原始题号。</p><p>规则来源：<strong>2026年南山区人工智能训练师职业技能竞赛技术文件.docx</strong>。</p><ul><li>标准卷：单选 70 × 1 分，多选 10 × 2 分，判断 20 × 0.5 分，满分 100 分，90 分钟。</li><li>错选、多选或少选均不得分，考试未答题记 0 分并收入错题集。</li><li>正式比赛有 30% 现场命题；本站模拟卷全部取自公开题库。</li><li>500 道题均附独立编写的 AI 辅助解析和记忆要点，并非官方解析。遇到答案疑点或前提不完整时单独提示，计分仍按原题库答案。知识点为关键词辅助归类。</li><li>本站聚焦初赛理论题。技术文件中的决赛实操（数据采集与标注、数据分析、智能系统设计）需要另行练习。</li></ul></section></div><section class="panel section-gap guide-text"><h2>学习数据与备份</h2><p>记录保存在当前浏览器的本地存储中，不上传服务器。更换设备、浏览器或文件位置可能无法读取原记录；清除浏览器数据也会删除记录。建议定期导出备份，再在其他设备上导入。</p><p>备份包含答题统计、错题、收藏、个人笔记、练习进度、进行中的试卷及最近 30 次考试记录。导入将替换当前数据。考试使用绝对截止时间，导入过期试卷会自动交卷。</p><div class="backup-actions"><button class="btn primary" data-action="export">导出学习备份</button><button class="btn" data-action="import">导入备份</button>${writeBlocked?'<button class="btn" data-action="export-raw">导出原始记录</button>':''}<button class="btn danger" data-action="reset">清空全部记录</button></div><p class="help-line">直接用 Chrome 或 Edge 打开本 HTML 文件即可使用，无需安装或联网。考试记录和学习数据仅用于个人自测。</p></section>`}
function showModal(html){$('#modal').classList.remove('review-dialog','palette-dialog');$('#modal-content').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
let confirmCallback=null;
function confirmModal(title,desc,label,callback){confirmCallback=callback;showModal(`<h2>${esc(title)}</h2><p>${esc(desc)}</p><div class="actions"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="confirm">${esc(label)}</button></div>`)}
function downloadJson(value,name){const blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportState(){downloadJson(state,`南山刷题备份-${localDate()}.json`);toast('已生成学习备份，请保存下载文件。')}
function currentSession(){return route==='exam'?state.exam:route==='practice'?state.session:null}
function selectOption(key){const s=currentSession();if(!s)return;if(route==='exam'&&Date.now()>=s.deadline){finishExam(true);return}const q=BY_ID.get(s.ids[s.index]);if(!q.options.some(o=>o.key===key))return;const isExam=route==='exam';if(!isExam&&s.answers[q.id])return;const target=isExam?s.answers:s.drafts;let choice=target[q.id]||[];target[q.id]=q.type==='multi'?(choice.includes(key)?choice.filter(k=>k!==key):[...choice,key].sort()):[key];const scrolls=['#main .question-inner','#main .question-core'].map(selector=>({selector,top:$(selector)?.scrollTop||0}));persist();render();scrolls.forEach(({selector,top})=>{const node=$(selector);if(node)node.scrollTop=top});const btn=$(`.option[data-key="${key}"]`);btn?.focus({preventScroll:true})}
function submitPractice(){const s=state.session;if(!s)return;const id=s.ids[s.index];if(s.answers[id])return;const choice=s.drafts[id]||[];if(!choice.length){toast('请先选择答案。');return}s.answers[id]={choice:[...choice],correct:registerAnswer(id,choice)};studyPane='answer';persist();render();$('.q-nav .primary')?.focus({preventScroll:true})}
function handleAction(action,el){
 const s=currentSession();
 switch(action){
 case 'mobile-menu':showModal(`<div class="panel-head"><h2>学习空间</h2><button class="btn small-btn" data-action="close-modal">关闭</button></div><nav class="menu-nav" aria-label="学习空间菜单">${$('#nav').innerHTML}</nav>`);break;
 case 'study-pane':studyPane=el.dataset.pane;document.body.dataset.studyPane=studyPane;document.querySelectorAll('.question-inner,.question-core,.answer-panel').forEach(node=>node.scrollTop=0);document.querySelectorAll('.study-tabs button').forEach(b=>{b.classList.toggle('active',b.dataset.pane===studyPane);b.setAttribute('aria-pressed',String(b.dataset.pane===studyPane))});break;
 case 'open-palette':if(s){showModal(`<div class="panel-head"><h2>答题卡 · ${s.ids.length} 题</h2><button class="btn small-btn" data-action="close-modal">关闭</button></div>${palette(s,route==='exam')}${route==='exam'?'<div class="actions"><button class="btn" data-action="first-unanswered">定位未答题</button><button class="btn primary" data-action="submit-exam">检查并交卷</button></div>':''}<p class="small muted">点击题号跳转，带小圆点的题为考试标记题。</p>`);$('#modal').classList.add('palette-dialog');requestAnimationFrame(()=>$('#modal .q-num.current')?.scrollIntoView({block:'nearest'}))}break;
 case 'guide':navTo('guide');break;
 case 'start-all':replaceSession(QS.map(q=>q.id),'全库顺序练习 · 500 题','all');break;
 case 'resume':navTo('practice');break;
 case 'resume-exam':case 'exam-home':reviewExamId=null;navTo('exam');break;
 case 'wrong-home':navTo('wrong');break;
 case 'smart':smartPractice();break;
 case 'due':replaceSession(scopeQuestions('due').map(q=>q.id),'到期复习','due');break;
 case 'practice-settings':if(state.session)confirmModal('更换练习范围？','当前练习的题号进度会被替换，已提交的记录、错题、收藏和笔记会保留。','更换练习',()=>{state.session=null;persist();render()});else render();break;
 case 'start-custom':{const scope=$('#practice-scope').value,type=$('#practice-type').value,topic=$('#practice-topic').value,count=Number($('#practice-count').value);let qs=scopeQuestions(scope).filter(q=>(!type||q.type===type)&&(!topic||q.topic===topic));if($('#practice-order').value==='random')qs=shuffle(qs);if(count)qs=qs.slice(0,count);replaceSession(qs.map(q=>q.id),`${type?TYPES[type]:'题库'}专项练习 · ${qs.length} 题`);break}
 case 'option':selectOption(el.dataset.key);break;
 case 'submit-answer':submitPractice();break;
 case 'prev':if(s&&s.index>0){s.index--;persist();render()}break;
 case 'next':case 'skip':if(route==='exam'){if(s.index===s.ids.length-1)requestSubmit();else{s.index++;persist();render()}}else if(s)nextPractice();break;
 case 'jump':if(s){$('#modal').close();s.index=Number(el.dataset.index);persist();render()}break;
 case 'favorite':{const id=el.dataset.id,r=mutableRecord(id);r.favorite=!r.favorite;persist();el.textContent=r.favorite?'★ 已收藏':'☆ 收藏本题';el.setAttribute('aria-pressed',String(r.favorite));renderNav();toast(r.favorite?'已加入收藏':'已取消收藏');break}
 case 'session-summary':sessionSummary();break;
 case 'retry-session':{const old=state.session;const ids=old.ids.filter(id=>old.answers[id]&&!old.answers[id].correct);$('#modal').close();makeSession(ids,'本轮错题复练');break}
 case 'finish-session':$('#modal').close();state.session=null;persist();render();break;
 case 'start-standard':startExam({single:70,multi:10,judge:20,minutes:90},'标准模拟卷');break;
 case 'start-custom-exam':startExam(Object.fromEntries(['single','multi','judge','minutes'].map(k=>[k,Number($('#exam-'+k).value)])),'自定义模拟卷');break;
 case 'submit-exam':requestSubmit();break;
 case 'first-unanswered':{const i=s.ids.findIndex(id=>!s.answers[id]?.length);if(i===-1)toast('所有题目都已作答。');else{$('#modal').close();s.index=i;persist();render()}break}
 case 'flag':{const id=s.ids[s.index];if(s.flags[id])delete s.flags[id];else s.flags[id]=true;persist();render();break}
 case 'exam-result':reviewExamId=el.dataset.id;render();break;
 case 'retry-exam':{const h=state.history.find(e=>e.id===el.dataset.id);replaceSession(h.ids.filter(id=>!same(h.answers[id]||[],BY_ID.get(id).answer)),'模拟卷错题复练');break}
 case 'review-all-exam':openExamReview(el.dataset.id);break;
 case 'review-one-exam':{const h=state.history.find(e=>e.id===el.dataset.exam);openExamReview(h.id,h.ids.indexOf(el.dataset.id));break}
 case 'review-nav':openExamReview(el.dataset.exam,Number(el.dataset.index));break;
 case 'practice-one':replaceSession([el.dataset.id],'单题练习');break;
 case 'practice-filtered':replaceSession(filteredQuestions().map(q=>q.id),route==='wrong'?'错题巩固':route==='favorite'?'收藏专项练习':'筛选专项练习');break;
 case 'list-prev':filter.page--;$('#list-results').innerHTML=listResults();break;
 case 'list-next':filter.page++;$('#list-results').innerHTML=listResults();break;
 case 'close-modal':$('#modal').close();confirmCallback=null;break;
 case 'confirm':{const fn=confirmCallback;confirmCallback=null;$('#modal').close();fn?.();break}
 case 'export':exportState();break;
 case 'export-raw':try{downloadJson(localStorage.getItem(STORE)||'',`南山刷题原始记录-${localDate()}.json`)}catch(e){toast('无法读取浏览器原始记录。')}break;
 case 'import':$('#import-file').click();break;
 case 'reset':confirmModal('清空全部学习记录？','这会删除当前浏览器中的答题记录、错题、收藏、笔记、试卷和进度。建议先导出备份；清空后只能通过备份恢复。','清空全部记录',()=>{state=fresh();writeBlocked=false;storageOkay=true;reviewExamId=null;persist();render();toast('当前浏览器中的学习记录已清空。')});break;
 }
}
document.addEventListener('click',e=>{if(e.target.closest('.menu-nav a'))$('#modal').close();const el=e.target.closest('[data-action]');if(!el||el.disabled)return;handleAction(el.dataset.action,el)});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.matches('[data-note-id]')){mutableRecord(el.dataset.noteId).note=el.value;persist();const saved=el.closest('details').querySelector('.note-saved');saved.textContent=storageOkay&&!writeBlocked?'已保存':'暂存在本次页面，请导出备份';}
 if(el.id==='search'){filter.text=el.value;filter.page=1;$('#list-results').innerHTML=listResults()}
});
document.addEventListener('change',e=>{if(e.target.id==='list-page-size'){listPageSize=Number(e.target.value);filter.page=1;$('#list-results').innerHTML=listResults();return}const key={'filter-type':'type','filter-topic':'topic','filter-status':'status'}[e.target.id];if(key){filter[key]=e.target.value;filter.page=1;$('#list-results').innerHTML=listResults()}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>15*1024*1024){toast('备份文件过大，请使用本工具导出的 JSON 文件。');return}try{const imported=validateState(JSON.parse(await file.text()));confirmModal('导入并替换当前学习记录？',`备份包含 ${Object.keys(imported.records).length} 道题的记录与 ${imported.history.length} 次考试记录。导入前将自动下载当前记录备份。`,'导入备份',()=>{if(writeBlocked){try{downloadJson(localStorage.getItem(STORE)||'',`南山刷题原始记录-${localDate()}.json`)}catch(e){toast('无法备份原始记录，已取消导入。');return}}else exportState();state=imported;writeBlocked=false;storageOkay=true;reviewExamId=null;persist();render();toast('备份已导入。')})}catch(err){toast('导入失败：'+(err.message||'文件不是有效的学习备份。'))}});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);route=['home','practice','exam','wrong','favorite','library','guide'].includes(next)?next:'home';filter={text:'',type:'',topic:'',status:'',page:1};render();window.scrollTo({top:0})});
document.addEventListener('keydown',e=>{if($('#modal').open||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,a,summary'))return;if(e.target.closest('button')&&!e.target.closest('.option')&&!(e.target.closest('.q-nav')&&['ArrowLeft','ArrowRight'].includes(e.key)))return;const s=currentSession();if(!s)return;if(/^[a-e]$/i.test(e.key)){e.preventDefault();selectOption(e.key.toUpperCase())}else if(e.key==='Enter'){e.preventDefault();if(route==='practice'&&!s.answers[s.ids[s.index]])submitPractice();else handleAction('next',{})}else if(e.key==='ArrowLeft'){e.preventDefault();handleAction('prev',{})}else if(e.key==='ArrowRight'){e.preventDefault();handleAction('next',{})}});
window.addEventListener('storage',e=>{if(e.key===STORE){writeBlocked=true;storageWarning('检测到另一页面修改了学习记录。为避免互相覆盖，本页暂停自动保存；请导出本页备份，然后刷新以读取最新记录。')}});
route=['home','practice','exam','wrong','favorite','library','guide'].includes(location.hash.slice(1))?location.hash.slice(1):'home';render();setInterval(updateTimer,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});
</script>
</body></html>
