sis":"Python 支持在交互解释器的 >>> 提示符后逐条输入并执行语句，因此 C 所说“不支持逐条语句执行”错误。源代码区分大小写，# 引出行注释。CPython 虽会先把源码编译为字节码再由虚拟机执行，也不意味着它不能交互执行。","tip":"Python 支持交互执行；先编译为字节码与交互性并不矛盾。","caution":""}},{"id":"single-164","number":164,"type":"single","text":"以下选项中,Python代码的注释使用的符号是(  )。","options":[{"key":"A","text":"//"},{"key":"B","text":"/*…… */"},{"key":"C","text":"%"},{"key":"D","text":"#"}],"answer":["D"],"topic":"Python与数据分析","row":166,"explanation":{"analysis":"Python 在字符串之外使用 # 开始行注释，直到该物理行结束，因此选 D。// 在 Python 中表示整除，% 通常表示取模，/*…*/ 则不是 Python 注释语法。三引号包裹的是字符串字面量，在特定位置可作为文档字符串，不能等同于专用块注释。","tip":"Python 行注释用 #，三引号首先是字符串语法。","caution":""}},{"id":"single-165","number":165,"type":"single","text":"下面关于函数说法错误的是(  )。","options":[{"key":"A","text":"函数的三要素是函数名、参数和返回值,定义函数时参数和返回值不是必须的"},{"key":"B","text":"如果没有return语句,则Python函数默认返回值为None"},{"key":"C","text":"函数不可以嵌套"},{"key":"D","text":"使用def定义函数"}],"answer":["C"],"topic":"Python与数据分析","row":167,"explanation":{"analysis":"Python 允许在一个函数体内定义另一个函数，嵌套函数还可访问外层作用域中的变量，因此 C 错误。普通命名函数用 def 定义，可以没有参数，也可以没有显式 return；执行到函数结尾或执行不带表达式的 return 时，返回值均为 None。","tip":"函数可以嵌套，没有显式返回值时返回 None。","caution":""}},{"id":"single-166","number":166,"type":"single","text":"下面哪个函数用于从键盘接收信息(  )。","options":[{"key":"A","text":"int(  )"},{"key":"B","text":"print(  )"},{"key":"C","text":"input(  )"},{"key":"D","text":"range(  )"}],"answer":["C"],"topic":"Python与数据分析","row":168,"explanation":{"analysis":"input() 从标准输入读取一行，交互使用时通常接收键盘输入，并返回字符串，因此选 C。int() 用于整数转换，print() 用于输出，range() 表示整数序列。若想接收一个整数，常将二者组合为 int(input())，并处理输入不是整数时的异常。","tip":"input 读取的是字符串，数值输入需要显式转换。","caution":""}},{"id":"single-167","number":167,"type":"single","text":"range(5)的取值范围是(  )。","options":[{"key":"A","text":"[0, 1, 2, 3, 4, 5]"},{"key":"B","text":"[1, 2, 3, 4, 5]"},{"key":"C","text":"[0, 1, 2, 3, 4]"},{"key":"D","text":"[5]"}],"answer":["C"],"topic":"综合知识","row":169,"explanation":{"analysis":"range(5) 省略了起点和步长，默认从 0 开始、每次增加 1，并在到达 5 前停止，所以依次得到 0、1、2、3、4。A 错在包含终点，B 错在起点和终点，D 错在把参数当成唯一元素。Python 3 中 range 返回范围对象，并非直接返回列表。","tip":"range(stop) 从 0 开始，到 stop 之前结束。","caution":""}},{"id":"single-168","number":168,"type":"single","text":"常见的爬虫语言不包含(  )。","options":[{"key":"A","text":"HTML"},{"key":"B","text":"Python"},{"key":"C","text":"java"},{"key":"D","text":"php"}],"answer":["A"],"topic":"数据采集与处理","row":170,"explanation":{"analysis":"HTML 是描述网页结构的标记语言，通常是爬虫抓取和解析的内容，不能单独承担发送请求、调度任务和处理数据的完整程序逻辑，因此选 A。Python、Java、PHP 都是可用于编写爬虫的编程语言，可借助 HTTP 客户端和页面解析库实现采集。","tip":"HTML 描述网页，爬虫程序负责请求和解析网页。","caution":""}},{"id":"single-169","number":169,"type":"single","text":"Labelme不能对图像进行(  )标注。","options":[{"key":"A","text":"多边形"},{"key":"B","text":"曲线"},{"key":"C","text":"矩形"},{"key":"D","text":"多段线"}],"answer":["B"],"topic":"数据标注与质检","row":171,"explanation":{"analysis":"常见桌面版 Labelme 提供多边形、矩形、线段、点和多段线等标注形状，其中多段线由若干直线段连接而成。它通常没有直接绘制平滑曲线的标准形状工具，因此本题选 B。多边形边界或密集多段线可近似曲线，但与原生曲线标注功能不同。","tip":"多段线是直线段的组合，不等于原生曲线工具。","caution":"结论针对常见 Labelme 标准功能；插件、分支或后续版本可能提供曲线能力。"}},{"id":"single-170","number":170,"type":"single","text":"Labelme以(  )文件存储标注信息。","options":[{"key":"A","text":"XML"},{"key":"B","text":"CSV"},{"key":"C","text":"TXT"},{"key":"D","text":"JSON"}],"answer":["D"],"topic":"数据标注与质检","row":172,"explanation":{"analysis":"Labelme 默认把标注保存为 JSON，其中记录标签名称、形状类型、顶点坐标及关联图像信息，便于程序解析，因此选 D。XML 常见于 Pascal VOC 标注，TXT 常见于 YOLO 标签；它们不是 Labelme 默认的原生保存格式，转换后使用另当别论。","tip":"Labelme 默认 JSON；VOC 常见 XML，YOLO 常见 TXT。","caution":""}},{"id":"single-171","number":171,"type":"single","text":"Labelme是基于（ ）语言和PyQt框架开发的图像标注软件。","options":[{"key":"A","text":"C"},{"key":"B","text":"JAVA"},{"key":"C","text":"Python"},{"key":"D","text":"C++"}],"answer":["C"],"topic":"数据标注与质检","row":173,"explanation":{"analysis":"题目所指的桌面 Labelme 标注软件以 Python 编写，并借助 Qt 的 Python 绑定构建图形界面，所以选 C。PyQt 是连接 Python 与 Qt 的工具，而不是 C、Java 或 C++ 的语言名称。需要区分软件本身的开发语言与底层 GUI 库的实现语言。","tip":"看到 PyQt，先联想到 Python 的 Qt 图形界面绑定。","caution":""}},{"id":"single-172","number":172,"type":"single","text":"LangChain中的(  )组件用于连接LLM和外部工具。","options":[{"key":"A","text":"Agent"},{"key":"B","text":"Chain"},{"key":"C","text":"Memory"},{"key":"D","text":"Prompt"}],"answer":["A"],"topic":"AI与智能系统","row":174,"explanation":{"analysis":"Agent 可根据模型判断决定调用哪个外部工具、使用什么参数，以及是否继续下一步，因此 A 最符合题意。Chain 更强调预先编排的处理步骤，Memory 保存上下文或历史信息，Prompt 负责组织模型输入。工具通常需先声明并由应用执行，Agent 负责协调调用。","tip":"Agent 决定和协调工具调用，Prompt 组织输入，Memory 保存信息。","caution":"Chain 也能包含工具步骤；本题强调的是由模型动态决策的工具使用。"}},{"id":"single-173","number":173,"type":"single","text":"Agent开发平台的核心功能包括(  )。","options":[{"key":"A","text":"仅代码编辑"},{"key":"B","text":"提供开发、测试和部署工具"},{"key":"C","text":"仅数据存储"},{"key":"D","text":"仅用户界面"}],"answer":["B"],"topic":"AI与智能系统","row":175,"explanation":{"analysis":"Agent 开发平台需要覆盖从搭建到运行的流程，例如配置模型和工具、调试调用链、测试任务表现以及部署服务，B 的描述最完整。仅代码编辑、仅数据存储或仅用户界面都只覆盖局部能力，无法支撑一个 Agent 的开发、验证和实际交付。","tip":"开发平台的核心是支持开发、测试、部署的完整流程。","caution":""}},{"id":"single-174","number":174,"type":"single","text":"AutoGPT是一个(  )平台。","options":[{"key":"A","text":"自主Agent开发"},{"key":"B","text":"数据存储"},{"key":"C","text":"网络协议"},{"key":"D","text":"硬件配置"}],"answer":["A"],"topic":"综合知识","row":176,"explanation":{"analysis":"AutoGPT 围绕自主 Agent 的构建和运行展开，可将目标组织为多个步骤，并结合模型推理与工具操作推进任务，因此选 A。它不是数据库、网络通信协议或硬件配置标准。“自主”表示减少逐步人工指挥，不代表运行没有权限、预算和人工监督等约束。","tip":"AutoGPT 的关键词是自主 Agent 与多步骤任务执行。","caution":""}},{"id":"single-175","number":175,"type":"single","text":"Hugging Face在Agent 开发中的角色是(  )。","options":[{"key":"A","text":"提供预训练模型和开发工具"},{"key":"B","text":"硬件供应商"},{"key":"C","text":"网络服务商"},{"key":"D","text":"数据中心"}],"answer":["A"],"topic":"AI与智能系统","row":177,"explanation":{"analysis":"Hugging Face 为开发者提供模型仓库、数据集以及 Transformers 等开发工具，Agent 可以使用其中的预训练模型和组件，因此选 A。其主要角色不是生产硬件、提供电信网络或仅充当数据中心。模型能否用于具体任务还需检查能力、许可及资源需求。","tip":"Hugging Face 的核心资源是模型、数据集和模型开发工具。","caution":""}},{"id":"single-176","number":176,"type":"single","text":"OpenAI的Agent框架中,Function Calling用于(  )。","options":[{"key":"A","text":"计算函数"},{"key":"B","text":"让模型调用外部工具和API"},{"key":"C","text":"编译代码"},{"key":"D","text":"管理内存"}],"answer":["B"],"topic":"AI与智能系统","row":178,"explanation":{"analysis":"Function Calling 让模型依据预先声明的工具接口生成结构化调用请求，应用接收后执行相应函数或 API，再将结果交回模型，所以选 B。它不是一般的数学函数计算、代码编译或内存管理机制。模型提出调用不等于外部操作已经成功执行。","tip":"模型生成工具调用请求，应用执行工具并返回结果。","caution":""}},{"id":"single-177","number":177,"type":"single","text":"在Agent中调用第三方API时,应该(  )。","options":[{"key":"A","text":"没有限制"},{"key":"B","text":"设置请求超时和重试机制"},{"key":"C","text":"忽视错误"},{"key":"D","text":"无限重试"}],"answer":["B"],"topic":"AI与智能系统","row":179,"explanation":{"analysis":"第三方 API 可能遇到网络故障、限流或服务超时，设置超时与有限次数重试能避免任务长期卡住并恢复暂时性错误，因此选 B。重试宜配合退避策略，并考虑写入操作的幂等性。忽略错误、完全不限制请求或无限重试都会降低系统可靠性。","tip":"API 调用要有超时、有限重试与明确的失败处理。","caution":""}},{"id":"single-178","number":178,"type":"single","text":"在Agent中集成数据库的最佳实践是(  )。","options":[{"key":"A","text":"直接查询"},{"key":"B","text":"使用ORM或查询构建器"},{"key":"C","text":"随意编写SQL"},{"key":"D","text":"没有最佳实践"}],"answer":["B"],"topic":"AI与智能系统","row":180,"explanation":{"analysis":"ORM 或查询构建器能统一数据访问方式，提供参数绑定、类型映射等能力，减少随意拼接 SQL 导致的维护和安全问题，因此 B 是题中最佳选择。实际接入还应限制数据库权限并校验查询；直接执行经过参数化和审核的 SQL 也可以是合理做法。","tip":"优先规范数据访问，核心是参数化查询和最小权限。","caution":"ORM 并非所有项目的唯一最佳方案，也不会自动保证模型生成的查询安全。"}},{"id":"single-179","number":179,"type":"single","text":"长期记忆在Agent中的作用是(  )。","options":[{"key":"A","text":"没有作用"},{"key":"B","text":"保存长期学习的知识和经验"},{"key":"C","text":"只存储当前对话"},{"key":"D","text":"立即删除"}],"answer":["B"],"topic":"AI与智能系统","row":181,"explanation":{"analysis":"长期记忆保存跨会话仍有价值的信息，如用户偏好、已经确认的事实和任务经验，后续按需检索使用，因此选 B。仅维持当前对话主要属于短期记忆；立即删除则无法发挥长期积累作用。写入外部记忆通常不会直接修改语言模型的权重。","tip":"长期记忆跨会话复用知识，存入记忆不等于重新训练模型。","caution":""}},{"id":"single-180","number":180,"type":"single","text":"短期记忆在Agent中用于(  )。","options":[{"key":"A","text":"永久存储"},{"key":"B","text":"没有用处"},{"key":"C","text":"维护当前对话的上下文"},{"key":"D","text":"长期保存"}],"answer":["C"],"topic":"AI与智能系统","row":182,"explanation":{"analysis":"短期记忆维护当前任务或会话中的临时状态，例如最近的对话、工具结果和尚未完成的步骤，使 Agent 能连贯处理后续输入，所以选 C。它受上下文窗口或会话策略限制，不等于永久保存。需要长期复用的信息应再经过筛选写入持久存储。","tip":"短期记忆解决当前会话的上下文连续性。","caution":""}},{"id":"single-181","number":181,"type":"single","text":"Agent的记忆机制通常包括(  )。","options":[{"key":"A","text":"仅短期"},{"key":"B","text":"短期和长期记忆"},{"key":"C","text":"仅长期"},{"key":"D","text":"没有记忆"}],"answer":["B"],"topic":"AI与智能系统","row":183,"explanation":{"analysis":"常见 Agent 将记忆分为短期和长期两部分：短期部分维持当前会话与任务状态，长期部分保存可跨任务检索的事实和经验，因此 B 最全面。二者可相互配合，例如将本次对话中确认的偏好写入长期记忆，下次会话再检索出来。","tip":"短期管当前上下文，长期管跨会话积累。","caution":"不是所有 Agent 都必须具备两类记忆；题目描述的是常见架构。"}},{"id":"single-182","number":182,"type":"single","text":"Agent对话的初始化应该(  )。","options":[{"key":"A","text":"没有初始化"},{"key":"B","text":"加载相关的历史记忆和上下文"},{"key":"C","text":"随机开始"},{"key":"D","text":"清除所有记忆"}],"answer":["B"],"topic":"AI与智能系统","row":184,"explanation":{"analysis":"开始对话时加载相关历史和当前任务上下文，可以帮助 Agent 理解用户目标、延续未完成事项并避免重复提问，因此选 B。这里强调相关性，应筛选必要内容，而非无差别加载所有记录。随机开始或一律清空会丢失可用信息，也不利于保持任务连续性。","tip":"初始化时取回与本次任务有关的历史信息。","caution":""}},{"id":"single-183","number":183,"type":"single","text":"Agent的自适应记忆系统应该(  )。","options":[{"key":"A","text":"固定不变"},{"key":"B","text":"根据用户行为动态调整"},{"key":"C","text":"随意改变"},{"key":"D","text":"删除记忆"}],"answer":["B"],"topic":"AI与智能系统","row":185,"explanation":{"analysis":"自适应记忆会依据新信息和用户行为更新内容的相关性、优先级与保留策略，例如调整已过时的偏好，所以选 B。固定不变容易积累陈旧信息，随意改变则可能破坏事实一致性。更新仍应有依据，并区分用户明确陈述和系统推测。","tip":"自适应是有依据地更新记忆，不是任意改写历史。","caution":""}},{"id":"single-184","number":184,"type":"single","text":"记忆的可视化工具用于(  )。","options":[{"key":"A","text":"没有用处"},{"key":"B","text":"帮助理解Agent的记忆结构和内容"},{"key":"C","text":"增加复杂性"},{"key":"D","text":"降低效率"}],"answer":["B"],"topic":"Python与数据分析","row":186,"explanation":{"analysis":"记忆可视化可展示已保存的事实、来源、时间及相互关联，帮助开发者理解 Agent 为什么检索到某条信息，也方便发现重复、冲突或过期内容，因此选 B。图表本身不会自动改善记忆质量，但它提供了检查和调整记忆结构的可观察入口。","tip":"记忆可视化服务于理解、检查和调试记忆内容。","caution":""}},{"id":"single-185","number":185,"type":"single","text":"Agent开发框架的选择应考虑(  )。","options":[{"key":"A","text":"仅价格"},{"key":"B","text":"仅功能"},{"key":"C","text":"仅社区"},{"key":"D","text":"功能、易用性、社区支持和文档"}],"answer":["D"],"topic":"AI与智能系统","row":187,"explanation":{"analysis":"选择 Agent 框架需要同时看功能是否满足任务、接口是否易用、文档是否清楚以及社区维护情况，D 能覆盖这些因素。仅依据价格、功能数量或社区热度都可能忽视集成和维护成本。还应结合现有技术栈、部署限制和可测试性做实际验证。","tip":"框架选择看需求匹配、使用成本与持续维护能力。","caution":""}},{"id":"single-186","number":186,"type":"single","text":"LangChain与LlamaIndex的区别是(  )。","options":[{"key":"A","text":"没有区别"},{"key":"B","text":"完全相同"},{"key":"C","text":"LangChain侧重Agent,LlamaIndex侧重RAG"},{"key":"D","text":"位置不同"}],"answer":["C"],"topic":"综合知识","row":188,"explanation":{"analysis":"从传统定位看，LangChain 强调模型应用的编排、工具与 Agent 工作流，LlamaIndex 更突出数据接入、索引、检索和 RAG，因此 C 是最佳概括。二者不是完全相同，也并非互斥：两套生态都能支持检索增强与 Agent，功能范围会随版本发展。","tip":"LangChain 常从流程编排入手，LlamaIndex 常从数据与检索入手。","caution":"这是侧重点比较，不是严格功能边界；不能推断某框架只能做 Agent 或只能做 RAG。"}},{"id":"single-187","number":187,"type":"single","text":"自建Agent框架的优势是(  )。","options":[{"key":"A","text":"速度快"},{"key":"B","text":"高度自定义和控制"},{"key":"C","text":"成本低"},{"key":"D","text":"简单易用"}],"answer":["B"],"topic":"AI与智能系统","row":189,"explanation":{"analysis":"自建框架可自行设计状态管理、工具接口、调度规则和运行约束，对内部细节拥有更高控制权，因此选 B。它并不天然开发更快、成本更低或更简单，因为还要承担测试、监控、兼容和维护工作。是否自建取决于定制需求能否抵消这些投入。","tip":"自建的主要收益是定制与控制，代价是开发维护责任。","caution":""}},{"id":"single-188","number":188,"type":"single","text":"Agent框架的可扩展性是指(  )。","options":[{"key":"A","text":"无法扩展"},{"key":"B","text":"能够支持更多功能和组件的集成"},{"key":"C","text":"只能本地运行"},{"key":"D","text":"固定功能"}],"answer":["B"],"topic":"AI与智能系统","row":190,"explanation":{"analysis":"可扩展性指框架在需求增长时，能够通过清晰接口增加工具、模型、记忆存储或其他组件，而不必重写全部系统，因此选 B。只能本地运行是部署方式的限制，与是否易于扩展没有必然关系；无法增加能力或只支持固定功能则与可扩展性相反。","tip":"看能否接入新组件，判断框架的可扩展性。","caution":""}},{"id":"single-189","number":189,"type":"single","text":"Agent框架的文档质量影响(  )。","options":[{"key":"A","text":"没有影响"},{"key":"B","text":"开发效率和采用率"},{"key":"C","text":"代码速度"},{"key":"D","text":"硬件性能"}],"answer":["B"],"topic":"AI与智能系统","row":191,"explanation":{"analysis":"清楚的 API 文档、可运行示例和排错说明能减少开发者试错时间，让更多团队愿意采用并持续使用框架，因此选 B。文档质量不会直接改变 CPU、内存等硬件性能，也不会直接使同一段程序执行得更快，但可帮助开发者正确使用和优化接口。","tip":"好文档降低学习与排错成本，影响开发效率和采用率。","caution":""}},{"id":"single-190","number":190,"type":"single","text":"多Agent框架的协调机制是(  )。","options":[{"key":"A","text":"没有机制"},{"key":"B","text":"通过消息队列或中央调度器协调"},{"key":"C","text":"随机协调"},{"key":"D","text":"完全独立"}],"answer":["B"],"topic":"AI与智能系统","row":192,"explanation":{"analysis":"多个 Agent 需要交换任务状态、传递结果和处理依赖，消息队列可提供异步通信，中央调度器可分派工作与汇总结果，因此 B 合理。完全独立或随机行动难以完成有依赖的共同任务。协调也可采用其他协议，队列和调度器是常见实现方式。","tip":"多 Agent 协作需要任务分配、状态交换和结果汇总。","caution":""}},{"id":"single-191","number":191,"type":"single","text":"框架的监控和日志功能用于(  )。","options":[{"key":"A","text":"没有用处"},{"key":"B","text":"浪费资源"},{"key":"C","text":"追踪Agent行为和调试问题"},{"key":"D","text":"增加成本"}],"answer":["C"],"topic":"综合知识","row":193,"explanation":{"analysis":"监控和日志记录模型请求、工具调用、耗时、失败原因及任务状态，能帮助追踪 Agent 做了什么、定位在哪一步出错，所以选 C。它们确实消耗一定资源，但目的在于提高可观察性和故障处理效率。日志还应避免无必要地保存敏感内容。","tip":"日志还原过程，监控发现异常，共同支持调试。","caution":""}},{"id":"single-192","number":192,"type":"single","text":"BDI(信念-欲望-意图)Agent模型中,(  )代表Agent对世界的理解。","options":[{"key":"A","text":"信念"},{"key":"B","text":"欲望"},{"key":"C","text":"意图"},{"key":"D","text":"规划"}],"answer":["A"],"topic":"AI与智能系统","row":194,"explanation":{"analysis":"BDI 中 Beliefs 是信念，表示 Agent 当前对环境和自身状态的认识，因此选 A。Desires 是希望实现的目标，Intentions 是已经选择并承诺推进的目标或行动方向。信念可能不完整或过时，需要随着感知到的新信息更新，不能等同于客观世界的全部事实。","tip":"BDI：信念是知道什么，欲望是想做什么，意图是决定做什么。","caution":""}},{"id":"single-193","number":193,"type":"single","text":"在Agent架构中,(  )负责感知环境信息。","options":[{"key":"A","text":"传感器"},{"key":"B","text":"执行器"},{"key":"C","text":"推理引擎"},{"key":"D","text":"规划模块"}],"answer":["A"],"topic":"AI与智能系统","row":195,"explanation":{"analysis":"传感器承担从环境接收信息的角色，如摄像头、麦克风或软件系统中的消息输入，因此选 A。执行器负责对外产生动作，推理引擎根据已有信息形成判断，规划模块组织行动步骤。感知、决策与执行各有职责，但会共同构成闭环。","tip":"传感器负责输入，执行器负责输出行动。","caution":""}},{"id":"single-194","number":194,"type":"single","text":"(  )是自然语言处理中的基本单元。","options":[{"key":"A","text":"Token"},{"key":"B","text":"Byte"},{"key":"C","text":"Pixel"},{"key":"D","text":"Cluster"}],"answer":["A"],"topic":"综合知识","row":196,"explanation":{"analysis":"Token 是文本经分词器处理后进入模型的基本序列单位，可能是一个词、子词、汉字或其他片段，因此选 A。Byte 是字节单位，Pixel 是图像像素，Cluster 表示簇。Token 不必等于一个完整单词，具体拆分方式由所用分词器决定。","tip":"Token 是模型处理文本的单位，不一定等于一个词。","caution":""}},{"id":"single-195","number":195,"type":"single","text":"在RAG系统中,Chunking(切片)的主要目的是(  )。","options":[{"key":"A","text":"使文档片段适配模型的上下文窗口"},{"key":"B","text":"增加检索速度"},{"key":"C","text":"减少存储空间"},{"key":"D","text":"提高向量维度"}],"answer":["A"],"topic":"AI与智能系统","row":197,"explanation":{"analysis":"切片将长文档拆成较短、相对完整的片段，便于检索后放入模型有限的上下文窗口，因此 A 最符合题意。合适的片段粒度也会影响检索质量，但切片不必然更快、更省存储，更不会自动提高向量维度；过碎还可能损失语义关系。","tip":"RAG 切片既要适配上下文长度，也要保留足够语义。","caution":""}},{"id":"single-196","number":196,"type":"single","text":"以下(  )不是常见的设计模式。","options":[{"key":"A","text":"单例模式"},{"key":"B","text":"工厂模式"},{"key":"C","text":"装饰器模式"},{"key":"D","text":"编程语言"}],"answer":["D"],"topic":"综合知识","row":198,"explanation":{"analysis":"设计模式是解决反复出现的软件设计问题的通用组织方法。单例控制实例数量，工厂封装对象创建，装饰器动态扩展对象行为，三者都是常见模式。编程语言则提供表达程序的语法和语义，不是某一种软件设计方案，因此选 D。","tip":"模式描述设计方法，语言描述程序如何表达。","caution":""}},{"id":"single-197","number":197,"type":"single","text":"数据湖的主要目的是(  )。","options":[{"key":"A","text":"存储原始的、未处理的大数据"},{"key":"B","text":"加密数据"},{"key":"C","text":"压缩数据"},{"key":"D","text":"删除冗余数据"}],"answer":["A"],"topic":"综合知识","row":199,"explanation":{"analysis":"数据湖可集中保存大规模、不同格式的数据，常以接近原始的形态保留，待后续分析时再加工，因此选 A。加密、压缩和去重可以成为数据湖的配套能力，但不是其核心定义。数据湖也可包含处理后的数据，并不限定只允许存放未处理数据。","tip":"数据湖重在大规模、多格式保存，常先存原始数据再加工。","caution":""}},{"id":"single-198","number":198,"type":"single","text":"深度学习中,卷积神经网络(CNN)主要用于(  )。","options":[{"key":"A","text":"图像处理"},{"key":"B","text":"时间序列分析"},{"key":"C","text":"自然语言处理"},{"key":"D","text":"强化学习"}],"answer":["A"],"topic":"AI与智能系统","row":200,"explanation":{"analysis":"CNN 利用局部连接和权重共享提取空间模式，适合学习边缘、纹理和形状等图像特征，所以图像处理是本题最佳答案。卷积也可用于时间序列、文本或强化学习系统，但这些属于可应用领域，不改变 CNN 在视觉任务中的典型地位。","tip":"CNN 擅长提取局部模式，图像处理是典型应用。","caution":""}},{"id":"single-199","number":199,"type":"single","text":"数字图像的基本单位是(  )。","options":[{"key":"A","text":"像素"},{"key":"B","text":"点"},{"key":"C","text":"线"},{"key":"D","text":"区域"}],"answer":["A"],"topic":"数据采集与处理","row":201,"explanation":{"analysis":"数字栅格图像由按行列排列的像素组成，每个像素保存对应位置的亮度或颜色信息，因此选 A。线和区域由多个像素构成，“点”只是泛称，不如像素这一数字图像术语准确。图像宽、高通常以像素数表示，颜色则由通道数和位深编码。","tip":"栅格图像以像素为单位，像素存储位置对应的颜色或亮度。","caution":""}},{"id":"single-200","number":200,"type":"single","text":"灰度图像中,像素值的范围通常是(  )。","options":[{"key":"A","text":"0-1"},{"key":"B","text":"0-127"},{"key":"C","text":"0-255"},{"key":"D","text":"0-512"}],"answer":["C"],"topic":"数据采集与处理","row":202,"explanation":{"analysis":"常见的 8 位灰度图用 8 个二进制位表示一个像素，可编码 2⁸＝256 个灰度级，即 0 至 255，因此选 C。通常 0 表示黑、255 表示白。0 至 1 可用于归一化浮点图像；其他位深也有不同范围，题目的“通常”隐含 8 位表示。","tip":"8 位对应 256 个取值，编号范围为 0～255。","caution":""}},{"id":"single-201","number":201,"type":"single","text":"RGB颜色模型中,每个分量的范围通常是(  )。","options":[{"key":"A","text":"0-1"},{"key":"B","text":"0-255"},{"key":"C","text":"0-100"},{"key":"D","text":"0-360"}],"answer":["B"],"topic":"AI与智能系统","row":203,"explanation":{"analysis":"常见 24 位 RGB 图像为红、绿、蓝三个通道各分配 8 位，每个通道有 256 个取值，即 0 至 255，因此选 B。三个分量共同决定颜色；0 至 1 则常用于归一化浮点表示，0 至 360 常与某些颜色空间的色相角度有关。","tip":"常见 RGB 是三个 8 位通道，每个通道范围 0～255。","caution":""}},{"id":"single-202","number":202,"type":"single","text":"图像分辨率指的是(  )。","options":[{"key":"A","text":"图像中像素的总数"},{"key":"B","text":"图像的物理大小"},{"key":"C","text":"图像的色深"},{"key":"D","text":"图像的格式"}],"answer":["A"],"topic":"数据采集与处理","row":204,"explanation":{"analysis":"数字图像的空间分辨率常用宽×高的像素尺寸描述，也常以总像素数量作概括，因此选项中 A 最接近。物理尺寸还取决于显示或打印密度，色深描述单像素的编码精度，文件格式描述存储方式；它们都不能直接替代空间分辨率。","tip":"图像分辨率通常看像素宽和高，色深看每个像素编码多少位。","caution":"A 是简化表述；同样的总像素数可对应不同宽高，分辨率还可能指每单位长度的像素密度。"}},{"id":"single-203","number":203,"type":"single","text":"以下(  )是有损压缩格式。","options":[{"key":"A","text":"PNG"},{"key":"B","text":"BMP"},{"key":"C","text":"TIFF"},{"key":"D","text":"JPEG"}],"answer":["D"],"topic":"综合知识","row":205,"explanation":{"analysis":"常用 JPEG 编码通过量化等步骤丢弃部分图像信息，以较小文件保存照片，属于有损压缩，因此题库选 D。PNG 通常采用无损压缩，BMP 常见为未压缩位图。反复使用有损编码重新保存可能累积失真，单纯复制文件则不会重新压缩。","tip":"常见照片 JPEG 为有损压缩，PNG 为无损压缩。","caution":"TIFF 是灵活的容器格式，也可采用 JPEG 等有损压缩；本题把 TIFF 一概当作无损格式不够严谨。"}},{"id":"single-204","number":204,"type":"single","text":"卷积运算在图像处理中的作用是(  )。","options":[{"key":"A","text":"增加图像大小"},{"key":"B","text":"特征提取和滤波"},{"key":"C","text":"压缩数据"},{"key":"D","text":"增加像素值"}],"answer":["B"],"topic":"数据采集与处理","row":206,"explanation":{"analysis":"图像卷积让一个小核在局部区域滑动，对邻域像素进行加权组合，不同核可实现平滑、锐化、边缘检测等滤波，也可学习图像特征，因此选 B。输出大小受步长和填充影响，并非卷积的固定目的；压缩数据或统一增加像素值也不是卷积的基本定义。","tip":"卷积用局部加权运算完成滤波或特征提取。","caution":""}},{"id":"single-205","number":205,"type":"single","text":"图像配准(Image Registration)的目的是(  )。","options":[{"key":"A","text":"增加图像大小"},{"key":"B","text":"降低分辨率"},{"key":"C","text":"改变图像格式"},{"key":"D","text":"对齐多幅图像"}],"answer":["D"],"topic":"数据采集与处理","row":207,"explanation":{"analysis":"图像配准通过估计平移、旋转、缩放或更复杂的变换，使不同时间、视角或传感器获得的图像在空间位置上对应，因此选 D。对齐后才便于比较变化、融合图像或拼接全景。单纯改尺寸、降低分辨率或转换格式并不能保证同一目标对准。","tip":"配准解决多幅图像中同一位置的空间对齐。","caution":""}},{"id":"single-206","number":206,"type":"single","text":"图像分割的目的是(  )。","options":[{"key":"A","text":"压缩图像"},{"key":"B","text":"将图像分成有意义的区域"},{"key":"C","text":"增加对比度"},{"key":"D","text":"降低噪声"}],"answer":["B"],"topic":"数据采集与处理","row":208,"explanation":{"analysis":"图像分割根据语义、颜色、纹理等信息，把像素分配到有意义的区域或类别，例如把道路、车辆和背景区分开，所以选 B。压缩关注编码体积，对比度增强关注明暗差别，降噪关注干扰抑制；这些处理可能辅助分割，但不等于分割本身。","tip":"分割回答每个像素或区域属于什么。","caution":""}},{"id":"single-207","number":207,"type":"single","text":"图像金字塔主要用于(  )。","options":[{"key":"A","text":"多尺度图像处理"},{"key":"B","text":"增加存储空间"},{"key":"C","text":"提高分辨率"},{"key":"D","text":"改变颜色空间"}],"answer":["A"],"topic":"数据采集与处理","row":209,"explanation":{"analysis":"图像金字塔用一组不同尺度的图像表示同一内容，使算法能在粗尺度寻找整体结构、在细尺度处理局部细节，因此选 A。它常用于目标检测、配准和多尺度分析。保存多层图像可能增加存储，但这只是代价；也不会凭空创造原图缺失的高分辨率细节。","tip":"图像金字塔是一幅图像的多个尺度版本。","caution":""}},{"id":"single-208","number":208,"type":"single","text":"高斯模糊主要用于(  )。","options":[{"key":"A","text":"增强图像对比度"},{"key":"B","text":"检测边缘"},{"key":"C","text":"降噪和平滑"},{"key":"D","text":"锐化图像"}],"answer":["C"],"topic":"综合知识","row":210,"explanation":{"analysis":"高斯模糊用高斯权重对邻域像素求加权平均，抑制快速变化的高频成分，从而平滑图像并减弱部分噪声，因此选 C。它也会模糊细节和边缘，不能当作锐化操作。高斯平滑可作为边缘检测前的预处理，但其自身主要作用不是检测边缘。","tip":"高斯模糊做平滑，降噪时也可能损失细节。","caution":""}},{"id":"single-209","number":209,"type":"single","text":"直方图均衡化的目的是(  )。","options":[{"key":"A","text":"改善图像对比度和亮度分布"},{"key":"B","text":"压缩图像"},{"key":"C","text":"增加文件大小"},{"key":"D","text":"改变图像尺寸"}],"answer":["A"],"topic":"Python与数据分析","row":211,"explanation":{"analysis":"直方图均衡化依据灰度累积分布重新映射像素值，使原本集中在狭窄范围的灰度更充分地分布，从而常能增强对比度，所以选 A。它处理灰度分布，不负责图像压缩或改变宽高。增强效果依赖原图，也可能放大噪声或使亮度变化不自然。","tip":"直方图均衡化通过重新分配灰度来改善对比度。","caution":""}},{"id":"single-210","number":210,"type":"single","text":"图像阈值化(Thresholding)通常用于(  )。","options":[{"key":"A","text":"连续色调处理"},{"key":"B","text":"二值化(黑白)"},{"key":"C","text":"提高颜色深度"},{"key":"D","text":"增加分辨率"}],"answer":["B"],"topic":"数据采集与处理","row":212,"explanation":{"analysis":"阈值化将像素值与设定阈值比较，再分到不同类别。最常见的单阈值处理把像素分为两类，形成黑白二值图，因此选 B。它常用于前景与背景分离，不是增加颜色深度或空间分辨率的方法；多阈值处理也可产生多级区域。","tip":"单阈值通常把像素分成前景与背景两类。","caution":""}},{"id":"single-211","number":211,"type":"single","text":"形态学操作中,腐蚀(Erosion)的作用是(  )。","options":[{"key":"A","text":"放大前景对象"},{"key":"B","text":"消除噪声"},{"key":"C","text":"缩小前景对象"},{"key":"D","text":"旋转图像"}],"answer":["C"],"topic":"综合知识","row":213,"explanation":{"analysis":"在二值形态学中，以非零区域为前景时，腐蚀要求结构元素覆盖的位置都属于前景才保留中心，因而使前景边界向内收缩，所以 C 最准确。它可以去除某些细小前景噪点，但“消除噪声”是可能的应用，不能替代腐蚀的基本几何作用。","tip":"腐蚀收缩前景，细小前景区域可能随之消失。","caution":""}},{"id":"single-212","number":212,"type":"single","text":"形态学操作中,膨胀(Dilation)的作用是(  )。","options":[{"key":"A","text":"放大前景对象"},{"key":"B","text":"减小前景对象"},{"key":"C","text":"改变颜色"},{"key":"D","text":"改变亮度"}],"answer":["A"],"topic":"综合知识","row":214,"explanation":{"analysis":"二值图像中的膨胀将前景按照结构元素向周围扩展，因此会放大前景区域，选 A。它可填补细小间隙或连接相近区域，与收缩前景的腐蚀相反。这里的“放大”是前景形状扩展，图像画布的宽高通常不变，也不是整体颜色或亮度调整。","tip":"膨胀扩展前景边界，腐蚀收缩前景边界。","caution":""}},{"id":"single-213","number":213,"type":"single","text":"图像锐化的主要目的是(  )。","options":[{"key":"A","text":"增强细节和边缘"},{"key":"B","text":"降低噪声"},{"key":"C","text":"改变尺寸"},{"key":"D","text":"减小文件大小"}],"answer":["A"],"topic":"数据采集与处理","row":215,"explanation":{"analysis":"图像锐化强调灰度变化明显的部分，使轮廓和细节更突出，典型方法包括拉普拉斯增强和反锐化掩蔽，因此选 A。噪声同样可能包含高频成分，锐化常会把它一起放大，所以不能把锐化当作降噪。它也不以缩小文件或改变尺寸为主要目标。","tip":"锐化增强边缘细节，但也可能增强噪声。","caution":""}},{"id":"single-214","number":214,"type":"single","text":"图像的感受野(Receptive Field)在卷积网络中指的是(  )。","options":[{"key":"A","text":"输入图像的大小"},{"key":"B","text":"输出像素所对应的输入区域"},{"key":"C","text":"卷积核的大小"},{"key":"D","text":"特征图的数量"}],"answer":["B"],"topic":"数据采集与处理","row":216,"explanation":{"analysis":"感受野指某个输出特征位置能够受输入图像中哪些区域影响，即输出位置对应的输入范围，因此选 B。单层卷积的局部感受野与卷积核有关，多层叠加后还受步长、膨胀率等影响，通常大于单个卷积核，不能直接与核大小或特征图数量等同。","tip":"感受野描述一个输出位置能看到多大的输入区域。","caution":""}},{"id":"single-215","number":215,"type":"single","text":"区域增长(Region Growing)属于(  )。","options":[{"key":"A","text":"边缘检测方法"},{"key":"B","text":"图像滤波"},{"key":"C","text":"图像分割方法"},{"key":"D","text":"颜色转换"}],"answer":["C"],"topic":"综合知识","row":217,"explanation":{"analysis":"区域增长先选取种子像素，再按灰度、颜色或纹理相似性把相邻像素逐步并入区域，最终得到目标区域划分，因此属于图像分割方法，选 C。边缘检测寻找突变位置，滤波改变局部像素响应，颜色转换改变表示方式，都与这一逐步归并过程不同。","tip":"区域增长从种子出发，按相似性扩展出分割区域。","caution":""}},{"id":"single-216","number":216,"type":"single","text":"Sobel算子主要用于(  )。","options":[{"key":"A","text":"图像平滑"},{"key":"B","text":"边缘检测"},{"key":"C","text":"图像旋转"},{"key":"D","text":"颜色转换"}],"answer":["B"],"topic":"综合知识","row":218,"explanation":{"analysis":"Sobel 算子用水平和垂直方向的差分核近似计算图像梯度，梯度较大的位置往往对应亮度突变和边缘，所以选 B。其计算含一定平滑作用，但主要目的仍是边缘检测。旋转处理空间坐标，颜色转换处理通道表示，均不是 Sobel 的职责。","tip":"Sobel 计算梯度，用亮度变化寻找边缘。","caution":""}},{"id":"single-217","number":217,"type":"single","text":"颜色空间HSV相比RGB的优势是(  )。","options":[{"key":"A","text":"存储空间更小"},{"key":"B","text":"更接近人眼感知"},{"key":"C","text":"计算速度更快"},{"key":"D","text":"支持更多颜色"}],"answer":["B"],"topic":"综合知识","row":219,"explanation":{"analysis":"HSV 把颜色分为色相、饱和度和明度，比直接调节红绿蓝强度更符合人描述颜色的直觉，便于按颜色范围分割，因此 B 最接近题意。它不天然占更少空间、计算更快或支持更多颜色，也不意味着不同 HSV 数值距离等于人眼感知差异。","tip":"HSV 便于按色相、饱和度和明度理解及筛选颜色。","caution":"HSV 是更直观的颜色表达，并非严格的感知均匀颜色空间；“更接近人眼感知”是简化说法。"}},{"id":"single-218","number":218,"type":"single","text":"LabelImg图像标注工具是一个使用(  )开发的开源工具。","options":[{"key":"A","text":"Java"},{"key":"B","text":"C++"},{"key":"C","text":"C"},{"key":"D","text":"Python"}],"answer":["D"],"topic":"数据标注与质检","row":220,"explanation":{"analysis":"LabelImg 是以 Python 编写、使用 Qt 图形界面的开源图像标注工具，常用于给目标画矩形框，因此选 D。其导出结果可服务于目标检测训练，但开发语言与标注文件的格式是两个概念。Qt 底层使用 C++ 不代表 LabelImg 主要代码也由 C++ 编写。","tip":"LabelImg 使用 Python，常用于矩形目标框标注。","caution":""}},{"id":"single-219","number":219,"type":"single","text":"为了提高模型回答的准确性,以下哪种方法最有效(  )。","options":[{"key":"A","text":"提供清晰的上下文和约束条件"},{"key":"B","text":"尽量使用复杂的长难句"},{"key":"C","text":"减少标点符号的使用"},{"key":"D","text":"增加问题的模糊性"}],"answer":["A"],"topic":"AI与智能系统","row":221,"explanation":{"analysis":"明确说明任务背景、已有事实、输出要求和约束，可以减少模型对问题的错误猜测，使回答更贴近目标，因此 A 是这组方法中最有效的选择。长难句、减少标点或增加歧义会让指令更难解析。清晰提示能改善表现，但事实结论仍需适当核验。","tip":"高质量提示先讲清任务、背景、约束与输出形式。","caution":""}},{"id":"single-220","number":220,"type":"single","text":"在提示词中,Role(角色)的设定主要影响模型的哪方面(  )。","options":[{"key":"A","text":"回答的语气和专业视角"},{"key":"B","text":"模型的训练速度"},{"key":"C","text":"模型的参数量"},{"key":"D","text":"模型的推理延迟"}],"answer":["A"],"topic":"AI与智能系统","row":222,"explanation":{"analysis":"角色设定为模型提供回答立场和表达方式，例如“面向初学者的 Python 教师”会引导其采用教学视角与适合新手的语气，所以选 A。它不会修改模型参数数量或重新启动训练，也不能保证缩短推理延迟。角色名称本身并不证明答案具备专业资质。","tip":"Role 影响视角和语气，不改变模型规模或训练过程。","caution":""}},{"id":"single-221","number":221,"type":"single","text":"人工智能中,可解释性(Explainability)指的是(  )。","options":[{"key":"A","text":"模型的准确率"},{"key":"B","text":"模型决策过程的可理解性"},{"key":"C","text":"模型的运行速度"},{"key":"D","text":"模型的参数数量"}],"answer":["B"],"topic":"AI与智能系统","row":223,"explanation":{"analysis":"可解释性关注人能否理解模型为何产生某个预测，包括哪些输入因素重要、决策依据及适用限制，因此选 B。准确率回答预测对不对，运行速度回答多快，参数量描述规模，它们都与可解释性不同。高准确率的模型也可能难以解释其具体决策。","tip":"可解释性问为什么这样预测，准确率问预测是否正确。","caution":""}},{"id":"single-222","number":222,"type":"single","text":"(  )是指模型在训练集上表现好但在测试集上表现差的现象。","options":[{"key":"A","text":"过拟合"},{"key":"B","text":"欠拟合"},{"key":"C","text":"梯度消失"},{"key":"D","text":"梯度爆炸"}],"answer":["A"],"topic":"AI与智能系统","row":224,"explanation":{"analysis":"过拟合是模型过度适应训练样本中的细节甚至噪声，在训练集上表现很好，却无法同样有效地处理未见数据，因此选 A。欠拟合通常在训练和测试上都表现不足；梯度消失、爆炸是优化过程中的梯度问题，不是题干所描述的训练与测试表现差距。","tip":"训练好、测试差，首先警惕过拟合。","caution":""}},{"id":"single-223","number":223,"type":"single","text":"(  )是衡量分类模型精确率和召回率调和平均数的指标。","options":[{"key":"A","text":"F1分数"},{"key":"B","text":"Accuracy"},{"key":"C","text":"MSE"},{"key":"D","text":"R2"}],"answer":["A"],"topic":"AI与智能系统","row":225,"explanation":{"analysis":"F1 是精确率 P 与召回率 R 的调和平均，公式为 2PR/(P+R)，任何一项很低都会拉低 F1，因此选 A。Accuracy 衡量整体预测正确比例；MSE 衡量平方误差；R² 衡量回归拟合程度。F1 适合同时关注误报与漏报的分类任务。","tip":"F1＝2PR/(P+R)，同时兼顾精确率和召回率。","caution":""}},{"id":"single-224","number":224,"type":"single","text":"MapReduce编程模型中,Map阶段的输出结果称为(  )。","options":[{"key":"A","text":"Shuffle"},{"key":"B","text":"中间数据"},{"key":"C","text":"最终输出"},{"key":"D","text":"Combiner"}],"answer":["B"],"topic":"AI与智能系统","row":226,"explanation":{"analysis":"Map 读取输入并产生中间键值对，随后通常经过分区、传输与排序，交给 Reduce 聚合，所以 Map 的输出称为中间数据，选 B。Shuffle 是中间数据的重分发过程，Combiner 是可选的局部聚合步骤，最终输出一般由 Reduce 等后续阶段产生。","tip":"Map 产出中间键值对，Shuffle 分发，Reduce 汇总。","caution":""}},{"id":"single-225","number":225,"type":"single","text":"Transformer模型的核心是(  )。","options":[{"key":"A","text":"卷积操作"},{"key":"B","text":"循环单元"},{"key":"C","text":"多头自注意力机制"},{"key":"D","text":"池化层"}],"answer":["C"],"topic":"AI与智能系统","row":227,"explanation":{"analysis":"Transformer 的关键机制是注意力，尤其多头自注意力可让序列中不同位置建立联系，并从多个表示子空间提取关系，因此选 C。卷积是 CNN 的典型操作，循环单元是 RNN 的典型结构，池化常用于汇聚信息；它们都不是原始 Transformer 的核心替代物。","tip":"Transformer 依靠多头注意力建模序列中的关系。","caution":""}},{"id":"single-226","number":226,"type":"single","text":"BERT是一个预训练模型,主要用于(  )。","options":[{"key":"A","text":"图像识别"},{"key":"B","text":"语音识别"},{"key":"C","text":"目标检测"},{"key":"D","text":"自然语言处理"}],"answer":["D"],"topic":"AI与智能系统","row":228,"explanation":{"analysis":"BERT 是基于 Transformer 编码器的语言预训练模型，通过上下文学习文本表示，常用于文本分类、命名实体识别和抽取式问答，因此选 D。其名称中的双向表示强调同时利用左右上下文。原始 BERT 的主要对象是文本，而不是图像检测或直接处理音频。","tip":"BERT 是面向文本理解的双向编码器预训练模型。","caution":""}},{"id":"single-227","number":227,"type":"single","text":"迁移学习的主要思想是(  )。","options":[{"key":"A","text":"利用已训练模型的知识用于新任务"},{"key":"B","text":"从零开始训练"},{"key":"C","text":"增加数据量"},{"key":"D","text":"降低模型复杂度"}],"answer":["A"],"topic":"综合知识","row":229,"explanation":{"analysis":"迁移学习把源任务或源领域已经学到的表示、参数等知识用于新任务，例如用预训练视觉模型再微调少量行业图像，因此选 A。从零训练没有复用已有知识，不是迁移的核心。迁移可能减少新任务的数据需求，但并不等于简单增加数据或削减模型复杂度。","tip":"迁移学习复用已有知识，再适配新任务。","caution":""}},{"id":"single-228","number":228,"type":"single","text":"以下哪个是生成式模型(  )。","options":[{"key":"A","text":"逻辑回归"},{"key":"B","text":"支持向量机"},{"key":"C","text":"决策树"},{"key":"D","text":"生成对抗网络(GAN)"}],"answer":["D"],"topic":"AI与智能系统","row":230,"explanation":{"analysis":"GAN 通过生成器与判别器的对抗训练，让生成器学习产生类似训练数据的新样本，是典型生成式模型，因此选 D。逻辑回归、支持向量机和常见分类决策树主要学习输入到类别的判别关系。能输出预测标签，并不等于能建模并生成原始数据样本。","tip":"GAN 学习生成新样本，分类器主要区分类别。","caution":""}},{"id":"single-229","number":229,"type":"single","text":"归一化(Normalization)的主要作用是(  )。","options":[{"key":"A","text":"加快模型收敛速度"},{"key":"B","text":"增加模型参数"},{"key":"C","text":"删除异常值"},{"key":"D","text":"增加模型复杂度"}],"answer":["A"],"topic":"数据采集与处理","row":231,"explanation":{"analysis":"将不同量纲或尺度的数值特征调整到可比较范围，可改善优化问题的数值条件，让梯度更新更稳定，常有利于加快收敛，因此选 A。归一化不会自动增加参数，也不是删除异常值的方法；对树模型等不敏感于尺度的算法，其收益可能较小。","tip":"统一数值尺度常有利于梯度优化，但不等于清除异常值。","caution":"加快收敛是常见作用，并非所有模型、所有归一化方法都保证达到。"}},{"id":"single-230","number":230,"type":"single","text":"特征工程在机器学习中的重要性(  )。","options":[{"key":"A","text":"不重要"},{"key":"B","text":"与模型选择无关"},{"key":"C","text":"决定模型性能的上限"},{"key":"D","text":"用于数据压缩"}],"answer":["C"],"topic":"AI与智能系统","row":232,"explanation":{"analysis":"特征工程将原始数据转换为模型更容易利用的有效信息，好的特征可突出与目标相关的规律，因此 C 最贴近题库强调的重要性。它并非只做压缩，也与模型选择紧密相关。最终性能仍同时取决于数据质量、样本量、模型能力和训练方法。","tip":"特征决定模型能利用哪些信息，是性能的重要影响因素。","caution":"“决定性能上限”是经验性强调，不能理解为特征工程单独决定一个固定上限。"}},{"id":"single-231","number":231,"type":"single","text":"k折交叉验证的目的是(  )。","options":[{"key":"A","text":"提高模型泛化能力"},{"key":"B","text":"加速训练"},{"key":"C","text":"减少参数"},{"key":"D","text":"压缩模型"}],"answer":["A"],"topic":"综合知识","row":233,"explanation":{"analysis":"k 折交叉验证轮流以一折作验证集、其余折作训练集，汇总多次结果，主要用于较稳健地估计泛化表现和选择模型。合理选型可间接改善泛化，因此题库选 A。它通常需要重复训练，并不是加速训练、减少参数或压缩模型的方法。","tip":"交叉验证先评估泛化，再支持模型和参数选择。","caution":"A 的表述不精确：交叉验证本身不直接提高模型能力，核心目的是评估和选择。"}},{"id":"single-232","number":232,"type":"single","text":"过拟合问题的常见解决方案是(  )。","options":[{"key":"A","text":"增加训练数据、正则化、降维"},{"key":"B","text":"减少训练数据"},{"key":"C","text":"增加模型复杂度"},{"key":"D","text":"移除验证集"}],"answer":["A"],"topic":"AI与智能系统","row":234,"explanation":{"analysis":"增加有代表性的训练数据可减少对少量样本细节的依赖，正则化约束模型过度复杂，适当降维可去除冗余噪声，因此 A 是常见组合。减少数据或盲目增加复杂度可能加重过拟合；移除验证集只是失去发现问题的依据，并没有解决问题。","tip":"缓解过拟合可增加有效数据，并限制不必要的复杂度。","caution":""}},{"id":"single-233","number":233,"type":"single","text":"以下哪个指标常用于评估回归模型的性能(  )。","options":[{"key":"A","text":"均方误差"},{"key":"B","text":"准确率"},{"key":"C","text":"召回率"},{"key":"D","text":"F1分数"}],"answer":["A"],"topic":"Python与数据分析","row":235,"explanation":{"analysis":"回归预测连续数值，均方误差把每个预测值与真实值之差平方后取平均，可衡量数值预测偏差，因此选 A。它对较大的误差惩罚更明显。准确率、召回率和 F1 通常需要离散类别判断，主要用于分类评价，不能直接替代一般回归误差。","tip":"回归看数值误差，分类常看准确率、召回率和 F1。","caution":""}},{"id":"single-234","number":234,"type":"single","text":"欠拟合问题通常由(  )引起。","options":[{"key":"A","text":"过度训练"},{"key":"B","text":"模型过于简单"},{"key":"C","text":"数据标注错误"},{"key":"D","text":"计算能力不足"}],"answer":["B"],"topic":"综合知识","row":236,"explanation":{"analysis":"模型过于简单时，无法表达数据中的主要规律，即使在训练集上也表现不好，属于典型欠拟合，所以选 B。训练不足、特征信息不足或正则化过强也可能造成欠拟合。过度训练通常更容易引起过拟合；计算能力和标签错误并不能单独定义欠拟合。","tip":"欠拟合通常是表达或学习不足，训练集上也难拟合好。","caution":""}},{"id":"single-235","number":235,"type":"single","text":"以下哪种算法属于生成式模型(  )。","options":[{"key":"A","text":"支持向量机"},{"key":"B","text":"K-近邻算法"},{"key":"C","text":"生成对抗网络"},{"key":"D","text":"线性回归"}],"answer":["C"],"topic":"AI与智能系统","row":237,"explanation":{"analysis":"生成对抗网络包含负责生成样本的生成器和区分真实、生成样本的判别器，通过竞争学习数据特征，因此 C 属于生成式模型。支持向量机和 K 近邻常用于分类或回归，普通线性回归拟合条件均值；这些选项的常规形式都不是题目所指的样本生成模型。","tip":"GAN 的生成器从潜在输入生成数据样本。","caution":""}},{"id":"single-236","number":236,"type":"single","text":"RAG的生成阶段使用(  )模型。","options":[{"key":"A","text":"图像"},{"key":"B","text":"LLM"},{"key":"C","text":"音频"},{"key":"D","text":"视频"}],"answer":["B"],"topic":"AI与智能系统","row":238,"explanation":{"analysis":"典型文本 RAG 先从外部知识库检索相关片段，再把片段与用户问题一起交给大型语言模型生成回答，因此选 B。检索器负责找资料，LLM 负责结合上下文组织答案。图像、音频和视频模型可用于多模态扩展，但不是本题默认文本生成阶段的答案。","tip":"文本 RAG：检索器找证据，LLM 结合证据回答。","caution":""}},{"id":"single-237","number":237,"type":"single","text":"当需要模型进行复杂推理时,应使用(  )提示词。","options":[{"key":"A","text":"思维链"},{"key":"B","text":"简单问答"},{"key":"C","text":"代码生成"},{"key":"D","text":"文本摘要"}],"answer":["A"],"topic":"AI与智能系统","row":239,"explanation":{"analysis":"思维链类提示引导模型把复杂问题分解成若干可处理的步骤，有助于组织多步计算或逻辑关系，因此 A 符合题意。简单问答、代码生成和摘要是任务或输出形式，不能自动提供这种分解。实际使用可要求给出关键依据与核验结果，效果仍取决于模型和任务。","tip":"复杂任务可先分解步骤，再检查中间结论与最终结果。","caution":"不必要求模型暴露完整内部推理；对具备推理能力的模型，清楚的任务和核验要求通常更重要。"}},{"id":"single-238","number":238,"type":"single","text":"当模型回答过于啰嗦时,可以在Prompt中加入什么指令(  )。","options":[{"key":"A","text":"\"请随意发挥\""},{"key":"B","text":"\"请回答得越长越好\""},{"key":"C","text":"\"请简洁回答,不超过100字\""},{"key":"D","text":"\"请增加细节描述\""}],"answer":["C"],"topic":"AI与智能系统","row":240,"explanation":{"analysis":"“请简洁回答，不超过 100 字”同时给出风格要求和可检查的长度上限，能直接针对回答冗长的问题，所以选 C。“随意发挥”会放宽约束，“越长越好”和“增加细节”则会鼓励扩写。若必须严格控制字数，还应在生成后进行长度检查。","tip":"控制篇幅时同时说明简洁风格和明确长度限制。","caution":""}},{"id":"single-239","number":239,"type":"single","text":"机器学习是一种(  )。","options":[{"key":"A","text":"人工智能技术"},{"key":"B","text":"数据分析方法"},{"key":"C","text":"编程语言"},{"key":"D","text":"机械工程技术"}],"answer":["A"],"topic":"AI与智能系统","row":241,"explanation":{"analysis":"机器学习研究如何从数据或经验中学习规律，使系统在任务上的表现改进，是人工智能的重要技术分支，因此题库选 A。它不属于编程语言或机械工程技术。机器学习也广泛用于数据分析，所以应理解 A 是本题要考查的学科归属，而非否定分析用途。","tip":"机器学习属于人工智能，也可作为数据分析的方法。","caution":"B 在广义应用描述下也能成立；作为单选题，A 更准确地表达学科归属。"}},{"id":"single-240","number":240,"type":"single","text":"机器学习中,监督学习的特点是(  )。","options":[{"key":"A","text":"需要有标记的训练数据"},{"key":"B","text":"不需要训练数据"},{"key":"C","text":"只需要无标记数据"},{"key":"D","text":"不依赖数据"}],"answer":["A"],"topic":"AI与智能系统","row":242,"explanation":{"analysis":"监督学习使用输入与目标标签配对的训练样本，通过比较预测和标签的差异来学习映射，因此选 A。标签可以是分类类别，也可以是回归数值。只利用无标签数据发掘结构通常属于无监督学习；监督学习也不能脱离数据凭空训练。","tip":"监督学习的关键是训练样本具有目标标签。","caution":""}},{"id":"single-241","number":241,"type":"single","text":"大数据分析中,数据挖掘和机器学习之间是(  )。","options":[{"key":"A","text":"没有区别"},{"key":"B","text":"都是同义词"},{"key":"C","text":"数据挖掘更广泛"},{"key":"D","text":"两者有交叉"}],"answer":["D"],"topic":"AI与智能系统","row":243,"explanation":{"analysis":"数据挖掘侧重从数据中发现有价值的模式和知识，机器学习侧重从经验中学习可用于预测或决策的规律。挖掘工作常使用机器学习算法，二者也各有独立关注点，因此选 D。把它们完全视为同义词，或简单认定一方在所有语境下包含另一方，都不准确。","tip":"数据挖掘与机器学习目标有侧重，方法和应用有交叉。","caution":""}},{"id":"single-242","number":242,"type":"single","text":"以下哪个属于非监督学习(  )。","options":[{"key":"A","text":"分类"},{"key":"B","text":"回归"},{"key":"C","text":"聚类"},{"key":"D","text":"排序"}],"answer":["C"],"topic":"综合知识","row":244,"explanation":{"analysis":"聚类根据样本之间的相似性将其分组，通常不需要预先给定每个样本所属的类别，因此选 C。常规分类和回归依赖目标标签，属于监督学习。排序可采用监督或其他方法实现，但并不是这组选项中最典型、最明确的无监督任务。","tip":"分类学习已有类别，聚类从无标签数据中寻找分组。","caution":""}},{"id":"single-243","number":243,"type":"single","text":"一个机器学习系统的基本结构不包括以下哪个(  )。","options":[{"key":"A","text":"感知"},{"key":"B","text":"学习"},{"key":"C","text":"环境"},{"key":"D","text":"知识库"}],"answer":["A"],"topic":"AI与智能系统","row":245,"explanation":{"analysis":"本题采用传统学习系统的分解方式，通常列出环境、学习部分、知识库和执行部分，因而把“感知”视为未单独列出的部件，题库选 A。实际机器学习系统可以包含传感和感知模块，也可能不使用显式知识库；系统组成必须结合采用的架构定义理解。","tip":"本题按传统四部分口径记忆：环境、学习、知识库、执行。","caution":"“基本结构”没有唯一通用划分，不能据此断言机器学习系统不包含感知。"}},{"id":"single-244","number":244,"type":"single","text":"机器学习研究如何通过计算的手段,利用经验来改善系统自身的性能,请问机器学习利用数据训练出什么(  )。","options":[{"key":"A","text":"模型"},{"key":"B","text":"表结构"},{"key":"C","text":"结果"},{"key":"D","text":"报表"}],"answer":["A"],"topic":"AI与智能系统","row":246,"explanation":{"analysis":"机器学习通过数据调整某种表示或规则的参数，得到能对新输入进行预测、分类或决策的模型，因此选 A。表结构用于组织数据，报表用于展示分析结果，都不是训练的核心产物。“结果”过于泛指，无法体现模型可重复应用于新样本这一特征。","tip":"训练产生模型，模型再对新输入产生预测结果。","caution":""}},{"id":"single-245","number":245,"type":"single","text":"机器通过人类发现的问题空间的数据,进行机器学习,具有在人类发现的问题空间中求解的能力,并且求解的过程与结果可以被人类智能(  ),此为机器智能的产生。","options":[{"key":"A","text":"理解"},{"key":"B","text":"参考"},{"key":"C","text":"相同"},{"key":"D","text":"采纳"}],"answer":["A"],"topic":"AI与智能系统","row":247,"explanation":{"analysis":"按题干表达，机器在给定问题空间中学习并求解，后半句强调人能够认识和解释求解过程及结果，所以 A“理解”最契合语义。“相同”不能描述人对过程的关系，“参考”和“采纳”则是可能的使用行为，并非题干强调的认知关系。","tip":"此题重在句义：对求解过程与结果形成理解。","caution":"这不是机器智能的通用严格定义；可解释性是重要属性，但并非所有智能系统都已能被人完整理解。"}},{"id":"single-246","number":246,"type":"single","text":"机器学习的一个常见应用是(  )。","options":[{"key":"A","text":"语音识别"},{"key":"B","text":"图像处理"},{"key":"C","text":"自然语言处理"},{"key":"D","text":"所有上述"}],"answer":["D"],"topic":"AI与智能系统","row":248,"explanation":{"analysis":"机器学习可从音频学习语音到文字的映射，从图像学习目标和场景特征，也可从文本学习语义、分类或生成能力，因此三项都属于常见应用，选 D。不同任务使用的数据表示和模型结构可能不同，但共同点都是借助数据学习规律。","tip":"语音、图像和自然语言都是机器学习的常见应用领域。","caution":""}},{"id":"single-247","number":247,"type":"single","text":"(  )是指算法对特定人群产生不公平的结果。","options":[{"key":"A","text":"算法歧视"},{"key":"B","text":"算法推荐"},{"key":"C","text":"算法备案"},{"key":"D","text":"算法审计"}],"answer":["A"],"topic":"AI与智能系统","row":249,"explanation":{"analysis":"算法对某些群体产生系统性不公平的待遇或不利影响，称为算法歧视，可能源于样本偏差、标签偏见、代理变量或目标设计，因此选 A。算法推荐是一种应用功能，备案是管理程序，审计则是检查评估过程，后两者可用于发现和治理问题。","tip":"算法歧视关注群体间不公平影响，审计用于检查这些影响。","caution":""}},{"id":"single-248","number":248,"type":"single","text":"OpenAI的Function Calling API返回(  )。","options":[{"key":"A","text":"代码"},{"key":"B","text":"函数名和参数"},{"key":"C","text":"错误信息"},{"key":"D","text":"随机数"}],"answer":["B"],"topic":"综合知识","row":250,"explanation":{"analysis":"当模型选择发出 Function Calling 工具请求时，返回内容包含所调用函数的名称及结构化参数，应用据此执行具体操作，因此选 B。返回函数名和参数并不意味着函数已执行，更不等于直接返回一段可运行源码。实际响应还可能包含调用标识等元信息。","tip":"Function Calling 返回调用描述，外部应用负责执行。","caution":"并非每次 API 响应都必然包含工具调用；是否调用取决于配置、任务及模型选择。"}},{"id":"single-249","number":249,"type":"single","text":"RAG相比传统LLM的优势是(  )。","options":[{"key":"A","text":"更快速"},{"key":"B","text":"更昂贵"},{"key":"C","text":"能利用外部知识库提高准确性"},{"key":"D","text":"更小的模型"}],"answer":["C"],"topic":"AI与智能系统","row":251,"explanation":{"analysis":"RAG 在生成前检索外部知识库，把相关证据加入上下文，使模型能利用训练之后更新的信息或私有领域资料，因此选 C。检索和额外上下文通常会增加一定耗时与成本，并不保证更快或让模型变小；最终准确性还取决于检索质量和生成约束。","tip":"RAG 的优势是补充可更新的外部知识与证据。","caution":""}},{"id":"single-250","number":250,"type":"single","text":"梯度消失问题主要发生在(  )。","options":[{"key":"A","text":"浅层网络"},{"key":"B","text":"深层网络"},{"key":"C","text":"卷积层"},{"key":"D","text":"池化层"}],"answer":["B"],"topic":"综合知识","row":252,"explanation":{"analysis":"反向传播时，梯度沿多层链式相乘，若多次乘以较小导数，传到前面层的信号会越来越弱，深层网络更容易出现梯度消失，因此选 B。长序列循环网络也有类似问题。它不专属于卷积层或池化层，可用合适激活、初始化和残差连接等方法缓解。","tip":"层数或时间链路越长，小导数连乘越容易让梯度衰减。","caution":""}},{"id":"single-251","number":251,"type":"single","text":"智能系统网络优化中,完全控制是指(  )。","options":[{"key":"A","text":"只需拥有单一互联网连接,就能轻松获得电信网通双线路的速度优势"},{"key":"B","text":"无需人工干预,免去繁琐复杂的日常维护"},{"key":"C","text":"客户对特定路由有完全控制权,能做到深入的路由调整"},{"key":"D","text":"当优化路径不可用时,自动选择原来路径"}],"answer":["C"],"topic":"AI与智能系统","row":253,"explanation":{"analysis":"题干所说的完全控制强调客户拥有对具体路由策略的配置权，能够按需求进行深入调整，因此选 C。A 描述多线路优化带来的接入效果，B 描述自动运维，D 描述优化路径失效后的回退机制。控制权、自动化和容错是不同能力，不能混为一谈。","tip":"完全控制看路由调整权限，自动回退看故障恢复能力。","caution":""}},{"id":"single-252","number":252,"type":"single","text":"在Tableau产品中,(  )可实现建立数据仓库与数据文件的连接,完成数据导入分析。","options":[{"key":"A","text":"Tableau Desktop"},{"key":"B","text":"Tableau Public"},{"key":"C","text":"Tableau Online"},{"key":"D","text":"Tableau Server"}],"answer":["A"],"topic":"计算机与办公基础","row":254,"explanation":{"analysis":"Tableau Desktop 主要用于连接数据库、数据仓库及文件，制作分析工作簿和可视化，因此本题选 A。Server 与原称 Online、现称 Cloud 的产品更偏向发布、共享和集中管理；Public 面向公共发布，也有制作能力，但不是题中完整专业桌面分析工具的标准答案。","tip":"Desktop 常用于连接和制作，Server／Cloud 常用于发布和协作。","caution":"产品连接能力并非完全互斥，Tableau Public 也能连接部分文件数据源；题目考查的是主要产品定位。"}},{"id":"single-253","number":253,"type":"single","text":"以下选项中,关于消息中间件RocketMQ说法错误的是(  )。","options":[{"key":"A","text":"由Java开发"},{"key":"B","text":"支持消息失败重试、消息事务、消息回溯"},{"key":"C","text":"实时性好"},{"key":"D","text":"不支持大量堆积"}],"answer":["D"],"topic":"综合知识","row":255,"explanation":{"analysis":"RocketMQ 是主要使用 Java 开发的分布式消息中间件，设计上支持高吞吐与大量消息积压，并具有失败重试、事务消息和消费回溯等能力，所以 D 错误。消息积压表示生产速度暂时超过消费速度，能否承受还受磁盘容量、保留策略和部署资源限制。","tip":"RocketMQ 支持消息积压，但容量仍受资源与保留策略限制。","caution":""}},{"id":"single-254","number":254,"type":"single","text":"T检验中,(  )主要用于定量数据和定类数据的差异关系研究。","options":[{"key":"A","text":"独立样本的T检验"},{"key":"B","text":"单一样本的T检验"},{"key":"C","text":"配对T检验"},{"key":"D","text":"回归系数的显著性检验"}],"answer":["A"],"topic":"综合知识","row":256,"explanation":{"analysis":"独立样本 t 检验比较两个相互独立组的定量指标均值，例如比较两类样本的平均成绩，因此 A 最符合题意。单样本检验比较一个均值与指定值，配对检验针对同一对象前后或匹配样本，回归系数检验则考查某个系数是否显著偏离假设值。","tip":"独立两组比均值用独立样本 t 检验，同一对象前后用配对检验。","caution":"题干应限定定类变量有两个组；需考虑独立性及分布条件，方差不齐可使用 Welch t 检验。"}},{"id":"single-255","number":255,"type":"single","text":"多元回归模型中,(  )用来验证回归方程是否有统计学意义。","options":[{"key":"A","text":"方差分析"},{"key":"B","text":"决定系数"},{"key":"C","text":"复相关系数"},{"key":"D","text":"偏回归平方和"}],"answer":["A"],"topic":"Python与数据分析","row":257,"explanation":{"analysis":"多元线性回归通常用方差分析中的整体 F 检验，检验各斜率系数是否同时为 0，从而判断回归方程整体是否有统计学意义，因此选 A。R² 和复相关系数描述拟合或关联程度，不能单凭数值大小完成显著性检验；偏回归平方和只是相关分解量。","tip":"整体回归显著性常看 F 检验，拟合程度常看 R²。","caution":""}},{"id":"single-256","number":256,"type":"single","text":"分词算法中,(  )是由右到左方向扫描的。","options":[{"key":"A","text":"正向最大匹配法"},{"key":"B","text":"逆向最大匹配法"},{"key":"C","text":"最少切分"},{"key":"D","text":"双向最大匹配法"}],"answer":["B"],"topic":"AI与智能系统","row":258,"explanation":{"analysis":"逆向最大匹配从句子右端向左扫描，每次优先尝试词典允许的最长片段，因此选 B。正向最大匹配方向相反；双向最大匹配通常综合两个方向的分词结果；最少切分强调切分数量或全局目标，不直接规定必须从右向左扫描。","tip":"逆向指从右向左，最大匹配指优先匹配最长词。","caution":""}},{"id":"single-257","number":257,"type":"single","text":"下列选项中,关于yield生成器说法错误的是(  )。","options":[{"key":"A","text":"包含yield语句的函数是一个生成器"},{"key":"B","text":"生成器冻结后不再执行未完成的语句"},{"key":"C","text":"通过for循环输出值"},{"key":"D","text":"相比一次列出所有内容更耗时"}],"answer":["D"],"topic":"综合知识","row":259,"explanation":{"analysis":"含 yield 的普通函数是生成器函数，调用后得到生成器对象；迭代到 yield 时产出值并暂停，下次迭代再继续，for 可驱动这一过程。生成器按需产出通常节省内存，不能笼统认定更耗时，所以题库选 D；总耗时仍受是否遍历全部数据等因素影响。","tip":"yield 暂停并保留状态，生成器的稳定优势是按需与节省内存。","caution":"D 不是普遍错误或正确的性能结论；B 只能解释为暂停期间不执行，恢复迭代后会执行剩余语句。"}},{"id":"single-258","number":258,"type":"single","text":"不同的职业人员在特定的职业活动中形成了特殊的职业关系不包括(  )。","options":[{"key":"A","text":"职业主体与职业服务对象之间的关系"},{"key":"B","text":"职业团体之间的关系"},{"key":"C","text":"同一职业团体内部人与人之间的关系"},{"key":"D","text":"职业劳动者与个人之间的关系"}],"answer":["D"],"topic":"职业道德与法规","row":260,"explanation":{"analysis":"职业关系通常围绕工作角色划分，包括从业者与服务对象、不同职业团体之间，以及同一团体内部成员之间的关系，A、B、C 对应这些常见类型。D 仅说“职业劳动者与个人”，未明确对方在职业活动中的角色，故不属于题目列出的规范分类。","tip":"职业关系按职业角色划分：服务对象、团体之间、团体内部。","caution":"D 并非表示劳动者不能与个人形成职业关系，而是其表述不构成明确的分类。"}},{"id":"single-259","number":259,"type":"single","text":"爱岗敬业的要求中,(  )是爱岗敬业的高层次展现,必须不断学习。","options":[{"key":"A","text":"乐业"},{"key":"B","text":"勤业"},{"key":"C","text":"怠业"},{"key":"D","text":"精业"}],"answer":["D"],"topic":"职业道德与法规","row":261,"explanation":{"analysis":"精业强调持续学习、钻研业务并提高专业技能，是在愿意从业、勤于履职基础上追求更高质量，故选 D。乐业侧重热爱和乐于工作，勤业侧重勤勉投入，怠业则是懈怠职责。题干的“高层次”和“不断学习”直接指向专业能力的精进。","tip":"乐业重热爱，勤业重勤勉，精业重技艺精进。","caution":""}},{"id":"single-260","number":260,"type":"single","text":"防火墙是一种计算机硬件和软件的结合,使互联网与内部网之间建立起一个(  ),从而保护内部网免受非法用户的侵入。","options":[{"key":"A","text":"安全等级保护制度"},{"key":"B","text":"安全信息系统"},{"key":"C","text":"安全网关"},{"key":"D","text":"安全保护"}],"answer":["C"],"topic":"计算机与办公基础","row":262,"explanation":{"analysis":"防火墙在不同信任程度的网络之间实施访问控制，根据规则允许或阻止通信，承担安全网关的作用，因此选 C。安全等级保护制度是管理与技术要求的体系，安全信息系统和安全保护过于宽泛。防火墙可以是软件、硬件设备或虚拟化服务，不限于单一形态。","tip":"防火墙在网络边界按规则控制通信，形成安全网关。","caution":""}},{"id":"single-261","number":261,"type":"single","text":"以下选项中,不属于聚类算法的应用场景的是(  )。","options":[{"key":"A","text":"网站关键词来源聚类整合"},{"key":"B","text":"恶意流量识别"},{"key":"C","text":"商务中发现不同的客户群"},{"key":"D","text":"图像压缩"}],"answer":["B"],"topic":"Python与数据分析","row":263,"explanation":{"analysis":"关键词归组、客户分群和用聚类中心近似图像颜色都是聚类的典型场景。题库把恶意流量识别归为分类任务而选 B，但实际也可对网络流量聚类，利用异常簇或偏离正常簇的行为发现攻击，尤其适用于缺少已知攻击标签的情况。","tip":"聚类能做分群，也能辅助异常检测，是否恶意还需进一步判断。","caution":"题库 B 不是严格成立的排除项：恶意流量识别也可使用聚类，四个场景都存在聚类应用。"}},{"id":"single-262","number":262,"type":"single","text":"下列情况中,用人单位可以单方解除劳动合同的是(  )。","options":[{"key":"A","text":"患病,在规定的医疗期"},{"key":"B","text":"女职工在孕期、产期、哺乳期"},{"key":"C","text":"职工患职业病丧失部分劳动能力"},{"key":"D","text":"严重失职、营私舞弊,对用人单位利益造成重大损失"}],"answer":["D"],"topic":"职业道德与法规","row":264,"explanation":{"analysis":"严重失职或营私舞弊并给用人单位造成重大损害，属于法定的过失性解除事由，故本题选 D。医疗期、孕产哺乳期及特定职业病情形通常受到特别保护，不能仅因这些状态按一般无过失解除或经济性裁员规则处理。适用 D 仍需事实和证据支持。","tip":"严重失职并造成重大损害，是法定过失性解除事由。","caution":"受保护状态并非对所有解除情形绝对豁免；本题应按《劳动合同法》不同解除事由及保护条款区分理解。"}},{"id":"single-263","number":263,"type":"single","text":"结构化数据一般以表格的形式组成,表格的行表示(  )。","options":[{"key":"A","text":"观察值"},{"key":"B","text":"特征值"},{"key":"C","text":"预测值"},{"key":"D","text":"误差值"}],"answer":["A"],"topic":"综合知识","row":265,"explanation":{"analysis":"在常见的结构化数据表中，一行对应一个对象、事件或一次观测，即一条观察记录，因此选 A；一列对应某个属性或特征。单元格才是某条记录在某一特征上的具体值。预测值和误差值可作为表中的列，但不是所有行的通用定义。","tip":"数据表通常行是样本或记录，列是属性或特征。","caution":""}},{"id":"single-264","number":264,"type":"single","text":"以下选项属于半结构化数据的应用场合(  )。","options":[{"key":"A","text":"邮件系统"},{"key":"B","text":"图片识别"},{"key":"C","text":"人脸识别"},{"key":"D","text":"ERP"}],"answer":["A"],"topic":"综合知识","row":266,"explanation":{"analysis":"电子邮件含有发件人、收件人、时间等明确字段，同时带有自由文本正文和附件，既有结构又不完全符合固定二维表结构，是半结构化数据的典型例子，所以选 A。图片和人脸图像通常属于非结构化数据；ERP 中的业务表则多为结构化记录。","tip":"邮件头有字段、正文较自由，属于典型半结构化数据。","caution":""}},{"id":"single-265","number":265,"type":"single","text":"下列选项中,关于VBA命名说法错误的是(  )。","options":[{"key":"A","text":"字符长度小于40"},{"key":"B","text":"不能与VB保留字重名"},{"key":"C","text":"字母打头"},{"key":"D","text":"不能包含数字"}],"answer":["D"],"topic":"综合知识","row":267,"explanation":{"analysis":"VBA 标识符通常要求以字母开头，可包含后续数字和下划线，并需避免与保留字冲突，所以 D“不能包含数字”错误。比如 score2 是合法变量名。命名长度限制与名称类别有关，普通变量名的上限通常为 255 个字符，不能笼统说必须少于 40 个字符。","tip":"VBA 名称可含数字，但通常不能以数字开头。","caution":"题库选 D，但 A“字符长度小于 40”也不是 VBA 变量命名的一般规则，本题存在多项错误。"}},{"id":"single-266","number":266,"type":"single","text":"数据质量检测的准确性是指(  )。","options":[{"key":"A","text":"数据信息是否存在缺失的状况"},{"key":"B","text":"数据是否遵循了统一的规范"},{"key":"C","text":"数据记录的信息是否存在异常或错误"},{"key":"D","text":"数据从产生到可以查看的时间间隔"}],"answer":["C"],"topic":"综合知识","row":268,"explanation":{"analysis":"数据准确性关注记录是否正确反映真实对象或事实，异常、错误的数值或内容会损害准确性，因此 C 最接近。A 对应完整性，B 对应规范性或一致性，D 对应及时性。检测到异常只是核查线索，罕见但真实的值不能未经确认就当作错误删除。","tip":"准确性看是否真实正确，完整性看是否缺失，及时性看是否及时。","caution":""}},{"id":"single-267","number":267,"type":"single","text":"对比分析方法中,(  )是指同一空间条件下,对不同时期数据的比较。","options":[{"key":"A","text":"纵比"},{"key":"B","text":"同比"},{"key":"C","text":"环比"},{"key":"D","text":"横比"}],"answer":["A"],"topic":"综合知识","row":269,"explanation":{"analysis":"在同一对象或空间范围下比较不同时期的数据，属于纵向比较，简称纵比，所以选 A。同比通常比较本期与上年同一时期，环比比较相邻时期，二者是常用的时间比较口径。横比则侧重同一时期不同地区、对象或群体之间的比较。","tip":"纵比沿时间比较，横比在不同对象之间比较。","caution":""}},{"id":"single-268","number":268,"type":"single","text":"职业责任感的建立途径不包括(  )。","options":[{"key":"A","text":"强化职业观念"},{"key":"B","text":"放宽岗位规章制度"},{"key":"C","text":"强调从业人员的职责"},{"key":"D","text":"对从业人员进行评估"}],"answer":["B"],"topic":"职业道德与法规","row":270,"explanation":{"analysis":"建立职业责任感需要明确岗位职责、强化职业认同，并通过评估和反馈促进履责，A、C、D 均符合这一方向。单纯放宽岗位规章制度不能替代责任教育，还可能使职责边界不清，因此 B 不是题目所指的建立途径。制度合理化与无原则放宽应加以区分。","tip":"职业责任感依靠认同、明确职责和履责评价。","caution":""}},{"id":"single-269","number":269,"type":"single","text":"庄子笔下的\"庖丁解牛\"体现的技术价值观念是(  )。","options":[{"key":"A","text":"向善"},{"key":"B","text":"求精"},{"key":"C","text":"重义"},{"key":"D","text":"轻利"}],"answer":["B"],"topic":"综合知识","row":271,"explanation":{"analysis":"庖丁长期实践、洞察牛体结构并顺应其规律下刀，表现出熟练技艺以及对操作境界的持续追求，最能体现求精，所以选 B。向善、重义和轻利属于其他价值取向，并非这个故事关于技艺的核心。题目强调的是经验积累与精湛技能。","tip":"庖丁解牛体现循规律、熟技艺、追求精湛。","caution":""}},{"id":"single-270","number":270,"type":"single","text":"第三次信息化浪潮的标志是(  )。","options":[{"key":"A","text":"互联网的普及"},{"key":"B","text":"云计算、大数据、物联网技术的普及"},{"key":"C","text":"个人电脑的普及"},{"key":"D","text":"虚拟现实技术的普及"}],"answer":["B"],"topic":"综合知识","row":272,"explanation":{"analysis":"按常见信息化浪潮的教材划分，个人计算机普及对应第一波，互联网普及对应第二波，云计算、大数据和物联网的发展构成第三波的重要标志，因此选 B。虚拟现实虽是相关技术方向，却不能单独概括这一阶段的数据、连接与计算基础变化。","tip":"按本题口径记忆：个人电脑、互联网、云计算与大数据及物联网。","caution":"“第几次浪潮”是特定教材的历史分期，不同文献的划分方式可能不同。"}},{"id":"single-271","number":271,"type":"single","text":"图像灰度方差说明了图像的(  )属性。","options":[{"key":"A","text":"平均灰度"},{"key":"B","text":"图像对比度"},{"key":"C","text":"图像整体亮度"},{"key":"D","text":"图像细节"}],"answer":["B"],"topic":"数据采集与处理","row":273,"explanation":{"analysis":"灰度方差衡量各像素灰度偏离平均灰度的程度，差异越大往往说明明暗变化越明显，因此常用来反映整体对比度，选 B。平均灰度更能表征整体亮度；方差不记录像素的空间排列，因此无法单独说明边缘位置、纹理结构等具体细节。","tip":"平均值描述整体灰度水平，方差描述灰度离散程度与对比度。","caution":""}},{"id":"single-272","number":272,"type":"single","text":"网络管理软件包括管理专用软件,管理支持软件和(  )。","options":[{"key":"A","text":"用户专用软件"},{"key":"B","text":"用户支持软件"},{"key":"C","text":"用户管理软件"},{"key":"D","text":"用户接口软件"}],"answer":["D"],"topic":"计算机与办公基础","row":274,"explanation":{"analysis":"按题目的网络管理软件分类，管理专用软件实现具体管理功能，管理支持软件提供基础服务，用户接口软件负责管理员与系统之间的交互，因此选 D。显示告警、呈现拓扑和接受管理命令都依赖接口。“用户管理软件”通常是具体功能，不能代替整个交互层。","tip":"网络管理软件三类：专用功能、支持服务、用户接口。","caution":""}},{"id":"single-273","number":273,"type":"single","text":"(  )由整个属性集开始,每一步都删除尚在属性集中的最坏属性。","options":[{"key":"A","text":"逐步向上选择"},{"key":"B","text":"逐步向后删除"},{"key":"C","text":"向前选择和向后删除"},{"key":"D","text":"子集评估"}],"answer":["B"],"topic":"综合知识","row":275,"explanation":{"analysis":"逐步向后删除从全部候选特征开始，每次按评价标准删除贡献最小或最不利的特征，直到满足停止条件，因此选 B。向前选择从空集或小集合开始逐步添加；双向方法交替添加和删除；子集评估是评价步骤，不直接限定搜索从完整集合开始。","tip":"向后从全体逐个删，向前从少量逐个加。","caution":""}},{"id":"single-274","number":274,"type":"single","text":"下列选项中,关于TF-IDF方法叙述错误的是(  )。","options":[{"key":"A","text":"用于资讯检索与文本挖掘的常用加权技术"},{"key":"B","text":"可以用来评估一个词对于一个文档集或语料库中某个文档的重要程度"},{"key":"C","text":"很难定位文章的关键字"},{"key":"D","text":"可用于情感分析"}],"answer":["C"],"topic":"综合知识","row":276,"explanation":{"analysis":"TF-IDF 将词在当前文档中的频率与其在语料中的稀有程度结合，常用于挑选能代表该文档的关键词，所以 C“很难定位关键字”与其典型用途不符。它广泛用于检索和文本挖掘，也可将文本转为特征供情感分类器使用，但自身不理解词义和上下文。","tip":"TF-IDF 偏好当前文档常见、其他文档少见的词。","caution":""}},{"id":"single-275","number":275,"type":"single","text":"推断性统计分析的变量中,(  )是指取值范围是一个区间,它可以在该区间中连续取值。","options":[{"key":"A","text":"无序分类变量"},{"key":"B","text":"有序分类变量"},{"key":"C","text":"连续型变量"},{"key":"D","text":"离散型变量"}],"answer":["C"],"topic":"Python与数据分析","row":277,"explanation":{"analysis":"连续型变量在理论上可取某一区间中的任意实数，例如长度、质量和时间，因此选 C。离散型变量只能取可数的值，如人数；无序和有序分类变量分别表示无先后关系或有顺序的类别。测量仪器精度有限，不会因此改变连续变量的理论性质。","tip":"连续变量可在区间内连续取值，离散变量按一个个值计数。","caution":""}},{"id":"single-276","number":276,"type":"single","text":"语义分割评价指标中,平均交并比是指(  )。","options":[{"key":"A","text":"每一类像素正确分类的个数除以每一类像素的实际个数"},{"key":"B","text":"每一类像素的精度的平均值"},{"key":"C","text":"求出每一类交并比(交集 / 并集)之后取平均值"},{"key":"D","text":"每一类出现的频率作为权重"}],"answer":["C"],"topic":"综合知识","row":278,"explanation":{"analysis":"交并比 IoU 是某类别预测区域与真实区域的交集面积除以并集面积；mIoU 先分别计算各类别的 IoU，再对类别取平均，因此选 C。A 更接近该类召回率，B 是平均类别准确率的口径，D 则描述按类别频率加权，不是普通 mIoU。","tip":"mIoU 先逐类算交集÷并集，再取类别平均。","caution":""}},{"id":"single-277","number":277,"type":"single","text":"以下选项中,关于问题控制过程叙述错误的是(  )。","options":[{"key":"A","text":"调查和诊断是一个反复的过程"},{"key":"B","text":"在生命周期内,问题的分类是一成不变的"},{"key":"C","text":"影响度是指对业务的影响程度"},{"key":"D","text":"紧急度是指多长时间解决问题是可以接受的"}],"answer":["B"],"topic":"综合知识","row":279,"explanation":{"analysis":"问题调查会随着新证据不断修正原因与影响判断，原有分类也可能改变，所以 B“一成不变”错误。调查诊断往往反复进行；影响度关注对业务造成多大损害，紧急度关注可以接受多长处理时间。二者共同帮助安排优先级，但不是同一指标。","tip":"问题分类可随证据调整，影响度看损害，紧急度看时间。","caution":""}},{"id":"single-278","number":278,"type":"single","text":"以下选项中,关于数据标注的存储安全管理要求说法错误的是(  )。","options":[{"key":"A","text":"数据加工的服务器与计算机禁止连接互联网"},{"key":"B","text":"数据加工的服务器需要使用多节点存储系统"},{"key":"C","text":"数据加工的服务器可以通过外接设备拷贝"},{"key":"D","text":"数据加工的服务器要定期做好容灾备份"}],"answer":["C"],"topic":"数据标注与质检","row":280,"explanation":{"analysis":"在题目假设的严格隔离标注环境中，未经控制地通过外接设备拷贝服务器数据会增加泄露和恶意软件风险，因此 C 是拟选错误项。隔离网络、容灾备份和适当冗余都可加强安全与可靠性；实际导入导出应经过授权、校验和记录，而非任意操作。","tip":"标注数据导出应受控授权，不能任意用外接设备拷贝。","caution":"A 的全面断网和 B 的多节点存储并非所有标注项目的通用强制要求；外接设备也可在审批控制下使用。"}},{"id":"single-279","number":279,"type":"single","text":"以下聚类算法中,聚类形状是任意形状的是(  )。","options":[{"key":"A","text":"K-means"},{"key":"B","text":"K-means++"},{"key":"C","text":"Bi-Kmeans"},{"key":"D","text":"OPTICS"}],"answer":["D"],"topic":"Python与数据分析","row":281,"explanation":{"analysis":"OPTICS 根据密度可达关系组织样本，能够揭示非球状、形状不规则的簇，因此选 D。K-means、K-means++ 和二分 K-means 都以质心及距离划分为基础，通常更适合相对紧凑、近似球状的簇。K-means++ 改进的是初始化，并没有改变这一核心偏好。","tip":"任意形状簇常考虑密度方法，K-means 系列偏好紧凑簇。","caution":""}},{"id":"single-280","number":280,"type":"single","text":"下列关于图像噪声说法错误的是(  )。","options":[{"key":"A","text":"图像的噪声是在获取、存储、处理和传输过程中产生的"},{"key":"B","text":"噪声在图像中的分布具有随机性"},{"key":"C","text":"噪声具有叠加性"},{"key":"D","text":"噪声的产生与图像无关"}],"answer":["D"],"topic":"数据采集与处理","row":282,"explanation":{"analysis":"图像噪声可在采集、传输等环节引入，其强度有时与原始信号有关，例如光子散粒噪声随光强变化，因此不能一概说噪声与图像无关，题库选 D。噪声常具有随机性，但也有固定图样干扰；具体影响应依据噪声来源及成像模型分析。","tip":"噪声可能依赖信号，常见模型包括加性噪声与乘性噪声。","caution":"C“噪声具有叠加性”若指所有噪声都可用独立加性模型描述，也不严谨；斑点噪声等常用乘性模型。"}},{"id":"single-281","number":281,"type":"single","text":"(  )的聚类方法可独立于数据对象。","options":[{"key":"A","text":"基于划分式"},{"key":"B","text":"基于密度式"},{"key":"C","text":"基于层次式"},{"key":"D","text":"基于网格式"}],"answer":["D"],"topic":"Python与数据分析","row":283,"explanation":{"analysis":"基于网格的聚类先把数据空间划分成有限单元，并在单元统计量上完成聚类，核心聚类运算主要随网格数量变化，因此题库选 D。划分、密度和层次方法通常直接围绕样本或样本关系运算。“独立于数据对象”应理解为后续计算的粒度，而非结果与数据无关。","tip":"网格聚类在单元上运算，主要成本受网格划分数量影响。","caution":"建立网格统计仍需读取数据，聚类结果也依赖数据；题干所谓“独立”是简化的复杂度描述。"}},{"id":"single-282","number":282,"type":"single","text":"关于训练数据集目录结构设计,下列做法正确的是(  )。","options":[{"key":"A","text":"按说话人/场景/日期分层,并将训练/验证/测试集分开存放"},{"key":"B","text":"所有音频放入单一文件夹"},{"key":"C","text":"目录结构与元数据无需对应"},{"key":"D","text":"只保留最新版本、删除历史"}],"answer":["A"],"topic":"数据采集与处理","row":284,"explanation":{"analysis":"按说话人、场景和日期分层，并区分训练、验证、测试数据，有利于查找、质量追踪和防止误用，因此选 A。文件目录应能与元数据关联，历史版本需按策略保留。只有分文件夹还不够：同一说话人或近重复音频跨集合仍可能造成数据泄漏。","tip":"目录组织方便管理，分组划分与去重才真正帮助避免泄漏。","caution":""}},{"id":"single-283","number":283,"type":"single","text":"语音数据的元数据(Metadata)最适合采用(  )格式存储以便程序读取。","options":[{"key":"A","text":"手写便签"},{"key":"B","text":"JSON、CSV等结构化格式"},{"key":"C","text":"仅记在大脑中"},{"key":"D","text":"仅隐含于文件名"}],"answer":["B"],"topic":"计算机与办公基础","row":285,"explanation":{"analysis":"JSON 能表达字段和嵌套信息，CSV 适合固定列的表格，两者都便于程序读取、校验和批量处理，因此选 B。手写便签或只凭记忆无法可靠支撑自动流程；文件名可编码少量信息，但不宜承担完整元数据。还应保持字段定义、字符编码和文件标识一致。","tip":"元数据使用可解析的结构化格式，并与音频建立稳定对应关系。","caution":""}},{"id":"single-284","number":284,"type":"single","text":"在机器学习中,将数据集划分为训练集、验证集和测试集的主要目的是(  )。","options":[{"key":"A","text":"减少数据量"},{"key":"B","text":"在独立数据上评估模型泛化能力"},{"key":"C","text":"增加标注成本"},{"key":"D","text":"避免使用元数据"}],"answer":["B"],"topic":"AI与智能系统","row":286,"explanation":{"analysis":"训练集用于学习参数，验证集用于选择配置和调整方案，测试集用于在最终确定方案后评估未见数据上的表现，所以主要目的是独立评估泛化能力，选 B。反复依据测试成绩调参会把测试集信息泄漏到开发过程，不能继续把该结果视为独立检验。","tip":"训练学参数，验证做选择，测试留作最终独立评估。","caution":""}},{"id":"single-285","number":285,"type":"single","text":"对于语音识别(ASR)训练数据,下列信息通常应作为元数据记录的是(  )。","options":[{"key":"A","text":"说话人 ID、性别、年龄段"},{"key":"B","text":"转录文本(Transcript)"},{"key":"C","text":"音频采样率、时长"},{"key":"D","text":"以上全部"}],"answer":["D"],"topic":"AI与智能系统","row":287,"explanation":{"analysis":"ASR 训练需把音频与转录文本对应，采样率和时长用于读取、校验与预处理，说话人信息有助于分组划分及分析覆盖情况，因此题目三类信息都可记录，选 D。人口属性只应在项目确有需求时依规采集，不能把性别和年龄当作所有 ASR 训练的必需标签。","tip":"ASR 关键对应是音频与转录，技术和说话人元数据帮助管理评估。","caution":"A 中性别、年龄段属于可按需求记录的属性，并非每个语音识别数据集都必须收集。"}},{"id":"single-286","number":286,"type":"single","text":"对音频片段添加\"淡入/淡出(Fade In/Out)\"的主要作用是(  )。","options":[{"key":"A","text":"平滑音量与剪辑点,避免爆音/咔嗒声"},{"key":"B","text":"提高采样率"},{"key":"C","text":"降低位深"},{"key":"D","text":"改变声道数"}],"answer":["A"],"topic":"数据采集与处理","row":288,"explanation":{"analysis":"淡入让片段开头的音量逐渐升高，淡出让结尾逐渐降低，可减小剪辑点的波形突变，避免明显的咔嗒声并使衔接更自然，因此选 A。它改变的是随时间变化的增益，不会自动提高采样率、降低位深或改变声道数。","tip":"淡入淡出调节音量包络，主要用于平滑起止和剪辑点。","caution":""}},{"id":"single-287","number":287,"type":"single","text":"将一段48kHz的音频转换为16kHz以用于语音识别模型,该过程属于(  )。","options":[{"key":"A","text":"位深转换"},{"key":"B","text":"采样率转换(重采样)"},{"key":"C","text":"声道转换"},{"key":"D","text":"与重编码无关"}],"answer":["B"],"topic":"数据采集与处理","row":289,"explanation":{"analysis":"48 kHz 和 16 kHz 表示每秒采集的样本数，将前者转换为后者是采样率转换，即重采样，所以选 B。降采样通常应先低通滤波以防混叠；位深描述单样本精度，声道数描述独立通道数量，二者与采样频率是不同参数。","tip":"每秒样本数改变是重采样，降采样前要考虑防混叠滤波。","caution":""}},{"id":"single-288","number":288,"type":"single","text":"音频\"标准化(Normalize)\"操作的作用是(  )。","options":[{"key":"A","text":"改变采样率"},{"key":"B","text":"将峰值或响度统一到目标电平"},{"key":"C","text":"删除静音段"},{"key":"D","text":"转码格式"}],"answer":["B"],"topic":"数据采集与处理","row":290,"explanation":{"analysis":"音频标准化通过调整增益，使峰值或测得的响度达到指定目标，便于控制音量和保持不同素材的一致性，因此选 B。峰值标准化与响度标准化的衡量方式不同，但都不是改采样率、删除静音或转换文件格式，也不能替代专门的降噪处理。","tip":"Normalize 调整目标电平，峰值目标与响度目标需区分。","caution":""}},{"id":"single-289","number":289,"type":"single","text":"在Audacity中进行降噪,标准流程是(  )。","options":[{"key":"A","text":"直接全选后降噪"},{"key":"B","text":"先选取一段纯噪声\"获取噪声特征\",再对全文降噪"},{"key":"C","text":"仅调低低通"},{"key":"D","text":"用归一化代替"}],"answer":["B"],"topic":"综合知识","row":291,"explanation":{"analysis":"Audacity 常规噪声消除流程先选择仅有背景噪声的一段，获取噪声特征，再选中需处理的音频应用降噪，因此选 B。噪声样本若夹带语音，可能误伤有用声音。低通滤波只削弱高频，标准化只调整电平，均不能替代基于噪声特征的降噪。","tip":"先从纯噪声获取特征，再应用到需要处理的音频。","caution":""}},{"id":"single-290","number":290,"type":"single","text":"使用FFmpeg将WAV转为MP3,核心命令参数是(  )。","options":[{"key":"A","text":"`-i in.wav -codec:a libmp3lame out.mp3`"},{"key":"B","text":"`-resize`"},{"key":"C","text":"`-fps`"},{"key":"D","text":"`-loop`"}],"answer":["A"],"topic":"综合知识","row":292,"explanation":{"analysis":"FFmpeg 中 -i in.wav 指定输入文件，-codec:a libmp3lame 选择 MP3 音频编码器，out.mp3 指定输出路径，所以 A 构成正确的核心参数。完整命令前需加 ffmpeg，并确保构建包含该编码器。其余选项涉及尺寸、帧率或循环概念，不能替代音频编码设置。","tip":"转码先指定输入，再选择音频编码器与输出文件。","caution":""}},{"id":"single-291","number":291,"type":"single","text":"在自然语言处理的数据标注中,意图分类任务的本质是(  )。","options":[{"key":"A","text":"将用户话语映射到预定义的意图类别"},{"key":"B","text":"识别句子中的人名、地名等实体边界"},{"key":"C","text":"对语音信号进行降噪处理"},{"key":"D","text":"计算文本的阅读难度"}],"answer":["A"],"topic":"数据标注与质检","row":293,"explanation":{"analysis":"意图分类识别用户希望完成什么事，将整条话语映射到项目定义的类别，如查天气、订票或播放音乐，因此选 A。识别人名地名及其范围属于实体识别，降噪处理音频信号，阅读难度评估文本复杂程度。意图与实体可以联合标注，但回答的问题不同。","tip":"意图回答想做什么，实体和槽位回答涉及谁、哪里及何时。","caution":""}},{"id":"single-292","number":292,"type":"single","text":"用户说\"明天北京天气怎么样\",在标注平台中最合适的意图标签是(  )。","options":[{"key":"A","text":"音乐播放"},{"key":"B","text":"天气查询"},{"key":"C","text":"导航出行"},{"key":"D","text":"闲聊问候"}],"answer":["B"],"topic":"数据标注与质检","row":294,"explanation":{"analysis":"“明天北京天气怎么样”的主要请求是获取天气信息，所以应标为天气查询，选 B。其中“明天”是时间参数，“北京”是地点参数；出现地名不代表用户在导航出行。音乐播放和闲聊问候也不符合句子的实际任务目标。","tip":"按整句话的用户目标判意图，不被单个地名等实体误导。","caution":""}},{"id":"single-293","number":293,"type":"single","text":"当一句话同时包含\"查一下从上海到广州的高铁票\"和\"顺便提醒我下午三点开会\"两层诉求时,正确的做法是(  )。","options":[{"key":"A","text":"只标注第一个出现的意图"},{"key":"B","text":"随意选一个意图标注"},{"key":"C","text":"按多意图(multi-intent)标准同时标注两个意图"},{"key":"D","text":"直接标记为无法标注并丢弃"}],"answer":["C"],"topic":"综合知识","row":295,"explanation":{"analysis":"话语中既请求查询高铁票，又请求设置会议提醒，包含两个可独立执行的目标。在支持多意图标注的规范下，应同时记录两个意图，因此选 C。只留第一个或随机选一个会损失真实需求；丢弃也会浪费可标注的数据，必要时按规范分别关联各自槽位。","tip":"多意图句要保留每个明确诉求，并依规范关联对应参数。","caution":""}},{"id":"single-294","number":294,"type":"single","text":"关于意图分类标注的\"单标签\"与\"多标签\"区别,下列说法中正确的是(  )。","options":[{"key":"A","text":"单标签指每条话语归为一个意图,多标签允许多个意图并存"},{"key":"B","text":"单标签允许多个意图并存"},{"key":"C","text":"多标签指每条话语必须归为三个以上意图"},{"key":"D","text":"二者没有任何区别"}],"answer":["A"],"topic":"数据标注与质检","row":296,"explanation":{"analysis":"单标签任务为每条话语指定一个类别，多标签任务允许同一话语具有多个类别，因此 A 正确。多标签并不要求必须有三个或更多标签，一条话语也可能只有一个适用标签。使用哪种形式应由任务定义和标注规范决定，不能由标注员临时改变。","tip":"单标签恰选一类，多标签允许多个适用类别。","caution":""}},{"id":"single-295","number":295,"type":"single","text":"在命名实体识别(NER)标注中,用于标记实体开头与内部位置的常用标注体系是(  )。","options":[{"key":"A","text":"XML体系"},{"key":"B","text":"JSON体系"},{"key":"C","text":"CSV体系"},{"key":"D","text":"BIO体系(B-实体、I-实体、O)"}],"answer":["D"],"topic":"数据标注与质检","row":297,"explanation":{"analysis":"BIO 是序列标注方案：B 表示实体开头，I 表示同一实体的后续部分，O 表示实体之外，通常再附实体类型，所以选 D。XML、JSON 和 CSV 是数据序列化或存储格式，可以保存 BIO 标签，但不直接规定实体的起始和内部位置含义。","tip":"BIO 定义标签含义，JSON、XML、CSV 定义保存格式。","caution":""}},{"id":"single-296","number":296,"type":"single","text":"对于句子\"李白在成都写下了这首诗\",按\"人名、地名\"标注,下列边界标注正确的是(  )。","options":[{"key":"A","text":"人名=李白,地名=成都"},{"key":"B","text":"人名=李白在,地名=成都"},{"key":"C","text":"人名=李,地名=成都"},{"key":"D","text":"人名=李白,地名=成都写下了"}],"answer":["A"],"topic":"数据标注与质检","row":298,"explanation":{"analysis":"句子中的完整人名是“李白”，完整地名是“成都”，因此 A 的两个边界都正确。“在”是引出地点的词，不属于人名；只标“李”会截断完整姓名；“写下了”是描述动作的成分，也不属于地名，应排除在实体边界之外。","tip":"实体边界既不能截断名称，也不能吞入旁边的语法成分。","caution":""}},{"id":"single-297","number":297,"type":"single","text":"标注实体边界时,标注粒度的确定应(  )。","options":[{"key":"A","text":"严格遵循项目标注规范的规定"},{"key":"B","text":"由标注入员随意决定"},{"key":"C","text":"总是标到最细一级"},{"key":"D","text":"总是标到最粗一级"}],"answer":["A"],"topic":"数据标注与质检","row":299,"explanation":{"analysis":"项目可能按词、字符或完整专名规定实体边界，还可能对机构层级和嵌套实体作特别约定，因此标注粒度必须遵循项目规范，选 A。总选最细或最粗都可能违背任务需求；标注员随意决定则会造成样本口径不一致，影响模型训练和质检。","tip":"粒度没有通用的越细越好，应统一遵循项目规范。","caution":""}},{"id":"single-298","number":298,"type":"single","text":"在意图+槽位联合标注中,槽位填充的作用是(  )。","options":[{"key":"A","text":"替代意图分类"},{"key":"B","text":"仅用于文本分词"},{"key":"C","text":"提取意图所需的关键信息参数(如时间、地点、对象)"},{"key":"D","text":"删除无关词语"}],"answer":["C"],"topic":"数据标注与质检","row":300,"explanation":{"analysis":"意图说明用户要做什么，槽位提取完成该任务所需的具体参数，例如天气查询中的日期、城市，订票中的出发地和目的地，因此选 C。槽位不能代替意图，单纯分词也无法判断参数角色；它的目标不是删词，而是把关键信息映射到规定字段。","tip":"意图确定任务，槽位提供执行任务所需的参数。","caution":""}},{"id":"single-299","number":299,"type":"single","text":"质检中发现某条标注\"实体边界少标了一个字\",该错误类型属于(  )。","options":[{"key":"A","text":"标签错误"},{"key":"B","text":"边界错误(漏标)"},{"key":"C","text":"意图错误"},{"key":"D","text":"格式错误"}],"answer":["B"],"topic":"数据标注与质检","row":301,"explanation":{"analysis":"实体少标一个字说明标注跨度没有覆盖完整名称，属于边界错误中的漏标，因此选 B。标签错误是把类别标错，例如把人名标成地名；意图错误涉及用户诉求类别，格式错误涉及数据结构或语法。判断错误类型时先区分范围、类别与保存格式。","tip":"少一个字看边界，类别选错看标签，结构不合法看格式。","caution":""}},{"id":"single-300","number":300,"type":"single","text":"当质检员与标注员的标注结果不一致时,平台通常应(  )。","options":[{"key":"A","text":"直接采纳质检员结果"},{"key":"B","text":"直接采纳标注员结果"},{"key":"C","text":"按仲裁/复核机制由第三方或规范判定"},{"key":"D","text":"直接删除该数据"}],"answer":["C"],"topic":"数据标注与质检","row":302,"explanation":{"analysis":"标注员与质检员出现分歧时，应对照规范、例子和上下文，由复核或仲裁机制确定最终结论，因此选 C。质检员也可能误判，不能仅凭角色直接采纳；删除数据则没有解决口径问题。若分歧暴露规范空白，还应补充规则并检查同类样本。","tip":"标注分歧靠规范与复核解决，必要时更新规则保持一致。","caution":""}},{"id":"multi-001","number":1,"type":"multi","text":"爱岗敬业的具体要求是(  )。","options":[{"key":"A","text":"树立职业理想"},{"key":"B","text":"强化职业责任"},{"key":"C","text":"提高职业技能"},{"key":"D","text":"抓住择业机遇"},{"key":"E","text":"经常要求提高待遇"}],"answer":["A","B","C"],"topic":"职业道德与法规","row":3,"explanation":{"analysis":"职业理想使从业者明确职业目标，职业责任要求认真履行岗位职责，职业技能保证工作能够胜任，因此 A、B、C 都是爱岗敬业的具体落实。择业机遇属于职业选择问题，提高待遇属于劳动权益诉求，二者可以合理追求，但本身不能说明是否爱岗敬业。","tip":"爱岗敬业抓住三点：理想、责任、技能。","caution":""}},{"id":"multi-002","number":2,"type":"multi","text":"在日常生活中,人们应该尊重他人的权益,不侵犯他人的(  )。","options":[{"key":"A","text":"财产"},{"key":"B","text":"公司公共设备"},{"key":"C","text":"名誉"},{"key":"D","text":"公司共享用具"},{"key":"E","text":"隐私"}],"answer":["A","C","E"],"topic":"综合知识","row":4,"explanation":{"analysis":"财产、名誉和隐私分别涉及财产权益、社会评价与私人生活安宁，均是应尊重的个人合法权益。公司公共设备和共享用具是物品及使用资源，不能直接与个人权利类型并列，故本题选 A、C、E；实际生活中也不能随意损坏或侵占公司的公共财物。","tip":"尊重他人，既保护财产，也尊重名誉和隐私。","caution":"B、D 不入选是因题目考个人权益分类，并不意味着公共财物可以被侵犯。"}},{"id":"multi-003","number":3,"type":"multi","text":"在职业活动中,举止得体的具体要求包括(  )。","options":[{"key":"A","text":"感情热烈"},{"key":"B","text":"表情从容"},{"key":"C","text":"行为适度"},{"key":"D","text":"畏惧权势"},{"key":"E","text":"表情肃穆"}],"answer":["B","C"],"topic":"职业道德与法规","row":5,"explanation":{"analysis":"举止得体强调外在表达与身份、场合及服务对象相适应。表情从容能传递稳定和尊重，行为适度能避免过度亲近或失礼，所以选 B、C。感情热烈或表情肃穆仅适合部分场景，不能作为普遍要求；畏惧权势则违背平等和有原则的职业交往。","tip":"得体的核心是从容、适度、符合场合。","caution":""}},{"id":"multi-004","number":4,"type":"multi","text":"下面关于爱岗敬业的说法正确的是(  )。","options":[{"key":"A","text":"爱岗敬业是爱岗与敬业的总称"},{"key":"B","text":"爱岗比敬业重要"},{"key":"C","text":"\"爱岗\"是\"敬业\"的基石"},{"key":"D","text":"\"爱岗\"是\"敬业\"的升华"},{"key":"E","text":"爱岗敬业与个人道德无关"}],"answer":["A","C"],"topic":"职业道德与法规","row":6,"explanation":{"analysis":"爱岗敬业同时包含对岗位的认同和对工作的认真负责，故 A 正确。爱岗提供投入工作的情感与价值基础，支持敬业行为，因此 C 正确。二者相互促进，不能简单说爱岗更重要；通常是敬业体现和深化爱岗，D 把关系倒置，E 则忽略了其职业道德属性。","tip":"爱岗是认同岗位，敬业是负责尽职。","caution":""}},{"id":"multi-005","number":5,"type":"multi","text":"关于Python中的字符串,以下说法(  )是正确的。","options":[{"key":"A","text":"字符串是不可变的"},{"key":"B","text":"可以使用切片操作"},{"key":"C","text":"字符串可以直接修改其中的字符"},{"key":"D","text":"可以使用+运算符进行拼接"}],"answer":["A","B","D"],"topic":"Python与数据分析","row":7,"explanation":{"analysis":"Python 的 str 是不可变序列，可以通过切片读取一段字符，也能用 + 连接字符串，因此 A、B、D 正确。不可变意味着不能执行 s[0]='a' 这种原位修改；若要替换字符，应拼接或调用 replace 等方法生成新字符串，再将变量指向新对象。","tip":"字符串能切片、能拼接，但不能原位改字符。","caution":""}},{"id":"multi-006","number":6,"type":"multi","text":"以下(  )是Python的控制语句。","options":[{"key":"A","text":"if-else"},{"key":"B","text":"for循环"},{"key":"C","text":"while循环"},{"key":"D","text":"try-except-finally"}],"answer":["A","B","C","D"],"topic":"Python与数据分析","row":8,"explanation":{"analysis":"if-else 按条件选择执行分支，for 遍历可迭代对象，while 在条件成立时重复执行，三者直接控制程序路径。try-except-finally 则根据异常是否发生转移执行，并安排清理代码，也属于控制流程语句，因此四项都选。","tip":"分支、循环、异常处理都会改变程序执行流程。","caution":""}},{"id":"multi-007","number":7,"type":"multi","text":"为了解决大语言模型(LLM)的知识时效性和幻觉问题,Agent常结合RAG技术,RAG流程通常包含(  )阶段。","options":[{"key":"A","text":"检索(Retrieval)"},{"key":"B","text":"增强(Augmentation)"},{"key":"C","text":"生成(Generation)"},{"key":"D","text":"强化学习(Reinforcement Learning)"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":9,"explanation":{"analysis":"RAG 先检索与问题相关的资料，再把检索结果加入模型输入以增强上下文，最后由模型据此生成回答，所以选 A、B、C。强化学习是模型训练或策略优化方法，不是一次 RAG 请求的必经阶段；检索材料仍需检查质量，RAG 本身不能保证完全消除幻觉。","tip":"RAG 三步：检索资料、补充上下文、生成回答。","caution":""}},{"id":"multi-008","number":8,"type":"multi","text":"以下(  )属于Agent开发中常见的\"规划(Planning)\"策略。","options":[{"key":"A","text":"思维链(CoT)"},{"key":"B","text":"思维树(ToT)"},{"key":"C","text":"计划与执行(Plan-and-Execute)"},{"key":"D","text":"梯度下降(Gradient Descent)"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":10,"explanation":{"analysis":"思维链把复杂问题拆成连续的推理步骤，思维树探索并比较多条候选思路，计划与执行则先形成任务计划再逐步行动，这些都可支持 Agent 规划。梯度下降通过梯度更新模型参数，主要用于数值优化和训练，不属于此处的任务规划策略，因此排除 D。","tip":"规划安排解决问题的步骤；梯度下降更新参数。","caution":""}},{"id":"multi-009","number":9,"type":"multi","text":"以下(  )是评估AI Agent性能或效果的常见指标或方法。","options":[{"key":"A","text":"任务完成率(Success Rate)"},{"key":"B","text":"平均执行步数/耗时"},{"key":"C","text":"人工评估(Human Evaluation)"},{"key":"D","text":"模型参数量大小"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":11,"explanation":{"analysis":"任务完成率反映目标是否达成，执行步数和耗时反映效率，人工评估可检查实用性、表达质量及复杂任务表现，故 A、B、C 都有价值。参数量描述模型规模，但大模型可能工具调用差、成本高或任务失败，不能直接作为 Agent 效果好坏的指标。","tip":"评 Agent 看完成效果、执行效率和实际体验。","caution":""}},{"id":"multi-010","number":10,"type":"multi","text":"关于多智能体(Multi-Agent)协作系统,以下说法正确的有(  )。","options":[{"key":"A","text":"可以通过角色分工(如产品经理、工程师 )来完成任务"},{"key":"B","text":"智能体之间需要通信协议来交换信息"},{"key":"C","text":"冲突协调策略是多智能体系统的关键技术之一"},{"key":"D","text":"多智能体系统一定比单智能体系统运行速度快"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":12,"explanation":{"analysis":"多智能体可由不同角色分别处理需求、开发和审查，并通过约定的消息格式交换结果；任务冲突、意见不一致和资源竞争需要协调，因此 A、B、C 正确。通信、等待、重复推理都会产生额外开销，只有任务适合拆分并行时才可能提速，D 的“一定”不成立。","tip":"多智能体增加协作能力，也增加协调成本。","caution":""}},{"id":"multi-011","number":11,"type":"multi","text":"在AI Agent的核心架构中,通常包含(  )关键组件。","options":[{"key":"A","text":"LLM (大语言模型)"},{"key":"B","text":"工具(Tools)"},{"key":"C","text":"记忆(Memory)"},{"key":"D","text":"规划(Planner)"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":13,"explanation":{"analysis":"在常见的大模型 Agent 架构中，LLM 负责理解和推理，工具扩展查询及执行能力，记忆保留历史与任务状态，规划模块拆分目标并安排步骤。因此四项均是常见组件。组件可以合并实现，例如规划由 LLM 提示词驱动，不一定对应四个独立的软件服务。","tip":"大模型 Agent 常见四件套：模型、工具、记忆、规划。","caution":"此题适用于 LLM Agent；更广义的智能体不一定使用大语言模型。"}},{"id":"multi-012","number":12,"type":"multi","text":"在LangChain等框架中,关于Agent工具调用(Function Calling )的描述,正确的有(  )。","options":[{"key":"A","text":"LLM输出结构化的指令(如JSON格式 )"},{"key":"B","text":"工具描述通常包含名称、参数和参数类型"},{"key":"C","text":"工具调用不需要任何描述,LLM能自动猜测"},{"key":"D","text":"参数校验是防止工具调用失败的重要环节"}],"answer":["A","B","D"],"topic":"AI与智能系统","row":14,"explanation":{"analysis":"函数调用通常由模型生成包含工具名称和参数的结构化请求，运行环境再校验并执行。工具的名称、用途、参数类型与约束帮助模型选择正确接口，因此 A、B、D 正确。缺少工具描述时，模型无法可靠知道可用接口及参数规范，不能依靠猜测，故 C 错误。","tip":"模型提出结构化调用，程序校验后执行。","caution":""}},{"id":"multi-013","number":13,"type":"multi","text":"在开发生产级Agent时,为了防止Agent陷入\"死循环\"或资源耗尽,通常需要采取(  )措施。","options":[{"key":"A","text":"设置最大迭代次数(Max Iterations)"},{"key":"B","text":"引入超时熔断机制(Timeout)"},{"key":"C","text":"在Prompt中增加自我反思或终止引导"},{"key":"D","text":"禁用所有外部工具调用"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":15,"explanation":{"analysis":"最大迭代次数限制循环总步数，超时机制限制执行时间，终止引导帮助模型识别完成或无法继续的状态，因此 A、B、C 都可采用。提示词只是软约束，应配合程序限额；禁用全部工具会削弱任务能力，也不能阻止纯推理循环，所以 D 不是合理通用方案。","tip":"防死循环用硬限额，提示词再辅助判断何时停止。","caution":""}},{"id":"multi-014","number":14,"type":"multi","text":"在Dify中编排多智能体(Multi-Agent)协同工作流时,以下(  )是保障协作可靠性的关键设计。","options":[{"key":"A","text":"定义清晰的消息契约(如JSON Schema )"},{"key":"B","text":"设置最大迭代次数防止死循环"},{"key":"C","text":"使用上下文桥(Context Bridge )传递会话状态"},{"key":"D","text":"为关键任务链设置兜底(Fallback )机制"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":16,"explanation":{"analysis":"消息契约使各节点知道字段及格式，迭代上限阻止无休止往返，上下文传递保留任务状态，兜底机制处理超时或节点失败，这四类设计共同提高协作可靠性。实际实现时还应校验输入输出，并明确失败后是重试、降级还是转人工。","tip":"可靠协作要约定格式、传递状态、限制循环、处理失败。","caution":"题库选 ABCD；“Context Bridge”可理解为上下文传递设计，并非所有 Dify 版本都存在同名内置组件。"}},{"id":"multi-015","number":15,"type":"multi","text":"Agent架构模型中,反应型Agent的特点是(  )。","options":[{"key":"A","text":"直接基于当前感知进行决策"},{"key":"B","text":"没有内部状态"},{"key":"C","text":"响应速度快"},{"key":"D","text":"需要完整的内部模型"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":17,"explanation":{"analysis":"简单反应型 Agent 根据当前感知直接匹配规则并产生动作，省去复杂搜索和完整世界建模，因而通常响应较快；在这一狭义模型中也不维护历史状态，故题库选 A、B、C。D 要求完整内部模型，与题目强调的直接感知—动作机制不符。","tip":"简单反应型依当前输入执行规则，强调快速响应。","caution":"B 只适用于简单反射型等无状态模型；广义反应式架构也可能保存有限状态，不能一概说所有反应型 Agent 都无内部状态。"}},{"id":"multi-016","number":16,"type":"multi","text":"多Agent协作的主要模式包括(  )。","options":[{"key":"A","text":"黑板模型"},{"key":"B","text":"合同网协议"},{"key":"C","text":"市场机制"},{"key":"D","text":"拍卖机制"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":18,"explanation":{"analysis":"黑板模型通过共享信息空间协作，合同网由任务发布、投标与授标完成分工，市场机制利用价格或效用配置资源，拍卖机制以竞价选择任务承担者，因此四项都属于协作方法。拍卖通常也是市场机制的一种具体形式，两者存在包含关系但均可入选。","tip":"共享黑板、合同招标、市场交易和拍卖都能组织协作。","caution":""}},{"id":"multi-017","number":17,"type":"multi","text":"Agent系统中,(  )用于协调多个Agent的行为。","options":[{"key":"A","text":"组织结构"},{"key":"B","text":"通信协议"},{"key":"C","text":"任务分配机制"},{"key":"D","text":"随机决策"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":19,"explanation":{"analysis":"组织结构规定各 Agent 的角色、权限及汇报关系，通信协议规定消息如何交换，任务分配机制决定由谁执行哪项工作，这些都能实现行为协调。单纯随机决策没有共同目标、依赖关系或冲突处理依据，不能作为可靠的协调机制，因此选 A、B、C。","tip":"协调多 Agent 要明确角色、通信和分工。","caution":""}},{"id":"multi-018","number":18,"type":"multi","text":"Agent的主要系统组件包括(  )。","options":[{"key":"A","text":"感知模块"},{"key":"B","text":"决策模块"},{"key":"C","text":"执行模块"},{"key":"D","text":"通信模块"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":20,"explanation":{"analysis":"感知模块获取环境信息，决策模块选择目标和动作，执行模块把决策转化为外部操作，通信模块负责与人或其他智能体交换信息，四者构成常见系统的功能划分。不同实现可合并模块，通信也可能只是一个工具接口，不要求物理上分成四套程序。","tip":"智能体先感知，再决策和行动，并通过通信协作。","caution":""}},{"id":"multi-019","number":19,"type":"multi","text":"Agent的感知模块需要具备(  )的能力。","options":[{"key":"A","text":"信息采集"},{"key":"B","text":"数据预处理"},{"key":"C","text":"特征提取"},{"key":"D","text":"异常检测"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":21,"explanation":{"analysis":"信息采集提供原始观测，预处理负责去噪和格式统一，特征提取把输入转为决策可用的表示，异常检测识别传感器故障或异常状态，因此四项都能服务于可靠感知。异常检测可以在独立模块实现，题目考查的是感知链路应覆盖的能力范围。","tip":"有效感知不仅收数据，还要清理、提取和识别异常。","caution":""}},{"id":"multi-020","number":20,"type":"multi","text":"工作流编排的主要目的是(  )。","options":[{"key":"A","text":"组织Agent的执行顺序"},{"key":"B","text":"管理任务依赖关系"},{"key":"C","text":"控制数据流向"},{"key":"D","text":"实现目标分解"}],"answer":["A","B","C","D"],"topic":"综合知识","row":22,"explanation":{"analysis":"工作流将目标分解为可执行节点，安排节点的先后或并行关系，确定必须等待的依赖，并把前一节点结果传给后续节点，因此 A、B、C、D 均符合编排目的。拆分目标决定“做什么”，顺序、依赖和数据流则决定各子任务如何衔接。","tip":"工作流同时安排任务、顺序、依赖和数据传递。","caution":""}},{"id":"multi-021","number":21,"type":"multi","text":"Agent的行为评估维度包括(  )。","options":[{"key":"A","text":"效率"},{"key":"B","text":"有效性"},{"key":"C","text":"鲁棒性"},{"key":"D","text":"可解释性"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":23,"explanation":{"analysis":"效率考察完成任务消耗的时间、调用次数和成本；有效性考察结果是否满足目标；鲁棒性考察面对异常输入或工具失败时能否稳定工作；可解释性考察行为依据和执行轨迹是否可理解。四者衡量不同方面，单看最终答案不足以全面评价 Agent。","tip":"评估行为兼顾做得对、做得快、扛得住和说得清。","caution":""}},{"id":"multi-022","number":22,"type":"multi","text":"下列哪些属于集成学习方法(  )。","options":[{"key":"A","text":"Boosting"},{"key":"B","text":"Bagging"},{"key":"C","text":"单个最近邻搜索"},{"key":"D","text":"随机森林"}],"answer":["A","B","D"],"topic":"综合知识","row":24,"explanation":{"analysis":"Bagging 对不同抽样数据训练多个模型后汇总预测，Boosting 逐轮训练模型以补偿先前错误，随机森林则结合自助采样与随机特征构建多棵树，三者都整合多个学习器。单个最近邻搜索只依据邻近样本做一次判断，不构成多模型集成，因此排除 C。","tip":"集成学习把多个学习器的结果组合起来。","caution":""}},{"id":"multi-023","number":23,"type":"multi","text":"下列哪些属于监督学习任务(  )。","options":[{"key":"A","text":"回归"},{"key":"B","text":"分类"},{"key":"C","text":"无标签聚类"},{"key":"D","text":"有标签样本预测"}],"answer":["A","B","D"],"topic":"综合知识","row":25,"explanation":{"analysis":"监督学习用输入及对应标签学习映射。回归预测连续数值，分类预测类别，有标签样本预测也直接体现这一设定，所以 A、B、D 正确。无标签聚类根据样本自身的相似性寻找结构，没有预先提供的目标标签，属于无监督学习。","tip":"有目标标签指导学习，就是监督学习。","caution":""}},{"id":"multi-024","number":24,"type":"multi","text":"如下(  )是机器学习中的激活函数。","options":[{"key":"A","text":"ReLU"},{"key":"B","text":"Sigmoid"},{"key":"C","text":"Tanh"},{"key":"D","text":"Softmax"}],"answer":["A","B","C","D"],"topic":"Python与数据分析","row":26,"explanation":{"analysis":"ReLU 将负输入截为零，Sigmoid 将数值映射到 0 与 1 之间，Tanh 映射到 −1 与 1 之间，Softmax 把一组分数转为总和为 1 的概率向量。它们均可作为神经网络的激活函数；Softmax 常位于互斥多分类任务的输出层。","tip":"ReLU、Sigmoid、Tanh 和 Softmax 都用于变换网络输出。","caution":""}},{"id":"multi-025","number":25,"type":"multi","text":"ReAct框架的核心循环步骤包括(  )。","options":[{"key":"A","text":"思考(Reasoning/Thought)"},{"key":"B","text":"行动(Action)"},{"key":"C","text":"观察(Observation)"},{"key":"D","text":"微调(Fine-tuning)"}],"answer":["A","B","C"],"topic":"Python与数据分析","row":27,"explanation":{"analysis":"ReAct 将推理与行动交替组织：先分析下一步，再调用工具或执行动作，然后观察返回结果并继续调整。因此 A、B、C 构成典型循环。微调是使用训练数据更新模型参数，不是每轮任务执行的必需步骤，故 D 不属于核心循环。","tip":"ReAct：思考下一步，执行动作，观察反馈。","caution":""}},{"id":"multi-026","number":26,"type":"multi","text":"提示词的安全性考虑应包括(  )。","options":[{"key":"A","text":"防止注入攻击"},{"key":"B","text":"避免生成有害内容"},{"key":"C","text":"保护用户隐私"},{"key":"D","text":"确保输出符合伦理"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":28,"explanation":{"analysis":"提示注入可能把外部文本伪装成指令，有害内容会造成直接风险，泄露用户信息会侵犯隐私，违反伦理的输出则可能带来歧视或不当决策。因此四项均应考虑。实际系统还需权限控制、数据隔离及输出校验，不能只靠提示词文字来保证安全。","tip":"提示安全同时关注指令边界、内容、隐私和伦理。","caution":""}},{"id":"multi-027","number":27,"type":"multi","text":"在提示词中使用分隔符的优势有(  )。","options":[{"key":"A","text":"清晰分离不同部分"},{"key":"B","text":"防止提示注入"},{"key":"C","text":"提高结构清晰度"},{"key":"D","text":"增加token数量"}],"answer":["A","B","C"],"topic":"AI与智能系统","row":29,"explanation":{"analysis":"分隔符可把任务指令、参考资料、示例和待处理内容区分开来，减少结构歧义，因此 A、C 明确成立。它也可辅助提示模型把资料视为数据，降低部分注入风险，这对应题库的 B；增加 token 只是潜在开销，并非使用分隔符的主要优势。","tip":"分隔符帮助划清内容边界，安全仍需额外控制。","caution":"题库选 ABC，但 B 的“防止提示注入”表述过强：分隔符不是安全隔离机制，不能单独阻止攻击。"}},{"id":"multi-028","number":28,"type":"multi","text":"提示词优化的常用方法包括(  )。","options":[{"key":"A","text":"迭代测试"},{"key":"B","text":"增加随机性"},{"key":"C","text":"用户反馈整合"},{"key":"D","text":"增加模型参数"}],"answer":["A","C"],"topic":"AI与智能系统","row":30,"explanation":{"analysis":"迭代测试通过固定样例比较改写前后的表现，整合用户反馈能暴露指令遗漏和实际需求，故 A、C 是常用优化方法。增加随机性可能扩大输出波动，并不稳定改善任务表现；增加模型参数属于模型架构或训练选择，不是提示词本身的优化。","tip":"优化提示词靠测试和反馈，效果要用样例验证。","caution":""}},{"id":"multi-029","number":29,"type":"multi","text":"在大模型的训练中,哪些技术可以用于提高小数据集上的学习效果(  )。","options":[{"key":"A","text":"迁移学习"},{"key":"B","text":"元学习"},{"key":"C","text":"生成对抗网络"},{"key":"D","text":"多任务学习"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":31,"explanation":{"analysis":"迁移学习利用已有模型知识，元学习训练快速适应新任务的能力，多任务学习借助相关任务共享表示，都可缓解样本不足。GAN 可在合适条件下生成额外训练样本，因此题库也选 C。不过合成数据要验证真实性、多样性和标签质量，否则可能放大偏差。","tip":"小样本可借已有知识、相关任务和经过验证的数据增强。","caution":"GAN 并非大语言模型小样本训练的通用首选；它本身也可能因数据太少而训练不稳。四项表示“可能有帮助”，不表示必然有效。"}},{"id":"multi-030","number":30,"type":"multi","text":"当模型输出结果不符合预期时,以下(  )是有效的优化手段。","options":[{"key":"A","text":"增加具体的示例"},{"key":"B","text":"调整指令的措辞或顺序"},{"key":"C","text":"明确约束条件和边界"},{"key":"D","text":"将复杂任务拆解为子任务"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":32,"explanation":{"analysis":"具体示例展示期望输入输出，调整措辞和顺序可消除歧义，约束条件明确允许与禁止的范围，拆解子任务则减少一次推理的复杂度，所以四项都可用于改进结果。改动后应在代表性样例上比较，确认是否真正改善而非只修好单个例子。","tip":"输出偏离时，补示例、清指令、定边界、拆任务。","caution":""}},{"id":"multi-031","number":31,"type":"multi","text":"如下为聚类算法的是(  )。","options":[{"key":"A","text":"K-Means"},{"key":"B","text":"Transformer"},{"key":"C","text":"DBSCAN"},{"key":"D","text":"RNN"}],"answer":["A","C"],"topic":"Python与数据分析","row":33,"explanation":{"analysis":"K-Means 依据样本到中心的距离形成若干簇，DBSCAN 依据局部密度发现簇并识别噪声，二者是具体聚类算法。Transformer 是以注意力为核心的网络架构，RNN 是循环神经网络架构，它们可用于多种任务，但本身不等于聚类算法。","tip":"K-Means 按中心距离聚类，DBSCAN 按密度聚类。","caution":""}},{"id":"multi-032","number":32,"type":"multi","text":"在大模型的推理过程中,哪些技术可以用于提高模型的可解释性(  )。","options":[{"key":"A","text":"特征重要性评估"},{"key":"B","text":"激活图可视化"},{"key":"C","text":"代理模型"},{"key":"D","text":"反事实解释"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":34,"explanation":{"analysis":"特征重要性评估衡量输入因素的影响，激活图展示内部响应，代理模型用较简单模型近似复杂模型行为，反事实解释考察怎样改变输入会改变结论。因此四项都可辅助解释。它们提供的证据类型不同，尤其可视化或代理近似不能自动证明模型的真实因果推理过程。","tip":"解释模型可看重要特征、内部响应、近似规则和反事实。","caution":""}},{"id":"multi-033","number":33,"type":"multi","text":"生成对抗网络中所谓的对抗是(  )之间的关系。","options":[{"key":"A","text":"生成模型"},{"key":"B","text":"监督模型"},{"key":"C","text":"判别模型"},{"key":"D","text":"无监督模型"},{"key":"E","text":"聚类模型"}],"answer":["A","C"],"topic":"计算机与办公基础","row":35,"explanation":{"analysis":"GAN 的生成模型尝试产生逼真的样本，判别模型区分真实样本和生成样本，两者通过相互竞争推动训练，因此选 A、C。监督、无监督是学习范式，聚类是任务类型，这些词都不是 GAN 中相互对抗的两个网络角色。","tip":"GAN 是生成器造样本、判别器辨真假。","caution":""}},{"id":"multi-034","number":34,"type":"multi","text":"分布式机器学习可以解决(  )等问题。","options":[{"key":"A","text":"异步梯度下降"},{"key":"B","text":"计算量大"},{"key":"C","text":"训练数据量大"},{"key":"D","text":"模型规模大"},{"key":"E","text":"可视化展示"}],"answer":["B","C","D"],"topic":"AI与智能系统","row":36,"explanation":{"analysis":"分布式机器学习可将大量样本分到多台设备处理，通过并行计算缓解计算量大，并把过大的模型切分到多个设备，因此选 B、C、D。异步梯度下降是一类分布式训练策略，而非需要解决的规模问题；可视化展示也不是分布式训练直接针对的主要瓶颈。","tip":"分布式训练主要应对数据大、计算多、模型大。","caution":""}},{"id":"multi-035","number":35,"type":"multi","text":"数据标注的核心质量指标包括哪些(  )。","options":[{"key":"A","text":"标注准确性"},{"key":"B","text":"标注一致性"},{"key":"C","text":"标注覆盖率"},{"key":"D","text":"标注速度"}],"answer":["A","B","C"],"topic":"数据标注与质检","row":37,"explanation":{"analysis":"准确性衡量标签是否符合事实和规范，一致性衡量不同标注者或不同批次是否使用同一标准，覆盖率衡量应标内容是否完整。这三项直接决定训练标签质量。标注速度体现生产效率，速度快并不能证明标签正确、统一或无遗漏，所以排除 D。","tip":"标注质量看准确、一致、完整；速度是效率指标。","caution":""}},{"id":"multi-036","number":36,"type":"multi","text":"网络数据采集方式包括以下(  )。","options":[{"key":"A","text":"网络爬虫"},{"key":"B","text":"数据埋点"},{"key":"C","text":"初级方式"},{"key":"D","text":"中级方式"},{"key":"E","text":"高级方式"}],"answer":["A","B"],"topic":"数据采集与处理","row":38,"explanation":{"analysis":"网络爬虫从网页或接口提取可访问的数据，数据埋点在网页或应用中记录点击、曝光等事件，二者都有明确的采集机制。初级、中级和高级只是笼统的等级称呼，没有说明通过什么技术获取数据，因此不能作为此题中的采集方式分类。","tip":"爬虫采网页内容，埋点采用户及系统事件。","caution":""}},{"id":"multi-037","number":37,"type":"multi","text":"人体姿态数据采集案例(办公室过道场景)中,姿态采集的要求有(  )。","options":[{"key":"A","text":"单人全身出镜"},{"key":"B","text":"不遮挡面部"},{"key":"C","text":"站立于过道中间"},{"key":"D","text":"不依靠两侧墙体或其他物体"},{"key":"E","text":"双手环抱"}],"answer":["A","B","C","D"],"topic":"数据采集与处理","row":39,"explanation":{"analysis":"按本题的办公室过道采集要求，单人全身出镜可保证目标及肢体完整，不遮面便于关联面部信息，站在过道中间且不倚靠物体可减少遮挡和外部支撑干扰，因此选 A、B、C、D。双手环抱只是一种特定动作，还可能遮挡躯干，不是所有样本的共同要求。","tip":"该场景要单人全身、面部可见、居中站立、不依靠物体。","caution":"这些是题目给定场景的采集规范，并非所有人体姿态数据集的通用要求；复杂姿态任务也会专门采集遮挡或倚靠动作。"}},{"id":"multi-038","number":38,"type":"multi","text":"在数据清洗过程中,应对所获取的数据进行筛选,以下选项是正确的(  )。","options":[{"key":"A","text":"去掉重复数据"},{"key":"B","text":"去掉无关数据"},{"key":"C","text":"补全缺失数据"},{"key":"D","text":"平滑噪声数据"},{"key":"E","text":"最大限度纠正数据的不一致性和不完整性"}],"answer":["A","B","C","D","E"],"topic":"数据采集与处理","row":40,"explanation":{"analysis":"数据清洗既包括删除重复和无关记录，也包括按合理规则处理缺失、平滑噪声和统一不一致的格式或编码，所以五项都可选。操作应依据数据含义和任务目标：真实极端值不能随意当噪声删除，缺失值也应在评估原因后选择插补、保留标记或剔除。","tip":"清洗要去冗余、补缺失、控噪声、统一标准。","caution":""}},{"id":"multi-039","number":39,"type":"multi","text":"以下选项是插补缺失值的常用方法(  )。","options":[{"k
