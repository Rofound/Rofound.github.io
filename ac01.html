<script id="question-data" type="application/json">{"version":"nanshan-2026-v1","contentRevision":"2026-09-24-explanations","questions":[{"id":"single-001","number":1,"type":"single","text":"下列符合遵纪守法要求的做法不包括(  )。","options":[{"key":"A","text":"遵守法律法规"},{"key":"B","text":"遵守行为规范"},{"key":"C","text":"遵守所在机构的规章制度"},{"key":"D","text":"在楼下没人的时候可以高空抛物"}],"answer":["D"],"topic":"职业道德与法规","row":3,"explanation":{"analysis":"题目问的是“不包括”，应选 D。高空抛物的危险不因一时看不到楼下有人而消失，物体可能伤及行人、车辆或公共设施。A、B、C 分别强调遵守法律、行为规范与组织规章，都符合遵纪守法的基本要求。判断职业行为时，应看行为本身的责任与风险，不能用侥幸心理替代规则。","tip":"遇到“不包括”，先找违反规则的行为；无人可见不等于没有风险。","caution":""}},{"id":"single-002","number":2,"type":"single","text":"关于道德与法律的区别,表述不正确的是(  )。","options":[{"key":"A","text":"道德的表现形式不如法律严格"},{"key":"B","text":"道德的调整范围比法律广"},{"key":"C","text":"法律由国家强制力保障实施"},{"key":"D","text":"道德产生时间比法律早,有阶级的社会才有道德规范"}],"answer":["D"],"topic":"职业道德与法规","row":4,"explanation":{"analysis":"D 的前半句“道德产生时间比法律早”并不是本题错误所在，问题在于把道德限定为有阶级社会才存在。人类共同生活形成的行为规范早于成文法律，也并非只有阶级社会才有。A、B、C 分别从表现形式、调整范围和国家强制保障说明两者差别，符合本题采用的基础教材表述。","tip":"辨析复合选项时逐句判断：前半句正确，也可能因后半句错误而整项错误。","caution":""}},{"id":"single-003","number":3,"type":"single","text":"某互联网企业数据分析师发现用户健康数据存在泄露风险,向部门主管汇报后未获重视。根据职业道德要求,其下一步最合理的做法是(  )。","options":[{"key":"A","text":"自行联系媒体曝光以推动整改"},{"key":"B","text":"继续向上级监管部门或行业协会报告"},{"key":"C","text":"因未造成实际损失选择沉默"},{"key":"D","text":"私下提醒部分用户注意隐私保护"}],"answer":["B"],"topic":"职业道德与法规","row":5,"explanation":{"analysis":"健康数据泄露风险涉及服务对象权益，主管未重视并不意味着报告责任已经结束。B 强调通过有权限的渠道继续升级报告，比沉默或只提醒少数用户更能推动系统性处置。A 的自行公开可能扩大敏感信息暴露；D 不能替代正式报告。实际应保存必要证据，并按组织流程及适用规则确定接收报告的机构。","tip":"发现重大数据风险：留痕、升级报告、控制披露范围。","caution":"题库将“监管部门或行业协会”并列，但行业协会未必有监管权限；实际报告渠道应按具体风险与适用规定选择。"}},{"id":"single-004","number":4,"type":"single","text":"职业活动中\"服务意识\"的核心要求是(  )。","options":[{"key":"A","text":"满足服务对象所有需求"},{"key":"B","text":"以企业利润最大化为优先"},{"key":"C","text":"平衡服务对象权益与职业规范"},{"key":"D","text":"避免与服务对象产生矛盾"}],"answer":["C"],"topic":"职业道德与法规","row":6,"explanation":{"analysis":"服务意识要求认真回应合理需求，同时守住职业规范和服务对象的合法权益，因此 C 最完整。A 的“所有需求”包括可能违规或不合理的要求，不能无条件满足；B 把利润置于权益之上；D 只求不发生矛盾，可能导致回避问题。负责任的服务可以包含解释边界、拒绝不当要求并提供可行替代方案。","tip":"服务好不等于全答应，合理需求与职业边界要同时满足。","caution":""}},{"id":"single-005","number":5,"type":"single","text":"某中学教师发现学生家长通过微信发送红包希望\"关照孩子\",正确处理方式是(  )。","options":[{"key":"A","text":"接收后用于班级活动支出并公示"},{"key":"B","text":"明确拒绝并说明教师职业规范"},{"key":"C","text":"暂时收取待学期结束后退还"},{"key":"D","text":"以\"代存\"名义转交班主任处理"}],"answer":["B"],"topic":"综合知识","row":7,"explanation":{"analysis":"红包与“关照孩子”直接关联，接受后容易造成利益冲突和教育公平问题。B 通过明确拒绝并解释职业规范，在源头上避免不当利益影响。把钱用于班级、暂收后退或声称代存，都没有消除接受利益及特殊照顾期待。正确处理的重点是保持公平、清楚表达边界，而非改变红包的名义或最终用途。","tip":"与特殊照顾挂钩的礼金，应明确拒绝，不能靠改用途来消除利益冲突。","caution":""}},{"id":"single-006","number":6,"type":"single","text":"下列行为中,违反\"职业忠诚\"要求的是(  )。","options":[{"key":"A","text":"企业技术员在行业论坛分享非涉密技术经验"},{"key":"B","text":"公务员在社交媒体发布对政策的个人解读"},{"key":"C","text":"银行柜员将客户账户异常交易报告合规部门"},{"key":"D","text":"律师为犯罪嫌疑人提供符合法律的辩护服务"}],"answer":["B"],"topic":"职业道德与法规","row":8,"explanation":{"analysis":"职业忠诚应包含履行职责、遵守合法纪律与保密要求，不能理解为禁止一切个人表达。A 已限定非涉密经验分享；C 是合规报告；D 是依法提供专业服务，均有正当性。B 只有在泄密、冒用官方身份、违反适用纪律等情况下才可能构成问题，仅凭“发布政策个人解读”不足以判定违反职业忠诚。","tip":"判断职业表达是否违规，要看保密、身份与具体纪律，不能仅看是否发表个人意见。","caution":"题库答案为 B，但题干缺少违规内容、保密义务或适用纪律等前提，无法仅据现有文字认定 B 必然违规。"}},{"id":"single-007","number":7,"type":"single","text":"职业纪律与职业道德的关系是(  )。","options":[{"key":"A","text":"职业纪律是职业道德的法律化延伸"},{"key":"B","text":"职业道德是职业纪律的软性约束补充"},{"key":"C","text":"二者相互独立,无直接关联"},{"key":"D","text":"职业纪律是职业道德的最低要求"}],"answer":["D"],"topic":"职业道德与法规","row":9,"explanation":{"analysis":"按本题的职业道德教育表述，D 强调遵守职业纪律是从业者必须守住的基本底线，而较高层次的职业道德还要求主动负责、诚实服务等。A 把一切职业纪律说成“法律化”不准确，许多纪律属于组织规则；C 忽视两者联系。B 只描述道德的补充约束作用，没有直接体现题目强调的最低行为要求。","tip":"纪律提供基本行为底线，道德还要求超越最低要求的责任与自觉。","caution":""}},{"id":"single-008","number":8,"type":"single","text":"下列关于\"职业良心\"的表述,正确的是(  )。","options":[{"key":"A","text":"职业良心是社会舆论的外在压力"},{"key":"B","text":"职业良心仅受个人价值观影响"},{"key":"C","text":"职业良心是从业者对职业责任的自觉认知"},{"key":"D","text":"职业良心在利益冲突时无实际约束作用"}],"answer":["C"],"topic":"职业道德与法规","row":10,"explanation":{"analysis":"职业良心是从业者对自身责任的内在认识和自我评价，表现为即使无人监督也愿意尽责，所以选 C。社会舆论属于外部约束，不等于良心；个人价值观会影响良心，但职业规范、教育和社会实践也会影响它。利益冲突往往正是职业良心发挥约束作用的场景，并不能据此断言其没有作用。","tip":"良心是内在自律，舆论是外在监督。","caution":""}},{"id":"single-009","number":9,"type":"single","text":"\"言行一致\"、\"身体力行\",是加强( )修养的远见卓识","options":[{"key":"A","text":"乐于奉献"},{"key":"B","text":"诚实守信"},{"key":"C","text":"精诚团结"},{"key":"D","text":"爱岗敬业"}],"answer":["B"],"topic":"综合知识","row":11,"explanation":{"analysis":"“言行一致”要求承诺与实际行动相符，“身体力行”要求以行动兑现所讲的道理，两者最直接对应诚实守信，因此选 B。奉献强调付出，团结强调协作，敬业强调认真履职，虽都可以通过行动体现，但不是这组关键词的中心。做此类概念匹配题时，应寻找表述与规范之间最直接的联系。","tip":"言与行相符、承诺能兑现，首先联想到诚实守信。","caution":""}},{"id":"single-010","number":10,"type":"single","text":"某科技公司程序员小张发现同事小王在代码中植入恶意后门,可能导致用户数据泄露。根据职业道德要求,小张最合理的做法是(  )。","options":[{"key":"A","text":"装作没看见,避免同事关系恶化"},{"key":"B","text":"私下提醒小王删除后门,不向上级报告"},{"key":"C","text":"立即向部门主管或合规部门举报"},{"key":"D","text":"将后门信息出售给竞争对手以获利"}],"answer":["C"],"topic":"职业道德与法规","row":12,"explanation":{"analysis":"恶意后门可能持续危及用户数据，C 的正式举报能让有权限的主管或合规团队启动调查与处置，并留下记录。A 放任风险；B 仅私下提醒，既可能无法消除后门，也可能失去核查线索；D 出售漏洞信息进一步侵害用户与组织利益。合理做法还包括保存必要证据，避免自行扩散后门细节。","tip":"恶意后门是组织安全事件，应及时正式报告，不能仅靠私下劝说。","caution":""}},{"id":"single-011","number":11,"type":"single","text":"某心理咨询师在朋友圈分享\"最近接待了一位有严重抑郁倾向的企业高管\",未提及具体信息。此行为主要违反(  )。","options":[{"key":"A","text":"专业胜任原则"},{"key":"B","text":"保密义务"},{"key":"C","text":"服务公平原则"},{"key":"D","text":"职业荣誉要求"}],"answer":["B"],"topic":"综合知识","row":13,"explanation":{"analysis":"咨询中的来访经历和心理健康状况具有高度敏感性。即使不写姓名，“企业高管”“最近接待”等线索与熟人已有信息结合，仍可能识别来访者，因此题库选择保密义务 B。专业胜任讨论能力是否足够，公平讨论是否差别对待，均不如保密直接。案例交流应取得必要授权并做充分去识别处理。","tip":"不写姓名不等于充分匿名，职业、时间等组合线索也可能识别人。","caution":"题干未说明授权、可识别性及披露细节；是否实际违反保密义务需结合具体情境，不能把所有匿名案例交流一概判为违规。"}},{"id":"single-012","number":12,"type":"single","text":"新能源汽车工程师在研发中发现某设计参数存在安全隐患,但公司为抢占市场要求按期量产。此时工程师应(  )。","options":[{"key":"A","text":"服从公司安排并参与风险评估报告编写"},{"key":"B","text":"向相关监管部门提交书面风险预警"},{"key":"C","text":"私下联系媒体披露设计缺陷"},{"key":"D","text":"离职以避免责任牵连"}],"answer":["B"],"topic":"综合知识","row":14,"explanation":{"analysis":"当产品设计存在安全隐患，而组织仍要求按期量产时，工程师应把公众安全与风险报告置于进度压力之前。B 提出向有权限的监管机构书面预警，比盲目服从或仅离职更能推动风险处置。A 若只是配合量产而未解决隐患就不足；C 的公开披露也不应替代规范的报告和核查渠道。","tip":"产品安全风险不能因上市期限而被掩盖，报告应可追溯且指向有权限的渠道。","caution":"实际应结合风险严重性、内部升级机制及报告义务确定路径；题目未充分交代这些条件，B 是给定选项中的风险升级方案。"}},{"id":"single-013","number":13,"type":"single","text":"网络主播在推广保健品时,明知产品未获得保健食品认证仍宣称\"有效治疗糖尿病\"。此行为主要违反(  )。","options":[{"key":"A","text":"勤勉尽责原则"},{"key":"B","text":"诚实信用原则"},{"key":"C","text":"公平竞争原则"},{"key":"D","text":"保护隐私原则"}],"answer":["B"],"topic":"计算机与办公基础","row":15,"explanation":{"analysis":"明知没有相应依据仍宣称可治疗糖尿病，是用虚假或误导性信息促成购买，最直接违反诚实信用原则，因此选 B。勤勉尽责强调认真履行职责，公平竞争关注竞争秩序，隐私保护关注个人信息，均不如虚假宣传与诚信的对应关系直接。即使获得保健食品相关资质，也不能因此把保健食品当作疾病治疗药物宣传。","tip":"明知不实仍作疗效承诺，首先判断为违反诚信。","caution":""}},{"id":"single-014","number":14,"type":"single","text":"社区工作者在调解邻里纠纷时,一方是自己的亲戚,另一方是长期支持社区工作的居民。此时应重点遵循的职业道德规范是(  )。","options":[{"key":"A","text":"热情服务"},{"key":"B","text":"办事公道"},{"key":"C","text":"奉献社会"},{"key":"D","text":"团结协作"}],"answer":["B"],"topic":"职业道德与法规","row":16,"explanation":{"analysis":"一方是亲戚，另一方与社区关系良好，双方都可能引入关系压力。调解应依据事实和统一标准处理，不能按亲疏或贡献大小偏袒，故选 B 办事公道。热情、奉献和协作有助于工作，但不能替代公正原则；存在影响公正的利益关系时，还应按适用程序说明关系或安排回避。","tip":"遇到亲属、熟人或利益关系，优先检查是否公正与是否需要回避。","caution":""}},{"id":"single-015","number":15,"type":"single","text":"PCIe 网卡相对 USB 网卡传输速度与延迟更(  )","options":[{"key":"A","text":"差"},{"key":"B","text":"优"},{"key":"C","text":"等同"},{"key":"D","text":"慢"}],"answer":["B"],"topic":"综合知识","row":17,"explanation":{"analysis":"题库选择 B，是基于常见高性能内置 PCIe 网卡直接连接系统总线、带宽余量及延迟表现通常较好的比较。USB 网卡还受 USB 版本、共享总线、芯片和驱动等因素影响。但实际传输速度还受网卡规格、链路速率及网络环境限制，不能仅凭接口名称断言任何 PCIe 网卡都更快。","tip":"接口影响上限，实际网速还要看网卡规格、总线版本与链路瓶颈。","caution":"“PCIe 一定优于 USB”并非普遍结论；题干未限定产品和接口版本，B 应理解为通常条件下的概括。"}},{"id":"single-016","number":16,"type":"single","text":"打开路径为我的电脑-属性-设备管理器-磁盘驱动器,就能显示出(  )型号。","options":[{"key":"A","text":"光源"},{"key":"B","text":"摄像头"},{"key":"C","text":"鼠标"},{"key":"D","text":"硬盘"}],"answer":["D"],"topic":"综合知识","row":18,"explanation":{"analysis":"设备管理器的“磁盘驱动器”分组列出系统识别到的磁盘设备及其型号，因此在给定选项中选 D 硬盘。摄像头、鼠标通常出现在各自设备类别中，光源不是这里的标准设备类型。这里看到的是设备型号等硬件信息，不是某个分区的文件夹内容；不同 Windows 版本的入口名称可能有所不同。","tip":"设备管理器看硬件型号，“磁盘驱动器”对应磁盘设备。","caution":""}},{"id":"single-017","number":17,"type":"single","text":"计算机网络的三要素是指(  )。","options":[{"key":"A","text":"集线器、交换机、路由器"},{"key":"B","text":"计算机设备、通信线路和连接设备、网络协议"},{"key":"C","text":"万维网、电子邮件、网络聊天"},{"key":"D","text":"计算机设备、网卡、网线"}],"answer":["B"],"topic":"计算机与办公基础","row":19,"explanation":{"analysis":"构成计算机网络既要有参与通信的计算机等设备，也要有传输与连接设施，还必须有共同遵守的网络协议，因此 B 同时覆盖节点、连接和规则。A 只是几种连接设备；C 列的是网络应用；D 虽包含硬件，却漏掉规定数据格式与通信过程的协议。没有协议，即使设备物理连接也不能保证正常通信。","tip":"网络三要素：通信设备、连接通道、共同协议。","caution":""}},{"id":"single-018","number":18,"type":"single","text":"计算机网络最突出的优点是(  )。","options":[{"key":"A","text":"运算速度快"},{"key":"B","text":"运算精度高"},{"key":"C","text":"存储容量大"},{"key":"D","text":"资源共享"}],"answer":["D"],"topic":"计算机与办公基础","row":20,"explanation":{"analysis":"网络将原本分散的计算机连接起来，使文件、打印机、应用服务和计算资源能够被多个用户共享，所以 D 最能体现网络的突出优势。单机运算速度、精度和存储容量主要由相应硬件与系统决定，联网本身并不会必然提高这些指标。网络可以支持分布式协作，但它的基础价值首先是通信和资源共享。","tip":"问网络的典型优势，抓住跨设备的通信与资源共享。","caution":""}},{"id":"single-019","number":19,"type":"single","text":"以下属于存储器的是(  )。","options":[{"key":"A","text":"串口"},{"key":"B","text":"硬盘"},{"key":"C","text":"内存储器"},{"key":"D","text":"显示器"}],"answer":["B"],"topic":"计算机与办公基础","row":21,"explanation":{"analysis":"存储器用于保存数据或指令，通常包含内存储器和外存储器。B 硬盘属于外存，C 内存储器也显然属于存储器；A 串口是通信接口，D 显示器是输出设备。因此知识上 B、C 都成立，不能为了配合单选答案而把内存排除在存储器之外。区分内外存时主要看用途、访问方式和持久性等特点。","tip":"存储器既包括内存，也包括硬盘等外存。","caution":"题库标答案 B，但 C“内存储器”同样正确，本题存在多个正确选项，不满足单选题要求。"}},{"id":"single-020","number":20,"type":"single","text":"一个字节由(  )位二进制信息组成。","options":[{"key":"A","text":"2"},{"key":"B","text":"4"},{"key":"C","text":"8"},{"key":"D","text":"16"}],"answer":["C"],"topic":"综合知识","row":22,"explanation":{"analysis":"现代计算机通常以 8 个二进制位组成一个字节，因此选 C。每个位只能取 0 或 1，8 位共有 2 的 8 次方，即 256 种组合；一个字节能表示多大整数还取决于是否有符号及编码方式。2、4、16 都不是本题所问的标准字节位数，尤其要避免把字节与位或字长混为一谈。","tip":"1 Byte＝8 bit，字节与位相差 8 倍。","caution":""}},{"id":"single-021","number":21,"type":"single","text":"硬盘中信息记录介质被称为(  )。","options":[{"key":"A","text":"磁道"},{"key":"B","text":"盘片"},{"key":"C","text":"扇区"},{"key":"D","text":"磁盘"}],"answer":["B"],"topic":"综合知识","row":23,"explanation":{"analysis":"对于机械硬盘，数据记录在带磁性材料的盘片表面，因此 B 对应实际承载记录的介质。磁道是盘片上的环形记录路径，扇区是划分出的存储区域，二者属于组织方式而非盘片本身。D“磁盘”更像设备或介质的统称，没有 B 精确。固态硬盘则用闪存保存数据，并不具有机械盘片。","tip":"机械硬盘：盘片是介质，磁道和扇区是介质上的组织结构。","caution":"该表述只适用于机械硬盘 HDD；若“硬盘”包含 SSD，则不存在盘片这一统一答案。"}},{"id":"single-022","number":22,"type":"single","text":"以下属于输入设备的是(  )。","options":[{"key":"A","text":"鼠标"},{"key":"B","text":"扬声器"},{"key":"C","text":"中央处理器"},{"key":"D","text":"显示器"}],"answer":["A"],"topic":"综合知识","row":24,"explanation":{"analysis":"输入设备把用户或外界的信息送入计算机，鼠标将移动、点击等操作转成输入事件，所以选 A。扬声器把结果以声音输出，显示器把结果以图像输出；中央处理器负责执行指令和计算，属于处理部件。判断时可以沿着信息方向区分：进入计算机是输入，传给用户是输出。","tip":"按信息流向分类：鼠标送入操作，屏幕和扬声器输出结果。","caution":""}},{"id":"single-023","number":23,"type":"single","text":"以下不属于计算机硬件的是(  )。","options":[{"key":"A","text":"串口"},{"key":"B","text":"电脑管家"},{"key":"C","text":"光驱"},{"key":"D","text":"显示器"}],"answer":["B"],"topic":"计算机与办公基础","row":25,"explanation":{"analysis":"硬件是计算机中可以作为物理部件存在的设备与接口，串口、光驱和显示器都属于这一范围。电脑管家是安装运行的软件程序，用于管理或维护系统，所以 B 不属于硬件。不能因软件名称中有“电脑”或能操作硬件，就把它归为硬件；区分的关键是实体部件还是程序及相关数据。","tip":"能安装运行的程序属于软件，接口和设备属于硬件。","caution":""}},{"id":"single-024","number":24,"type":"single","text":"(  )是衡量GPU显存传输速度的指标。","options":[{"key":"A","text":"带宽"},{"key":"B","text":"延迟"},{"key":"C","text":"算力"},{"key":"D","text":"主频"}],"answer":["A"],"topic":"综合知识","row":26,"explanation":{"analysis":"显存带宽表示 GPU 与显存之间单位时间可传输的数据量，通常用 GB/s 等单位衡量，因此选 A。延迟描述一次访问等待多久，算力衡量单位时间的计算能力，主频只是时钟频率。较高主频可能影响性能，但显存传输能力还取决于数据速率、位宽等因素，不能仅用某一个主频替代带宽。","tip":"带宽看每秒能搬多少数据，延迟看一次要等多久。","caution":""}},{"id":"single-025","number":25,"type":"single","text":"计算机的故障中的(  )表现为偶然原因引起的短暂故障。","options":[{"key":"A","text":"永久性故障"},{"key":"B","text":"间歇性故障"},{"key":"C","text":"瞬时性故障"},{"key":"D","text":"软件故障"}],"answer":["C"],"topic":"计算机与办公基础","row":27,"explanation":{"analysis":"偶然原因引起、持续时间短并可能自行消失的故障称为瞬时性故障，故选 C。永久性故障通常持续存在，往往需要修理或替换部件；间歇性故障会在一段时间内反复出现和消失。软件故障是按成因或所在层面分类，不能专门说明持续时间。这里的识别关键词是“偶然”“短暂”。","tip":"瞬时是一次短暂异常，间歇是反复时有时无，永久是持续存在。","caution":""}},{"id":"single-026","number":26,"type":"single","text":"开机后,计算机首先进行设备检测,称为(  )。","options":[{"key":"A","text":"启动系统"},{"key":"B","text":"设备检测"},{"key":"C","text":"开机"},{"key":"D","text":"系统自检"}],"answer":["D"],"topic":"计算机与办公基础","row":28,"explanation":{"analysis":"计算机开机早期，固件会执行上电自检，检查必要硬件能否满足后续启动条件，因此题库选择 D 系统自检。启动操作系统是后续阶段；“设备检测”和“开机”描述过于宽泛，不是本题要考的标准名称。自检能发现部分硬件问题，但通过自检并不代表整台计算机所有功能都已经得到全面测试。","tip":"开机顺序先自检，再进入后续引导与系统启动。","caution":""}},{"id":"single-027","number":27,"type":"single","text":"(  )是管理计算机硬件与软件资源的计算机程序。","options":[{"key":"A","text":"键盘"},{"key":"B","text":"鼠标"},{"key":"C","text":"操作系统"},{"key":"D","text":"应用系统"}],"answer":["C"],"topic":"计算机与办公基础","row":29,"explanation":{"analysis":"操作系统负责调度处理器、管理内存和文件、控制设备，并向应用程序提供运行服务，所以选 C。键盘和鼠标是输入硬件，不是资源管理程序；应用系统依赖操作系统完成具体业务，通常不承担整个计算机的通用资源管理。区分时可问：它是在统一管理运行环境，还是在完成某项用户任务？","tip":"操作系统管资源、供服务，应用程序做具体任务。","caution":""}},{"id":"single-028","number":28,"type":"single","text":"在计算机网络中,子网掩码的作用是(  )。","options":[{"key":"A","text":"加密数据"},{"key":"B","text":"验证用户身份"},{"key":"C","text":"划分IP地址的网络部分和主机部分"},{"key":"D","text":"控制带宽"}],"answer":["C"],"topic":"计算机与办公基础","row":30,"explanation":{"analysis":"子网掩码用于指出 IPv4 地址中哪些位属于网络前缀、哪些位属于主机部分，因此选 C。把 IP 地址与掩码按位与，可以得到相应网络地址，从而辅助判断目的地址是否在同一子网。数据加密、身份认证和带宽控制各有其他机制负责，掩码并不会自动提供这些功能。","tip":"子网掩码回答“哪部分是网络号”，不负责加密或限速。","caution":""}},{"id":"single-029","number":29,"type":"single","text":"在微型计算机中,bit的中文含义是(  )。","options":[{"key":"A","text":"二进制位"},{"key":"B","text":"双字"},{"key":"C","text":"字节"},{"key":"D","text":"字"}],"answer":["A"],"topic":"计算机与办公基础","row":31,"explanation":{"analysis":"bit 是 binary digit 的缩写，表示一个二进制位，只能取 0 或 1，因此选 A。字节通常包含 8 位；“字”和“双字”是更大的数据单位，其具体位数要结合体系结构或约定理解。常见易错点是大小写：bit 常缩写为 b，Byte 常缩写为 B，例如 Mb/s 与 MB/s 并不是同一个单位。","tip":"小写 b 表示位，大写 B 表示字节。","caution":""}},{"id":"single-030","number":30,"type":"single","text":"世界上第一台电子数字计算机诞生于(  )。","options":[{"key":"A","text":"1958"},{"key":"B","text":"1946"},{"key":"C","text":"1965"},{"key":"D","text":"1947"}],"answer":["B"],"topic":"计算机与办公基础","row":32,"explanation":{"analysis":"按基础教材通常采用的口径，本题指 1946 年公开亮相的 ENIAC，故选 B。该机器常被介绍为第一台通用电子数字计算机，体现电子器件替代早期机电结构的重要进展。1958、1965、1947 均不符合 ENIAC 的这一时间点。学习时应把年代与所指机器绑定，避免忽略不同历史定义。","tip":"基础考试常把 ENIAC 与 1946 年对应记忆。","caution":"“第一台电子数字计算机”存在定义口径差异；严格历史讨论还涉及更早的专用电子计算设备，本题按 ENIAC 的教材口径判分。"}},{"id":"single-031","number":31,"type":"single","text":"控制器通过一定的(  )来使计算机有序的工作和协调。","options":[{"key":"A","text":"控制指令"},{"key":"B","text":"译码器"},{"key":"C","text":"逻辑部件"},{"key":"D","text":"寄存器"}],"answer":["A"],"topic":"计算机与办公基础","row":33,"explanation":{"analysis":"控制器按照指令执行顺序，完成取指、译码并发出相应控制信号，协调运算器、存储器和输入输出部件工作。A“控制指令”最接近题意。译码器是帮助解释指令的部件，寄存器用于暂存信息，逻辑部件可以参与运算，但都不是描述整个控制过程的答案。注意指令、控制信号与实现这些功能的硬件不是同一层次。","tip":"控制器的主线是取指、译码、发控制信号。","caution":"A 的“控制指令”用词较笼统；更精确地说，控制器根据指令产生控制信号来协调各部件。"}},{"id":"single-032","number":32,"type":"single","text":"下面属于操作系统的是(  )。","options":[{"key":"A","text":"硬件系统"},{"key":"B","text":"中央处理器"},{"key":"C","text":"网络操作系统"},{"key":"D","text":"显示器"}],"answer":["C"],"topic":"计算机与办公基础","row":34,"explanation":{"analysis":"网络操作系统仍属于操作系统，只是在基本资源管理之外，重点支持网络通信、共享服务和网络用户管理，因此选 C。硬件系统是实体设备的整体，中央处理器是处理部件，显示器是输出设备，三者都不属于操作系统软件。题目考查的是软件层级分类，不是是否能参与联网。","tip":"名称前加“网络”，不改变它属于操作系统软件这一分类。","caution":""}},{"id":"single-033","number":33,"type":"single","text":"以下选项不是网络操作系统提供的服务(  )。","options":[{"key":"A","text":"文件服务"},{"key":"B","text":"打印服务"},{"key":"C","text":"通信服务"},{"key":"D","text":"办公自动化服务"}],"answer":["D"],"topic":"计算机与办公基础","row":35,"explanation":{"analysis":"网络操作系统通常提供共享文件、网络打印及通信支持，A、B、C 都是常见基础服务。办公自动化涉及文档流转、审批、协同办公等具体业务，通常由运行在系统之上的应用软件实现，因此本题选 D。操作系统可以支持或承载办公应用，但“为应用提供环境”不等于“该业务就是系统的基本服务”。","tip":"文件、打印、通信是底层服务，办公流程通常属于应用层。","caution":""}},{"id":"single-034","number":34,"type":"single","text":"计算机系统的层次结构中级别最高的是(  )。","options":[{"key":"A","text":"高级语言机器级"},{"key":"B","text":"汇编语言机器级"},{"key":"C","text":"传统机器语言机器级"},{"key":"D","text":"微程序机器级"}],"answer":["A"],"topic":"计算机与办公基础","row":36,"explanation":{"analysis":"在给定的四个机器层次中，高级语言机器级最接近程序员熟悉的抽象表达，因此选 A。由低到高可理解为微程序机器级、传统机器语言机器级、汇编语言机器级、高级语言机器级；较高层用更抽象的表示描述功能，通常经翻译或解释落实到较低层。汇编虽然便于记忆，仍与具体机器指令联系紧密。","tip":"抽象程度：微程序＜机器语言＜汇编＜高级语言。","caution":"这里是四个给定层次之间的比较；不同体系结构教材可能还列出更高的应用语言层。"}},{"id":"single-035","number":35,"type":"single","text":"计算机视觉与很多学科都有密切关系,例如(  )为计算机视觉提供了图像处理的方法与工具。","options":[{"key":"A","text":"数字图像处理"},{"key":"B","text":"美术学"},{"key":"C","text":"计算机绘图"},{"key":"D","text":"物理学"}],"answer":["A"],"topic":"计算机与办公基础","row":37,"explanation":{"analysis":"数字图像处理提供滤波、增强、变换、分割等处理图像的方法，是计算机视觉的重要工具基础，因此选 A。美术学关注艺术表达，计算机绘图更偏向图像生成，物理学能解释成像等机制，但与题干所说“提供图像处理的方法与工具”最直接对应的仍是数字图像处理。视觉在此基础上进一步识别和理解图像内容。","tip":"图像处理改善和变换像素，计算机视觉进一步解释像素中的内容。","caution":""}},{"id":"single-036","number":36,"type":"single","text":"(  )致力于计算机理解人类语言的句子或词语,目的是实现人机交互 。","options":[{"key":"A","text":"文字校对技术"},{"key":"B","text":"自然语言生成技术"},{"key":"C","text":"中文自动分词技术"},{"key":"D","text":"自然语言处理技术"}],"answer":["D"],"topic":"计算机与办公基础","row":38,"explanation":{"analysis":"自然语言处理研究计算机如何处理、理解和生成人类语言，覆盖词语、句子乃至篇章，因此选 D。文字校对、分词和自然语言生成都是更具体的任务，不能单独概括题干强调的整体领域。尤其自然语言生成偏向产出文本，而题干强调理解语言并支持交互，范围明显更广。","tip":"NLP 是总领域，分词、校对、理解与生成都是其中的任务。","caution":""}},{"id":"single-037","number":37,"type":"single","text":"计算机业界最初的硬件巨头\"蓝色巨人\"指的是(  )。","options":[{"key":"A","text":"IBM"},{"key":"B","text":"Microsoft"},{"key":"C","text":"联想"},{"key":"D","text":"Sun"}],"answer":["A"],"topic":"计算机与办公基础","row":39,"explanation":{"analysis":"“蓝色巨人”是 IBM 的广为人知的称呼，与其蓝色品牌标识及历史上在大型机等计算机市场的地位有关，所以选 A。Microsoft 主要以软件业务闻名；联想和 Sun 各有自己的发展历史，都不是这一称号的对应企业。本题属于计算机产业常识，不是通过当前公司规模来重新判断称号。","tip":"蓝色巨人对应 IBM。","caution":""}},{"id":"single-038","number":38,"type":"single","text":"以下哪项不属于计算机视觉领域的标注任务(  )。","options":[{"key":"A","text":"物体检测"},{"key":"B","text":"边缘检测"},{"key":"C","text":"关键点识别"},{"key":"D","text":"自然语言处理"}],"answer":["D"],"topic":"数据标注与质检","row":40,"explanation":{"analysis":"物体检测、边缘检测和关键点识别都围绕图像中的空间结构，可使用目标框、轮廓、点位等标注支持训练或评估。自然语言处理主要处理文本或语言信息，因此 D 不属于这里的计算机视觉标注任务。即使多模态系统同时处理图像和语言，也不能因此取消视觉任务与语言任务的基本分类。","tip":"看图中位置和形状多属视觉；分析语言含义多属 NLP。","caution":""}},{"id":"single-039","number":39,"type":"single","text":"下面哪种说法是错误的(  )。","options":[{"key":"A","text":"文本文件是基于字符编码方式存储文件"},{"key":"B","text":"二进制文件是按二进制的编码方式来存放文件的"},{"key":"C","text":"数据是以二进制编码方式存储在计算机文件中的"},{"key":"D","text":"计算机只能识别文本文件"}],"answer":["D"],"topic":"综合知识","row":41,"explanation":{"analysis":"计算机底层把文件内容作为二进制数据存储，文本文件也不例外，只是其字节通常按字符编码解释。程序可以按相应格式处理图片、音频、可执行文件等二进制文件，并非只能识别文本，因此 D 错误。A 说明文本的解释方式，C 说明共同的存储基础；文本与二进制文件的区别不在于是否由 0 和 1 保存。","tip":"所有文件底层都是字节，文本文件多了一套字符编码解释规则。","caution":""}},{"id":"single-040","number":40,"type":"single","text":"在计算机内部,数据的表示形式是(  )。","options":[{"key":"A","text":"八进制"},{"key":"B","text":"十进制"},{"key":"C","text":"二进制"},{"key":"D","text":"十六进制"}],"answer":["C"],"topic":"计算机与办公基础","row":42,"explanation":{"analysis":"数字计算机内部通常使用二进制位表示数据，因此选 C。十进制方便人类日常阅读，八进制和十六进制常作为二进制的紧凑书写形式；它们并不意味着硬件改用八种或十六种基本状态保存同一数据。例如十六进制 F 与二进制 1111 表示同一数值，只是表示记法不同。","tip":"机器内部用二进制，十六进制常用来更紧凑地展示二进制。","caution":""}},{"id":"single-041","number":41,"type":"single","text":"(  )是人以自然语言同计算机进行交互的综合性技术,结合了语言学、心理学、工程、计算机技术等领域的知识。","options":[{"key":"A","text":"情感交互"},{"key":"B","text":"语音交互"},{"key":"C","text":"体感交互"},{"key":"D","text":"脑机交互"}],"answer":["B"],"topic":"计算机与办公基础","row":43,"explanation":{"analysis":"题库选择 B，指用户以语音自然语言与系统交流，系统通过语音识别、语言理解、对话管理和语音合成等环节完成交互。情感交互关注情绪因素，体感交互关注动作姿态，脑机交互关注脑信号，都不直接对应这一典型流程。不过自然语言交互还可以采用文字，不能将“自然语言”与“语音”完全等同。","tip":"语音交互常见链路：听清语音、理解意思、形成回答、合成播报。","caution":"题干只写“自然语言”，未明确语音形式；B 是给定选项中最贴近的答案，但自然语言交互也包含文字交互。"}},{"id":"single-042","number":42,"type":"single","text":"在计算机网络中,DNS的主要作用是(  )。","options":[{"key":"A","text":"域名解析"},{"key":"B","text":"数据加密"},{"key":"C","text":"流量控制"},{"key":"D","text":"拥塞控制"}],"answer":["A"],"topic":"计算机与办公基础","row":44,"explanation":{"analysis":"DNS 的主要作用是域名解析，例如把易记的域名查询为相应 IP 地址，因此选 A。它让用户无需直接记住每个服务的数字地址。数据加密由 TLS 等机制承担，流量控制和拥塞控制属于传输等环节的功能。DNS 还可承载邮件路由等记录，但这些扩展不改变其名称解析系统的核心定位。","tip":"DNS 解决“名字对应哪里”，不是负责加密或调节流量。","caution":""}},{"id":"single-043","number":43,"type":"single","text":"在Web开发中,RESTful API的核心思想是(  )。","options":[{"key":"A","text":"使用XML 格式传输数据"},{"key":"B","text":"使用JavaScript进行开发"},{"key":"C","text":"使用关系型数据库"},{"key":"D","text":"使用HTTP 方法操作资源"}],"answer":["D"],"topic":"综合知识","row":45,"explanation":{"analysis":"在常见 Web RESTful API 中，用 URI 标识资源，再用 GET、POST、PUT、DELETE 等 HTTP 方法表达读取、创建或修改等操作，因此选 D。数据可使用 JSON、XML 等格式，后端可用多种语言和数据库，A、B、C 都不是必须条件。REST 还强调无状态、统一接口等约束，并不只等于 URL 上附一个 HTTP 方法。","tip":"RESTful 的常见理解：资源有地址，HTTP 方法表达对资源的操作。","caution":""}},{"id":"single-044","number":44,"type":"single","text":"HTTPS相比HTTP的主要优势是(  )。","options":[{"key":"A","text":"提高了安全性和数据加密"},{"key":"B","text":"提高了传输速度"},{"key":"C","text":"降低了带宽消耗"},{"key":"D","text":"简化了协议实现"}],"answer":["A"],"topic":"综合知识","row":46,"explanation":{"analysis":"HTTPS 是在 TLS 安全机制上使用 HTTP，提供传输加密、完整性保护及基于证书的身份验证等能力，所以选 A。它的主要优势不是保证更快、必然更省带宽或实现更简单。HTTPS 能保护客户端与服务器之间的传输，但不能单独保证网站内容可信，或保证服务端收到数据后一定安全保存。","tip":"HTTPS 保护传输通道；看到小锁不代表网站所有行为都可信。","caution":""}},{"id":"single-045","number":45,"type":"single","text":"在计算机网络中,(  )是路由(Routing)。","options":[{"key":"A","text":"数据包在网络中的传输方式"},{"key":"B","text":"确定数据包从源地址到目标地址的最优路径"},{"key":"C","text":"网络设备的配置"},{"key":"D","text":"用户认证方式"}],"answer":["B"],"topic":"计算机与办公基础","row":47,"explanation":{"analysis":"路由关注为数据包选择从源网络到目标网络的路径，B 最准确。所谓“最优”通常由路由协议度量、网络策略或优先级决定，并不一定是地理距离最短。A 只是泛称数据传输方式，没有体现路径决策；C 的设备配置可能影响路由，却不是路由的定义；D 则属于身份安全问题。","tip":"路由负责选路，“最优”由度量与策略定义。","caution":""}},{"id":"single-046","number":46,"type":"single","text":"在操作系统中,(  )是进程(Process)。","options":[{"key":"A","text":"正在运行的程序实例"},{"key":"B","text":"计算机的处理器"},{"key":"C","text":"内存中的一段代码"},{"key":"D","text":"硬盘上的文件"}],"answer":["A"],"topic":"计算机与办公基础","row":48,"explanation":{"analysis":"进程是程序的一次执行实例，除了代码，还包括执行状态、地址空间和相关资源，因此选 A。处理器是运行进程的硬件；硬盘上的程序文件是静态内容；单纯一段内存代码也不足以代表完整进程。同一程序可以同时启动多个进程，它们可能运行相同代码，却具有不同的状态和资源。","tip":"程序是静态文件，进程是程序运行起来后的实例。","caution":""}},{"id":"single-047","number":47,"type":"single","text":"大数据的关键特征\"4V\"不包括以下(  )。","options":[{"key":"A","text":"Volume(体量大)"},{"key":"B","text":"Velocity(流速快)"},{"key":"C","text":"Validity(有效性)"},{"key":"D","text":"Variety(种类多)"}],"answer":["C"],"topic":"综合知识","row":49,"explanation":{"analysis":"本题采用的大数据常见 4V 口径包括 Volume、Velocity、Variety，以及 Value 或另一些资料中的 Veracity。给定的 A、B、D 分别对应体量、速度和多样性，C 的 Validity 不属于本题采用的四项，因此选 C。有效性仍是数据治理的重要关注点，不能因为不在某套缩写中就认为它不重要。","tip":"先记体量、速度、多样性，再按教材确认第四个 V 的具体口径。","caution":"大数据 4V 并无唯一通用列法，第四个 V 常见 Value 或 Veracity；应按本题材料口径判断，避免把不同版本混为一谈。"}},{"id":"single-048","number":48,"type":"single","text":"TCP/IP模型中,HTTP协议属于(  )。","options":[{"key":"A","text":"网络层"},{"key":"B","text":"传输层"},{"key":"C","text":"应用层"},{"key":"D","text":"物理层"}],"answer":["C"],"topic":"AI与智能系统","row":50,"explanation":{"analysis":"HTTP 规定客户端与服务端如何交换请求、响应及其语义，属于 TCP/IP 的应用层，所以选 C。传输层的 TCP 或 UDP 为上层提供端到端传输能力，网络层主要解决 IP 寻址和路由，物理层涉及信号传输。HTTP/1.1 和 HTTP/2 常运行于 TCP 之上，HTTP/3 使用 QUIC，但 HTTP 的应用层定位不变。","tip":"HTTP 管应用请求，TCP/UDP 管传输，IP 管寻址与选路。","caution":""}},{"id":"single-049","number":49,"type":"single","text":"TCP和UDP协议的主要区别是(  )。","options":[{"key":"A","text":"TCP面向连接,UDP无连接"},{"key":"B","text":"TCP速度更快"},{"key":"C","text":"UDP更安全"},{"key":"D","text":"没有区别"}],"answer":["A"],"topic":"综合知识","row":51,"explanation":{"analysis":"TCP 在通信前建立连接状态，并提供可靠、有序的字节流；UDP 以无连接数据报方式发送，协议本身不保证到达、顺序或去重，所以 A 正确。不能一概说 TCP 更快，额外控制可能带来开销；UDP 也不天然更安全。实际性能与安全取决于应用需求、网络状况及是否配合加密等机制。","tip":"TCP 重可靠有序，UDP 提供轻量数据报；速度和安全不能只看名称。","caution":""}},{"id":"single-050","number":50,"type":"single","text":"(  )是SQL注入攻击。","options":[{"key":"A","text":"通过网络协议进行攻击"},{"key":"B","text":"通过输入恶意SQL语句进行攻击"},{"key":"C","text":"通过DDoS进行攻击"},{"key":"D","text":"通过病毒传播进行攻击"}],"answer":["B"],"topic":"计算机与办公基础","row":52,"explanation":{"analysis":"SQL 注入发生在应用把不可信输入错误地拼接进 SQL 指令，使输入的一部分被数据库当作查询逻辑执行，因此 B 对应其机制。DDoS 主要耗尽服务资源，病毒传播是另一类攻击方式，A 过于笼统。防护的关键是参数化查询，让用户输入始终作为数据绑定，不能仅靠屏蔽少数关键词来保证安全。","tip":"SQL 注入混淆了“数据”和“指令”，参数化查询用于把两者分开。","caution":""}},{"id":"single-051","number":51,"type":"single","text":"在编程中,(  )是递归(Recursion)。","options":[{"key":"A","text":"函数调用其他函数"},{"key":"B","text":"函数调用自身"},{"key":"C","text":"循环语句"},{"key":"D","text":"条件判断"}],"answer":["B"],"topic":"综合知识","row":53,"explanation":{"analysis":"递归的典型形式是函数在求解过程中调用自身，把原问题转化为规模更小的同类问题，所以选 B。它需要明确的终止条件，否则可能不断调用直到超过限制。调用其他函数是一般函数调用，循环和条件判断是控制结构，都不能单独定义递归。间接递归也可能经由其他函数最终回到自身。","tip":"递归要同时有自我调用与能到达的终止条件。","caution":""}},{"id":"single-052","number":52,"type":"single","text":"IP地址的分类中,192.168.0.1属于(  )类别。","options":[{"key":"A","text":"A类"},{"key":"B","text":"B类"},{"key":"C","text":"C类"},{"key":"D","text":"D类"}],"answer":["C"],"topic":"综合知识","row":54,"explanation":{"analysis":"按照传统 IPv4 分类编址，首字节在 192 至 223 范围内的地址属于 C 类，192.168.0.1 因而选 C。它同时位于常用私有地址段 192.168.0.0/16，这与“传统 C 类”属于不同分类角度。D 类传统上用于组播；现代网络通常使用 CIDR 前缀表示网络，不能只凭传统类别确定实际子网大小。","tip":"192.168 常见于私网；传统分类是 C 类，实际子网仍要看前缀或掩码。","caution":""}},{"id":"single-053","number":53,"type":"single","text":"无线网卡覆盖范围的大小直接影响到(  )的发送和传输。","options":[{"key":"A","text":"无线信号"},{"key":"B","text":"有线信号"},{"key":"C","text":"电话线"},{"key":"D","text":"微信"}],"answer":["A"],"topic":"综合知识","row":55,"explanation":{"analysis":"无线网卡通过无线电信号与接入点等设备通信，覆盖范围决定在哪些位置有机会获得可用的无线连接，因此 A 最直接。网线和电话线属于有线介质，“微信”是应用，不是覆盖范围所描述的信号类别。实际覆盖还受天线、发射功率、墙体遮挡、频段和干扰等因素影响，不能只由网卡一个参数决定。","tip":"无线覆盖首先影响无线链路，应用能否流畅运行还受后续网络条件影响。","caution":""}},{"id":"single-054","number":54,"type":"single","text":"在人工智能中,用于处理图像的神经网络结构是(  )。","options":[{"key":"A","text":"循环神经网络"},{"key":"B","text":"卷积神经网络"},{"key":"C","text":"感知机"},{"key":"D","text":"多层感知机"}],"answer":["B"],"topic":"AI与智能系统","row":56,"explanation":{"analysis":"卷积神经网络使用局部连接、权重共享等方式提取图像空间特征，是处理图像的经典结构，因此选 B。循环神经网络更常用于序列建模；单个感知机表达能力有限；多层感知机虽也能处理展开后的像素，却没有卷积结构利用局部空间规律的直接优势。图像模型还可以采用视觉 Transformer 等其他架构。","tip":"图像有局部空间结构，卷积擅长从局部模式逐层提取特征。","caution":"B 是本题中的典型答案，不能理解成只有卷积神经网络才能处理图像。"}},{"id":"single-055","number":55,"type":"single","text":"人工智能训练师在模型训练过程中,调整的参数通常是(  )。","options":[{"key":"A","text":"权重和偏置"},{"key":"B","text":"内存大小"},{"key":"C","text":"显示器分辨率"},{"key":"D","text":"鼠标灵敏度"}],"answer":["A"],"topic":"AI与智能系统","row":57,"explanation":{"analysis":"神经网络训练通常根据损失及梯度更新权重、偏置等可学习参数，借此改变模型对输入的映射，所以选 A。内存大小可能限制训练规模，但不是通过训练优化的数据拟合参数；显示器分辨率和鼠标灵敏度与模型学习无关。训练师还可能设置学习率、批量大小等超参数，它们与模型内部的权重和偏置应区分。","tip":"训练优化权重和偏置；学习率、批量大小等属于训练配置中的超参数。","caution":""}},{"id":"single-056","number":56,"type":"single","text":"语音识别、语义理解、语音合成、OCR 识别、人脸识别等都属于人工智能技术,以下哪项不是 AI 技术的典型应用(  )。","options":[{"key":"A","text":"智能扫地机器人"},{"key":"B","text":"无人机"},{"key":"C","text":"微信客服"},{"key":"D","text":"哈利波特的扫帚"}],"answer":["D"],"topic":"AI与智能系统","row":58,"explanation":{"analysis":"智能扫地机器人可进行环境感知与路径规划，无人机可借助视觉导航，智能客服可识别用户意图，这些都有现实 AI 应用场景。哈利波特的扫帚属于虚构魔法设定，不是现实人工智能技术应用，因此选 D。判断应用实例时，应看是否通过算法完成感知、决策等任务，而不是只看设备是否自动移动。","tip":"科幻或魔法设定不是现实 AI 应用，自动化设备也不一定使用 AI。","caution":"无人机和微信客服既可能采用 AI，也可能完全由人控制或使用简单规则；本题按其智能化应用场景理解。"}},{"id":"single-057","number":57,"type":"single","text":"根据机器智能水平由低到高,(  )是正确的。","options":[{"key":"A","text":"计算智能、感知智能、认知智能"},{"key":"B","text":"计算智能、感应智能、认知智能"},{"key":"C","text":"机器智能、感知智能、认知智能"},{"key":"D","text":"机器智能、感应智能、认知智能"}],"answer":["A"],"topic":"AI与智能系统","row":59,"explanation":{"analysis":"本题采用常见的概念划分：计算智能侧重计算和存储，感知智能侧重看、听等信息识别，认知智能进一步涉及理解、推理和知识运用，因此选 A。B、D 的“感应智能”不是此处的标准层次名称；C 用总称“机器智能”替代计算智能。该划分用于理解能力差异，不代表所有系统都必然按同一路线升级。","tip":"计算会算，感知会看听，认知强调理解和推理。","caution":""}},{"id":"single-058","number":58,"type":"single","text":"下面不属于领域知识智能问答机器人的是(  )。","options":[{"key":"A","text":"淘宝智能客服机器人"},{"key":"B","text":"南航智能客服"},{"key":"C","text":"分拣机器人"},{"key":"D","text":"电信智能客服"}],"answer":["C"],"topic":"AI与智能系统","row":60,"explanation":{"analysis":"领域知识问答机器人围绕某个业务范围理解问题，并利用规则或知识库给出回答。淘宝、航空公司和电信的智能客服都有这种典型用途。分拣机器人主要识别物品并执行分类、搬运等物理动作，核心任务不是知识问答，因此选 C。二者可能都使用 AI，但应用目标和输入输出形式不同。","tip":"问答机器人解决“问什么、答什么”，分拣机器人解决“物品放哪里”。","caution":""}},{"id":"single-059","number":59,"type":"single","text":"在与智能客服机器人交流时,人们采用的是(  )。","options":[{"key":"A","text":"关键字"},{"key":"B","text":"自然语言"},{"key":"C","text":"纯语音"},{"key":"D","text":"纯文字"}],"answer":["B"],"topic":"AI与智能系统","row":61,"explanation":{"analysis":"人们通常用日常语言向客服表达需求，例如“我的订单什么时候发货”，这种语言属于自然语言，所以选 B。自然语言可以通过文字或语音输入，因而 C、D 的“纯语音”“纯文字”都过度限定了形式。关键词可以用于简单检索，但真实表达还包含上下文、否定、指代等信息，不能把自然语言交互完全等同于关键词输入。","tip":"自然语言是内容形式，文字和语音是承载它的输入方式。","caution":""}},{"id":"single-060","number":60,"type":"single","text":"\"人工智能中的符号主义\"是(  )。","options":[{"key":"A","text":"数据预处理"},{"key":"B","text":"统计学习方法"},{"key":"C","text":"深度学习方法"},{"key":"D","text":"使用符号和规则表示知识的方法"}],"answer":["D"],"topic":"AI与智能系统","row":62,"explanation":{"analysis":"符号主义使用显式符号表示概念，再通过逻辑关系和规则进行推理，因此选 D，例如用“若满足条件，则采取动作”表达知识。统计学习侧重从数据中估计规律，深度学习通常通过多层神经网络学习表示，数据预处理则是准备数据的步骤。符号方法与数据学习方法可以结合，而不是必须互相排斥。","tip":"符号主义的识别词是知识表示、逻辑、规则与推理。","caution":""}},{"id":"single-061","number":61,"type":"single","text":"(  )要求AI系统应当透明、可解释。","options":[{"key":"A","text":"可解释性"},{"key":"B","text":"黑盒化"},{"key":"C","text":"复杂性"},{"key":"D","text":"自动化"}],"answer":["A"],"topic":"综合知识","row":63,"explanation":{"analysis":"可解释性关注人能否理解系统的行为依据、影响因素或输出原因，因此 A 对应透明、可解释的要求。黑盒化强调内部机制不易理解，方向相反；复杂性描述结构或过程的繁复程度；自动化描述任务执行方式，两者都不保证解释能力。需要注意，给出流畅说明并不等于说明真实反映了模型的决策原因。","tip":"解释应帮助理解真实依据，流畅的理由不一定就是忠实的解释。","caution":""}},{"id":"single-062","number":62,"type":"single","text":"人工智能产品设计和需求定义有了新的趋势和变化,以下选项不属于新趋势或者变化(  )。","options":[{"key":"A","text":"从用户角度考虑投入产出比"},{"key":"B","text":"传感器技术的飞速进步,带来了多元化交互行为"},{"key":"C","text":"产品的需求来源于确定的因果关系"},{"key":"D","text":"智能化产品在数据和隐私方面将更加重视安全性"}],"answer":["C"],"topic":"AI与智能系统","row":64,"explanation":{"analysis":"AI 产品需要面对数据不确定性、模型误差和持续反馈，需求通常来自用户问题与业务价值验证，不能一概说来源于确定的因果关系，故本题选 C。A 强调用户投入产出，B 强调传感器带来的交互变化，D 强调数据与隐私安全，均可构成产品设计的重要趋势。观察到相关性也不能直接当成已证明的因果关系。","tip":"AI 需求要验证用户价值，数据相关性不能自动变成确定因果。","caution":""}},{"id":"single-063","number":63,"type":"single","text":"下列说法中对专用人工智能理解正确的是(  )。","options":[{"key":"A","text":"在某一个特定领域应用的人工智能。"},{"key":"B","text":"不是真正在这次人工智能浪潮中起到影响的主角。"},{"key":"C","text":"充分利用已掌握的技能来解决新问题、达到甚至超过人类智慧的人工智能。"},{"key":"D","text":"是众多科幻作品中颠覆人类社会的人工智能形象。"}],"answer":["A"],"topic":"AI与智能系统","row":65,"explanation":{"analysis":"专用人工智能针对有限任务或特定领域设计，例子包括专门的语音识别、图像分类和围棋系统，因此 A 正确。它可以在某一任务上超过人的表现，却不意味着能把能力无条件迁移到所有领域。C 描述的是更广泛的跨任务能力，D 是科幻形象，B 则忽略专用系统在实际应用中的重要作用。","tip":"某项能力很强，不等于具备跨领域的通用智能。","caution":""}},{"id":"single-064","number":64,"type":"single","text":"人工智能的历史可以追溯到哪个时期(  )。","options":[{"key":"A","text":"20世纪50年代"},{"key":"B","text":"19世纪80年代"},{"key":"C","text":"21世纪90年代"},{"key":"D","text":"18世纪30年代"}],"answer":["A"],"topic":"AI与智能系统","row":66,"explanation":{"analysis":"作为有明确名称的现代学科，人工智能通常以 1956 年达特茅斯会议为重要起点，对应 20 世纪 50 年代，因此选 A。数学逻辑、自动机和计算思想的源流更早，但与本题所问学科发展时期应区分。19 世纪或 18 世纪已有相关思想并不等于当时已经形成现代人工智能研究领域。","tip":"AI 学科常见起点：1956 年达特茅斯会议。","caution":"“历史可以追溯”说法较宽；A 指现代人工智能学科的兴起，相关思想与技术前身早于 20 世纪 50 年代。"}},{"id":"single-065","number":65,"type":"single","text":"不属于当今的人工智能发展方向的是(  )。","options":[{"key":"A","text":"以机器与人结合而成的增强型混合智能系统"},{"key":"B","text":"用机器、人、网络结合成新的群智系统"},{"key":"C","text":"用机器、人、网络和物结合成的更加复杂的智能系统"},{"key":"D","text":"用计算机模拟人工智能"}],"answer":["D"],"topic":"AI与智能系统","row":67,"explanation":{"analysis":"A、B、C 分别强调人机混合、群体协同以及与网络和物理环境结合的智能系统，具有较清楚的研究方向含义。D“用计算机模拟人工智能”是循环且模糊的说法，没有交代模拟对象或技术方向，因此题库将其排除。但这不表示基于计算机的模型、仿真和智能算法已经不属于 AI 研究。","tip":"新方向通常说明新的协同主体或能力，循环定义不能提供有效区分。","caution":"题库答案 D 主要依据措辞不清；若其本意是“用计算机模拟人类智能”，则仍是 AI 的基本研究内容，不能据此排除。"}},{"id":"single-066","number":66,"type":"single","text":"TensorFlow由(  )人工智能团队开发和维护。","options":[{"key":"A","text":"百度"},{"key":"B","text":"阿里"},{"key":"C","text":"谷歌"},{"key":"D","text":"腾讯"}],"answer":["C"],"topic":"AI与智能系统","row":68,"explanation":{"analysis":"TensorFlow 源于 Google 团队开发并开源的机器学习框架，因此在给定公司中选 C。它支持张量计算、自动微分和模型构建，可用于深度学习训练与部署。百度、阿里和腾讯也有各自的 AI 技术生态，但不能据此混淆框架来源。开源之后，维护和贡献还涉及更广泛的社区参与者。","tip":"TensorFlow 对应 Google；开源框架通常还有社区共同贡献。","caution":""}},{"id":"single-067","number":67,"type":"single","text":"人工智能的定义是(  )。","options":[{"key":"A","text":"计算机模拟人类智能的技术"},{"key":"B","text":"机器能够独立思考和学习"},{"key":"C","text":"使机器具备人类的情感和意识"},{"key":"D","text":"利用机器进行科学研究的方法"}],"answer":["A"],"topic":"AI与智能系统","row":69,"explanation":{"analysis":"在给定表述中，A 最接近人工智能的基础定义，即研究和构建能够实现某些人类智能任务的计算机方法与系统。B 的“独立思考”缺少明确技术标准，C 把情感和意识当作必要条件，D 则把范围扩大成任何用机器做科研。现实 AI 可以表现出识别、预测、推理等能力，而无需先证明具有人的意识。","tip":"AI 看可实现的智能任务，不以是否具有情感和意识作为基本门槛。","caution":""}},{"id":"single-068","number":68,"type":"single","text":"以下哪个不是人工智能应用的例子(  )。","options":[{"key":"A","text":"语音助手"},{"key":"B","text":"机器人导游"},{"key":"C","text":"自动驾驶汽车"},{"key":"D","text":"手机游戏"}],"answer":["D"],"topic":"AI与智能系统","row":70,"explanation":{"analysis":"语音助手、机器人导游和自动驾驶汽车都是常见的 AI 应用场景。但手机游戏同样可以用 AI 控制非玩家角色、生成内容、匹配玩家或检测作弊，因此不能笼统说手机游戏不是 AI 应用。只有在强调“手机游戏这个产品类别本身不必依赖 AI”时，才可能理解题库选择 D 的出题意图。","tip":"判断是否使用 AI，要看具体功能实现，不能只按产品类别排除。","caution":"题库答案为 D，但手机游戏完全可以应用人工智能，题干没有限定具体游戏或功能，排除 D 的结论不严谨。"}},{"id":"single-069","number":69,"type":"single","text":"以下哪个不是人工智能的伦理问题(  )。","options":[{"key":"A","text":"隐私保护"},{"key":"B","text":"自主决策"},{"key":"C","text":"就业岗位流失"},{"key":"D","text":"网络安全"}],"answer":["D"],"topic":"职业道德与法规","row":71,"explanation":{"analysis":"隐私保护涉及数据权益，自主决策涉及责任与人类控制，就业变化涉及分配与社会影响，前三项都可能引发伦理问题。网络安全也会影响人的安全、权益及系统可信度，属于 AI 治理的重要议题，不能仅因它具有技术内容就排除其伦理维度。安全问题和伦理问题往往交叉，并非互斥分类。","tip":"技术问题也可能有伦理后果，网络安全与 AI 伦理可以同时相关。","caution":"题库标 D，但“网络安全不是人工智能伦理问题”这一概括不成立；现有选项无法形成严格唯一的否定答案。"}},{"id":"single-070","number":70,"type":"single","text":"人工智能中的\"机器学习\"是指(  )。","options":[{"key":"A","text":"让机器可以像人类一样学习知识"},{"key":"B","text":"通过算法让机器从数据中学习和改进"},{"key":"C","text":"让机器具备自主学习能力"},{"key":"D","text":"通过神经网络让机器学习"}],"answer":["B"],"topic":"AI与智能系统","row":72,"explanation":{"analysis":"机器学习通过算法从数据中建立或改进模型，使其在目标任务上的表现得到改善，因此 B 最准确。A、C 都较抽象，没有说明从数据学习的机制；D 把机器学习限定为神经网络，范围过窄，决策树、线性模型等也属于机器学习。是否学得有效需要通过独立数据和合适指标验证，不能只看训练数据上表现。","tip":"机器学习从数据形成模型，神经网络只是其中一类方法。","caution":""}},{"id":"single-071","number":71,"type":"single","text":"人工智能中的\"机器人\"是指(  )。","options":[{"key":"A","text":"一种可以执行任务的机器设备"},{"key":"B","text":"一种具备智能和意识的机器"},{"key":"C","text":"一种可以进行复杂推理的机器"},{"key":"D","text":"一种可以进行学习和决策的机器"}],"answer":["A"],"topic":"AI与智能系统","row":73,"explanation":{"analysis":"机器人是可执行任务的机器系统，通常结合感知、控制和执行机构，A 是给定选项中最基本的描述。机器人不必具有意识，也不必都能复杂推理或自主学习；工业机械臂可以按预设流程完成任务。具备 AI 的机器人能力可能更灵活，但“机器人”和“强智能、有意识的机器”不能画等号。","tip":"机器人不等于有意识的机器，也不一定依赖机器学习。","caution":"A 的定义较宽，只能视为本题中的近似表述；并非所有能执行任务的机器设备都通常被称作机器人。"}},{"id":"single-072","number":72,"type":"single","text":"人工智能中的\"专家系统\"是指(  )。","options":[{"key":"A","text":"一种可以模拟人类专家知识的系统"},{"key":"B","text":"一种可以进行自主学习的系统"},{"key":"C","text":"一种可以进行复杂推理的系统"},{"key":"D","text":"一种可以进行图像识别的系统"}],"answer":["A"],"topic":"AI与智能系统","row":74,"explanation":{"analysis":"专家系统把某个领域的专家知识表示为知识库，并通过推理机制提供判断或建议，所以 A 最贴切。复杂推理是可能具备的能力，但 C 没有体现专家知识这一核心；自主学习并非传统专家系统的必要条件，图像识别也只是可能涉及的具体任务。经典结构通常包括知识库、推理机和交互或解释部分。","tip":"专家系统的核心是领域知识库加推理机制。","caution":""}},{"id":"single-073","number":73,"type":"single","text":"(  )是汽车人工智能领域的核心应用方向之一。","options":[{"key":"A","text":"整车的智能营销"},{"key":"B","text":"驾驶辅助系统"},{"key":"C","text":"零部件的预测维修"},{"key":"D","text":"数据驱动的产品优化"}],"answer":["B"],"topic":"AI与智能系统","row":75,"explanation":{"analysis":"驾驶辅助系统直接服务于行驶安全和车辆操控，可借助感知与决策技术实现车道保持、碰撞预警等功能，因此 B 是汽车 AI 的典型核心应用。智能营销、预测维修和产品优化也可能应用 AI，但更多面向营销或运营环节。做本题时抓住“汽车核心应用”的出题语境，而不要将其他选项理解为绝对不能用 AI。","tip":"围绕驾驶场景的感知与辅助控制，是汽车 AI 的典型重点。","caution":"题目问“之一”，而 A、C、D 也可属于汽车产业的重要 AI 应用；B 是最典型答案，题干的唯一性有限。"}},{"id":"single-074","number":74,"type":"single","text":"人工智能中的\"深度学习\"是指(  )。","options":[{"key":"A","text":"一种数据库查询语言"},{"key":"B","text":"让机器可以进行深度思考的能力"},{"key":"C","text":"通过模拟人脑神经网络的方式进行学习"},{"key":"D","text":"让机器可以进行复杂问题的推理和决策"}],"answer":["C"],"topic":"AI与智能系统","row":76,"explanation":{"analysis":"深度学习主要利用多层神经网络逐级学习数据表示，C 在选项中最接近这一含义。它不是数据库查询语言，也不等于机器能够像人一样“深度思考”。推理和决策可以是其应用，但不能代替方法定义。人工神经网络受到生物神经系统启发，却并非对人脑结构和工作过程的完整复刻。","tip":"深度指多层表示学习，不是意识层面的“想得深”。","caution":"C 的“模拟人脑”是教材式概括；现代深度学习的精确定义应以多层神经网络及表示学习为核心。"}},{"id":"single-075","number":75,"type":"single","text":"以下哪个不属于人工智能核心技术体系的常见分层(  )。","options":[{"key":"A","text":"通用技术层"},{"key":"B","text":"中间层"},{"key":"C","text":"应用技术层"},{"key":"D","text":"基础技术层"}],"answer":["B"],"topic":"AI与智能系统","row":77,"explanation":{"analysis":"按本题采用的技术体系划分，基础技术层提供底层支撑，通用技术层提供可复用能力，应用技术层面向具体场景，A、C、D 构成这组名称。B“中间层”没有在这套分层中作为独立规范名称出现，因此选 B。架构分层依赖分析目的，不应把题库的一套分法当作所有 AI 系统唯一允许的结构。","tip":"分层题先识别教材采用的命名体系，不把泛称“中间层”自动当成标准层。","caution":"AI 产业或技术体系存在多种分层方式，本题答案只适用于其采用的基础、通用、应用三层口径。"}},{"id":"single-076","number":76,"type":"single","text":"人工智能中的\"自然语言处理\"是指(  )。","options":[{"key":"A","text":"让机器可以理解和处理人类的自然语言"},{"key":"B","text":"让机器能够像人类一样进行语音交流"},{"key":"C","text":"利用机器进行语言学研究的方法"},{"key":"D","text":"让机器能够进行自动翻译"}],"answer":["A"],"topic":"AI与智能系统","row":78,"explanation":{"analysis":"自然语言处理让计算机处理和理解人类语言，也包含生成语言等任务，因此 A 的范围最合适。语音交流还需要语音识别与合成，不能代表所有 NLP；自动翻译只是 NLP 的一个应用；利用机器做语言学研究则更接近一种研究用途。文本分类、实体识别、问答、摘要都可以是 NLP 任务。","tip":"翻译、问答、摘要是 NLP 的应用，NLP 不限于语音交流。","caution":""}},{"id":"single-077","number":77,"type":"single","text":"下列说法中对通用人工智能（AGI）说明错误的是（　）。","options":[{"key":"A","text":"具备跨领域迁移并快速学习新任务的能力"},{"key":"B","text":"已在当前人工智能浪潮中占据主导地位并基本实现"},{"key":"C","text":"具备跨领域迁移并快速学习新任务的能力"},{"key":"D","text":"具备跨领域迁移并快速学习新任务的能力"}],"answer":["B"],"topic":"AI与智能系统","row":79,"explanation":{"analysis":"AGI 通常指能够跨领域迁移知识、学习新任务并解决多类问题的通用能力，A、C、D 的文字都描述了这一目标。B 把“已占主导地位并基本实现”当成既定事实，缺乏统一定义与公认评估依据，因此是题库要排除的说法。某个模型在多项任务上表现优秀，也不足以自动证明所有 AGI 条件已达成。","tip":"跨任务表现强，不等于已获公认地实现通用人工智能。","caution":"原题 A、C、D 完全重复，属于选项质量问题；AGI 的实现标准本身也存在争议，不能靠单一口号判断。"}},{"id":"single-078","number":78,"type":"single","text":"下面关于人工智能说法错误的是(  )。","options":[{"key":"A","text":"人工智能一定程度上能模仿人类的活动"},{"key":"B","text":"人工智能可以全面取代人类活动"},{"key":"C","text":"人工智能的发展将改变人类社会生活"},{"key":"D","text":"人工智能的发展也会产生一些负面的社会影响"}],"answer":["B"],"topic":"AI与智能系统","row":80,"explanation":{"analysis":"AI 可以自动完成或辅助部分活动，但其能力依赖任务、数据、工具和约束，不能由此推导为“全面取代人类活动”，所以 B 错误。A 的“一定程度”承认能力边界；C、D 分别指出生活变化与潜在负面影响，均合理。看到“全面”“所有”等绝对化表述时，要特别检查是否忽略了责任、价值判断和现实环境的复杂性。","tip":"部分任务可以自动化，不代表人类全部活动都能被替代。","caution":""}},{"id":"single-079","number":79,"type":"single","text":"下面不是应用于智能物流领域的机器人是(  )。","options":[{"key":"A","text":"迎宾机器人"},{"key":"B","text":"搬运机器人"},{"key":"C","text":"货架穿梭车"},{"key":"D","text":"分拣机器人"}],"answer":["A"],"topic":"AI与智能系统","row":81,"explanation":{"analysis":"搬运机器人、货架穿梭车和分拣机器人分别对应货物搬移、仓储存取与分类处理，都是智能物流的典型设备。迎宾机器人主要承担接待、导览或简单咨询，因此 A 是给定选项中不属于典型物流场景的答案。虽然同一设备可以扩展用途，分类时应依据题目描述的主要工作任务。","tip":"物流机器人围绕货物流动，迎宾机器人围绕接待服务。","caution":""}},{"id":"single-080","number":80,"type":"single","text":"智慧医疗的发展目前不受哪个因素影响(  )。","options":[{"key":"A","text":"缺少复合型人才"},{"key":"B","text":"用户隐私数据安全问题"},{"key":"C","text":"医学水平不够"},{"key":"D","text":"市场主需求量不足以带动发展"}],"answer":["C"],"topic":"综合知识","row":82,"explanation":{"analysis":"智慧医疗依赖医学知识、临床流程和可靠证据，同时受复合人才、隐私安全、数据及市场条件影响。医学水平不足会影响可用诊疗知识和模型验证，因此不能说 C 对其发展“没有影响”。D 的需求不足是否成立也应由具体地区和产品数据判断。题干没有给出足以排除某一因素的事实条件。","tip":"医疗 AI 的效果依赖医学基础与临床验证，技术发展不能脱离医疗知识。","caution":"题库答案为 C，但医学水平会影响智慧医疗；“不受影响”的绝对判断缺乏依据，D 的市场需求判断同样依赖具体情境。"}},{"id":"single-081","number":81,"type":"single","text":"智能医疗可以在(  )等方面发挥重要作用。","options":[{"key":"A","text":"辅助诊疗、疾病预测、医疗影像辅助诊断、药物开发"},{"key":"B","text":"货物搬运、仓储管理、货物配送"},{"key":"C","text":"人脸识别、指纹解锁、产品检测"},{"key":"D","text":"远程维护、企业管理、个性化定制"}],"answer":["A"],"topic":"AI与智能系统","row":83,"explanation":{"analysis":"辅助诊疗、疾病风险预测、医疗影像分析和药物研发都直接服务于医疗健康任务，因此选 A。B 对应物流，C 混合生物识别与工业检测，D 更偏企业运营或一般制造服务。智能医疗的定位通常是辅助专业人员、提升分析效率和质量，具体能力仍要以相应临床验证和适用范围为依据。","tip":"看应用目标是否直接服务诊疗、健康风险评估或药物研发。","caution":""}},{"id":"single-082","number":82,"type":"single","text":"通过交通信息采集系统采集道路中的车辆流量、行车速度等信息,经智能系统分析后调整各路口红绿灯时长属于人工智能在(  )领域的应用。","options":[{"key":"A","text":"智能物流"},{"key":"B","text":"智能安防"},{"key":"C","text":"智能控制"},{"key":"D","text":"智能交通"}],"answer":["D"],"topic":"数据采集与处理","row":84,"explanation":{"analysis":"系统采集车流和速度，再调整交通信号灯，是以道路通行效率和交通管理为目标的智能交通应用，所以选 D。C“智能控制”可以描述其中采用的技术方法，但题目问应用领域，应选更具体的交通场景。物流关注货物流转，安防关注安全监测等任务，与本题直接目标不如智能交通一致。","tip":"领域看解决什么场景的问题，方法看怎样实现；调红绿灯的领域是交通。","caution":""}},{"id":"single-083","number":83,"type":"single","text":"以下哪种技术不属于人工智能(  )。","options":[{"key":"A","text":"机器学习"},{"key":"B","text":"自然语言处理"},{"key":"C","text":"数据挖掘"},{"key":"D","text":"云计算"}],"answer":["D"],"topic":"AI与智能系统","row":85,"explanation":{"analysis":"机器学习、自然语言处理和与学习方法交叉的数据挖掘，都直接涉及从数据提取规律或执行智能任务。云计算主要提供计算、存储及网络资源的交付方式，因此在此分类下选 D。AI 可以运行在云上，云平台也可以提供 AI 服务，但支撑技术和 AI 方法不是同一概念，云计算本身不必包含智能决策。","tip":"云计算提供运行资源，AI 方法决定如何学习、感知或推理。","caution":""}},{"id":"single-084","number":84,"type":"single","text":"人工智能的未来发展方向包括以下哪些(  )。","options":[{"key":"A","text":"强化学习"},{"key":"B","text":"量子计算"},{"key":"C","text":"多模态学习"},{"key":"D","text":"所有选项都正确"}],"answer":["D"],"topic":"AI与智能系统","row":86,"explanation":{"analysis":"强化学习研究通过交互学习策略，多模态学习研究联合利用文本、图像、声音等信息，均是 AI 研究方向。量子计算与机器学习的交叉研究也可能探索新的计算方法，因此按题目宽泛的未来技术口径选 D。这里不应理解为量子计算整体都属于 AI，或量子方法已经在所有 AI 任务上提供实际优势。","tip":"强化学习、多模态属于直接方向；量子计算与 AI 的关系主要是交叉研究。","caution":"量子计算本身是独立的计算技术领域；只有按量子机器学习等交叉方向理解 B，D 才较合理。"}},{"id":"single-085","number":85,"type":"single","text":"以下哪个不是人工智能的子领域(  )。","options":[{"key":"A","text":"机器学习"},{"key":"B","text":"自动化"},{"key":"C","text":"计算机视觉"},{"key":"D","text":"自然语言处理"}],"answer":["B"],"topic":"AI与智能系统","row":87,"explanation":{"analysis":"机器学习、计算机视觉和自然语言处理是常见 AI 子领域。自动化是更广泛的工程目标与技术范畴，定时器、固定规则控制等自动化系统不必使用 AI，因此题库选 B。AI 能提升自动化的适应性，但“能自动运行”不足以说明存在学习、感知或推理能力。两者有交集，不能完全等同。","tip":"自动执行不一定智能，自动化与人工智能有交集但范围不同。","caution":""}},{"id":"single-086","number":86,"type":"single","text":"下列(  )是不属于专用人工智能和通用人工智能之间的区别。","options":[{"key":"A","text":"知识技能的迁移能力"},{"key":"B","text":"跨领域推理能力"},{"key":"C","text":"实现特定领域的应用"},{"key":"D","text":"意识的认识与掌握"}],"answer":["C"],"topic":"AI与智能系统","row":88,"explanation":{"analysis":"专用 AI 与通用 AI 都可以用于具体领域，因此 C“实现特定领域的应用”本身不是区分两者的标准。更关键的差异在于能否把知识迁移到新任务、进行跨领域推理和适应。A、B 符合这种区分思路。D 涉及意识，而意识并不是通用智能公认且可直接检验的必要定义条件，应避免将两者捆绑。","tip":"区分专用与通用，主要看迁移和适应范围，不能只看是否能做某个任务。","caution":"题库选 C 有其逻辑，但 D“意识的认识与掌握”也不是公认的专用 AI 与 AGI 区分标准，题目存在概念争议。"}},{"id":"single-087","number":87,"type":"single","text":"(  )是零售行业内应用最为广泛、效果最为显著的人工智能技术,线上线下的零售巨头都在运用此技术帮助进行交叉销售、向上销售、提高复购率。","options":[{"key":"A","text":"智能店铺管理"},{"key":"B","text":"无人超市"},{"key":"C","text":"智能交易策略"},{"key":"D","text":"精准营销与个性化推荐系统"}],"answer":["D"],"topic":"AI与智能系统","row":89,"explanation":{"analysis":"个性化推荐根据用户兴趣、行为和商品关系选择相关内容，可用于推荐互补商品、升级产品和再次购买，恰好对应交叉销售、向上销售与复购，因此选 D。店铺管理、无人超市和交易策略各有应用，但与题干列出的营销目标不如推荐系统直接。评价推荐效果还应考虑用户体验和长期价值，而非只看短期点击率。","tip":"交叉销售、向上销售和复购，优先联想到精准营销与推荐系统。","caution":"“最为广泛、效果最为显著”是概括性表述，具体行业效果仍需要数据验证。"}},{"id":"single-088","number":88,"type":"single","text":"淘宝美工——鲁班这一案例属于人工智能产业应用的哪个场景(  )。","options":[{"key":"A","text":"人工智能在汽车行业中的应用"},{"key":"B","text":"人工智能在消费品和电商领域行业的应用"},{"key":"C","text":"人工智能在金融行业的应用"},{"key":"D","text":"人工智能在个人生活娱乐学习方面的应用"}],"answer":["B"],"topic":"AI与智能系统","row":90,"explanation":{"analysis":"“鲁班”案例围绕电商营销图片等视觉设计工作，通过自动化或智能设计提高商品推广素材的制作效率，其服务对象与使用场景都属于消费品和电子商务，因此选 B。即使底层涉及图像处理或内容生成，也不会改变业务应用领域。汽车、金融以及个人娱乐学习都不符合题干的淘宝美工场景。","tip":"判断产业应用先看服务的业务：电商素材设计属于电商场景。","caution":""}},{"id":"single-089","number":89,"type":"single","text":"掀起人工智能发展的第三个高潮是由(  )驱动的。","options":[{"key":"A","text":"计算驱动"},{"key":"B","text":"数据驱动"},{"key":"C","text":"知识驱动"},{"key":"D","text":"常识驱动"}],"answer":["B"],"topic":"AI与智能系统","row":91,"explanation":{"analysis":"题库把第三次 AI 发展高潮概括为数据驱动，强调大规模数据与机器学习、深度学习相结合带来的进步，因此选 B。知识驱动更容易联想到显式规则和专家系统，常识驱动并非本题采用的阶段标签。不过现代 AI 的发展也离不开算力、算法和工程进展，不能理解为只有数据一个因素发挥作用。","tip":"第三次浪潮常记为数据驱动，但实际进步来自数据、算力与算法共同作用。","caution":"AI 浪潮的分期和命名并非完全统一，B 是该题的教材概括，不能据此否定算力的关键作用。"}},{"id":"single-090","number":90,"type":"single","text":"只专注于完成某个特别设定的任务的人工智能属于(  )。","options":[{"key":"A","text":"超人工智能"},{"key":"B","text":"弱人工智能"},{"key":"C","text":"强人工智能"},{"key":"D","text":"认知智能"}],"answer":["B"],"topic":"AI与智能系统","row":92,"explanation":{"analysis":"只完成某个预先限定任务的系统，属于通常所说的弱人工智能或狭义人工智能，所以选 B。它可以在特定任务上非常强，却未必能跨领域迁移；强人工智能通常指更广泛的通用能力或相关理论目标，超人工智能则描述远超人类的设想。认知智能是能力分类用语，不直接表示任务范围有限。","tip":"“弱”主要指范围有限，不等于在该任务上表现弱。","caution":""}},{"id":"single-091","number":91,"type":"single","text":"(  )系统包括了学习、语言、认知、推理、创造和计划,目标是使人工智能在非监督学习情况下处理前所未见的细节,并同时与人类开展交互式学习。","options":[{"key":"A","text":"超人工智能"},{"key":"B","text":"弱人工智能"},{"key":"C","text":"强人工智能"},{"key":"D","text":"认知智能"}],"answer":["C"],"topic":"AI与智能系统","row":93,"explanation":{"analysis":"题干把学习、语言、推理、创造与计划等广泛能力放在同一系统中，并强调处理未见情境，意在描述强人工智能，故题库选 C。弱 AI 通常限定任务，超 AI 强调超过人类的能力水平；认知智能也涉及理解和推理，但与这里整体通用能力的教材语境不同。具体是否通用仍需可检验的能力标准。","tip":"跨多类任务、适应新情境，指向通用或强智能的目标。","caution":"强 AI、AGI、认知智能的术语用法存在重叠；“非监督学习”不是实现强 AI 的必要定义条件，本题措辞不宜当成严格定义。"}},{"id":"single-092","number":92,"type":"single","text":"人工智能的发展会对社会产生哪些影响(  )。","options":[{"key":"A","text":"提高生产效率和经济发展"},{"key":"B","text":"减少人类工作岗位"},{"key":"C","text":"改变人类生活方式和社会结构"},{"key":"D","text":"所有选项都正确"}],"answer":["D"],"topic":"AI与智能系统","row":94,"explanation":{"analysis":"AI 可能提高生产效率、改变工作方式，并使部分岗位或任务需求减少，同时影响生活和组织结构，因此按“可能产生哪些影响”的理解选 D。B 需要区分部分岗位减少与全社会就业总量必然下降：技术也可能创造新岗位，净效应取决于产业、制度和时间尺度。不能把潜在影响误读成在所有情况下都必然发生。","tip":"AI 会重塑任务与岗位；局部替代不等于总就业必然减少。","caution":"B 的“减少人类工作岗位”应理解为部分岗位可能减少，不能作为整体就业净减少的无条件预测。"}},{"id":"single-093","number":93,"type":"single","text":"人工智能中的\"强化学习\"是指(  )。","options":[{"key":"A","text":"让机器具备自主决策能力"},{"key":"B","text":"通过奖惩机制让机器学习最优策略"},{"key":"C","text":"利用神经网络进行学习和决策"},{"key":"D","text":"让机器能够进行复杂问题的推理和决策"}],"answer":["B"],"topic":"AI与智能系统","row":95,"explanation":{"analysis":"强化学习让智能体与环境交互，依据奖励信号调整策略，以提高长期累积回报，因此 B 最贴切。自主决策是可能产生的能力，不是专属学习机制；神经网络可用于强化学习，也可用于其他学习范式，故 C 过窄。奖励不一定即时出现，某个动作的价值还可能取决于它对后续结果的影响。","tip":"强化学习的核心是交互、奖励和长期回报最大化。","caution":""}},{"id":"single-094","number":94,"type":"single","text":"将原始数据进行集成、变换、维度规约、数值规约是以下哪个步骤的任务(  )。","options":[{"key":"A","text":"频繁模式挖掘"},{"key":"B","text":"分类和预测"},{"key":"C","text":"数据预处理"},{"key":"D","text":"数据流挖掘"}],"answer":["C"],"topic":"综合知识","row":96,"explanation":{"analysis":"集成把多源数据汇合，变换调整表示或尺度，维度规约减少特征，数值规约用较紧凑表示保留信息，这些都属于正式分析建模前的数据准备，因此选 C。频繁模式挖掘、分类预测和数据流挖掘是后续分析任务或处理范式。预处理会影响数据质量和模型结果，不能把它当作可随意省略的格式整理。","tip":"先整合、变换和缩减数据，再进入挖掘或建模。","caution":""}},{"id":"single-095","number":95,"type":"single","text":"以下(  )是关系型数据库。","options":[{"key":"A","text":"MySQL"},{"key":"B","text":"MongoDB"},{"key":"C","text":"Cassandra"},{"key":"D","text":"HBase"}],"answer":["A"],"topic":"计算机与办公基础","row":97,"explanation":{"analysis":"MySQL 主要采用关系模型，以表、行、列组织数据，并支持 SQL 查询与关系操作，因此选 A。MongoDB 主要是文档数据库，Cassandra 和 HBase 通常归为宽列或列族型 NoSQL 数据库。是否支持某种查询语言并不是唯一分类依据，关键在于主要数据模型及其组织、查询和一致性设计。","tip":"MySQL 是关系型；MongoDB 是文档型；Cassandra、HBase 常归为宽列型。","caution":""}},{"id":"single-096","number":96,"type":"single","text":"NoSQL数据库中,MongoDB属于(  )。","options":[{"key":"A","text":"键值存储"},{"key":"B","text":"列族存储"},{"key":"C","text":"文档存储"},{"key":"D","text":"搜索引擎"}],"answer":["C"],"topic":"计算机与办公基础","row":98,"explanation":{"analysis":"MongoDB 以文档组织数据，文档可包含字段、嵌套对象和数组，常以类似 JSON 的结构理解，实际采用 BSON 表示，因此选 C。键值存储侧重按键定位值，列族存储有另一套组织方式，搜索引擎主要围绕索引与检索。MongoDB 虽有索引、检索等能力，其主要数据库分类仍是文档存储。","tip":"看到 MongoDB，先记文档、字段、嵌套结构与 BSON。","caution":""}},{"id":"single-097","number":97,"type":"single","text":"商务数据的来源不包括(  )。","options":[{"key":"A","text":"个人数据"},{"key":"B","text":"电子商务平台"},{"key":"C","text":"社交平台"},{"key":"D","text":"O2O数据"}],"answer":["A"],"topic":"综合知识","row":99,"explanation":{"analysis":"电商平台、社交平台和 O2O 业务可以产生订单、互动和到店等商务数据，但经合法收集的个人购买记录、客户反馈等同样能成为商务分析来源。因此不能一概把“个人数据”排除。A 更像按数据主体划分的类别，B、C、D 更像平台或业务来源，选项本身不在同一分类维度。","tip":"商务数据来源要看业务用途与合法来源，个人相关数据并非天然不属于商务数据。","caution":"题库答案 A 缺乏充分依据；个人数据可依法用于商务分析，本题混用了数据类别与来源渠道。"}},{"id":"single-098","number":98,"type":"single","text":"数据的获取途径没有(  )。","options":[{"key":"A","text":"从别人数据库窃取"},{"key":"B","text":"产品自有数据"},{"key":"C","text":"调查问卷"},{"key":"D","text":"互联网数据导入"}],"answer":["A"],"topic":"综合知识","row":100,"explanation":{"analysis":"题库选择 A，是把问题理解为合法、合规的数据获取途径。未经授权窃取别人的数据库不具有正当性；产品自有数据、调查问卷和互联网导入则可能成为合法来源，但仍需满足权限、告知及使用范围等要求。尤其“互联网上可见”不意味着可以任意采集和使用，也不能因用于训练就免除相应责任。","tip":"先判断获取权限与使用依据，能拿到数据不等于有权使用。","caution":"题干“获取途径没有”表述不准确，窃取在事实上可能取得数据；A 应理解为“不属于合法获取途径”。"}},{"id":"single-099","number":99,"type":"single","text":"下列属于无序数据类型的是( )。","options":[{"key":"A","text":"set"},{"key":"B","text":"list"},{"key":"C","text":"tuple"},{"key":"D","text":"str"}],"answer":["D"],"topic":"综合知识","row":101,"explanation":{"analysis":"Python 的 set 是无序集合，不承诺元素的序列位置，也不能按位置索引取值，因此应选 A。list、tuple、str 都是有序序列，可以用索引访问元素；例如字符串 s='abc' 中 s[0] 为 'a'。字符串不可变描述的是不能原地修改内容，与是否有序是两个不同维度，不能混淆。","tip":"set 无序；list、tuple、str 都有序；不可变不等于无序。","caution":"题库标 D（str），与 Python 类型语义冲突。按题干“无序数据类型”，正确选项应为 A（set）；页面保留原题库答案用于对照。"}},{"id":"single-100","number":100,"type":"single","text":"数据表是由行(记录)和列(字段)构成,因此也称(  )。","options":[{"key":"A","text":"数据"},{"key":"B","text":"二维表"},{"key":"C","text":"表格"},{"key":"D","text":"大数据"}],"answer":["B"],"topic":"综合知识","row":102,"explanation":{"analysis":"数据表以行和列两个方向组织信息，行对应一条记录，列对应一种字段，因此也称二维表，选 B。A“数据”和 D“大数据”描述对象或规模，不能表示这种结构；C“表格”虽是常用叫法，但没有直接体现题干强调的行列两个维度。在关系数据库中，表中的行也不应被当作天然有固定展示顺序。","tip":"二维表两维：行是记录，列是字段。","caution":""}},{"id":"single-101","number":101,"type":"single","text":"在大数据处理中,数据清洗主要处理(  )。","options":[{"key":"A","text":"增加数据量"},{"key":"B","text":"提高数据精度"},{"key":"C","text":"删除所有异常值"},{"key":"D","text":"缺失值、重复值、异常值等"}],"answer":["D"],"topic":"数据采集与处理","row":103,"explanation":{"analysis":"数据清洗针对缺失、重复、格式不一致及异常等质量问题进行检测和处理，因此 D 最完整。增加数据量不是清洗的主要目的，提高精度可能是结果之一；C 的“删除所有异常值”尤其错误，异常可能是真实且重要的业务信号。处理前应结合规则和来源核查，再决定纠正、插补、去重、保留或删除，并记录变更。","tip":"异常先核查再处理，数据清洗不等于把异常全部删掉。","caution":""}},{"id":"single-102","number":102,"type":"single","text":"Hadoop生态中,HDFS主要用于(  )。","options":[{"key":"A","text":"分布式文件存储"},{"key":"B","text":"实时数据处理"},{"key":"C","text":"数据库管理"},{"key":"D","text":"网络通信"}],"answer":["A"],"topic":"综合知识","row":104,"explanation":{"analysis":"HDFS 是 Hadoop 的分布式文件系统，把大文件分块存储在多个节点，并通过冗余等机制提高可靠性，因此选 A。实时处理需要相应计算框架，数据库管理和网络通信也不是 HDFS 的主要定位。它更适合大规模文件的分布式存取，而不是把每个小文件或任意低延迟随机更新场景都作为最佳用途。","tip":"HDFS 负责分布式存文件，计算任务由其他组件承担。","caution":""}},{"id":"single-103","number":103,"type":"single","text":"MetaGPT框架的特点是(  )。","options":[{"key":"A","text":"仅用于数据处理"},{"key":"B","text":"仅用于网络通信"},{"key":"C","text":"支持多Agent 角色扮演和协作"},{"key":"D","text":"仅用于图形界面"}],"answer":["C"],"topic":"综合知识","row":105,"explanation":{"analysis":"MetaGPT 的典型特点是把多个智能体赋予不同角色，通过工作流程和消息协作完成较复杂任务，因此选 C。它不是只做数据处理、只做网络通信或只做界面绘制的单一用途工具。角色划分有助于组织产出，但仍需明确输入输出、检查结果并处理错误，不能因为有多个 Agent 就假设结果天然可靠。","tip":"MetaGPT 记住多角色、流程化协作与产出交接。","caution":""}},{"id":"single-104","number":104,"type":"single","text":"在数据处理中,(  )是指去除个人标识符的过程。","options":[{"key":"A","text":"脱敏"},{"key":"B","text":"加密"},{"key":"C","text":"压缩"},{"key":"D","text":"备份"}],"answer":["A"],"topic":"综合知识","row":106,"explanation":{"analysis":"去除或替换姓名、证件号等直接标识符，属于常见的数据脱敏处理，因此选 A。加密通常让持有密钥者可恢复明文，压缩为了减少存储量，备份为了保留副本，目标不同。但删掉姓名并不必然实现匿名化，其他字段组合仍可能重新识别人，脱敏效果必须结合可关联信息及使用场景评估。","tip":"脱敏减少识别暴露，加密控制明文读取；去标识不等于不可重新识别。","caution":""}},{"id":"single-105","number":105,"type":"single","text":"在采集训练数据时,未经用户同意采集个人隐私数据属于(  )。","options":[{"key":"A","text":"违法行为"},{"key":"B","text":"合规操作"},{"key":"C","text":"行业惯例"},{"key":"D","text":"数据优化"}],"answer":["A"],"topic":"数据采集与处理","row":107,"explanation":{"analysis":"若没有用户同意，也不存在其他适用的合法处理依据，就擅自采集个人隐私数据用于训练，会侵犯相关权益，题库据此选择 A。所谓行业惯例或数据优化目标不能自动赋予采集权限。实际处理应明确目的、范围及法律依据，并满足与数据敏感程度相应的要求；涉及敏感信息时尤其不能只以便利为由采集。","tip":"采集个人信息先确认合法依据，训练用途不是豁免理由。","caution":"“未经同意一律违法”过于绝对，适用法律可能规定同意之外的合法处理依据；A 应在缺乏其他合法依据的前提下理解。"}},{"id":"single-106","number":106,"type":"single","text":"在数据结构中,栈(Stack)的特点是(  )。","options":[{"key":"A","text":"先进先出(FIFO)"},{"key":"B","text":"后进先出(LIFO)"},{"key":"C","text":"随机访问"},{"key":"D","text":"树形结构"}],"answer":["B"],"topic":"综合知识","row":108,"explanation":{"analysis":"栈限制在同一端进行压入与弹出，后压入的元素会先被取出，因此是 B 后进先出。例如先压入 A 再压入 B，第一次弹出的是 B。先进先出对应队列；随机访问常用于描述数组等结构的访问方式；树形结构则是另一种组织关系。函数调用栈和撤销操作都常用栈的思想理解。","tip":"栈像叠盘子：最后放上去的，最先拿下来。","caution":""}},{"id":"single-107","number":107,"type":"single","text":"(  )是缓存(Cache)。","options":[{"key":"A","text":"用于临时存储频繁访问的数据以提高性能"},{"key":"B","text":"用于永久存储数据"},{"key":"C","text":"用于压缩数据"},{"key":"D","text":"用于加密数据"}],"answer":["A"],"topic":"综合知识","row":109,"explanation":{"analysis":"缓存把近期或经常使用的数据临时保存在更便于访问的位置，减少重复计算或访问较慢资源的成本，因此选 A。它不是以永久保存为主要目标，也不等同于压缩或加密。使用缓存还要考虑过期和一致性，否则可能读到旧数据；缓存命中率与访问模式匹配时，性能收益通常更明显。","tip":"缓存用空间换取访问效率，但要管理失效与数据新旧。","caution":""}},{"id":"single-108","number":108,"type":"single","text":"在数据库中,(  )是事务(Transaction)。","options":[{"key":"A","text":"一组必须全部成功或全部失败的数据库操作"},{"key":"B","text":"单个SQL语句"},{"key":"C","text":"数据备份"},{"key":"D","text":"日志记录"}],"answer":["A"],"topic":"计算机与办公基础","row":110,"explanation":{"analysis":"事务把一组数据库操作作为逻辑工作单元，其中原子性要求整体成功提交或失败回滚，所以 A 最能说明概念。事务可以只包含一条语句，也可以包含多条，B 不能构成完整定义；备份和日志用于恢复或记录，并不等于事务本身。常见 ACID 特性还包括一致性、隔离性和持久性。","tip":"事务先记“要么一起成功，要么一起撤回”，再联系 ACID。","caution":""}},{"id":"single-109","number":109,"type":"single","text":"云计算与大数据的核心特征是(  )。","options":[{"key":"A","text":"按需付费、自助服务和弹性伸缩"},{"key":"B","text":"只需一次性投资"},{"key":"C","text":"需要专业人员24小时维护"},{"key":"D","text":"不支持多租户架构"}],"answer":["A"],"topic":"综合知识","row":111,"explanation":{"analysis":"按需获取资源、自助使用、弹性伸缩及按用量计费，是云计算的典型服务特征，所以给定选项中选 A。一次性投资不是所有云服务的前提，多租户架构也并非不受支持；是否需要专人维护取决于服务模式。大数据则更关注数据体量、速度、类型及处理挑战，不能把云服务特征直接当成大数据定义。","tip":"云计算强调资源如何供给，大数据强调数据规模与处理挑战。","caution":"题干将“云计算与大数据”合并得过宽，A 主要描述云计算，不能作为两者共同且完整的核心特征定义。"}},{"id":"single-110","number":110,"type":"single","text":"数据质量检测的完整性是指(  )。","options":[{"key":"A","text":"数据信息是否存在缺失的状况"},{"key":"B","text":"数据是否遵循了统一的规范"},{"key":"C","text":"数据记录的信息是否存在异常或错误"},{"key":"D","text":"数据从产生到可以查看的时间间隔"}],"answer":["A"],"topic":"综合知识","row":112,"explanation":{"analysis":"完整性检查所需记录或字段是否齐全、有没有遗漏，因此选 A。例如订单表缺少关键订单号或必要日期，会影响数据完整性。B 关注规范统一，偏一致性或规范性；C 关注信息是否正确，偏准确性；D 描述从产生到可用的时间差，偏及时性。完整不代表正确，所有字段填满也可能含有错误值。","tip":"完整性问“有没有缺”，准确性问“填得对不对”。","caution":""}},{"id":"single-111","number":111,"type":"single","text":"数据质量是保证数据应用的基础,它的评估标准四个方面不包括(  )。","options":[{"key":"A","text":"完整性"},{"key":"B","text":"一致性"},{"key":"C","text":"准确性"},{"key":"D","text":"冗余性"}],"answer":["D"],"topic":"综合知识","row":113,"explanation":{"analysis":"本题采用的常见质量维度包括完整性、一致性、准确性及及时性，因而所列选项中 D 冗余性不在这组正向评价名称内。重复和冗余仍然需要治理，可能通过唯一性、重复率等指标体现；只是它不是本题所指定四维的名称。数据质量框架随业务用途变化，不能据此认为冗余对质量毫无影响。","tip":"辨别“是否属于这套维度名称”与“是否影响数据质量”是两件事。","caution":"数据质量没有唯一的四维标准，唯一性或重复程度也可作为质量指标；D 只按本题采用的维度口径排除。"}},{"id":"single-112","number":112,"type":"single","text":"以下选项中,关于数据一致性说法错误的是(  )。","options":[{"key":"A","text":"数据质量的一致性主要体现在数据记录的规范和数据是否符合逻辑"},{"key":"B","text":"一致性的规范指的是数据存在它特定的格式"},{"key":"C","text":"一致性的逻辑指的是多项数据间存在着固定的逻辑关系"},{"key":"D","text":"数据的一致性对于数据分析本身要求并不高"}],"answer":["D"],"topic":"综合知识","row":114,"explanation":{"analysis":"数据分析需要同一字段含义、单位、格式及相关数据逻辑保持可比，一致性不足可能造成错误分组、重复计数或相互矛盾的结论，因此 D 错误。例如同一性别类别同时出现多种未经映射的编码，会使统计被拆散。A、B、C 从规范和逻辑关系解释一致性，虽较概括，却比“要求不高”的说法合理。","tip":"一致性让数据能够一起比较和计算，格式或逻辑冲突会直接影响结论。","caution":""}},{"id":"single-113","number":113,"type":"single","text":"池化(Pooling)操作的主要作用是(  )。","options":[{"key":"A","text":"强化数据"},{"key":"B","text":"增加计算量"},{"key":"C","text":"增加GPU"},{"key":"D","text":"降维"}],"answer":["D"],"topic":"综合知识","row":115,"explanation":{"analysis":"典型池化在局部窗口内取最大值、均值等汇总结果，并常配合步长缩小特征图的空间尺寸，因此 D“降维”最贴近其常见作用。它有助于降低后续计算量并保留局部代表信息，而不是增加 GPU 或刻意增加计算量。更准确地说，这里通常是空间下采样，不一定等同于减少通道数或任意意义上的维度数量。","tip":"池化常把一片局部信息压成一个代表值，实现空间下采样。","caution":""}},{"id":"single-114","number":114,"type":"single","text":"在数据表中,表的\"列\"称为(  )。","options":[{"key":"A","text":"数据"},{"key":"B","text":"字段"},{"key":"C","text":"记录"},{"key":"D","text":"大数据"}],"answer":["B"],"topic":"综合知识","row":116,"explanation":{"analysis":"数据表的每一列表示某一种属性或信息类别，称为字段，因此选 B。例如学生表中的姓名、学号和年龄分别是字段，每个字段通常有约定的数据类型。记录对应一整行，包含某个对象在各字段上的取值；“数据”和“大数据”并不专门表示列。记忆时将列与属性、行与实例一一对应。","tip":"列是字段，说明一种属性；行是记录，描述一个实例。","caution":""}},{"id":"single-115","number":115,"type":"single","text":"在数据表中,表的\"行\"称为(  )。","options":[{"key":"A","text":"数据"},{"key":"B","text":"字段"},{"key":"C","text":"记录"},{"key":"D","text":"大数据"}],"answer":["C"],"topic":"综合知识","row":117,"explanation":{"analysis":"一行通常集合了某个对象或一次事件在各字段上的值，称为一条记录，所以选 C。例如一笔订单的一行可以含订单号、金额和时间。字段是列的名称与属性维度，不是整行；数据是统称，大数据则描述规模及处理特征。行和列共同构成二维表，但承担的含义不同。","tip":"一笔订单、一名学生等对象的一整行，就是一条记录。","caution":""}},{"id":"single-116","number":116,"type":"single","text":"下面对数据标注描述哪一个是正确的(  )。","options":[{"key":"A","text":"所有的数据标注都可以使用脚本语言自动标注"},{"key":"B","text":"所有数据标注都可以完全通过算法自动实现，无需人工干预"},{"key":"C","text":"OCR手写转录完全可以通过识别工具实现自动转录"},{"key":"D","text":"数据标注是个重复性很强的工作"}],"answer":["D"],"topic":"数据标注与质检","row":118,"explanation":{"analysis":"标注员往往按同一规范反复处理大量样本，因此 D 的“重复性很强”符合许多标注工作的特点。脚本和模型能辅助预标注，却不能保证覆盖所有模糊、异常或领域特殊情况。A、B 的“所有”“完全”“无需人工”以及 C 对手写 OCR 的绝对保证，都忽略识别错误、规则理解和质量复核的需要。","tip":"自动预标注能提效，但绝不意味着所有样本都无需人工判断。","caution":""}},{"id":"single-117","number":117,"type":"single","text":"常见的图像标注类型中的(  )最常用的应用场景是自动驾驶领域,用来识别车道及边界。","options":[{"key":"A","text":"点标注"},{"key":"B","text":"线标注"},{"key":"C","text":"分类标注"},{"key":"D","text":"像素标注"}],"answer":["B"],"topic":"数据标注与质检","row":119,"explanation":{"analysis":"车道线和道路边界具有连续的线状结构，用折线或曲线标出其走向通常较合适，因此选 B 线标注。点标注适合关键位置，分类标注只给整体类别，不能直接表示边界路径。像素级标注也可以用于车道分割，但在题干强调线条形态的常见标注方法中，线标注最直接。","tip":"目标是细长连续轨迹时，优先想到线或折线标注。","caution":"车道识别也可采用像素分割等方案；“最常用”取决于任务定义与数据集，本题按线状边界标注理解。"}},{"id":"single-118","number":118,"type":"single","text":"以下选项中,关于视频与图像数据标注的差异说法错误的是(  )。","options":[{"key":"A","text":"视频的数据结构比图像更复杂"},{"key":"B","text":"视频的洞察力更强"},{"key":"C","text":"视频还可以利用先前帧中的信息来识别可能被部分遮挡的对象"},{"key":"D","text":"与视频标注相比,图像标注的难度更高"}],"answer":["D"],"topic":"数据采集与处理","row":120,"explanation":{"analysis":"视频包含连续帧，标注不仅要识别每帧内容，还常需保持目标身份、轨迹和事件边界的时间一致性，通常比孤立图像多一层复杂度。因此 D 无条件断言图像标注更难不合理。前后帧信息确实可以帮助判断遮挡对象，视频也提供运动与变化信息；但某个具体任务的难度仍取决于内容、规范和工具。","tip":"视频多了时间维度：既要标对单帧，还要保持跨帧一致。","caution":"“洞察力更强”和整体难度比较都较笼统；D 是题库的排除项，但并非所有视频任务都必然比所有图像任务困难。"}},{"id":"single-119","number":119,"type":"single","text":"以下选项中,关于视频标注特点说法错误的是(  )。","options":[{"key":"A","text":"视频数据标注是对视频剪辑进行标注的过程"},{"key":"B","text":"标注后的视频数据将作为训练数据集用于训练深度学习模型"},{"key":"C","text":"人工视频标注的准确度一定高于自动化标注工具"},{"key":"D","text":"视频标注可采用人工标注和自动化工具结合的方式进行"}],"answer":["C"],"topic":"数据标注与质检","row":121,"explanation":{"analysis":"人工标注会受到疲劳、理解差异和疏漏影响，自动工具在某些标准化任务上也可能表现很好，因此 C 的“准确度一定高于”不成立。视频可由人工、算法或两者协同标注，质量要通过抽检、复核和一致性指标验证。标注结果可用于训练模型，但采用人工本身并不构成准确性保证。","tip":"标注质量靠验证，不能仅凭“人工”或“自动”判断优劣。","caution":""}},{"id":"single-120","number":120,"type":"single","text":"根据所标注概念在视频结构上的不同层次,可将视频标注划分为三种,其中不包括(  )。","options":[{"key":"A","text":"视频类型层标注"},{"key":"B","text":"关键帧图像层标注"},{"key":"C","text":"图像中的物体层标注"},{"key":"D","text":"视频索引层标注"}],"answer":["D"],"topic":"数据标注与质检","row":122,"explanation":{"analysis":"按照题目采用的概念层次，视频类型层描述整段内容，关键帧图像层描述代表性画面，物体层描述画面中的对象，因此 A、B、C 对应由整体到局部的三个层次。视频索引主要帮助定位、检索或管理视频，不是这套内容概念层次中的一层，所以选 D。不要把存取组织方式与内容标注层级混为一谈。","tip":"内容层级从视频整体到帧，再到帧内对象；索引负责定位检索。","caution":"视频标注还存在事件、动作、轨迹等其他划分方式，本题三层结构并非唯一通用分类。"}},{"id":"single-121","number":121,"type":"single","text":"关于图像标注中的3D包围框说法错误的是(  )。","options":[{"key":"A","text":"可以显示目标的深度"},{"key":"B","text":"没有解决物体方向的问题"},{"key":"C","text":"通过将二维图像平面上的边界框向后投影到三维长方体来实现的"},{"key":"D","text":"它允许系统区分三维空间中的体积和位置等特征"}],"answer":["B"],"topic":"数据标注与质检","row":123,"explanation":{"analysis":"三维包围框通常描述目标在三维空间中的位置、长宽高及朝向，因此说它“没有解决物体方向的问题”的 B 不符合本题意图。A、D 对深度、体积和位置的描述与三维表示相符。需要注意，单个二维框一般不能唯一确定三维框，还需深度、标定、多视角或模型等信息，不能把二维框简单后投影当成充分条件。","tip":"3D 框常含位置、尺寸和朝向，2D 框本身不提供唯一三维解。","caution":"题库选 B；但 C 对三维框生成过程也过度简化，且部分轴对齐三维框不单独编码目标朝向，需按具体标注规范理解。"}},{"id":"single-122","number":122,"type":"single","text":"数据整合建立转换工程是在(  )中最先进行操作的。","options":[{"key":"A","text":"DataPipeline"},{"key":"B","text":"Kettle"},{"key":"C","text":"Oracle Goldengate"},{"key":"D","text":"Informatica"}],"answer":["B"],"topic":"综合知识","row":124,"explanation":{"analysis":"Kettle 的图形化环境中常通过创建转换来组织数据输入、清洗变换和输出步骤，因此题库选择 B。转换关注数据流处理，作业则常用于编排多个转换或其他任务。Oracle GoldenGate 更常与数据复制、变更同步联系；其他集成平台也可以设计转换流程，因此本题应理解为特定工具操作术语的识别。","tip":"Kettle 中，转换组织数据处理流，作业组织任务执行流。","caution":"题干未交代所用软件，“建立转换工程”并非只有 Kettle 能做；B 依赖其工具教学语境。"}},{"id":"single-123","number":123,"type":"single","text":"在数据整合中,以下(  )技术主要用于数据转换。","options":[{"key":"A","text":"EAI"},{"key":"B","text":"ECL"},{"key":"C","text":"ETL"},{"key":"D","text":"EIL"}],"answer":["C"],"topic":"综合知识","row":125,"explanation":{"analysis":"ETL 分别表示抽取、转换和装载，其中 Transform 明确承担清洗、映射、格式调整、计算等转换工作，因此选 C。EAI 更侧重应用系统间集成的整体方法，其他缩写也不是本题所指的标准流程。ETL 不只完成转换，还负责把数据从来源移动到目标系统；题目是在几个技术名称中找最直接关联项。","tip":"ETL＝Extract、Transform、Load，中间的 T 就是转换。","caution":""}},{"id":"single-124","number":124,"type":"single","text":"以下不属于数据整合解决方案的是(  )。","options":[{"key":"A","text":"数据爬虫"},{"key":"B","text":"ETL工具"},{"key":"C","text":"数据仓库"},{"key":"D","text":"数据虚拟化"}],"answer":["A"],"topic":"综合知识","row":126,"explanation":{"analysis":"数据爬虫主要从网页等来源采集内容，本身通常不构成完整的多源数据整合方案，因此题库选 A。ETL 工具负责抽取、转换、装载，数据仓库提供汇集后的分析存储，数据虚拟化可在逻辑层统一访问来源。爬虫采到的数据仍需要结构化、对齐与质量处理，才能真正用于整合分析。","tip":"采到数据只是第一步，多源对齐和统一访问才体现整合。","caution":"爬虫可以是数据整合流水线的一部分；A 只能理解为不属于此处列举的完整整合方案，不能说它与整合无关。"}},{"id":"single-125","number":125,"type":"single","text":"以下选项不属于数据整合过程的是(  )。","options":[{"key":"A","text":"抽取"},{"key":"B","text":"转换"},{"key":"C","text":"清洗"},{"key":"D","text":"装载"}],"answer":["C"],"topic":"综合知识","row":127,"explanation":{"analysis":"若只问 ETL 三个字母对应的名称，答案是抽取、转换、装载，清洗不是独立的第四个字母阶段。但实际数据整合通常需要处理重复、缺失、格式冲突等问题，清洗常发生在转换阶段，因此清洗当然可以属于数据整合过程。不能把“未单列为 ETL 名称”误推为“不参与整合”。","tip":"清洗常包含在 ETL 的转换阶段，未单列不等于不属于流程。","caution":"题库标 C，但题干问广义数据整合过程时，清洗确实可能是其中一部分；只有把题目改为“不是 ETL 三阶段名称”才有明确依据。"}},{"id":"single-126","number":126,"type":"single","text":"数据埋点是一种良好的(  )部署数据采集方式。","options":[{"key":"A","text":"公有化"},{"key":"B","text":"公开化"},{"key":"C","text":"私有化"},{"key":"D","text":"自助式"}],"answer":["C"],"topic":"数据采集与处理","row":128,"explanation":{"analysis":"数据埋点是在应用或页面的指定事件中记录行为数据，例如按钮点击和流程完成。企业可以将埋点数据发送到自建系统，也可以使用第三方分析服务，因此埋点并不天然等于私有化部署。题库选择 C 可能想强调采集自有产品数据的方案，但“采集方式”和“部署模式”应分别讨论。","tip":"埋点描述在哪里触发采集，私有化描述系统部署在哪里。","caution":"题库答案 C 的前提不足；埋点支持私有化或第三方托管部署，不能由采集技术直接推出部署模式。"}},{"id":"single-127","number":127,"type":"single","text":"以下选项不属于产生多种数据采集方式与处理方式的原因的是(  )。","options":[{"key":"A","text":"数据来源丰富"},{"key":"B","text":"数据质量要求高"},{"key":"C","text":"存储与分析的数据量大"},{"key":"D","text":"数据具有保密性"}],"answer":["D"],"topic":"数据采集与处理","row":129,"explanation":{"analysis":"来源丰富、质量要求和数据规模都会推动不同采集与处理方案的出现，但保密性同样会影响方案选择。例如敏感数据可能要求本地处理、限制外传、降低采集范围或采用受控访问。因而 D 不是可以普遍排除的因素。选择数据方法时应综合来源、质量、规模、时效、权限和安全需求，而非只看技术效率。","tip":"数据保密要求会直接影响能采什么、在哪里处理以及谁能访问。","caution":"题库标 D，但保密性确实可能促成不同采集和处理方式，题干缺乏把 D 排除的合理限定。"}},{"id":"single-128","number":128,"type":"single","text":"在对数据进行标准化时,需要考虑数据特征,因为不同特征之间往往具有不同的(  ),会造成数值间分布差异较大。","options":[{"key":"A","text":"分布"},{"key":"B","text":"量纲"},{"key":"C","text":"单位"},{"key":"D","text":"标准"}],"answer":["B"],"topic":"数据采集与处理","row":130,"explanation":{"analysis":"不同特征可能衡量不同物理或业务量，例如身高与收入，其量纲和数值尺度不同，直接计算距离或优化时可能使大数值特征占主导，因此题库选 B。标准化常用减均值再除标准差等办法调整尺度。单位与量纲相关但不等同：米和厘米属于同一量纲的不同单位，也会产生数值差异。","tip":"量纲看测量的是什么，单位看用什么尺度计量；标准化帮助统一数值尺度。","caution":"C“单位”不同也可能造成尺度差异；本题以常见教材术语“量纲”作为答案，标准化也不保证消除所有分布差异。"}},{"id":"single-129","number":129,"type":"single","text":"数据预处理方法不包括(  )。","options":[{"key":"A","text":"数据清洗"},{"key":"B","text":"数据合并"},{"key":"C","text":"数据标注"},{"key":"D","text":"数据变换"}],"answer":["C"],"topic":"数据采集与处理","row":131,"explanation":{"analysis":"传统数据预处理常包括清洗、整合或合并、变换和规约，A、B、D 分别对应这些准备工作。数据标注给样本赋予任务标签，通常作为监督学习数据制作的独立环节，因此本题选 C。不过在广义机器学习工程中，标注也可能被纳入数据准备流程，分类取决于“预处理”采用的范围。","tip":"狭义预处理整理已有数据，标注主要补充任务所需的标签。","caution":"C 是狭义流程分类下的答案；广义数据准备可能包含标注，不能把两者绝对割裂。"}},{"id":"single-130","number":130,"type":"single","text":"数据清洗是指对可能存在异常的数据进行(  )和处理。","options":[{"key":"A","text":"标注"},{"key":"B","text":"检测"},{"key":"C","text":"标准化"},{"key":"D","text":"离散化"}],"answer":["B"],"topic":"数据采集与处理","row":132,"explanation":{"analysis":"处理异常之前，需要先识别哪些数据缺失、重复、格式错误或违反业务逻辑，这一步是检测，因此选 B。标准化和离散化是特定的数据变换方法，不能概括所有质量问题的发现；标注则是给样本附加标签。清洗不仅要发现问题，还应选用合适规则修正或保留，并使处理结果能够追溯到原始数据。","tip":"数据清洗先检测问题，再决定怎样处理。","caution":""}},{"id":"single-131","number":131,"type":"single","text":"缺失值的常见处理方法不包括(  )。","options":[{"key":"A","text":"删除"},{"key":"B","text":"数据插补"},{"key":"C","text":"数据变换"},{"key":"D","text":"数据标注"}],"answer":["D"],"topic":"数据采集与处理","row":133,"explanation":{"analysis":"缺失值常见策略包括删除适当记录、依据统计或模型插补，并结合缺失机制评估影响。一般的任务标签标注不能替代缺失值估计，因此题库选择 D。数据变换本身也不必然补上空值，例如简单取对数无法恢复缺失内容；另外增加“是否缺失”的指示变量，是可用的建模策略，但不等于完成数值插补。","tip":"插补是填估计值，缺失指示是保留“缺过”这一信息，二者作用不同。","caution":"题库选 D，但 C“数据变换”若无具体方法，也不属于直接处理缺失的典型策略；若“标注”指缺失指示，则亦可有辅助作用。"}},{"id":"single-132","number":132,"type":"single","text":"异常值是指样本中的个别值,其数值明显偏离所属样本的(  )。","options":[{"key":"A","text":"观测值"},{"key":"B","text":"测量值"},{"key":"C","text":"重复值"},{"key":"D","text":"更新值"}],"answer":["A"],"topic":"数据采集与处理","row":134,"explanation":{"analysis":"异常值通常指明显偏离大多数观测或预期模式的个别数据，因此 A 最接近题意。它可能源于录入或测量错误，也可能是真实的极端事件；重复值只表示重复出现，更新值只表示发生更新，不能定义异常。判断偏离程度应结合数据分布和业务约束，而不是看到数值大就直接删除。","tip":"异常是偏离其他观测或合理模式，不一定就是错误数据。","caution":"题干表述略不完整，更准确应为“明显偏离其他观测值或整体模式”；测量值也属于观测的一种，A 是更一般的术语。"}},{"id":"single-133","number":133,"type":"single","text":"属于数据清洗的步骤(  )。","options":[{"key":"A","text":"删除原始数据中无关数据"},{"key":"B","text":"删除原始数据中重复数据"},{"key":"C","text":"平滑噪声数据"},{"key":"D","text":"以上都是"}],"answer":["D"],"topic":"数据采集与处理","row":135,"explanation":{"analysis":"清洗可以按任务规则去除无关数据、识别并处理重复记录，以及对确认的噪声进行适当平滑，因此 A、B、C 都可能属于清洗，选 D。这里的“删除”必须有依据，不能把多次真实发生的业务事件误当重复，也不能把重要极端信号当噪声消掉。保留原始数据和处理记录有助于复查与纠错。","tip":"去无关、去重复、处理噪声都可清洗，但每一步都应有业务依据。","caution":""}},{"id":"single-134","number":134,"type":"single","text":"当进行数据预处理时有些数据值是被遗漏的,那么应该采用(  )方法。","options":[{"key":"A","text":"删除"},{"key":"B","text":"数据插补"},{"key":"C","text":"数据变换"},{"key":"D","text":"数据标注"}],"answer":["B"],"topic":"数据采集与处理","row":136,"explanation":{"analysis":"当任务需要为缺失位置补入合理估计值时，使用数据插补，因此题库选 B。可以根据字段性质采用中位数、分组统计或模型方法，但必须避免把验证集信息泄露进训练流程。删除也是某些缺失情形的处理办法，不能说所有遗漏都必须插补；普通变换和标注则不会自动恢复缺失数值。","tip":"需要补值时选插补，具体方法要看缺失机制和业务含义。","caution":"题干未限定必须保留记录，删除在部分情形也合理；B 是补全缺失的典型方法，并非处理所有缺失的唯一选择。"}},{"id":"single-135","number":135,"type":"single","text":"图像标注的本质是(  )到语言表示化的过程。","options":[{"key":"A","text":"色彩"},{"key":"B","text":"空间"},{"key":"C","text":"视觉"},{"key":"D","text":"文件"}],"answer":["C"],"topic":"数据标注与质检","row":137,"explanation":{"analysis":"图像标注把人从画面中识别出的对象、属性、边界或关系，转化为类别名称及结构化标记，因此选 C 视觉。色彩和空间只是可能涉及的特征，文件是承载形式，都不能概括图像的整体内容。标注结果可以是标签、坐标、多边形或掩码，不一定是一段自然语言，但都试图把视觉语义明确表示出来。","tip":"图像标注把视觉中的含义变成可读取的标签与结构。","caution":"题干“语言表示化”是宽泛说法；很多标注输出是坐标或像素掩码，并非自然语言文本。"}},{"id":"single-136","number":136,"type":"single","text":"以下(  )属于图像标注方法。","options":[{"key":"A","text":"标框标注"},{"key":"B","text":"多媒体标注"},{"key":"C","text":"空间坐标标注"},{"key":"D","text":"时间戳标注"}],"answer":["A"],"topic":"数据标注与质检","row":138,"explanation":{"analysis":"标框标注用矩形等边界框定位图像中的目标，是目标检测数据制作的典型方法，因此 A 明确成立。多媒体标注只是宽泛类别，时间戳更常用于标记时序位置。空间坐标也可以用于图像关键点或目标位置标注，因此不能在完全没有限定的情况下断言 C 不属于图像标注方法。","tip":"目标检测常用框，关键点任务常用坐标，按任务目标选择表示。","caution":"题库选 A，但 C“空间坐标标注”也可能是图像标注形式，选项边界不清；A 是最典型而非严格唯一的答案。"}},{"id":"single-137","number":137,"type":"single","text":"数据采集器不能采集以下哪种数据(  )。","options":[{"key":"A","text":"图片"},{"key":"B","text":"文字"},{"key":"C","text":"网站信息"},{"key":"D","text":"专利"}],"answer":["D"],"topic":"数据采集与处理","row":139,"explanation":{"analysis":"数据采集器能否获取内容，取决于内容的载体、访问权限、接口和工具能力。专利公开文本、书目信息及图片可以通过合法数据库或接口采集，所以不能因为属于“专利”就认定技术上不能采集。图片、文字和网站信息也是不同载体或内容描述，与专利这种知识产权或文献类别并不处于同一维度。","tip":"可采集性看权限、载体和接口，不能只按内容是否涉及专利来判断。","caution":"题库标 D，但公开专利信息可以依法采集；“专利不能采集”是错误的绝对化结论，使用时仍需遵守访问与权利要求。"}},{"id":"single-138","number":138,"type":"single","text":"下列关于合格数据标注员应该具备的素质中,描述错误的是(  )。","options":[{"key":"A","text":"持续的学习力是标注工作的基础"},{"key":"B","text":"有耐心才能坚持在标注行业"},{"key":"C","text":"具备一定的管理能力"},{"key":"D","text":"较强专注力可提高个人工作效率"}],"answer":["C"],"topic":"数据标注与质检","row":140,"explanation":{"analysis":"标注工作需要持续学习规范、保持耐心和专注，以处理大量样本并减少遗漏，A、B、D 都对应一线工作的直接要求。题库把 C 排除，可能意在区分普通标注员与承担人员或项目管理职责的岗位。管理能力可以有帮助，只是不一定是所有标注员的必要门槛，不能说具备管理能力本身是错误素质。","tip":"一线标注首先看规范理解、专注与耐心；管理职责依岗位而定。","caution":"题目问“描述错误”，但 C 只是非普遍必需，并非错误或不应具备，题库把必要性与有益性混淆。"}},{"id":"single-139","number":139,"type":"single","text":"标注公司的岗位角色包括(  )。","options":[{"key":"A","text":"数据标注员"},{"key":"B","text":"质检员"},{"key":"C","text":"项目负责人"},{"key":"D","text":"以上都是"}],"answer":["D"],"topic":"数据标注与质检","row":141,"explanation":{"analysis":"数据标注员执行样本标注，质检员核对结果是否符合规范，项目负责人协调进度、人员和质量要求，三种角色都可能存在于标注公司，因此选 D。实际团队中角色可能分设，也可能由同一人兼任，但功能上应明确执行、复核和管理的责任。清晰分工有助于及时发现问题并形成可追溯的处理链路。","tip":"标注执行、质量复核、项目协调，是三类常见职责。","caution":""}},{"id":"single-140","number":140,"type":"single","text":"下列关于数据标注员对数据进行标注的描述,错误的是(  )。","options":[{"key":"A","text":"需要参照数据标注规则"},{"key":"B","text":"遇到数据标注规则模糊的问题需要及时询问"},{"key":"C","text":"按照自己的想法猜测标注"},{"key":"D","text":"数据标注员需要总结经验并及时汇报遇到的问题"}],"answer":["C"],"topic":"数据标注与质检","row":142,"explanation":{"analysis":"标注需要依据统一规范，遇到未覆盖或模糊情形应询问、升级和记录，而不是按个人猜想各自决定，所以 C 错误。A 确保标准一致，B 促进澄清边界，D 帮助发现并完善规则。若每位标注员用自己的理解临时补规则，同类样本会出现相互冲突的标签，进而影响训练与评估质量。","tip":"模糊样本先求证、留痕，不能把个人猜测变成团队规则。","caution":""}},{"id":"single-141","number":141,"type":"single","text":"中级数据标注员应该具备的职业技能包括(  )。\n①具备较高的职业道德和一定的从业经验\n②具备较高的业务能力和责任心\n③具备业务开发能力\n④具备简单质检能力\n⑤具备团队管理能力","options":[{"key":"A","text":"①②③⑤"},{"key":"B","text":"①③④⑤"},{"key":"C","text":"①②③④⑤"},{"key":"D","text":"①②④⑤"}],"answer":["D"],"topic":"职业道德与法规","row":143,"explanation":{"analysis":"题库要求中级标注员具备职业素养与经验、业务能力与责任心、简单质检以及一定团队管理能力，即①②④⑤，对应 D。③业务开发通常涉及开拓业务或客户，和直接执行、检查标注工作的技能重点不同，因此排除。其余组合要么加入③，要么遗漏必要项；实际任职要求仍应按相应岗位标准确定。","tip":"本题中级角色强调会做、会检、能协同，不把业务开发列为必备项。","caution":"不同组织和职业标准对中级岗位的管理职责可能不同，题目给出的组合不宜作为所有标注岗位的统一要求。"}},{"id":"single-142","number":142,"type":"single","text":"数据标注规则的特点包括(  )。\n①数据标注规则需要一致\n②数据标注规则需要不断完善\n③需求方优先规则\n④质检优先规则\n⑤数据标注规则不能改变","options":[{"key":"A","text":"①②③④"},{"key":"B","text":"②③④⑤"},{"key":"C","text":"①③④⑤"},{"key":"D","text":"①②④⑤"}],"answer":["A"],"topic":"数据标注与质检","row":144,"explanation":{"analysis":"标注规则应在同一版本和适用范围内保持一致，同时能根据新问题经确认后完善，所以①②可以同时成立，⑤“不能改变”错误。题库也纳入需求方和质检要求，因此组合为①②③④，选 A。实际更新要审批、说明版本及生效范围，必要时回溯重标；优先级必须来自已确认规范，不能任由一方临时口头改判。","tip":"规则可以完善，但要版本一致、变更受控，不能各自随意修改。","caution":"③④的“优先”应按项目约定解释，需求意见和质检意见冲突时需复核或仲裁，不能同时无条件优先。"}},{"id":"single-143","number":143,"type":"single","text":"以下选项对于数据采集渠道的描述是不正确的(  )。","options":[{"key":"A","text":"直接购买"},{"key":"B","text":"共享行业数据"},{"key":"C","text":"网络数据采集"},{"key":"D","text":"公司私有数据"}],"answer":["D"],"topic":"数据采集与处理","row":145,"explanation":{"analysis":"购买、行业共享、网络采集是常见外部获取途径，但企业自有系统产生的数据同样是重要内部来源，例如订单、设备日志和客服记录。因此公司私有数据不应被排除在广义采集渠道之外。题库选 D 可能是把前三项当作获取动作、最后一项当作数据来源类别，二者混用使题目的单选依据不足。","tip":"采集既有外部来源，也有经授权使用的企业内部数据。","caution":"题库答案 D 只有在限定“外部获取方式”时才较可解释；按现有广义题干，公司私有数据是有效的数据来源。"}},{"id":"single-144","number":144,"type":"single","text":"下面哪个数是float类型(  )。","options":[{"key":"A","text":"10"},{"key":"B","text":"True"},{"key":"C","text":"1+2j"},{"key":"D","text":"3.14"}],"answer":["D"],"topic":"综合知识","row":146,"explanation":{"analysis":"在 Python 中，3.14 是浮点数字面量，类型为 float，因此选 D。10 是 int，True 是 bool，1+2j 产生 complex 复数。浮点数用有限二进制精度表示，并非所有十进制小数都能精确存储；在金额等需要精确十进制运算的场景，应按需求选择相应表示方式，而不是认为带小数点就一定精确。","tip":"整数 int、真假 bool、带 j 的复数 complex、3.14 属于 float。","caution":""}},{"id":"single-145","number":145,"type":"single","text":"Python中用于科学计算的基础库是(  )。","options":[{"key":"A","text":"NumPy"},{"key":"B","text":"Requests"},{"key":"C","text":"Flask"},{"key":"D","text":"Django"}],"answer":["A"],"topic":"Python与数据分析","row":147,"explanation":{"analysis":"NumPy 提供高效多维数组、向量化运算和大量数值计算功能，是 Python 科学计算生态的基础，因此选 A。Requests 主要用于发送 HTTP 请求，Flask 和 Django 是 Web 开发框架。它们都可以出现在数据系统中，但承担的职责不同；Pandas 等数据工具也经常与 NumPy 的数组能力配合使用。","tip":"NumPy 管数值数组，Requests 管 HTTP，Flask/Django 管 Web 应用。","caution":""}},{"id":"single-146","number":146,"type":"single","text":"在Python中,以下(  )关键字用于定义函数。","options":[{"key":"A","text":"def"},{"key":"B","text":"function"},{"key":"C","text":"func"},{"key":"D","text":"fn"}],"answer":["A"],"topic":"Python与数据分析","row":148,"explanation":{"analysis":"Python 使用 def 定义常规函数，例如 def add(a, b): 后跟缩进函数体，并可用 return 返回结果，所以选 A。function、func 和 fn 不是 Python 用于这种定义的关键字。注意函数名后要有参数列表和冒号，函数体靠缩进确定范围；定义函数本身通常不会立即执行其中的主体代码，调用时才会执行。","tip":"Python 常规函数定义：def、参数括号、冒号、缩进函数体。","caution":""}},{"id":"single-147","number":147,"type":"single","text":"Python中,列表(list)和元组(tuple)的主要区别是(  )。","options":[{"key":"A","text":"长度不同"},{"key":"B","text":"列表可修改,元组不可修改"},{"key":"C","text":"性能差异"},{"key":"D","text":"存储位置不同"}],"answer":["B"],"topic":"Python与数据分析","row":149,"explanation":{"analysis":"列表可以增删元素或重新给某个位置赋值，元组创建后不能替换、增加或删除其直接元素，所以选 B。二者都能包含多个对象，长度并没有固定的彼此差别。元组不可变指它保存的元素引用不能改；若元组内部引用了一个列表，该列表自身仍可修改，因此不要把元组不可变误解为内部一切对象都冻结。","tip":"列表可改，元组的直接元素不可改；元组引用的可变对象仍可能变化。","caution":""}},{"id":"single-148","number":148,"type":"single","text":"在Python中,以下(  )方法用于获取列表的长度。","options":[{"key":"A","text":"list.size()"},{"key":"B","text":"len(list)"},{"key":"C","text":"list.length()"},{"key":"D","text":"list.count()"}],"answer":["B"],"topic":"Python与数据分析","row":150,"explanation":{"analysis":"获取列表元素个数用内置函数 len，例如 items=[2,4,6] 时 len(items) 为 3，因此 B 正确。Python 列表没有 size() 或 length() 方法；count(x) 统计的是某个值 x 出现的次数，而且需要参数，不是获取总长度。题中 list 应理解为某个列表变量，实际写代码时宜用 items 等名称，避免遮蔽内置类型名。","tip":"len 求总元素数，count(x) 求指定值出现几次。","caution":""}},{"id":"single-149","number":149,"type":"single","text":"关于Python的列表,以下选项中描述错误的是(  )。","options":[{"key":"A","text":"Python列表的长度不可变"},{"key":"B","text":"Python列表是一个可以修改数据项的序列类型"},{"key":"C","text":"Python列表用中括号[]表示"},{"key":"D","text":"Python列表是包含0个或者多个对象引用的有序序列"}],"answer":["A"],"topic":"Python与数据分析","row":151,"explanation":{"analysis":"Python 列表是可变长度的有序序列，可用 append、extend、insert 增加元素，也可通过 pop、remove 或切片操作删除，因此 A 错误。B 说明元素可修改，C 说明常用字面量表示法，D 说明列表保存对象引用且可为空，都正确。列表的有序指有位置和索引，不代表其中的元素已经按数值大小排好序。","tip":"列表有序、可变、长度可调整；有序不等于已排序。","caution":""}},{"id":"single-150","number":150,"type":"single","text":"关于Python的字典类型,以下选项中描述错误的是(  )。","options":[{"key":"A","text":"用{}标识,以key:value的形式存储数据"},{"key":"B","text":"字典当中的元素是通过键(key)来存取的,而不是通过索引去取值"},{"key":"C","text":"字典的元素是键值对,键(key)必须使用不可变类型"},{"key":"D","text":"同一个字典中,键(key)不是唯一的"}],"answer":["D"],"topic":"Python与数据分析","row":152,"explanation":{"analysis":"字典通过唯一的键映射到值，向同一个键再次赋值会更新对应值，不会保留两个相同的键，因此 D 错误。字典常用大括号和 key:value 形式构造，通过键访问元素。键的严格要求是可哈希：字符串、整数及由可哈希元素构成的元组常可用，而列表不可用；“不可变类型”只是基础教学中的近似记忆。","tip":"字典键唯一，重复赋值覆盖旧值；键真正的技术要求是可哈希。","caution":"C 的准确要求应是可哈希，且作为键使用时哈希值应稳定、相等关系与哈希一致。某些可变的自定义对象也可作键，所以“必须使用不可变类型”过于绝对；题库仍按 D 判分。"}},{"id":"single-151","number":151,"type":"single","text":"关于Python的字典类型,以下选项中描述正确的是(  )。","options":[{"key":"A","text":"通过def函数创建字典"},{"key":"B","text":"键值对之间以分号分隔"},{"key":"C","text":"如果通过get(key)函数获取值:key不存在返回None"},{"key":"D","text":"如果通过dict['key']获取值:key不存在不会报错"}],"answer":["C"],"topic":"Python与数据分析","row":153,"explanation":{"analysis":"dict.get(key) 在键不存在且未指定默认值时返回 None，因此选 C；若写成 get(key, default)，则返回指定默认值。字典用花括号或 dict() 创建，键值对之间用逗号分隔。dict['key'] 遇到不存在的键会抛出 KeyError，def 用于定义函数。","tip":"get 可给默认值，下标取不存在的键会报 KeyError。","caution":""}},{"id":"single-152","number":152,"type":"single","text":"关于Python的元组类型,以下选项中描述错误的是(  )。","options":[{"key":"A","text":"元组中元素不可以是不同类型"},{"key":"B","text":"元组一旦创建就不能被修改"},{"key":"C","text":"Python中元组采用逗号和圆括号(可选)来表示"},{"key":"D","text":"一个元组可以作为另一个元组的元素,可以采用多级索引获取信息"}],"answer":["A"],"topic":"Python与数据分析","row":154,"explanation":{"analysis":"元组可以同时保存整数、字符串、列表等不同类型的对象，故 A 的限制不存在。元组支持嵌套和多级索引，通常以逗号分隔元素，圆括号用于分组。所谓不可变，是不能替换、增删元组自身的元素；若元素是列表，该列表内部仍可修改。","tip":"元组限制元素位置的修改，不限制元素类型。","caution":"B 的“不能被修改”指元组本身；元组内引用的可变对象仍可改变。"}},{"id":"single-153","number":153,"type":"single","text":"关于Python的元组类型,以下选项中描述正确的是(  )。","options":[{"key":"A","text":"不可以索引取值"},{"key":"B","text":"可以切片操作"},{"key":"C","text":"元组是可变序列"},{"key":"D","text":"使用中括号包裹元素"}],"answer":["B"],"topic":"Python与数据分析","row":155,"explanation":{"analysis":"元组属于不可变序列，既能用索引读取单个元素，也能用切片取得一段元素，因此 B 正确。切片产生结果，不会原地修改原元组。中括号通常创建列表；元组以逗号构成，常配合圆括号，单元素元组还要保留尾随逗号。","tip":"不可变不等于不可读取：元组支持索引和切片。","caution":""}},{"id":"single-154","number":154,"type":"single","text":"Python中的变量var如果包含字符串的内容,下面哪种数据类型不可能创建var(  )。","options":[{"key":"A","text":"list"},{"key":"B","text":"string"},{"key":"C","text":"char"},{"key":"D","text":"dict"}],"answer":["C"],"topic":"Python与数据分析","row":156,"explanation":{"analysis":"Python 没有独立的内置 char 字符类型，单个字符也用长度为 1 的 str 表示，所以选 C。列表可将字符串作为元素，字典可把字符串作为键或值，字符串本身当然也能保存文本。选项 string 表达字符串类型的意思，实际内置类型名为 str。","tip":"Python 中一个字符也是 str，没有内置 char 类型。","caution":"选项 B 的 string 不是 Python 内置字符串类型的正式名称，正式名称为 str。"}},{"id":"single-155","number":155,"type":"single","text":"被导入(import)的 Python 模块首次执行后，会自动生成扩展名为( )的字节码文件","options":[{"key":"A","text":".pyf"},{"key":"B","text":".pyb"},{"key":"C","text":".py"},{"key":"D","text":".pyc"}],"answer":["D"],"topic":"Python与数据分析","row":157,"explanation":{"analysis":"CPython 导入源代码模块时通常会将编译后的字节码缓存为 .pyc 文件，放在 __pycache__ 目录，后续导入可复用以减少编译开销。.py 是源代码扩展名；.pyf、.pyb 不是这里的字节码缓存格式。缓存保存的是字节码，不是通用机器码。","tip":"源代码是 .py，CPython 字节码缓存是 .pyc。","caution":"自动生成并非必然：禁用字节码写入、无写权限等情况下可以不生成 .pyc。"}},{"id":"single-156","number":156,"type":"single","text":"关于python列表,下列选项中,描述错误的选项是(  )。","options":[{"key":"A","text":"列表中的元素之间用逗号分隔"},{"key":"B","text":"列表中的元素可以是列表类型"},{"key":"C","text":"列表中可以包含数字类型的元素"},{"key":"D","text":"列表中的元素类型必须相同"}],"answer":["D"],"topic":"Python与数据分析","row":158,"explanation":{"analysis":"Python 列表可保存任意类型的对象引用，例如 [1, 'a', [2, 3]] 同时包含整数、字符串和嵌套列表，因此 D 错误。列表字面量用中括号包裹、逗号分隔元素，数字也可成为元素。同类型是某些数组结构的要求，不是 Python 列表的要求。","tip":"list 可以混合类型，也可以嵌套 list。","caution":""}},{"id":"single-157","number":157,"type":"single","text":"python中,已知ls=[12,34.5,True,'test',3+5j],则下列选项中,输出结果为\"['test']\"的选项是(  )。","options":[{"key":"A","text":"ls[3]"},{"key":"B","text":"ls[4]"},{"key":"C","text":"ls[3:4]"},{"key":"D","text":"ls[4:5]"}],"answer":["C"],"topic":"Python与数据分析","row":159,"explanation":{"analysis":"列表索引从 0 开始，'test' 位于索引 3。ls[3:4] 按左闭右开的切片规则取索引 3 的元素，结果仍是列表 ['test']，所以选 C。ls[3] 仅返回字符串 'test'；ls[4] 返回复数，ls[4:5] 返回包含该复数的列表。","tip":"索引取元素，切片取同类序列；右端下标不包含。","caution":""}},{"id":"single-158","number":158,"type":"single","text":"Python脚本的扩展名是(  )。","options":[{"key":"A","text":".python"},{"key":"B","text":".py"},{"key":"C","text":".pt"},{"key":"D","text":".pg"}],"answer":["B"],"topic":"Python与数据分析","row":160,"explanation":{"analysis":"Python 源代码脚本通常使用 .py 扩展名，解释器可通过 python 文件名.py 运行，因此选 B。.pt 常见于某些机器学习框架保存模型的文件约定；.python 和 .pg 不是 Python 源脚本的通常扩展名。扩展名用于识别文件用途，不决定内容本身。","tip":"Python 源脚本的标准扩展名是 .py。","caution":""}},{"id":"single-159","number":159,"type":"single","text":"以下不合法的python变量名是(  )。","options":[{"key":"A","text":"Python2"},{"key":"B","text":"N.X"},{"key":"C","text":"sum"},{"key":"D","text":"Hello_World"}],"answer":["B"],"topic":"Python与数据分析","row":161,"explanation":{"analysis":"N.X 含有点号，Python 会将其理解为访问对象 N 的属性 X，不能作为一个简单变量名，所以 B 不合法。Python2 和 Hello_World 符合标识符规则。sum 也是合法名称，但它会遮蔽内置求和函数，实际编程时应尽量避免这样命名。","tip":"点号用于属性访问；合法变量名也应避免遮蔽内置函数。","caution":""}},{"id":"single-160","number":160,"type":"single","text":"关于python类说法错误的是(  )。","options":[{"key":"A","text":"类的实例方法必须创建对象后才可以调用"},{"key":"B","text":"类的实例方法必须创建对象前才可以调用"},{"key":"C","text":"类的类方法可以用对象和类名来调用"},{"key":"D","text":"类的静态属性可以用类名和对象来调用"}],"answer":["B"],"topic":"Python与数据分析","row":162,"explanation":{"analysis":"实例方法通常通过实例调用，并用 self 接收该实例，不存在“必须在创建对象前调用”的要求，因此 B 错误。类方法绑定类，可用类名或实例访问；类属性也可通过二者读取。实例属性则通常在对象上维护，不能与类属性的访问方式混淆。","tip":"实例方法围绕实例，类方法围绕类，类属性可经类名访问。","caution":"A 是入门式简化：也能通过类访问普通方法并显式传入 self；“静态属性”通常应称类属性。"}},{"id":"single-161","number":161,"type":"single","text":"一个字符串str=\"Hello Python\",则str[1:8]是(  )。","options":[{"key":"A","text":"Hello Py"},{"key":"B","text":"ello Py"},{"key":"C","text":"ello Pyt"},{"key":"D","text":"Hello P"}],"answer":["B"],"topic":"Python与数据分析","row":163,"explanation":{"analysis":"'Hello Python' 的索引 1 是 e，索引 7 是 y，切片 [1:8] 包含索引 1 至 7，不包含索引 8 的 t，所以结果是 'ello Py'。空格也占一个字符位置，位于索引 5；忽略空格或误将右端点包含在内都会算错。","tip":"字符串切片左闭右开，空格同样占据索引。","caution":""}},{"id":"single-162","number":162,"type":"single","text":"关于Python变量,说法正确的是(  )。","options":[{"key":"A","text":"变量无需赋值便可以直接使用"},{"key":"B","text":"变量无需声明数据类型便可以直接赋值"},{"key":"C","text":"Python变量只有数字型和字符串型2种"},{"key":"D","text":"Python变量与其他所有高级程序设计语言变量的数据类型没有区别"}],"answer":["B"],"topic":"Python与数据分析","row":164,"explanation":{"analysis":"Python 采用动态类型机制，执行 x = 3 时即可建立名称与对象的绑定，无须先声明 x 的数据类型，因此 B 正确。名称未绑定就读取通常会引发 NameError。Python 还有列表、字典、集合、元组等许多类型，不能说只有数字和字符串。","tip":"变量名先赋值再使用，类型属于其绑定的对象。","caution":""}},{"id":"single-163","number":163,"type":"single","text":"下面关于Python语言的说法,错误的是(  )。","options":[{"key":"A","text":"Python源代码区分大小写"},{"key":"B","text":"Python语言是解释性的,可以在>>>提示符下交互输入Python语句"},{"key":"C","text":"python语言是编译执行的,不支持逐条语句执行方式"},{"key":"D","text":"Python用#引出行注释"}],"answer":["C"],"topic":"Python与数据分析","row":165,"explanation":{"analy
