ey":"A","text":"均值插补"},{"key":"B","text":"方差插补"},{"key":"C","text":"同类均值插补"},{"key":"D","text":"正态分布插补"},{"key":"E","text":"泊松分布插补"}],"answer":["A","C"],"topic":"数据采集与处理","row":41,"explanation":{"analysis":"均值插补以已观测值的平均水平填补缺失；同类均值插补先按类别或相似群体分组，再用组内均值填补，能利用部分群体差异，因此选 A、C。方差描述离散程度，不适合作为数值水平直接填入；按某分布抽样需要额外建模假设，不是此题的基础通用方法。","tip":"均值补总体平均，同类均值补组内平均。","caution":"正态或泊松模型在满足分布假设时也可用于随机或多重插补；题库排除 D、E 不代表这些方法在统计学上不存在。"}},{"id":"multi-040","number":40,"type":"multi","text":"人工智能在医疗领域的应用包括(  )。","options":[{"key":"A","text":"疾病诊断"},{"key":"B","text":"药物研发"},{"key":"C","text":"医疗影像分析"},{"key":"D","text":"病房监测"}],"answer":["A","B","C","D"],"topic":"AI与智能系统","row":42,"explanation":{"analysis":"AI 可从临床数据中辅助识别疾病风险，在药物研发中筛选候选分子，在影像中检测或分割病灶，也可结合传感器进行病房监测和异常预警，因此四项均为医疗应用。具体效果依赖数据与临床验证，辅助分析结果仍需按医疗流程由专业人员判断。","tip":"医疗 AI 可辅助诊断、研发、影像和监测。","caution":""}},{"id":"multi-041","number":41,"type":"multi","text":"以下选项属于计算机感染了病毒后常有的表现(  )。","options":[{"key":"A","text":"数据完整"},{"key":"B","text":"文件分配表出错"},{"key":"C","text":"频繁死机"},{"key":"D","text":"文件不变"},{"key":"E","text":"计算机硬件损坏"}],"answer":["B","C"],"topic":"计算机与办公基础","row":43,"explanation":{"analysis":"恶意程序可能破坏文件系统结构，造成文件分配表异常，也可能耗尽资源或干扰系统运行，引发频繁死机，所以选 B、C。数据完整和文件不变本身不是感染征兆；硬件物理损坏也不是普通计算机病毒感染的常见表现。上述异常还可能由磁盘或软件故障引起，不能单独确诊病毒。","tip":"文件系统异常和频繁死机是线索，需要进一步排查。","caution":""}},{"id":"multi-042","number":42,"type":"multi","text":"在选购台式机无线网卡,传输速率参数应该考虑(  )两个参数。","options":[{"key":"A","text":"价格"},{"key":"B","text":"产品所支持的网络标准"},{"key":"C","text":"产地"},{"key":"D","text":"所支持的最大传输速率"},{"key":"E","text":"售后服务"}],"answer":["B","D"],"topic":"综合知识","row":44,"explanation":{"analysis":"无线网卡支持的网络标准决定可用技术能力及兼容性，标称最大传输速率给出相应条件下的速率上限，所以 B、D 是直接相关参数。价格、产地和售后可影响购买决策，但不能直接表示传输速率；实际速度还受路由器、频段、信号和干扰影响。","tip":"比较网卡速率先看无线标准，再看标称速率。","caution":""}},{"id":"multi-043","number":43,"type":"multi","text":"以下关于人机交互接口的说法中,错误的有( )。","options":[{"key":"A","text":"人与计算机进行信息交互的接口界面"},{"key":"B","text":"人机交互接口应当尽可能提供全面信息"},{"key":"C","text":"人与计算机可以通过计算机语言进行对话"},{"key":"D","text":"人与计算机不可以通过自然语言及图形等方式进行对话"}],"answer":["B","D"],"topic":"综合知识","row":45,"explanation":{"analysis":"本题要求选错误说法。界面应优先提供用户当前任务所需的信息，信息越全面越好容易造成过载，所以 B 错。人机交互既可以使用程序语言，也可以使用自然语言、图形、语音或触摸，因此 D 错。A 是接口的基本含义，C 描述一种可行的交互方式。","tip":"交互要信息适量，并支持合适的语言或图形方式。","caution":""}},{"id":"multi-044","number":44,"type":"multi","text":"以下选项中,不属于人脸数据采集影响因素或表述有误的有( )。","options":[{"key":"A","text":"人脸识别效果受光照环境影响"},{"key":"B","text":"图像光线无法进行任何优化"},{"key":"C","text":"实际场景主要着力解决行人检测"},{"key":"D","text":"人脸相对于摄像头角度为侧脸最佳"}],"answer":["B","C","D"],"topic":"数据采集与处理","row":46,"explanation":{"analysis":"光照会影响人脸纹理、对比度和可见性，所以 A 正确，不应选入。采集时可通过补光、曝光和位置调整改善光线，B 错；行人检测与人脸采集是不同任务，C 偏离目标；通常清晰正脸更便于获得完整面部特征，不能笼统认为侧脸最佳，所以选 B、C、D。","tip":"人脸采集关注光照、清晰度和角度，侧脸不是普遍最佳。","caution":""}},{"id":"multi-045","number":45,"type":"multi","text":"下列方法中,可用于观测误差存在异方差或自相关情形的线性回归方法有( )。","options":[{"key":"A","text":"广义最小二乘法"},{"key":"B","text":"加权最小二乘法"},{"key":"C","text":"可行广义最小二乘法"},{"key":"D","text":"总体最小二乘法"}],"answer":["A","B","C"],"topic":"Python与数据分析","row":47,"explanation":{"analysis":"广义最小二乘法利用误差协方差结构处理异方差或相关性；加权最小二乘法是其常见特例，主要处理不同观测误差方差不同的情形；可行广义最小二乘法先估计未知协方差再拟合，因此选 A、B、C。总体最小二乘法主要针对解释变量和响应变量都存在测量误差的情况。","tip":"GLS 处理一般误差结构，WLS 侧重异方差，FGLS 先估计结构。","caution":"B 通常处理异方差，不能单独处理所有自相关情形；题中的“或”是入选关键。"}},{"id":"multi-046","number":46,"type":"multi","text":"下列关于页面数据清洗/抽取算法的描述,正确的有( )。","options":[{"key":"A","text":"对于基于模板自动生成的网页,基于网页模板自动生成的网页清洗算法常以 HTML 标签解析器为核心"},{"key":"B","text":"基于启发式规则的网页清洗算法通常依据HTML结构特征(如标签密度、链接密度 )设计规则"},{"key":"C","text":"基于分类器的网页抽取算法需要先对网页进行分块并提取特征,再训练分类模型"},{"key":"D","text":"基于无监督学习的网页抽取算法完全不需要 HTML 解析,可直接在原始文本上完成聚类"}],"answer":["A","B","C"],"topic":"数据采集与处理","row":48,"explanation":{"analysis":"模板网页的稳定标签结构便于用 HTML 解析定位内容；启发式方法可依据标签密度、链接密度等规则识别正文；分类器方法可将页面分块、提取特征后训练分类，故 A、B、C 正确。无监督只表示不依赖人工标签，并不意味着无需 HTML 结构或解析，D 把两件事混为一谈。","tip":"是否监督学习，与是否解析网页结构是两个独立问题。","caution":""}},{"id":"multi-047","number":47,"type":"multi","text":"关于信息安全问题的描述中,正确的有( )。","options":[{"key":"A","text":"仅依赖技术手段就可以解决"},{"key":"B","text":"需要政府制定政策加以引导"},{"key":"C","text":"需要通过立法约束网络行为"},{"key":"D","text":"需要对网络用户进行安全教育"}],"answer":["B","C","D"],"topic":"综合知识","row":49,"explanation":{"analysis":"信息安全涉及技术漏洞，也涉及组织制度、人员操作和法律责任。政策可以引导治理，立法明确行为边界与责任，安全教育减少弱密码、钓鱼等人为风险，因此选 B、C、D。单靠技术无法解决权限滥用、违规操作等全部问题，A 的“仅依赖”过于绝对。","tip":"安全治理需要技术、制度、法律和人员教育共同作用。","caution":""}},{"id":"multi-048","number":48,"type":"multi","text":"关于Linux 2.5.1版本号的描述,正确的有( )。","options":[{"key":"A","text":"\"2\"代表主版本号"},{"key":"B","text":"\"5\"代表次版本号"},{"key":"C","text":"\"1\"代表修改号/补丁号"},{"key":"D","text":"按照旧版Linux内核规则,奇数次版本号通常表示开发版"}],"answer":["A","B","C","D"],"topic":"综合知识","row":50,"explanation":{"analysis":"按题目指定的旧版 Linux 内核命名规则，2.5.1 中的 2 为主版本，5 为次版本，1 为修改或补丁序号；当时次版本奇数通常标识开发分支，偶数标识稳定分支，因此四项都正确。这里解释的是历史规则，不能把奇偶判别机械套到现代内核版本。","tip":"旧内核版本规则：主、次、补丁，次版本奇数多为开发版。","caution":""}},{"id":"multi-049","number":49,"type":"multi","text":"下列关于世界上第一台电子数字计算机的说法,正确的有( )。","options":[{"key":"A","text":"1946 年诞生的ENIAC是世界上第一台通用电子数字计算机"},{"key":"B","text":"ENIAC诞生于美国宾夕法尼亚大学"},{"key":"C","text":"ENIAC奠定了现代计算机的冯·诺依曼体系结构"},{"key":"D","text":"现代计算机广泛采用的\"存储程序\"概念主要由冯·诺依曼在EDVAC报告中提出"}],"answer":["A","B","D"],"topic":"计算机与办公基础","row":51,"explanation":{"analysis":"ENIAC 于 1946 年在美国宾夕法尼亚大学公开亮相，通常被称为第一台通用电子数字计算机，所以 A、B 正确。早期 ENIAC 主要靠接线和开关编程，不能直接说它奠定了存储程序体系；EDVAC 报告系统阐述存储程序设计，D 符合本题口径，C 不选。","tip":"ENIAC 记通用电子计算机；EDVAC 报告记存储程序思想。","caution":"“第一台”需保留“通用电子数字”的限定；存储程序思想有多位研究者的贡献，不宜理解为冯·诺依曼一人独创。"}},{"id":"multi-050","number":50,"type":"multi","text":"在软件下载过程中,下列版本号与其含义对应正确的有( )。","options":[{"key":"A","text":"Beta—测试版"},{"key":"B","text":"Professional—专业版"},{"key":"C","text":"Home—家庭版"},{"key":"D","text":"Free/Freeware—免费版"}],"answer":["A","B","C","D"],"topic":"计算机与办公基础","row":52,"explanation":{"analysis":"Beta 通常表示测试阶段版本；Professional 面向专业用途，Home 面向家庭用户；Free 或 Freeware 表示可免费使用的软件版本，因此四项对应均正确。这些名称说明发布阶段或产品定位，并不能直接保证功能相同、源代码开放或不存在使用范围限制。","tip":"Beta 看成熟阶段，Pro/Home 看定位，Free 看收费方式。","caution":""}},{"id":"multi-051","number":51,"type":"multi","text":"在劳动安全卫生法律制度中,劳动者享有的权利包括( )。","options":[{"key":"A","text":"危险因素和应急措施的知情权"},{"key":"B","text":"拒绝权"},{"key":"C","text":"监督权"},{"key":"D","text":"随时撤离权"}],"answer":["A","B","C"],"topic":"职业道德与法规","row":53,"explanation":{"analysis":"劳动者有权了解作业危险因素和应急措施，可拒绝违章指挥、强令冒险作业，也可对安全问题提出意见和监督，因此 A、B、C 正确。撤离权有条件：发现直接危及人身安全的紧急情况时可依法停止作业或采取措施后撤离，不是任何时候都可无条件撤离。","tip":"有知情、拒违章和监督权，紧急撤离须有危险情形。","caution":""}},{"id":"multi-052","number":52,"type":"multi","text":"下列统计方法中,可用于测量多个评分者间一致性的有( )。","options":[{"key":"A","text":"Kappa系数检验(如Fleiss' Kappa)"},{"key":"B","text":"ICC组内相关系数检验"},{"key":"C","text":"Kendall W协调系数检验"},{"key":"D","text":"格兰杰因果检验"}],"answer":["A","B","C"],"topic":"Python与数据分析","row":54,"explanation":{"analysis":"Fleiss' Kappa 适合多个评分者的类别判断一致性，ICC 常用于连续测量或评分的一致性，Kendall W 衡量多名评价者排序的协调程度，因此选 A、B、C。格兰杰因果检验分析时间序列的滞后信息是否增加预测能力，并不是评分者一致性指标。","tip":"类别看 Kappa，数值看 ICC，排序看 Kendall W。","caution":""}},{"id":"multi-053","number":53,"type":"multi","text":"下列关于数据清洗的说法,正确的有( )。","options":[{"key":"A","text":"数据预处理方法包括检查数据一致性"},{"key":"B","text":"数据预处理方法包括处理无效值"},{"key":"C","text":"估算法是处理缺省值常用的方法"},{"key":"D","text":"处理缺省值是指根据变量取值范围检查数据是否合乎要求"}],"answer":["A","B","C"],"topic":"数据采集与处理","row":55,"explanation":{"analysis":"一致性检查可发现单位、编码或逻辑矛盾，无效值处理纠正超范围或错误记录，估算法可用统计量或模型填补缺失值，因此 A、B、C 正确。根据变量范围检查值是否合法属于有效性校验；缺省值处理针对的是值未提供的情况，D 混淆了两类问题。","tip":"缺失是“没有值”，无效是“有值但不合理”。","caution":""}},{"id":"multi-054","number":54,"type":"multi","text":"下列关于WPS表格中各类汇总/操作方法的说法,正确的有( )。","options":[{"key":"A","text":"使用SUMIF函数可按条件汇总数据,结果会随源数据变化自动更新"},{"key":"B","text":"使用\"合并计算\"按钮汇总多个区域时,若未勾选\"创建指向源数据的链接\",结果不会随源数据自动变化"},{"key":"C","text":"使用数据透视表汇总数据时,默认情况下需要手动刷新才能同步源数据的更改"},{"key":"D","text":"使用\"思维导图\"按钮主要用于绘制思维导图,不用于表格数据的汇总统计"}],"answer":["A","B","C","D"],"topic":"综合知识","row":56,"explanation":{"analysis":"SUMIF 是引用源单元格的条件汇总公式，正常自动计算时会随数据更新；合并计算不建立源链接时通常形成静态结果；数据透视表一般需刷新缓存；思维导图用于表达概念关系而非表格汇总，所以四项都正确。理解是否保留引用或缓存，是判断结果会否自动更新的关键。","tip":"公式随引用重算，静态合并不自动变，透视表要刷新。","caution":"自动计算设置、WPS 版本及刷新配置可能改变默认更新行为；题目按常见默认设置作答。"}},{"id":"multi-055","number":55,"type":"multi","text":"下列关于平均数的说法,正确的有( )。","options":[{"key":"A","text":"算术平均数是n个变量值之和除以n"},{"key":"B","text":"调和平均数是n个变量值倒数的算术平均数的倒数"},{"key":"C","text":"几何平均数是n个变量值乘积的n次方根"},{"key":"D","text":"位置平均数是根据变量值在总体中所处位置确定的平均数,如中位数、众数"}],"answer":["A","B","C","D"],"topic":"综合知识","row":57,"explanation":{"analysis":"算术平均数是总和除以个数；调和平均数先对各值取倒数、求平均再取倒数；几何平均数为各值乘积的 n 次方根。中位数和众数通常归入位置平均数，分别依据排序位置和最高频数确定，所以四项正确；调和、几何平均数还需满足各自适用条件。","tip":"算术看和，调和看倒数，几何看积，位置看分布位置。","caution":"通常在正数数据上使用调和及几何平均数；众数更准确地说由频数最多的位置确定。"}},{"id":"multi-056","number":56,"type":"multi","text":"关于抽样检验与全数(全检)检验的区别与特点,下列说法错误的是( )。","options":[{"key":"A","text":"抽样检验是根据所抽取样本的质量检验结果来推断整批产品的质量"},{"key":"B","text":"经抽样检验判为合格的一批产品中,仍可能含有少量不合格品"},{"key":"C","text":"全数检验需对整批产品逐个进行检验"},{"key":"D","text":"抽样检验能够百分之百保证被接收批次中的每一件产品都合格"},{"key":"E","text":"全数检验由于逐个检验,被接收的合格批中必定不存在不合格品,且检验过程永远不会出现错检、漏检"}],"answer":["D","E"],"topic":"数据采集与处理","row":58,"explanation":{"analysis":"本题选错误项。抽检依据样本推断整批质量，存在抽样风险，接收一批不等于每件都合格，所以 D 错；全检虽逐件检查，仍会受人员、设备或判定标准影响，可能错检、漏检，E 也错。A、B 正确描述抽检，C 正确描述全检范围。","tip":"抽检有抽样风险，全检也不等于零检验错误。","caution":""}},{"id":"multi-057","number":57,"type":"multi","text":"下列关于影响行人属性标注的因素及数据特点的说法,正确的有( )。","options":[{"key":"A","text":"多视角因素是指同一人从不同拍摄角度成像,导致外观差异大,增加属性识别难度"},{"key":"B","text":"遮挡因素是指行人或其关键部位被障碍物遮挡,导致部分属性不可见"},{"key":"C","text":"数据不均衡因素是指各属性在数据集中正样本数量差异显著,部分属性正样本极少"},{"key":"D","text":"每个人只具备属性列表中的部分属性,这一现象称为标签稀疏性,不等同于数据不均衡因素"},{"key":"E","text":"低分辨率因素只影响远距离小目标,对正面清晰人脸的属性标注没有影响"}],"answer":["A","B","C","D"],"topic":"数据标注与质检","row":59,"explanation":{"analysis":"视角改变外观，遮挡使属性不可见，类别不均衡意味着不同属性的正例数量差异大；标签稀疏则指单个样本只具备少量标签，这些描述分别正确。低分辨率会损失纹理和细节，不由拍摄距离或是否正面决定，E 声称完全无影响不成立，因此选 A、B、C、D。","tip":"不均衡看各类样本数，稀疏看每个样本具备多少标签。","caution":""}},{"id":"multi-058","number":58,"type":"multi","text":"精细分割标注中,主要用于检查相邻图层边缘是否存在不贴合(缝隙或重叠)情况的查看模式有( )。","options":[{"key":"A","text":"原图模式——仅显示原始图像,不显示标注结果"},{"key":"B","text":"前景模式——以纯色叠加显示所有前景标注"},{"key":"C","text":"单物前景模式——单独显示当前选中图层的前景标注"},{"key":"D","text":"全景模式——显示全部图层合成后的整体效果"},{"key":"E","text":"灰度模式——将图像转为灰度显示,仅改变视觉效果"}],"answer":["C","D"],"topic":"数据标注与质检","row":60,"explanation":{"analysis":"按题设模式定义，单物前景能突出当前图层的具体边界，全景能检查各图层合成后是否出现缝隙、遮盖或不连续，因此题库选 C、D。原图没有标注结果，灰度主要改变原图显示，均不足以核查图层接缝；统一纯色前景也可能掩盖不同图层之间的重叠。","tip":"检查接缝既看单层边界，也看全部图层的合成效果。","caution":"这些名称和显示行为依赖具体标注工具；若 B 能保留不同层的边界或颜色，它也可能辅助检查。题库未给工具细节，不能把 CD 当作所有平台通用规则。"}},{"id":"multi-059","number":59,"type":"multi","text":"标注工程师使用人脸8点工具标注眼部关键点时,下列关于标注规则的说法,正确的有( )。","options":[{"key":"A","text":"若瞳孔清晰可见,眼部点应标注在瞳孔中心"},{"key":"B","text":"若瞳孔不可见但眼球可见,眼部点应标注在眼球正中间"},{"key":"C","text":"若眼球完全不可见,仍应将眼部点强行标注在可见的眼皮区域"},{"key":"D","text":"若眼睛完全闭合,眼部点可标注在眼裂中心或上下眼皮中间位置"},{"key":"E","text":"标注时应以项目规范为准,并在同批次中保持标准一致"}],"answer":["A","B","D","E"],"topic":"数据标注与质检","row":61,"explanation":{"analysis":"按题目的人脸八点规范，瞳孔清晰时取其中心，瞳孔不可辨但眼球可见时取眼球中部，闭眼时可按规范取眼裂中心；同批次保持统一规则也很重要，因此选 A、B、D、E。眼球完全不可见时应按遮挡规范处理，不能把任意眼皮位置强行当作真实眼部点。","tip":"眼点跟随可见程度和项目规范，遮挡时不可随意猜点。","caution":"具体关键点定义及遮挡点是否允许推断取决于项目；这里按本题给定八点规则理解。"}},{"id":"multi-060","number":60,"type":"multi","text":"关于关联规则挖掘中的基本概念,下列说法正确的有( )。","options":[{"key":"A","text":"支持度指的是项集A、B同时发生的概率"},{"key":"B","text":"置信度指的是项集A、B同时发生的概率"},{"key":"C","text":"最小支持度是判断频繁项集的阈值"},{"key":"D","text":"最小置信度是关联规则的可信程度本身"}],"answer":["A","C"],"topic":"综合知识","row":62,"explanation":{"analysis":"对规则 A→B，支持度是 P(A∩B)，置信度是条件概率 P(B|A)=P(A∩B)/P(A)，所以 A 正确、B 错。最小支持度是筛选频繁项集的门槛，C 正确；最小置信度是筛选规则的门槛，并不是某条规则实际的置信度，D 混淆了阈值与测量值。","tip":"支持度看共同出现，置信度看出现 A 后出现 B 的比例。","caution":""}},{"id":"multi-061","number":61,"type":"multi","text":"以下选项中,关于定性预测方法叙述错误的是( )。","options":[{"key":"A","text":"注重于事物发展在性质方面的预测"},{"key":"B","text":"具有较大的灵活性"},{"key":"C","text":"不易受主观因素的影响"},{"key":"D","text":"主要依赖历史数据的统计建模和量化分析"}],"answer":["C","D"],"topic":"综合知识","row":63,"explanation":{"analysis":"定性预测主要借助专家判断、经验、访谈和逻辑分析，适用于数据不足或需要判断发展方向的情况，具有灵活性，所以 A、B 正确。它容易受经验与主观偏差影响，C 错；主要依赖历史统计建模属于定量预测，D 也错，因此本题选 C、D。","tip":"定性靠经验判断，灵活但要防主观偏差。","caution":""}},{"id":"multi-062","number":62,"type":"multi","text":"关于音频\"标准化(Normalize)\",下列说法正确的有(    )。","options":[{"key":"A","text":"峰值标准化将最大样本值调到目标电平"},{"key":"B","text":"响度标准化常用LUFS单位(ITU-R BS.1770)"},{"key":"C","text":"标准化会改变音频语义内容"},{"key":"D","text":"可用于统一不同片段音量"}],"answer":["A","B","D"],"topic":"数据采集与处理","row":64,"explanation":{"analysis":"峰值标准化按最高样本幅度调整整体增益；响度标准化依据感知响度测量，常以 LUFS 表示；两者都可用于调整片段的音量水平，因此 A、B、D 正确。合理的增益调整不改写说话内容，C 错；峰值相同也不必然意味着人耳感到同样响。","tip":"峰值标准化对齐峰值，响度标准化对齐感知音量。","caution":""}},{"id":"multi-063","number":63,"type":"multi","text":"下列音频格式中,属于无损格式的有(    )。","options":[{"key":"A","text":"WAV(PCM )"},{"key":"B","text":"FLAC"},{"key":"C","text":"MP3"},{"key":"D","text":"APE"}],"answer":["A","B","D"],"topic":"数据采集与处理","row":65,"explanation":{"analysis":"WAV 中存放 PCM 时保留未压缩的采样数据，FLAC 和 APE 则通过可逆压缩保存音频，解码后可还原原采样值，所以选 A、B、D。MP3 使用有损压缩舍弃部分声音信息，即使转存为 WAV 也无法找回已经丢失的细节。","tip":"PCM、FLAC、APE 可保留采样信息，MP3 属于有损编码。","caution":"WAV 是容器，可能封装不同编码；本题明确限定 WAV（PCM），因此可选。"}},{"id":"multi-064","number":64,"type":"multi","text":"使用FFmpeg可以进行的工作包括(    )。","options":[{"key":"A","text":"格式转换(如WAV→MP3)"},{"key":"B","text":"采样率转换"},{"key":"C","text":"提取视频中的音频流"},{"key":"D","text":"修改麦克风硬件指向性"}],"answer":["A","B","C"],"topic":"综合知识","row":66,"explanation":{"analysis":"FFmpeg 能解码再编码完成格式转换，重采样改变采样率，也能从视频容器中提取音轨，因此 A、B、C 正确。麦克风硬件指向性由声学结构、传感器或设备工作模式决定，不能通过普通音视频文件处理命令直接修改，故 D 不属于其此处能力。","tip":"FFmpeg 处理媒体流和文件，不能直接改变麦克风声学结构。","caution":""}},{"id":"multi-065","number":65,"type":"multi","text":"关于语音数据元数据(Metadata )管理,下列说法正确的有(    )。","options":[{"key":"A","text":"应记录说话人ID、性别、年龄段等信息"},{"key":"B","text":"常用JSON、CSV等结构化格式存储"},{"key":"C","text":"元数据可有可无,不影响模型训练"},{"key":"D","text":"转录文本(Transcript)是语音识别任务的重要元数据"}],"answer":["A","B","D"],"topic":"综合知识","row":67,"explanation":{"analysis":"说话人 ID 及适用的人口属性可支持样本分组、划分与覆盖分析，JSON、CSV 便于结构化管理，转录文本则提供 ASR 的监督目标，因此 A、B、D 正确。缺少可靠文件映射和文本会影响训练及评估，C 错；涉及个人属性时应按任务需要和合规要求记录。","tip":"语音元数据连接音频、说话人信息和转录标签。","caution":"性别、年龄段并非所有语音项目的必填字段，应按必要性和授权范围采集，题库是举常见字段。"}},{"id":"multi-066","number":66,"type":"multi","text":"下列场景中,属于\"意图分类\"范畴的有(    )。","options":[{"key":"A","text":"判断用户话语属于\"天气查询\"还是\"机票预订\""},{"key":"B","text":"识别文本中的机构名"},{"key":"C","text":"将\"播放周杰伦的歌\"标注为\"音乐播放\"意图"},{"key":"D","text":"把超出预设范围的语句标记为OOS/未知意图"}],"answer":["A","C","D"],"topic":"综合知识","row":68,"explanation":{"analysis":"判断话语是在查天气、订机票还是播放音乐，都是识别用户希望系统执行什么；把超出支持范围的话语标为未知或 OOS，也属于意图分类体系的拒识处理，因此选 A、C、D。识别文本中的机构名称是在定位实体及其类型，属于命名实体识别，故排除 B。","tip":"意图回答“想做什么”，实体回答“提到了谁或什么”。","caution":""}},{"id":"multi-067","number":67,"type":"multi","text":"多意图(multi-intent)语句的标注要点包括(    )。","options":[{"key":"A","text":"同时标注句子中存在的多个意图"},{"key":"B","text":"只保留一个主要意图即可"},{"key":"C","text":"注意意图间的并列/包含关系"},{"key":"D","text":"在规范允许时记录意图组合"}],"answer":["A","C","D"],"topic":"数据标注与质检","row":69,"explanation":{"analysis":"一句话可能同时包含查天气和订车等多个独立诉求，应标出符合规范的多个意图，并辨明它们是并列任务还是同一任务的子目标；支持组合标签的项目还可记录组合，所以 A、C、D 正确。只留主要意图会丢失其他明确诉求，不符合多意图任务目标。","tip":"多意图标注要保留多个诉求，同时理清并列与包含关系。","caution":""}},{"id":"multi-068","number":68,"type":"multi","text":"标注平台中提升意图标注效率与质量的做法有(    )。","options":[{"key":"A","text":"使用快捷键批量标注"},{"key":"B","text":"参考历史相似样本"},{"key":"C","text":"跳过规范直接凭直觉"},{"key":"D","text":"对疑难样本提交仲裁或反馈"}],"answer":["A","B","D"],"topic":"数据标注与质检","row":70,"explanation":{"analysis":"快捷键减少重复操作，历史相似样本帮助校准边界，疑难样本仲裁可统一争议标准，因此 A、B、D 有助于效率与质量。凭直觉跳过规范会让同一表达被不同人员赋予不同标签，C 不可取；批量操作也需确认样本确实同类，不能把历史错误机械复制。","tip":"熟用工具、参照一致样例、把疑难交给仲裁。","caution":""}},{"id":"multi-069","number":69,"type":"multi","text":"关于BIO标注体系,下列说法正确的有(    )。","options":[{"key":"A","text":"B-实体表示实体开头"},{"key":"B","text":"I-实体表示实体内部延续"},{"key":"C","text":"O表示非实体"},{"key":"D","text":"每个实体必须以E-实体结尾"}],"answer":["A","B","C"],"topic":"数据标注与质检","row":71,"explanation":{"analysis":"BIO 中 B 标记一个实体的起始单元，I 标记该实体的后续单元，O 表示不属于实体，因此 A、B、C 正确。BIO 没有强制的 E 结束标签；显式使用 E 或单独实体标签的是 BIOES 等扩展体系，不能把它们的规则混入 BIO。","tip":"BIO 只有起始 B、内部 I、外部 O。","caution":""}},{"id":"multi-070","number":70,"type":"multi","text":"关于实体边界标注,下列说法正确的有(    )。","options":[{"key":"A","text":"边界应恰好覆盖实体本身"},{"key":"B","text":"不应把无关修饰语或动词纳入实体"},{"key":"C","text":"标注粒度须遵循项目规范"},{"key":"D","text":"实体边界越长越好"}],"answer":["A","B","C"],"topic":"数据标注与质检","row":72,"explanation":{"analysis":"实体边界要准确覆盖实体名称，排除与名称无关的动词或修饰语，同时按规范确定字符、词或短语粒度，因此 A、B、C 正确。无关成分越多越容易造成边界错误，长度增加不代表质量提高；名称本身包含的成分则应完整保留。","tip":"实体边界求恰好，既不漏实体成分，也不多圈上下文。","caution":""}},{"id":"judge-001","number":1,"type":"judge","text":"岗位能力要求指胜任本岗位工作应具有的主客观条件(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":3,"explanation":{"analysis":"岗位能力要求用来判断一个人能否完成岗位任务，通常涉及知识、技能、经验、判断及协作等条件。题干强调的是胜任工作的必要条件，而不只是学历、证书或某一项孤立技能，因此按题库口径判正确。","tip":"岗位能力围绕“能否胜任实际任务”来定义。","caution":"“主客观条件”是宽泛表述，组织资源等外部条件与个人岗位能力应区分，不能把一切工作条件都视为个人能力。"}},{"id":"judge-002","number":2,"type":"judge","text":"职业道德会随着社会发展而不断发展和完善,不同行业和领域的职业道德规范可能有所不同(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":4,"explanation":{"analysis":"社会分工、技术和服务方式改变后，会出现新的职业责任，例如数据隐私和算法公平。不同岗位面对的对象与风险不同，医生、教师和数据标注人员的具体规范自然有所差异，但诚信和负责等基础要求可以相通。","tip":"职业道德有共同底线，也有时代和行业差异。","caution":""}},{"id":"judge-003","number":3,"type":"judge","text":"新媒体管理师可以为了吸引眼球,适当夸大新闻内容,这并不违背职业道德(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"职业道德与法规","row":5,"explanation":{"analysis":"新闻传播应尊重事实、核实信息，吸引流量不能成为夸大或歪曲内容的理由。可以优化标题和表达，但不得使受众形成与事实不符的判断；题干把流量目标置于真实性之上，所以错误。","tip":"传播可以生动，事实不能夸大。","caution":""}},{"id":"judge-004","number":4,"type":"judge","text":"实事求是不属于道德范畴问题(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"职业道德与法规","row":6,"explanation":{"analysis":"实事求是既是认识和工作方法，也体现诚实、客观、不弄虚作假的道德要求。在报告数据、描述工作成果或处理错误时，是否尊重事实会直接影响他人权益，因此不能说它不属于道德范畴。","tip":"尊重事实既是方法要求，也是诚信要求。","caution":""}},{"id":"judge-005","number":5,"type":"judge","text":"职业道德不能通过法律条文强制员工实现(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":7,"explanation":{"analysis":"职业道德的完整实现依赖从业者自觉、行业规范和社会评价，不能仅靠法律把所有道德要求强制转化为行为。因此可按题库判正确，但涉及保密、诚信或安全的部分要求也可能同时受到法律约束。","tip":"法律保障底线，道德还需要内在自觉。","caution":"题干“不能通过法律条文强制”过于绝对。职业道德不能完全靠法律实现，但与法律重合的义务可以依法强制执行。"}},{"id":"judge-006","number":6,"type":"judge","text":"职业道德要以企业获取最大利润为原则(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"职业道德与法规","row":8,"explanation":{"analysis":"职业道德要求在合法经营基础上承担诚信、公平、安全和社会责任，不能以利润最大化压倒这些要求。利润是企业经营目标之一，若为获利而泄露隐私、欺骗用户或损害安全，仍然违反职业道德。","tip":"利润目标必须服从合法、诚信和负责的底线。","caution":""}},{"id":"judge-007","number":7,"type":"judge","text":"人们应该被动地抵制各种非法活动(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":9,"explanation":{"analysis":"遵纪守法不只意味着自己不参与违法活动，还包括在安全和法律允许的范围内主动拒绝、劝阻或向适当部门报告。题干强调被动抵制，弱化了主动承担责任的要求，故按题库判错误。","tip":"面对违法行为应依法主动应对，而非漠然旁观。","caution":"主动抵制不等于冒险直接对抗，应结合个人安全选择报警、报告等适当方式。"}},{"id":"judge-008","number":8,"type":"judge","text":"遵纪守法是每个公民应该具备的基本素质和责任(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":10,"explanation":{"analysis":"法律和纪律为社会交往提供基本秩序，公民应了解并遵守相关规则，依法行使权利并履行义务。遵纪守法不是某类职业的专属要求，而是参与社会生活应具备的基本责任，所以正确。","tip":"依法行使权利，也依法履行义务。","caution":""}},{"id":"judge-009","number":9,"type":"judge","text":"提倡爱岗敬业,热爱本职,并不是要求人们终身只能干一行,爱一行(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":11,"explanation":{"analysis":"爱岗敬业要求在任职期间认真负责、履行职责，并不剥夺依法择业或转换职业的权利。职业变化后仍可对新岗位保持敬业，关键是对当前工作负责，而不是终身不得更换行业。","tip":"可以合理择业转岗，但任职时要认真尽责。","caution":""}},{"id":"judge-010","number":10,"type":"judge","text":"职业具有不断发展和世代延续的特征,其管理方法也有一定历史继承性(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":12,"explanation":{"analysis":"职业随社会分工和技术进步不断变化，同时会保留前人积累的经验、流程及规范。管理方法因此具有继承性，但继承不等于照搬旧制度，还应根据新环境调整，所以题干两方面可以同时成立。","tip":"职业发展既继承经验，也根据时代改进。","caution":""}},{"id":"judge-011","number":11,"type":"judge","text":"专业技术人员只要业务能力强,就不必过于在意职业道德(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"职业道德与法规","row":13,"explanation":{"analysis":"专业能力决定能否完成技术任务，职业道德决定是否以负责、诚信和合规的方式使用能力。能力强却滥用数据、隐瞒风险或造假，可能造成更大损害，因此业务能力不能替代职业道德。","tip":"能力与道德是两项要求，技术强不能抵消失德。","caution":""}},{"id":"judge-012","number":12,"type":"judge","text":"在职业活动中,个人利益与职业道德发生冲突时,应优先考虑个人利益(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"职业道德与法规","row":14,"explanation":{"analysis":"合法个人利益应得到尊重，但不能通过背弃职业责任、泄露秘密或损害服务对象权益获取。发生冲突时应守住法律与职业规范，并通过协商、回避等正当方式处理，而非一概优先个人利益。","tip":"维护自身权益要走正当渠道，不能突破职业底线。","caution":""}},{"id":"judge-013","number":13,"type":"judge","text":"岗位知识要求指胜任本岗位工作应具有的知识结构和知识水平(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":15,"explanation":{"analysis":"知识结构说明岗位需要哪些领域的知识及其联系，知识水平说明需要掌握到何种深度。二者共同描述岗位知识要求，例如标注人员既需理解类别定义，也需达到正确处理边界样本的熟练程度。","tip":"知识结构回答“懂哪些”，知识水平回答“懂多深”。","caution":""}},{"id":"judge-014","number":14,"type":"judge","text":"在Python语言中,列表(List)是不可变的数据类型,一旦创建就不能修改(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"Python与数据分析","row":16,"explanation":{"analysis":"Python 列表是可变序列，创建后可以修改元素、追加内容或删除项目，例如 append 会改变原列表。不可变的是元组、字符串等类型；即使变量名不变，列表内部内容仍可变化，所以题干错误。","tip":"list 可增删改，tuple 和 str 不能原位改元素。","caution":""}},{"id":"judge-015","number":15,"type":"judge","text":"C语言是一种静态类型、编译型的编程语言,而Python是动态类型、解释型的编程语言(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":17,"explanation":{"analysis":"C 通常在编译阶段检查变量的静态类型并生成可执行代码；Python 的类型随运行时对象确定，常由解释器执行。该比较符合入门层面的语言分类，但“动态类型”并不等于没有类型检查。","tip":"静态或动态说类型检查方式，编译或解释说执行实现。","caution":"Python 实现通常也会先编译为字节码，且存在 JIT 实现；编译与解释不是完全互斥的语言属性。"}},{"id":"judge-016","number":16,"type":"judge","text":"在Python中,使用\"#\"符号进行单行注释,而使用三个引号('''或\"\"\")进行多行注释或文档字符串说明(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":18,"explanation":{"analysis":"井号引入的内容是 Python 单行注释。三引号可书写跨行字符串，放在模块、类或函数开头时可作为文档字符串；实践中也常把未使用的三引号字符串当作多行说明，因此题库判正确。","tip":"真正注释用 #；三引号本质上仍是字符串。","caution":"严格语法上 Python 没有以三引号定义的多行注释。题库将常见说明写法与注释合称，学习时应保留这一差别。"}},{"id":"judge-017","number":17,"type":"judge","text":"代码节点(Code Node)允许用户编写Python或JavaScript代码,用于处理复杂的数据转换逻辑(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":19,"explanation":{"analysis":"代码节点把自定义程序嵌入工作流，可进行字段重组、条件计算、格式转换或复杂校验，再把结果交给后续节点。因此它能补充图形化节点难以表达的处理逻辑，支持的语言取决于平台。","tip":"代码节点用于把自定义转换逻辑接入工作流。","caution":"Python 和 JavaScript 是常见支持语言，并非所有编排工具都同时支持二者。"}},{"id":"judge-018","number":18,"type":"judge","text":"NumPy是Python中的文本处理库(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"Python与数据分析","row":20,"explanation":{"analysis":"NumPy 的核心是多维数组、向量化运算、数值计算及线性代数等功能，并不是以文本处理为主要定位。虽然它也能存储字符串数组，但某项可用功能不能改变软件库的主要用途，因此错误。","tip":"NumPy 主要处理数组和数值计算。","caution":""}},{"id":"judge-019","number":19,"type":"judge","text":"AI Agent的核心能力仅依赖于大语言模型的生成能力,不需要外部的规划或记忆模块(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":21,"explanation":{"analysis":"完成持续任务需要记录进度、选择下一步并与外界交互，单次文本生成并不能自动解决这些问题。规划、记忆和工具能力可由独立模块或集成机制提供，因此“仅依赖生成能力、不需要这些能力”的断言错误。","tip":"Agent 除了生成，还需要管理状态、计划和行动。","caution":"并非所有 Agent 都必须显式部署独立规划和记忆模块；题干错误主要在于把核心能力缩减为生成文本。"}},{"id":"judge-020","number":20,"type":"judge","text":"为了防止Agent陷入死循环或资源耗尽,通常需要设置最大迭代次数或超时熔断机制(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":22,"explanation":{"analysis":"Agent 可能反复重试同一错误或持续生成下一步，耗尽时间、调用次数和预算。最大迭代次数提供步数上限，超时机制提供时间上限，能够从程序层面结束失控任务，因此是常用必要保护。","tip":"循环要设步数上限，任务要设时间上限。","caution":""}},{"id":"judge-021","number":21,"type":"judge","text":"在医疗Agent中,为了规避法律风险,必须明确告知用户\"我是AI助手,不能替代医生诊断\"(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":23,"explanation":{"analysis":"医疗助手应明确系统身份、能力边界和人工就医渠道，避免用户把模型输出直接当作医生诊断。题干中的提醒有助于减少误解，因此按题库判正确；真正的风险控制还需临床适用性验证和相应医疗流程。","tip":"医疗 AI 应说明辅助角色和使用边界。","caution":"不能仅靠这一句提示“规避法律风险”；是否必须使用指定原文、适用何种义务，取决于产品性质和适用规则。"}},{"id":"judge-022","number":22,"type":"judge","text":"工具调用要求Agent预先注册API名称、参数描述与权限信息,以便模型能够准确理解并调用(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":24,"explanation":{"analysis":"工具名称、用途和参数规范让模型知道何时及如何提出调用，权限配置则限制实际能做什么。工具还需要运行环境进行参数校验与权限判断，不能只让模型自行决定是否有权执行，所以题干的注册思想正确。","tip":"工具先描述清楚，调用时再验证参数与权限。","caution":"权限信息未必全部暴露给模型，也可能由运行时独立管理；关键是权限必须被实际执行环境强制检查。"}},{"id":"judge-023","number":23,"type":"judge","text":"AI Agent与传统Chatbot的本质区别在于Agent具备感知环境、自主规划并调用工具执行动作以达成目标的能力(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":25,"explanation":{"analysis":"传统聊天机器人主要完成一轮或多轮对话响应；典型 Agent 会围绕目标读取环境状态、安排步骤、调用工具，并根据结果继续调整。区别体现为持续感知与行动闭环，而不是聊天界面是否存在。","tip":"Agent 的特点是围绕目标形成感知—决策—行动闭环。","caution":"产品边界会重叠，部分 Chatbot 也具有工具和 Agent 能力；这是常见架构对比，而非严格互斥的产品分类。"}},{"id":"judge-024","number":24,"type":"judge","text":"Agent的\"幻觉\"问题完全可以通过增加模型参数量来解决,无需引入外部验证或工具调用机制(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":26,"explanation":{"analysis":"更大的模型仍可能因知识缺失、检索错误或概率生成而输出不实内容。减少幻觉需要高质量资料、外部验证、工具结果核对及不确定性处理，参数增加并不提供真实性保证，因此题干的“完全解决”错误。","tip":"模型更大也会幻觉，事实要有来源和验证。","caution":""}},{"id":"judge-025","number":25,"type":"judge","text":"为了降低Agent系统的端到端延迟,应尽可能让LLM在一次输出中生成所有步骤,避免多轮交互(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":27,"explanation":{"analysis":"一次生成全部步骤可能减少往返，但后续动作往往依赖工具实际返回，提前编完会增加错误、返工和无效调用。降低延迟应识别依赖、并行独立任务、使用缓存和合适模型，而不是强制所有任务单轮完成。","tip":"独立步骤可并行，依赖反馈的步骤必须等待结果。","caution":""}},{"id":"judge-026","number":26,"type":"judge","text":"Agent的自我修复能力是指当工具调用失败时,Agent能够捕获错误信息,分析原因并尝试修正参数或切换工具重新执行(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":28,"explanation":{"analysis":"工具失败后，Agent 可读取错误码或返回信息，判断是参数、权限还是临时故障，再采用修正参数、换工具或有限重试等措施。这构成自我修复，但重试应有上限，并避免重复产生不可逆副作用。","tip":"自我修复是根据错误反馈调整后再尝试。","caution":""}},{"id":"judge-027","number":27,"type":"judge","text":"提示词注入(Prompt Injection)攻击对Agent系统威胁更大,因为Agent具有执行外部操作的能力,可能导致越权行为(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":29,"explanation":{"analysis":"提示注入可能把网页、邮件或工具返回中的恶意文字当成指令。Agent 又能调用外部工具，错误服从后可能产生越权访问、泄露或修改等后果，因此风险超出文本回答，应对数据来源和操作权限设明确边界。","tip":"外部内容是数据，不能自动获得指挥工具的权限。","caution":""}},{"id":"judge-028","number":28,"type":"judge","text":"向量数据库在Agent记忆中主要用于存储非结构化的语义信息,支持基于相似度的快速检索(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":30,"explanation":{"analysis":"向量数据库保存文本等内容的嵌入向量，并按距离或相似度找回语义相关的信息，适合检索历史经验和知识片段。它通常还保存原文或原文引用及元数据，但语义相近并不保证内容事实正确。","tip":"向量记忆按语义相似度召回，需要核对原始内容。","caution":""}},{"id":"judge-029","number":29,"type":"judge","text":"为了提高Agent工具选择的准确率,工具的描述(Description)应当尽可能详细且包含典型的使用场景示例(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":31,"explanation":{"analysis":"准确说明工具用途、适用条件、参数和典型场景，可帮助模型区分相似工具，避免误选。有效描述应清晰且足够完整，因此题库判正确；重复堆砌无关细节反而会占用上下文并降低区分度。","tip":"工具描述重在明确用途和边界，不在于越长越好。","caution":"“尽可能详细”应理解为提供足够相关细节，而非无限扩写；描述冗长也可能降低选择质量。"}},{"id":"judge-030","number":30,"type":"judge","text":"具身智能(Embodied AI)是Agent的一种特殊形式,强调智能体在物理环境中通过传感器和执行器进行交互(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":32,"explanation":{"analysis":"具身智能强调智能体拥有可行动的载体，通过传感器感知环境，并通过执行器行动获得反馈。例如机器人用摄像头识别目标再控制机械臂抓取，体现了感知、动作与环境之间的闭环。","tip":"具身智能把感知和行动落在可交互的载体上。","caution":"具身智能研究也可在仿真环境中进行，题干的物理交互是典型应用表述，并非排除仿真。"}},{"id":"judge-031","number":31,"type":"judge","text":"Agent的安全性设计仅需关注输入端的提示词过滤,无需对输出端的工具执行结果进行权限控制和沙箱隔离(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":33,"explanation":{"analysis":"输入过滤无法识别所有恶意指令，也不能阻止模型误用合法工具。真正执行动作前仍应校验权限、参数和目标，并按需要设置沙箱隔离及结果检查，因此只管输入、不管执行阶段是不完整的安全设计。","tip":"安全检查要覆盖输入、决策、工具执行和结果。","caution":""}},{"id":"judge-032","number":32,"type":"judge","text":"评估Agent的好坏不仅要看最终答案的正确性,还需考量其任务完成效率、工具调用准确率及鲁棒性等指标(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":34,"explanation":{"analysis":"两个 Agent 都答对题目，但一个多次误调用、耗时过长或遇故障就停止，实际可用性会不同。因此评估要同时考虑成功率、时间成本、调用准确性及异常场景表现，不能仅看最终答案。","tip":"结果正确只是起点，还要看成本、过程和稳定性。","caution":""}},{"id":"judge-033","number":33,"type":"judge","text":"提示词工程(Prompt Engineering)在LLM节点中至关重要,直接影响Agent的输出质量(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":35,"explanation":{"analysis":"LLM 节点依赖提示词了解任务、输入含义、约束和输出格式。指令模糊或遗漏条件会让模型采取不同解释，而明确任务和示例通常能提升一致性，所以提示词工程会直接影响 Agent 的输出质量。","tip":"模型要先知道任务、约束和格式，才能稳定输出。","caution":""}},{"id":"judge-034","number":34,"type":"judge","text":"Agent编排中的\"上下文管理\"仅指保留用户的对话历史,不包含任务执行过程中的中间状态(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":36,"explanation":{"analysis":"上下文不仅包括用户对话，还包括目标、已完成步骤、工具结果、错误信息及待处理任务。后续节点需要这些中间状态才能延续工作、避免重复操作，因此把上下文管理缩减为保存聊天记录是错误的。","tip":"上下文同时包含对话历史和任务执行状态。","caution":""}},{"id":"judge-035","number":35,"type":"judge","text":"Agent编排中的\"人工介入\"通常被视为系统设计的失败,应尽可能完全消除人工审核环节(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":37,"explanation":{"analysis":"人工审核能处理高风险操作、歧义样本和超出模型能力的情况，是有意设计的控制机制。可靠系统会在适当节点引入人工，并保存状态方便继续执行，而不是把任何人工介入都视为失败。","tip":"适当转人工是可靠流程的一部分。","caution":""}},{"id":"judge-036","number":36,"type":"judge","text":"AutoGen框架主要通过对话驱动的方式来实现Agent之间的协作和任务流转(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":38,"explanation":{"analysis":"AutoGen 的典型设计通过多个 Agent 交换消息推进任务，角色可以提出问题、调用工具、反馈结果和审查输出。对话不仅是展示形式，也承担协作与任务转交，因此题干符合该框架的主要设计思路。","tip":"AutoGen 常用消息对话推动角色协作。","caution":"框架会随版本发展增加事件驱动等抽象，不能据此认为它只支持一种固定的轮流聊天结构。"}},{"id":"judge-037","number":37,"type":"judge","text":"在Agent编排中,DAG(有向无环图)结构能有效避免任务执行陷入死循环(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":39,"explanation":{"analysis":"DAG 的边有方向且图中不存在环，沿依赖关系执行时不能回到先前节点，因此能避免图结构自身形成循环。它适合表达有明确前后依赖的流程，但每个节点仍需设置超时和合理终止行为。","tip":"无环图能防图上的循环，节点内部仍需防失控。","caution":"DAG 不能保证整个程序绝不死循环：节点内部代码、重试机制或外部调度仍可能无限执行。"}},{"id":"judge-038","number":38,"type":"judge","text":"在Multi-Agent系统中,引入\"监督者\"(Supervisor)角色的主要目的是为了降低系统的计算成本(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":40,"explanation":{"analysis":"监督者主要承担分派任务、协调角色、汇总结果及决定继续或终止等职责，目标是让协作有序并提升任务质量。它可能减少重复工作，也可能增加模型调用，因此降低成本不是其定义性的主要目的。","tip":"Supervisor 核心是统筹与协调，成本未必下降。","caution":""}},{"id":"judge-039","number":39,"type":"judge","text":"在生产环境中,完善的日志记录和可观测性对于调试复杂的Agent编排流程至关重要(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":41,"explanation":{"analysis":"多节点 Agent 的错误可能来自输入、模型决策、工具参数或状态传递。日志和可观测性保留这些环节的时间、结果及调用关系，帮助定位失败和性能瓶颈，同时应避免在日志中无必要地记录敏感信息。","tip":"复杂流程要能追踪每一步输入、调用、输出和耗时。","caution":""}},{"id":"judge-040","number":40,"type":"judge","text":"在Agent图形化编排中,开始节点(Start Node)通常用于定义工作流的输入参数(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":42,"explanation":{"analysis":"开始节点作为工作流入口，通常声明用户问题、文件、选项等输入变量，并为后续节点提供起始数据。它使调用方知道流程需要哪些参数，也帮助编排工具检查输入，所以题干正确。","tip":"开始节点确定流程从哪些输入启动。","caution":""}},{"id":"judge-041","number":41,"type":"judge","text":"Agent编排中的\"上下文变量\"只能在当前节点内使用,无法传递给后续节点(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":43,"explanation":{"analysis":"上下文变量的作用之一就是在节点间传递数据和状态，后续节点可按平台规则引用前面节点的输出。局部变量可能只在单节点有效，但不能把这种作用域限制推广到所有上下文变量，所以错误。","tip":"局部变量与工作流上下文变量的作用域不同。","caution":""}},{"id":"judge-042","number":42,"type":"judge","text":"Agent的记忆模块(Memory)在图形化编排中通常通过数据库节点或向量存储节点来实现(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":44,"explanation":{"analysis":"数据库可以保存结构化任务状态和历史记录，向量存储可以检索语义相关的记忆，因此图形化流程常通过这些节点实现持久记忆。短期记忆也能使用会话变量或运行时状态，不一定每次都需访问数据库。","tip":"结构化状态可存数据库，语义记忆常用向量检索。","caution":""}},{"id":"judge-043","number":43,"type":"judge","text":"在图形化界面中,拖拽节点并连接是构建Agent工作流的主要交互方式(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":45,"explanation":{"analysis":"图形化编排把模型、条件、工具和处理步骤表示成节点，通过连线建立依赖和数据传递关系。拖拽节点并连接是常见的主要交互方式，使用户无需手写全部调度代码即可构建流程。","tip":"节点表示处理步骤，连线表示步骤之间的关系。","caution":""}},{"id":"judge-044","number":44,"type":"judge","text":"一个复杂的Agent工作流不能调用另一个Agent工作流,只能调用传统API(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":46,"explanation":{"analysis":"支持子流程、工作流工具或 API 封装的平台，可以让一个工作流调用另一个工作流，以复用能力和分层组织任务。调用时需约定输入输出并限制递归深度，因此“只能调用传统 API”的绝对说法错误。","tip":"复杂工作流可以通过子流程或工具封装组合复用。","caution":""}},{"id":"judge-045","number":45,"type":"judge","text":"提示词工程只适用于文本生成任务,对代码生成、图像理解等多模态任务无效(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据采集与处理","row":47,"explanation":{"analysis":"提示词不仅能指导自然语言写作，也能说明代码需求、测试条件、图像观察重点及多模态输出格式。只要模型支持相应输入和任务，清晰指令就能影响处理方式，所以提示词工程不局限于文本生成。","tip":"提示词是在说明任务，可用于代码和多模态理解。","caution":""}},{"id":"judge-046","number":46,"type":"judge","text":"GPU的显存带宽是影响大模型推理速度的关键瓶颈之一(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":48,"explanation":{"analysis":"大模型推理需要频繁从显存读取权重及缓存，尤其逐 token 解码时，运算单元可能等待数据搬运。显存带宽因此常构成瓶颈之一；实际瓶颈还取决于批大小、模型结构、量化方式和计算能力。","tip":"推理不只看算力，也看显存把数据送得多快。","caution":""}},{"id":"judge-047","number":47,"type":"judge","text":"TCP协议是面向连接的、可靠的传输层协议,而UDP协议是无连接的、不可靠的传输层协议(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":49,"explanation":{"analysis":"TCP 建立连接并通过确认、重传和排序提供可靠字节流；UDP 直接发送数据报，不内置可靠交付或顺序保证。UDP 的“不可靠”指协议不作这些保证，并不等于每个 UDP 包都会丢失。","tip":"TCP 提供可靠字节流，UDP 提供尽力交付的数据报。","caution":""}},{"id":"judge-048","number":48,"type":"judge","text":"HTTP协议默认使用的端口号是80,而HTTPS协议默认使用的端口号是443(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":50,"explanation":{"analysis":"HTTP 服务默认使用 TCP 80 端口，HTTPS 默认使用 443 端口，浏览器未写端口时通常按此连接。管理员可以配置其他端口，因此默认端口是约定而非强制只能使用的端口号。","tip":"HTTP 默认 80，HTTPS 默认 443。","caution":""}},{"id":"judge-049","number":49,"type":"judge","text":"遗传算法是进化算法的一种(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":51,"explanation":{"analysis":"遗传算法把候选解组成种群，以适应度评价解的好坏，并通过选择、交叉和变异逐代搜索。它借鉴生物进化机制，属于进化算法家族，但并非每次都保证找到全局最优解。","tip":"遗传算法通过选择、交叉、变异进化候选解。","caution":""}},{"id":"judge-050","number":50,"type":"judge","text":"IP地址127.0.0.1被称为本地回环地址,通常用于测试本机网络协议栈是否正常工作(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":52,"explanation":{"analysis":"127.0.0.1 指向本机回环接口，访问它时流量通常不离开本机，可测试本机协议栈或本地服务。回环测试成功不表示网线、路由器或互联网连接正常，这些需要进一步检测。","tip":"127.0.0.1 测本机，不能证明外网畅通。","caution":""}},{"id":"judge-051","number":51,"type":"judge","text":"DNS(域名系统)的主要作用是将人类可读的域名(如www.example.com)转换为机器可读的IP地址(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":53,"explanation":{"analysis":"DNS 通过分布式域名记录帮助客户端找到目标服务，常见 A 和 AAAA 记录分别给出 IPv4、IPv6 地址。这让用户使用易记域名而非数字地址访问网站，因此题干概括了 DNS 的主要用途。","tip":"DNS 常把域名解析为地址，还能提供其他记录。","caution":""}},{"id":"judge-052","number":52,"type":"judge","text":"计算机网络中的\"三次握手\"是TCP协议建立连接的过程,目的是为了防止已失效的连接请求突然传送到服务器(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":54,"explanation":{"analysis":"TCP 通过 SYN、SYN-ACK 和 ACK 确认双方收发能力并同步初始序号。第三次确认有助于避免服务器把历史失效请求误当作有效连接，因此题干正确，但这只是三次握手作用的一部分。","tip":"三次握手确认连接状态并同步双方初始序号。","caution":""}},{"id":"judge-053","number":53,"type":"judge","text":"防火墙是一种位于内部网络与外部网络之间的网络安全系统,用于监控和控制进出网络的流量(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":55,"explanation":{"analysis":"防火墙依据来源、目的地址、端口、连接状态等规则放行或拒绝网络流量，常部署在不同信任区域之间。题干描述了典型边界防火墙，也存在运行在单台主机上的防火墙实现。","tip":"防火墙按规则控制跨边界的网络流量。","caution":""}},{"id":"judge-054","number":54,"type":"judge","text":"子网掩码用于区分IP地址中的网络部分和主机部分,常见的子网掩码255.255.255.0对应的CIDR前缀是/24(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":56,"explanation":{"analysis":"IPv4 子网掩码中连续的 1 对应网络位，后面的 0 对应主机位。255.255.255.0 的前三个字节各有 8 个 1，共 24 位，因此表示为 /24，题干正确。","tip":"掩码数连续的 1：255.255.255.0 有 24 个。","caution":""}},{"id":"judge-055","number":55,"type":"judge","text":"在编程中,递归函数是指在函数内部调用自身的函数,使用递归时必须要有终止条件(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":57,"explanation":{"analysis":"递归通过把问题缩小后再次调用自身来求解，需要一个不再继续递归的基例，并确保每次调用朝基例推进。只有终止条件却永远到达不了也会导致无限递归，最终可能触发栈深度限制。","tip":"递归既要有出口，也要每次更接近出口。","caution":""}},{"id":"judge-056","number":56,"type":"judge","text":"MCP协议的核心差异在于它聚焦高层级协作与上下文维护,而不仅仅是简单的函数调用(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":58,"explanation":{"analysis":"MCP 用标准化的客户端—服务器协议暴露工具、资源和提示等能力，帮助模型应用连接外部系统；相比单独定义一个函数调用，它还涉及发现与协议生命周期。但其核心并不是自动完成多 Agent 规划、协作或持久记忆管理。","tip":"MCP 重点是标准化连接工具和上下文资源。","caution":"题库判正确，但“聚焦高层级协作与上下文维护”容易误导。MCP 是 Model Context Protocol，不等同于多智能体协作协议，也不自动维护完整业务上下文。"}},{"id":"judge-057","number":57,"type":"judge","text":"图形化编排工具生成的工作流一旦发布,就无法再进行修改或版本迭代(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":59,"explanation":{"analysis":"工作流发布后通常仍能编辑草稿、创建新版本、测试并重新发布，部分工具也支持回滚。已发布版本可保持稳定以供调用，但这与禁止未来修改不同，因此“一旦发布就无法迭代”错误。","tip":"发布固定一个版本，并不意味着永远不能更新。","caution":""}},{"id":"judge-058","number":58,"type":"judge","text":"图形化编排中的\"人工审核节点\"会暂停工作流执行,直到人工干预并给出指令(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":60,"explanation":{"analysis":"人工审核节点通常保存当前流程状态并等待审核人通过、拒绝或补充信息，获得决定后再沿相应分支继续。暂停使高风险动作能在实际执行前接受审查，也便于处理机器无法判定的情况。","tip":"人工审核节点先保存并等待，再按审核结果继续。","caution":"具体系统也可配置超时、取消或默认分支，题干描述的是正常等待人工决定的流程。"}},{"id":"judge-059","number":59,"type":"judge","text":"图形化编排工具通常支持将工作流导出为JSON或YAML格式,以便版本控制或迁移(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":61,"explanation":{"analysis":"JSON 或 YAML 能表达节点配置、变量和连接关系，便于将工作流纳入版本控制、备份及迁移。不同平台的字段和节点类型可能不同，即使文件格式相同，也不代表导出文件可以直接跨平台运行。","tip":"结构化导出利于版本管理，跨平台仍需兼容转换。","caution":"并非所有图形化工具都提供相同导出能力，实际以平台功能为准。"}},{"id":"judge-060","number":60,"type":"judge","text":"图形化编排工具中,连线(Edge)不仅代表执行顺序,还可以用于传递数据(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":62,"explanation":{"analysis":"连线可以描述哪个节点先执行，也可以把源节点的输出连接到目标节点的输入。具体平台可能将控制流与数据流分开表示，但概念上连线不局限于排序作用，故题干正确。","tip":"连线既能约束先后，也能承载数据依赖。","caution":""}},{"id":"judge-061","number":61,"type":"judge","text":"在图形化编排中,循环节点(Loop Node)必须设置明确的终止条件,否则可能导致无限循环(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":63,"explanation":{"analysis":"循环节点需要可达到的退出条件，例如遍历完有限集合、满足目标或达到最大次数。若状态始终不变化且没有上限，流程可能不断执行并耗费资源，因此设置明确终止条件是正确设计。","tip":"循环要有可达到的退出条件，最好再加次数上限。","caution":""}},{"id":"judge-062","number":62,"type":"judge","text":"OpenCV是一个开源的跨平台计算机视觉和机器学习软件库(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":64,"explanation":{"analysis":"OpenCV 是开源且可跨平台使用的计算机视觉库，提供图像处理、特征提取、视频分析及部分机器学习功能。它既可用于经典视觉算法，也可在视觉学习任务中承担预处理和推理辅助工作。","tip":"OpenCV 的核心领域是图像与计算机视觉。","caution":""}},{"id":"judge-063","number":63,"type":"judge","text":"人工智能训练师不需要具备编程技能(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":65,"explanation":{"analysis":"人工智能训练师的工作可能涉及数据清洗、格式转换、抽样检验和训练流程，编程能力能帮助自动化处理并理解工具行为。不同岗位深度要求不同，但笼统断言完全不需要编程技能不成立。","tip":"编程要求因岗位而异，数据处理基础通常有帮助。","caution":"并非所有初级或平台标注岗位都要求独立开发程序；本题否定的是普遍性的“不需要”。"}},{"id":"judge-064","number":64,"type":"judge","text":"人工智能训练师在处理多分类问题时,可以使用相同的标注策略来处理所有类别(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":66,"explanation":{"analysis":"多分类标注要统一总体原则，同时明确各类别的定义、边界、易混情况及特殊样例，不能忽略类别差异机械处理。因此题库判错误。若“相同策略”仅指统一使用同一平台或标注流程，则完全可以相同。","tip":"整体规范统一，类别判定规则需要明确区分。","caution":"题干用“可以”且未定义“相同标注策略”，存在歧义；同一套适当的多分类标注流程确实可以覆盖所有类别，不能无条件判定不可行。"}},{"id":"judge-065","number":65,"type":"judge","text":"由于人工智能产品都有相对复杂的底层技术,因此需要产品经理在设计产品的时候也要将产品的功能模块、交互流程、界面元素、配色字体等内容变得复杂多变(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":67,"explanation":{"analysis":"底层技术复杂并不要求用户界面同样复杂。产品应按使用目标组织信息，减少无关控件和认知负担，必要时渐进展示高级功能；盲目增加模块、流程和视觉变化反而降低可用性，所以错误。","tip":"技术可以复杂，用户完成任务的路径应清晰。","caution":""}},{"id":"judge-066","number":66,"type":"judge","text":"人工智能产品的目标之一就是降低用户的使用门槛,尽量减少用户的交互流程,降低使用难度,让产品的使用过程接近用户的自然行为(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":68,"explanation":{"analysis":"自然语言、自动识别和适当默认值可以减少用户学习成本及重复操作。优秀产品通过任务场景决定交互方式，让关键步骤清楚、反馈及时；减少流程应以不损失必要理解和控制为前提。","tip":"降低门槛要减少无效操作，同时保留必要控制。","caution":""}},{"id":"judge-067","number":67,"type":"judge","text":"人工智能行业的分析维度包括技术成熟度、市场规模、行业竞争格局、政策环境、人才供给和产业链结构(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":69,"explanation":{"analysis":"技术成熟度决定能力边界，市场规模和竞争格局影响商业机会，政策决定外部约束，人才供给关系到执行能力，产业链结构影响成本及合作资源。这些维度互补，因此都属于 AI 行业分析范围。","tip":"分析行业同时看技术、市场、竞争、政策、人才和产业链。","caution":""}},{"id":"judge-068","number":68,"type":"judge","text":"人工智能产品经理应打磨自身对场景的理解和判断力,确保产品在市场中的定位是当下阶段最适合的(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":70,"explanation":{"analysis":"AI 产品需要把模型能力与真实业务问题结合。理解场景可识别用户目标、数据条件和可容忍误差，再据技术成熟度及市场需求选择当前合适的定位，避免只因技术新颖就盲目增加功能。","tip":"产品定位应建立在场景需求与当前能力的匹配上。","caution":""}},{"id":"judge-069","number":69,"type":"judge","text":"AI的目的是为了超越人,突破人类的局限性(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":71,"explanation":{"analysis":"人工智能研究使机器执行通常需要智能的任务，实际目的包括辅助人类、提高效率和解决具体问题。某些系统在计算或识别方面超过人类，只是可能取得的能力表现，不能把“超越人”概括为 AI 的唯一目的。","tip":"AI 服务于任务和需求，不以全面超越人类为定义。","caution":"AI 可以以超越人类某项能力为研究目标；题库否定的是将这一目标概括为整个领域唯一或必然的目的。"}},{"id":"judge-070","number":70,"type":"judge","text":"三维一体的\"AI化公司\",首先要具备AI思维,其次要拥有AI能力,第三要遵循AI伦理(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":72,"explanation":{"analysis":"按题目的三维框架，AI 思维用于识别适合的问题，AI 能力用于把方案落地，AI 伦理约束数据、决策及使用方式。缺少任一方面都会使转型偏离实际需求或难以持续，因此按此框架判正确。","tip":"AI 化既要会想、能做，也要负责任。","caution":"这是管理框架的一种概括，并非公认的唯一公司分类标准，也不表示三者必须严格按时间先后实施。"}},{"id":"judge-071","number":71,"type":"judge","text":"数据敏感度是业务理解力、客户理解力、数据理解力三者的综合结果(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":73,"explanation":{"analysis":"能否从数据中发现有意义的变化，不只取决于统计技能，还需要理解业务运作和客户行为。把三方面结合，才能判断指标变化代表什么、是否值得行动，因此该说法可作为数据敏感度的实务概括。","tip":"理解数据要联系业务和客户，不能只看数字。","caution":"这里的“数据敏感度”指分析洞察能力，不是隐私安全中数据敏感等级，也不是统计学中的检测敏感性。"}},{"id":"judge-072","number":72,"type":"judge","text":"我国大数据应用技术的发展将涉及机器学习、多学科融合、大规模应用开源技术等领域(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":74,"explanation":{"analysis":"机器学习可从大规模数据提取规律，多学科融合把领域知识引入模型，开源技术提供可复用的存储、计算与分析基础。这些方向彼此促进，均可成为大数据应用技术发展的组成部分。","tip":"大数据应用常结合学习算法、领域知识和开源基础设施。","caution":""}},{"id":"judge-073","number":73,"type":"judge","text":"数据处理的基本目的是从大量的、可能是杂乱无章的、难以理解的数据中抽取并推导出对于某些特定的人们来说是有价值、有意义的数据(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":75,"explanation":{"analysis":"原始记录可能杂乱、重复或难以解释，经过清洗、转换、汇总和分析后，才能形成适合特定决策的信息。价值取决于使用目的，同一批数据对不同任务的作用可能不同，题干抓住了数据处理的基本目标。","tip":"数据处理把原始记录转为特定任务可用的信息。","caution":""}},{"id":"judge-074","number":74,"type":"judge","text":"高维向量空间中存在\"维数灾难\"问题,可能导致数据稀疏和距离度量失效(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":76,"explanation":{"analysis":"维度增加时，覆盖空间所需样本量会迅速上升，固定数量的数据显得更稀疏；某些距离还会出现集中现象，使近远差异不明显。因此高维下相似度方法可能变差，需要选择特征、降维或适当度量。","tip":"维度越高，样本覆盖越难，普通距离未必仍有效。","caution":""}},{"id":"judge-075","number":75,"type":"judge","text":"在关系型数据库中,主键(Primary Key)用于唯一标识表中的每一行记录,且主键字段的值不能为空(NULL)(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"计算机与办公基础","row":77,"explanation":{"analysis":"关系表的主键用于区分每一行，必须满足唯一性及非空约束。主键可以由一个字段构成，也可以由多个字段共同构成；复合主键的完整组合需要唯一，不能将组合中的缺失值当作有效标识。","tip":"主键要唯一且非空，可以由多个字段共同组成。","caution":""}},{"id":"judge-076","number":76,"type":"judge","text":"Embedding模型可以将不同长度的文本映射为固定长度的向量(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":78,"explanation":{"analysis":"文本嵌入模型通过编码和汇聚等过程，把不同长度的输入转换为固定维度的向量，便于计算相似度和建立索引。输入仍受模型最大长度限制，过长文本通常要截断或切块处理。","tip":"文本长度可变，句向量的维数通常固定。","caution":"题目指句子或文档级嵌入；词元级嵌入输出可能随词元数量形成可变长度的向量序列。"}},{"id":"judge-077","number":77,"type":"judge","text":"在多模态大模型中,增加模态的数量不会增加模型的复杂性和计算成本(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":79,"explanation":{"analysis":"增加图像、音频等模态往往需要新的编码器、对齐模块和更多输入计算，也会增加训练数据处理及存储负担。具体成本与架构相关，但断言模态增加不会增加复杂性和计算成本明显过于绝对。","tip":"更多模态通常带来额外编码、对齐和计算成本。","caution":""}},{"id":"judge-078","number":78,"type":"judge","text":"文本标注对结果的影响不亚于模型构建和调优过程,应该给予更多的重视(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":80,"explanation":{"analysis":"文本标签定义模型学习的目标，若实体边界、类别或情感标签错误，模型可能学到错误规律，调参也难以弥补。准确且一致的标注与模型设计共同决定效果，所以不能忽视标注质量。","tip":"标签就是学习目标，标签错误会直接污染训练。","caution":"“不亚于”是强调数据质量的教学表达，具体贡献无法脱离数据规模、任务和模型做统一量化比较。"}},{"id":"judge-079","number":79,"type":"judge","text":"视频标注广泛应用于计算机视觉(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":81,"explanation":{"analysis":"视频同时包含画面内容和时间关系，标注可以提供目标框、轨迹、动作和事件等监督信息。这些数据被用于目标跟踪、行为识别、自动驾驶等视觉任务，因此视频标注广泛应用于计算机视觉。","tip":"视频标注既标空间目标，也标时间变化。","caution":""}},{"id":"judge-080","number":80,"type":"judge","text":"当以标注对象为分类基础时,可以将数据标注细化为图像数据标注、文本数据标注和语音数据标注(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":82,"explanation":{"analysis":"按数据对象划分，图像、文本和语音都有各自的标注任务及工具，例如图像框选、文本实体和语音转写，因此列出的三类成立。不过现实数据还包括视频、点云和多模态数据，不能认为仅有这三类。","tip":"标注可按数据模态分类，三类常见但并不穷尽。","caution":"题干按常见对象举类时正确；若理解为所有标注对象只能划成三类，则分类不完整。"}},{"id":"judge-081","number":81,"type":"judge","text":"标注工具按照自动化程度分为手动、半自动和自动三种(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":83,"explanation":{"analysis":"手动工具主要依靠人直接标注，半自动工具先给模型建议再由人修正，自动工具则按规则或模型批量生成标签。这种分类依据人工参与程度；自动生成的标签仍可能需要抽检和校正。","tip":"自动化程度看人工参与多少，不代表质量天然可靠。","caution":""}},{"id":"judge-082","number":82,"type":"judge","text":"全数检验是指质检员对已完成标注的整个数据集进行逐条核查(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":84,"explanation":{"analysis":"全数检验检查待检集合中的每一条标注，而抽检只检查选中的一部分。全检能扩大核查覆盖范围，但人员疏忽、规范理解错误等仍可能导致错检或漏检，所以覆盖全部不等于保证零缺陷。","tip":"全检指检查范围全部覆盖，不是保证绝无错误。","caution":""}},{"id":"judge-083","number":83,"type":"judge","text":"大语言模型(LLM)节点通常用于处理非结构化数据,如文本生成、摘要或分类(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":85,"explanation":{"analysis":"LLM 节点可以读取自然语言资料并执行生成、总结、分类或信息抽取，将非结构化内容转换为可利用的结果。输出也可按要求形成结构化字段，但后续系统仍应验证格式和关键事实。","tip":"LLM 节点常把自然语言内容转成回答或结构化结果。","caution":""}},{"id":"judge-084","number":84,"type":"judge","text":"模型性能评估应结合任务目标选择合适指标(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":86,"explanation":{"analysis":"指标应对应实际任务代价：类别不均衡时仅看准确率可能掩盖漏检，回归可看误差，检索可看召回和排序质量。先明确目标与错误成本，再选择指标，才能判断模型是否适用。","tip":"先确定任务和错误代价，再选择评估指标。","caution":""}},{"id":"judge-085","number":85,"type":"judge","text":"预训练大模型时,训练时间越长,模型性能一定越好(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":87,"explanation":{"analysis":"训练更久可能先改善拟合，但收益会下降，也可能过拟合、学习到噪声或因不合适的学习率导致不稳定。模型表现应以独立验证数据及目标指标判断，不能用训练时长直接保证性能提高。","tip":"训练时长不是质量保证，要看验证表现。","caution":""}},{"id":"judge-086","number":86,"type":"judge","text":"Transformer模型完全基于注意力机制,不再包含循环或卷积结构(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":88,"explanation":{"analysis":"原始 Transformer 用自注意力和交叉注意力处理序列关系，替代了传统序列模型中的循环与卷积主干，因此题库判正确。不过网络还含前馈层、残差连接、归一化和位置表示，并非只由注意力层组成。","tip":"原始 Transformer 不依赖循环和卷积，但仍含前馈等模块。","caution":"“完全基于注意力”是架构侧重点的简称；Transformer 变体也可能融合卷积或循环结构，不能推广到所有变体。"}},{"id":"judge-087","number":87,"type":"judge","text":"人机协同系统的运行机制首先要做的是由人把观测到的数据,经过分析、推理和判断之后的结果通过人机交互接口输入计算机(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":89,"explanation":{"analysis":"在题目描述的人主导协同流程中，人先观察并判断，再经交互界面把信息输入计算机，计算机随后处理和反馈。这是一种可能的运行路径，因此题库判正确，但并不是所有人机协同系统的统一起点。","tip":"人机协同强调双方信息与行动衔接，起点依系统设计。","caution":"传感器自动采集或计算机先提出建议的系统也属于人机协同；题干“首先要”若作为普遍规则，则过于绝对。"}},{"id":"judge-088","number":88,"type":"judge","text":"Kafka具有高吞吐量、低延时特点,是完全的分布式系统(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":90,"explanation":{"analysis":"Kafka 通过多个代理节点、分区和副本组织消息流，支持水平扩展与故障恢复，设计上追求高吞吐和低延迟。实际表现仍受硬件、批处理、复制配置及负载影响，不能仅凭系统名称保证固定性能。","tip":"Kafka 用分区和副本构建可扩展的分布式消息流系统。","caution":"Kafka 也可单节点部署；“分布式系统”描述其架构能力，不意味着每个部署一定包含多台机器。"}},{"id":"judge-089","number":89,"type":"judge","text":"在使用视频人脸8点标注工具时,不需要在一个界面中对所有帧有预标框的人脸进行标注(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据标注与质检","row":91,"explanation":{"analysis":"按题库所用视频人脸八点工具的流程，应对要求处理的各帧预标人脸逐一核查并完成关键点标注，不能因为已有预标框就遗漏后续帧。不同界面的组织方式不改变应覆盖全部指定目标的质量要求。","tip":"预标框不是完成标注，仍需覆盖要求处理的所有帧和人脸。","caution":"题干未说明工具版本及逐帧界面设计，“必须在一个界面”无法作为通用技术规则；本题答案更适合按特定培训工具流程理解。"}},{"id":"judge-090","number":90,"type":"judge","text":"卡方检验中,卡方值越大,二者偏差程度越小(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":92,"explanation":{"analysis":"卡方统计量通常累加观测频数与期望频数差异的平方，再按期望频数加权。在相同模型和条件下，偏差越大，卡方值通常越大；是否显著还需结合自由度和显著性水平，题干将方向说反了。","tip":"卡方值越大，观测与期望的不符合程度通常越大。","caution":""}},{"id":"judge-091","number":91,"type":"judge","text":"正则表达式可以用来检查一个字符串是否含有某种子串(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":93,"explanation":{"analysis":"正则表达式用模式描述文本特征，可以搜索是否存在匹配子串，例如用数字模式检查文本中是否包含数字。搜索子串与要求整个字符串完全匹配不同，实际使用时应选择合适函数或边界符。","tip":"正则可查找局部模式，全文校验要注意匹配边界。","caution":""}},{"id":"judge-092","number":92,"type":"judge","text":"只有在实践过程中,才能体现出职业道德的水准(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":94,"explanation":{"analysis":"职业道德最终要通过履职、服务、处理利益冲突和承担责任等行为体现。口头承诺或熟记规范不能代替实际行动，因此题干强调通过实践检验职业道德水准，按题库判正确。","tip":"职业道德是否落实，关键看实际行动。","caution":""}},{"id":"judge-093","number":93,"type":"judge","text":"团结是由多种情感聚集在一起而产生的一种精神(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":95,"explanation":{"analysis":"信任、尊重、归属感和共同责任可以使成员愿意协作、相互支持，形成团结精神。题干从情感基础解释团结，符合常见道德教育表述；实际协作还需要共同目标、规则和明确分工。","tip":"团结有情感基础，也需要共同目标与合作行动。","caution":"这是一种描述性概括，不是严格的心理学定义；仅有情感聚集并不足以保证有效团结。"}},{"id":"judge-094","number":94,"type":"judge","text":"法律是由人执行的,执行时不能不考虑人情和权力等因素(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"职业道德与法规","row":96,"explanation":{"analysis":"执法应以事实为依据、以法律为准绳，不能因关系、人情或权力影响而偏袒。法律允许考虑具体情节时也应依法说明理由，这与徇私或屈从权势不同，因此题干错误。","tip":"依法考虑情节可以，受人情权力干预不可以。","caution":""}},{"id":"judge-095","number":95,"type":"judge","text":"多道程序设计是指在分布式系统中同一时刻运行多个程序(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":97,"explanation":{"analysis":"多道程序设计是在内存中容纳多个程序，并在一个程序等待输入输出等事件时切换执行其他程序，以提高资源利用率。它不要求分布式系统，也不意味着单核 CPU 在同一瞬间真正执行多个程序。","tip":"多道程序重在交替推进，提高 CPU 与设备利用率。","caution":""}},{"id":"judge-096","number":96,"type":"judge","text":"数据仓库的开发是一个不断循环的过程,是启发式的开发(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":98,"explanation":{"analysis":"数据仓库通常围绕业务主题逐步建设，随着使用者发现新问题，会继续补充数据、调整口径和完善模型。需求在分析实践中逐渐明确，因此开发常是迭代和启发式过程，而不是一次完成后永不改变。","tip":"数据仓库随着分析需求和数据理解持续迭代。","caution":""}},{"id":"judge-097","number":97,"type":"judge","text":"图像都是由一些排成行列的像素组成的,通常称为位图或点阵图(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据采集与处理","row":99,"explanation":{"analysis":"位图或光栅图像确实由按行列排列的像素组成，每个像素保存颜色等信息。但矢量图使用路径、曲线和形状描述画面，只有显示或栅格化时才转成像素，因此不能把这一特征推广为所有图像。","tip":"位图由像素组成，矢量图由几何对象描述。","caution":"题库判正确，但题干“图像都是”不严谨；若按所有数字图像的字面含义应判错误，只有限定为位图时成立。"}},{"id":"judge-098","number":98,"type":"judge","text":"软件著作权人可以许可他人行使其软件著作权,并有权获得报酬(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"职业道德与法规","row":100,"explanation":{"analysis":"软件著作权人可以在法律允许范围内通过许可合同授权他人使用有关权利，并约定报酬和使用范围。许可并不必然转移著作权本身，被许可方仍需遵守期限、用途及其他合同条件。","tip":"许可是授权使用，通常不等于转让著作权。","caution":""}},{"id":"judge-099","number":99,"type":"judge","text":"逻辑回归比高斯判别模型的泛化性能更弱(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"Python与数据分析","row":101,"explanation":{"analysis":"逻辑回归直接建模类别条件概率，高斯判别分析对各类输入分布作高斯等假设。假设贴近真实数据、样本量及正则化情况都会影响泛化，不能断言逻辑回归总比高斯判别弱，所以错误。","tip":"判别式与生成式方法谁更好，要看假设和数据。","caution":""}},{"id":"judge-100","number":100,"type":"judge","text":"数据的采集是挖掘数据价值的第一步,当数据量越来越大时,可提取出来的有用数据必然也就更多(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据采集与处理","row":102,"explanation":{"analysis":"新增数据可能只是重复记录、噪声或与任务无关的信息，甚至带来更大偏差，所以数量增加不保证有效信息增加。采集后仍需检查质量、代表性和相关性，才能判断其对模型和决策的实际价值。","tip":"数据量不等于信息量，更不等于任务价值。","caution":""}},{"id":"judge-101","number":101,"type":"judge","text":"VLOOKUP和LOOKUP函数都可以按区间取值(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"Python与数据分析","row":103,"explanation":{"analysis":"VLOOKUP 的近似匹配可依据有序下界查找所在区间，LOOKUP 也常在升序阈值表中返回对应等级。因此二者都可按区间取值，但需要正确设置阈值、排序和匹配模式，否则结果可能出错。","tip":"区间查找要用有序下界，并明确近似匹配规则。","caution":""}},{"id":"judge-102","number":102,"type":"judge","text":"在WPS表格中,隔行输入的快捷键为TAB(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":104,"explanation":{"analysis":"在常见 WPS 表格操作中，Tab 通常将活动单元格移动到右侧下一个位置，或在选区中依序移动，并不是专门的隔行输入快捷键。隔行录入需先选择相应区域、使用辅助列或其他适合的方法。","tip":"Tab 常用于横向移到下一单元格，不是隔行命令。","caution":""}},{"id":"judge-103","number":103,"type":"judge","text":"偏相关反映两个及两个以上的自变量同一个因变量的相关关系(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":105,"explanation":{"analysis":"偏相关衡量控制其他变量影响后两个变量之间的相关关系。多个自变量与一个因变量整体联系的程度通常由复相关描述，题干把偏相关与复相关混淆，因此错误。","tip":"偏相关是控制其他变量后看两个变量的关系。","caution":""}},{"id":"judge-104","number":104,"type":"judge","text":"分类标注是最基本的一种标注手段,其表现形式一般就是一张图对应一个数字标签(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":106,"explanation":{"analysis":"常见单标签图像分类为整张图片指定一个类别，并常用数字 ID 表示类别，因此“一图一标签”是基础分类标注形式。它与框出物体位置、勾画像素边界不同，后两者分别涉及检测或分割任务。","tip":"分类说明图里是什么，检测和分割还定位在哪里。","caution":"多标签分类可给一张图多个标签，类别也可直接用文字表示；题干描述的是常见单标签编码形式。"}},{"id":"judge-105","number":105,"type":"judge","text":"在运用3D人脸朝向工具进行人脸识别时,人脸图像过大不会影响识别速度(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据采集与处理","row":107,"explanation":{"analysis":"图像尺寸越大通常意味着更多像素需要读取、传输和预处理，若直接参与计算还会增加计算量与内存占用。即使模型内部统一缩放，也可能增加前处理开销，因此不能说过大图像完全不影响速度。","tip":"大图通常增加读取和处理成本，需按工具要求调整尺寸。","caution":""}},{"id":"judge-106","number":106,"type":"judge","text":"运维管理除了管理常规的运维报告文档和技术文档外,还管理运维管理文档和系统调测文档(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":108,"explanation":{"analysis":"运维不仅要记录日常运行情况和技术实现，还需保存管理流程、职责分工、变更审批以及系统测试调试记录。这些文档帮助追踪问题、交接工作和恢复系统，因此题干所列范围合理。","tip":"运维文档要覆盖技术、运行、管理和调测记录。","caution":""}},{"id":"judge-107","number":107,"type":"judge","text":"分组分析的目的主要是查明平均总指标的内容,把先进和落后区别开来,以便克服存在的缺点(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":109,"explanation":{"analysis":"总体平均数可能掩盖不同部门、地区或人群之间的差异。分组后可以比较各组指标，找出高低水平和问题集中处，从而提出有针对性的改进措施，因此题干概括了分组分析的一项重要用途。","tip":"分组能揭示总体平均数背后的差异。","caution":"“先进和落后”是特定绩效场景说法；一般统计分组还可用于描述结构、研究异质性等，不必涉及价值评价。"}},{"id":"judge-108","number":108,"type":"judge","text":"按控制原理的不同,自主无人系统分为开环控制系统和闭环控制系统(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":110,"explanation":{"analysis":"按是否使用输出反馈修正控制量，可区分开环与闭环：开环不根据结果纠偏，闭环则将实际状态与目标比较后调整。题干采用这一基本控制分类，因此按题库判正确。","tip":"开环不看结果纠偏，闭环通过反馈持续修正。","caution":"完整自主无人系统通常混合多种控制回路，且“自主”往往依赖反馈；这是控制方式的基础分类，不是系统的唯一分类方法。"}},{"id":"judge-109","number":109,"type":"judge","text":"多次排序时,一定要打开排序窗口检查规则(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":111,"explanation":{"analysis":"多次或多关键字排序时应检查排序字段、优先级、升降序和数据范围，以免旧规则残留或新规则覆盖造成错误。排序窗口是常见核对入口，题库强调复核操作，但它不是技术上唯一可用的检查方式。","tip":"多次排序重点检查关键字优先级、方向和数据范围。","caution":"题库判正确，但“一定要打开排序窗口”过于绝对；使用脚本、明确的菜单规则或其他可验证方式也可正确完成排序。"}},{"id":"judge-110","number":110,"type":"judge","text":"数据分类的兼容性原则指当有相关国家标准则应执行国家标准,若没有相关国家标准,则自由执行(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":112,"explanation":{"analysis":"分类兼容性要求尽量与现有标准、相关系统和业务口径协调。有国家标准时应遵循适用要求，没有时仍需参考行业或企业标准并形成统一规则，不能各自随意分类，否则数据难以交换和比较。","tip":"没有国家标准也要有统一、可兼容的分类规则。","caution":""}},{"id":"judge-111","number":111,"type":"judge","text":"在检查表单时需要检查服务器预先设定好的隐藏字段是否有遗漏(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":113,"explanation":{"analysis":"隐藏字段虽然不在界面显示，也可能携带记录标识、状态或校验所需信息，检查表单时应核对必需字段是否完整。服务器还必须验证这些字段，因为客户端隐藏并不意味着用户无法修改。","tip":"隐藏字段要检查完整性，也必须由服务器验证。","caution":""}},{"id":"judge-112","number":112,"type":"judge","text":"图像标注的质量好坏取决于像素点判定的准确性(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":114,"explanation":{"analysis":"在像素级分割标注中，边界像素归属是否准确直接影响掩膜质量，题库据此判正确。但图像标注还涉及类别、完整性、目标遗漏和规范一致性，只检查像素位置并不足以判断全部质量。","tip":"像素级任务要准边界，整体质量还要对类别、查遗漏。","caution":"题干把图像标注质量单独归因于像素点判定，范围过窄；对图像分类等任务尤其不适用。"}},{"id":"judge-113","number":113,"type":"judge","text":"数据分析报告是通过对项目数据全方位的科学分析来评估项目的可行性,为投资方决策项目提供科学依据(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":115,"explanation":{"analysis":"针对投资项目的数据分析报告，可以结合市场、成本、收益和风险数据评估可行性，为决策提供依据，因此在该场景下成立。分析结论仍依赖数据可靠性与方法假设，不能把报告视为收益保证。","tip":"项目分析报告把数据证据转化为可行性判断。","caution":"一般数据分析报告也用于运营、科研、质量监测等，并非都以项目可行性或投资方决策为目的；题干实际描述了特定报告类型。"}},{"id":"judge-114","number":114,"type":"judge","text":"电子邮件中的邮局协议是一个非常简单、但功能有限的邮件读取协议(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":116,"explanation":{"analysis":"邮局协议通常指 POP3，主要用于从邮件服务器获取邮件，协议设计较简单。相比 IMAP，它对多设备同步、服务器端文件夹等支持有限；发送邮件通常使用 SMTP，而不是 POP3。","tip":"POP3 主要取信，SMTP 主要发信，IMAP 擅长服务器同步。","caution":""}},{"id":"judge-115","number":115,"type":"judge","text":"数据库中一张表的主键个数可以是多个(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"计算机与办公基础","row":117,"explanation":{"analysis":"一张关系表只能定义一个主键约束，但这个主键可以由多个字段联合组成，称为复合主键。表中可以存在多个候选键或唯一约束，不能把它们说成多个主键，因此题干错误。","tip":"一表一个主键，主键可以含多个列。","caution":""}},{"id":"judge-116","number":116,"type":"judge","text":"根据奈奎斯特采样定理,要无失真采集最高频率为f的信号,采样率应不低于2f(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据采集与处理","row":118,"explanation":{"analysis":"采样率需至少达到最高频率两倍附近的奈奎斯特要求，才能避免不同频率采样后混叠，题库按常见简化表述判正确。实际系统还需带限和抗混叠滤波，并通常选择高于两倍的采样率留出余量。","tip":"记住两倍下限思想，实际采样应留裕量并先抗混叠。","caution":"严格恢复一般要求采样率大于两倍最高有效频率；恰好等于 2f 时，边界频率的相位等情况可能无法恢复。题干“不低于”是教学简化。"}},{"id":"judge-117","number":117,"type":"judge","text":"在Audacity中使用降噪功能前,必须先选取一段纯噪声获取噪声特征(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"综合知识","row":119,"explanation":{"analysis":"Audacity 常规噪声消除效果先从一段只包含背景噪声的音频获取噪声特征，再用该特征处理含语音的片段。选入语音成分会使算法误把声音当作噪声削弱，因此取样段应具有代表性且尽量纯净。","tip":"先取纯噪声特征，再对目标音频应用噪声消除。","caution":"本题针对需要噪声特征的常规降噪功能；其他降噪插件或算法不一定采用这一流程。"}},{"id":"judge-118","number":118,"type":"judge","text":"标准化(Normalize)操作会改变音频的语义内容(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据采集与处理","row":120,"explanation":{"analysis":"音频标准化主要通过调整增益，使峰值或响度达到目标水平，不会把说出的词语改成其他内容。若设置不当导致削波或过低音量，可能损伤可懂度，但这不是标准化的正常语义作用。","tip":"Normalize 调整音量尺度，不改写语音内容。","caution":""}},{"id":"judge-119","number":119,"type":"judge","text":"对音频添加淡入淡出(Fade In/Out)操作会改变其采样率(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据采集与处理","row":121,"explanation":{"analysis":"淡入淡出对随时间变化的振幅施加增益包络，使声音逐渐变大或变小。它不改变每秒采样点数，因而不改变采样率；采样率变化需要单独的重采样操作，所以题干错误。","tip":"淡入淡出改振幅，重采样才改采样率。","caution":""}},{"id":"judge-120","number":120,"type":"judge","text":"在机器学习项目中,训练集、验证集和测试集应分开存放以正确评估模型(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"AI与智能系统","row":122,"explanation":{"analysis":"训练集用于拟合参数，验证集用于选择模型与超参数，测试集用于最终独立评估，三者应保持数据隔离，避免泄漏。分开组织有助于防止误用，但关键是样本及使用流程独立，而不是必须存放在三个物理位置。","tip":"训练学习、验证调参、测试评估，关键是隔离和防泄漏。","caution":"可在同一数据库或目录中用可靠划分标记管理三类数据；物理分开存放有帮助，但不是正确评估的必需条件。"}},{"id":"judge-121","number":121,"type":"judge","text":"语音识别(ASR)训练数据的元数据只需记录音频文件名,无需转录文本(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"AI与智能系统","row":123,"explanation":{"analysis":"常规监督式 ASR 需要音频及对应转录文本，模型才能学习声音与文字的映射。文件名只负责定位音频，不能替代文本标签；还常记录时长、采样率或说话人信息，以支持质量检查及数据划分。","tip":"监督式语音识别训练需要音频与转录成对对应。","caution":"无监督或自监督预训练可以使用无转录音频，但本题按常规有监督 ASR 标注数据管理理解。"}},{"id":"judge-122","number":122,"type":"judge","text":"训练数据集的目录结构设计应与元数据标注文件一一对应、保持一致(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":124,"explanation":{"analysis":"元数据中的文件路径或 ID 应能准确定位对应样本，文件移动或改名后也要同步更新引用，否则会产生找不到文件、标签错配等错误。组织结构与标注记录一致能保证训练加载及追溯的可靠性。","tip":"每条标签都应准确找到对应的数据文件。","caution":"“一一对应”强调正确映射；多片段引用一个音频等合法设计未必是严格的一文件一记录。"}},{"id":"judge-123","number":123,"type":"judge","text":"意图分类与命名实体识别是同一个任务,无需区分(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":125,"explanation":{"analysis":"意图分类识别用户想做什么，例如订票或查天气；命名实体识别定位文本中的人名、地点、机构等内容。前者常对整句话赋类，后者对文本片段标边界和类型，两者可以协同但不是同一任务。","tip":"意图识别需求，实体提取需求中的关键对象。","caution":""}},{"id":"judge-124","number":124,"type":"judge","text":"\"播放音乐\"和\"暂停音乐\"可视为同一意图(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"综合知识","row":126,"explanation":{"analysis":"播放会启动或继续音频，暂停会中止当前播放，二者对应不同的动作及系统状态变化。在需要直接执行操作的意图体系中应分成不同意图，否则系统无法确定要做哪一种动作，所以按题库判错误。","tip":"判断意图是否相同，要看最终要求执行的动作。","caution":"若项目采用粗粒度“音乐控制”意图加动作槽位，两句话可归入同一上层意图；本题按细粒度动作意图定义作答。"}},{"id":"judge-125","number":125,"type":"judge","text":"标注前阅读标注规范与意图定义有助于提升标注一致性(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":127,"explanation":{"analysis":"规范明确类别含义、边界规则、优先级和疑难处理方式，使不同标注人员面对同一表达时有共同判断依据。标注前阅读并校准样例，可以减少个人直觉差异导致的不一致，因此正确。","tip":"先统一规则和样例，再进入批量标注。","caution":""}},{"id":"judge-126","number":126,"type":"judge","text":"实体\"北京大学\"在BIO体系下应标注为B-ORG、I-ORG、I-ORG、I-ORG(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":128,"explanation":{"analysis":"在按字标注且将北京大学识别为机构实体时，首字“北”标 B-ORG，其余“京”“大”“学”标 I-ORG，表示同一个机构实体的延续。BIO 不需要另设结束标签，因此该序列正确。","tip":"按字标注北京大学：一个 B-ORG，随后三个 I-ORG。","caution":"该答案以字符为标注单元；若项目按词元且将整个名称切成一个词元，则标签数量会不同。"}},{"id":"judge-127","number":127,"type":"judge","text":"标注实体边界时,可以把动词也纳入实体名称中(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据标注与质检","row":129,"explanation":{"analysis":"普通实体边界应只包含名称本身，句中“参观北京大学”的“参观”是动作，不能圈进机构实体。把无关动词并入会造成边界过长并污染训练标签，因此题库判错误，应按项目规则精确截取。","tip":"实体只圈名称本身，排除名称之外的动作词。","caution":"如果某个看似动词的词本来就是正式名称组成部分，应保留；不能按词性机械删掉实体名称中的合法文字。"}},{"id":"judge-128","number":128,"type":"judge","text":"标注质检的核心目的是提高标注速度(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["B"],"topic":"数据标注与质检","row":130,"explanation":{"analysis":"标注质检的核心是发现并纠正错标、漏标、边界错误和规范不一致，保证训练数据可靠。更顺畅的质检流程可能提高整体效率，但速度不能替代质量目标，甚至需要放慢速度核查疑难样本。","tip":"质检首先保证准确、一致和完整，速度只是效率要求。","caution":""}},{"id":"judge-129","number":129,"type":"judge","text":"质检中\"漏标\"指应当标注的内容未被标注(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":131,"explanation":{"analysis":"漏标指数据中存在规范要求标注的目标或内容，但结果中缺少相应标签，例如图片里的一个行人未画框。把对象标成错误类别叫错标，两者问题不同，核查时需要分别统计和修正。","tip":"该标却没标是漏标，标了但标签不对是错标。","caution":""}},{"id":"judge-130","number":130,"type":"judge","text":"抽检是指按一定比例随机抽取标注结果进行核查(  )。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"}],"answer":["A"],"topic":"数据标注与质检","row":132,"explanation":{"analysis":"抽检从整批结果中按预设方案选择一部分核查，并据此判断批次质量。随机抽样可降低挑选偏差，抽样比例应结合风险和质量目标确定；样本通过不代表未检查的每条数据都必然正确。","tip":"抽检用部分样本推断整体，保留抽样风险意识。","caution":"实际抽样还可按固定数量或分层方案设计，并不局限于简单固定比例随机抽取。"}}],"counts":{"single":300,"multi":70,"judge":130}}</script>
<script>'use strict';
const DATA=JSON.parse(document.getElementById('question-data').textContent);
const QS=DATA.questions, BY_ID=new Map(QS.map(q=>[q.id,q]));
const TYPES={single:'单选题',multi:'多选题',judge:'判断题'};
const POINTS={single:1,multi:2,judge:.5};
const TOPICS=[...new Set(QS.map(q=>q.topic))];
const STORE='nanshan-ai-study-v1', DAY=86400000;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('zh-CN');
const percent=(a,b)=>b?Math.round(a/b*100):0;
const same=(a,b)=>a.length===b.length&&[...a].sort().join('')===[...b].sort().join('');
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateTime=t=>new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const fresh=()=>({version:1,bank:DATA.version,records:{},daily:{},session:null,exam:null,history:[]});
let state=fresh(), storageOkay=true, storageMessage='', route='home', filter={text:'',type:'',topic:'',status:'',page:1}, reviewExamId=null;
let toastTimer, studyPane='answer', listPageSize=matchMedia('(max-width:760px)').matches?5:10;
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
function storageWarning(msg){storageOkay=false;storageMessage=msg;const box=$('#storage-alert');box.hidden=false;box.textContent=msg}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));if(storageOkay)$('#storage-alert').hidden=true;return true}catch(e){storageWarning('浏览器无法保存学习记录，本次仍可练习。请及时“导出学习备份”，避免关闭页面后丢失。');return false}}
function validObject(o){return o&&typeof o==='object'&&!Array.isArray(o)}
function cleanChoices(id,v){return Array.isArray(v)?[...new Set(v.filter(x=>BY_ID.get(id)?.options.some(o=>o.key===x)))].sort():[]}
function cleanSession(raw,isExam=false){
 if(!validObject(raw)||!Array.isArray(raw.ids)||!(/^[a-zA-Z0-9_-]{1,100}$/).test(String(raw.id||'')))return null;
 const ids=[...new Set(raw.ids.filter(id=>BY_ID.has(id)))];if(!ids.length)return null;
 const out={id:String(raw.id||'session'),title:String(raw.title||'练习').slice(0,100),kind:String(raw.kind||'practice'),ids,index:Math.max(0,Math.min(ids.length-1,Math.floor(Number(raw.index)||0))),answers:{},drafts:{},startedAt:Number(raw.startedAt)||Date.now(),flags:{}};
 ids.forEach(id=>{if(isExam){out.answers[id]=cleanChoices(id,raw.answers?.[id]);if(raw.flags?.[id])out.flags[id]=true}else{const a=raw.answers?.[id];if(validObject(a)&&Array.isArray(a.choice)){const choice=cleanChoices(id,a.choice);if(choice.length)out.answers[id]={choice,correct:same(choice,BY_ID.get(id).answer)}}out.drafts[id]=cleanChoices(id,raw.drafts?.[id])}});
 if(isExam){if(!Number.isFinite(raw.deadline)||!Number.isFinite(raw.duration)||raw.duration<=0)return null;out.deadline=raw.deadline;out.duration=raw.duration}
 return out;
}
function validateState(raw){
 if(!validObject(raw)||raw.version!==1||raw.bank!==DATA.version||!validObject(raw.records)||!Array.isArray(raw.history))throw Error('备份格式或题库版本不匹配。');
 const out=fresh();
